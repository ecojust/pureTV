    <!-- viewport-fit=cover so env(safe-area-inset-*) reports real values on
         notched phones. maximum-scale/user-scalable are kept for the engines
         that still honour them, but iOS Safari has ignored them since iOS 10 —
         the `touch-action: none` below is what actually stops pinch-zoom, along
         with the gesture handlers in src/core/Input.ts. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>Kart Royale</title>

    <!-- Add to Home Screen, which on a phone is worth more than it sounds.
         Safari's toolbar and tab strip occupy roughly the top 220px of a
         landscape phone — about a quarter of the vertical space, in a game that
         is already short of height and whose menus had to be rebuilt to fit
         what was left. Launched from the home screen these tags drop the chrome
         entirely and the game gets the whole panel.

         `black-translucent` puts the status bar over the canvas rather than
         above it, which is what we want given `viewport-fit=cover` and the
         `env(safe-area-inset-*)` padding already in the HUD and menu CSS.

         The deprecated apple-prefixed name is kept alongside the standard one:
         iOS honours the former and nothing else reads it, while the standard
         `mobile-web-app-capable` is what every other engine looks for. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Kart Royale" />
    <meta name="theme-color" content="#05070d" />
    <meta name="description" content="A kart racer with no art assets — every texture, mesh and sound generated in code." />
    <!-- No `apple-touch-icon`, deliberately. An icon would be the first and only
         art asset in the repository, and iOS falls back to a snapshot of the
         page, which is a procedurally generated image of the game — exactly the
         right icon for this project and one that costs nothing. -->
    <link rel="manifest" href="manifest.webmanifest" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 100%; height: 100%; overflow: hidden; background: #05070d;
        /* the page is a game surface, not a document: no panning, no pinch,
           no double-tap zoom, no pull-to-refresh, no long-press callout */
        touch-action: none;
        overscroll-behavior: none;
        -webkit-user-select: none; user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
        position: fixed; inset: 0;
      }
      body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
      #app { position: fixed; inset: 0; }
      canvas { display: block; width: 100%; height: 100%; touch-action: none; }

// Offline Simplified Chinese for ports whose upstream UI draws its own text.
(() => {
  const ignored = 'script,style,noscript,template,textarea,[contenteditable="true"],[translate="no"]';
  const attributes = ['title', 'placeholder', 'aria-label', 'alt'];
  let translate = text => text;
  let installed = false;

  function install({ strings, patterns = [] }) {
    if (installed) return;
    installed = true;

    function lookup(text) {
      if (Object.prototype.hasOwnProperty.call(strings, text)) return strings[text];
      const normalized = text.replace(/\s+/g, ' ');
      if (Object.prototype.hasOwnProperty.call(strings, normalized)) return strings[normalized];
      for (const [pattern, replacement] of patterns) {
        if (pattern.test(text)) return text.replace(pattern, replacement);
      }
      return text;
    }
    translate = value => {
      if (typeof value !== 'string') return value;
      const text = value.trim();
      if (!text) return value;
      let result = lookup(text);
      if (result === text && text.includes('\n')) {
        result = text.split('\n').map(line => translate(line)).join('\n');
      }
      return result === text ? value : value.replace(text, () => result);
    };

    // Canvas games often use measureText to wrap the same labels they draw.
    const proto = globalThis.CanvasRenderingContext2D?.prototype;
    if (proto) {
      for (const method of ['fillText', 'strokeText', 'measureText']) {
        const original = proto[method];
        proto[method] = function (value, ...args) {
          return original.call(this, translate(value), ...args);
        };
      }
    }

    // The observer also receives our writes. A translated label can still match
    // a dynamic pattern (for example numbers and unit abbreviations).
    const lastText = new WeakMap();
    const lastAttributes = new WeakMap();

    function textNode(node) {
      if (lastText.get(node) === node.data) return;
      const parent = node.parentElement;
      if (!parent || parent.closest(ignored)) return;
      const result = translate(node.data);
      if (result === node.data) return;
      // With no value attribute an option uses its label as the submitted value.
      if (parent.tagName === 'OPTION' && !parent.hasAttribute('value')) parent.setAttribute('value', parent.value);
      lastText.set(node, result);
      node.data = result;
    }

    function attribute(el, name) {
      const old = el.getAttribute(name);
      const written = lastAttributes.get(el);
      if (!old || written?.get(name) === old) return;
      const next = translate(old);
      if (old !== next) {
        const values = written || new Map();
        values.set(name, next);
        if (!written) lastAttributes.set(el, values);
        el.setAttribute(name, next);
      }
    }

    function visit(node) {
      if (node.nodeType === Node.TEXT_NODE) return textNode(node);
      if (node.nodeType !== Node.ELEMENT_NODE || node.closest(ignored)) return;
      for (const name of attributes) attribute(node, name);
      const walker = document.createTreeWalker(node, NodeFilter.SHOW_ELEMENT | NodeFilter.SHOW_TEXT, {
        acceptNode(child) {
          return child.nodeType === Node.ELEMENT_NODE && child.matches(ignored)
            ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT;
        },
      });
      while (walker.nextNode()) {
        const child = walker.currentNode;
        if (child.nodeType === Node.TEXT_NODE) textNode(child);
        else for (const name of attributes) attribute(child, name);
      }
    }

    document.documentElement.lang = 'zh-CN';
    visit(document.documentElement);
    new MutationObserver(records => {
      for (const record of records) {
        if (record.type === 'characterData') textNode(record.target);
        else if (record.type === 'attributes') {
          if (!record.target.closest(ignored)) attribute(record.target, record.attributeName);
        } else for (const node of record.addedNodes) visit(node);
      }
    }).observe(document.documentElement, {
      subtree: true, childList: true, characterData: true, attributes: true, attributeFilter: attributes,
    });
  }
  globalThis.PureTVChinese = { install, translate: text => translate(text) };
})();

    <div id="app"></div>

    <!-- Painted on the very first frame, before a single module has parsed, so
         the tab is never an unexplained black rectangle. main.ts advances it as
         each system initialises and removes it once the first real frame is up.
         Building a WebGL scene of this size takes a few seconds — the sky is
         raymarched into a PMREM probe, every texture is generated procedurally
         and every shader is compiled up front — and silence during that reads
         as a hang. -->
    <div id="boot">
      <div class="boot-in">
        <div class="boot-mark">KART<span>ROYALE</span></div>
        <div class="boot-bar"><i></i></div>
        <div class="boot-step">starting up</div>
      </div>
    </div>
    <style>
      #boot {
        position: fixed; inset: 0; z-index: 100; display: grid; place-items: center;
        background:
          radial-gradient(120% 90% at 50% 8%, #2c3560 0%, #141a33 42%, #080b16 100%);
        color: #f3f6fb; transition: opacity .55s ease; font-family: system-ui, -apple-system, sans-serif;
      }
      #boot.done { opacity: 0; pointer-events: none; }
      .boot-in { display: flex; flex-direction: column; align-items: center; gap: 3.4vmin; }
      .boot-mark {
        font-size: 8.2vmin; font-weight: 900; letter-spacing: .1em; line-height: .96;
        display: flex; flex-direction: column; align-items: center;
        background: linear-gradient(180deg, #fff 12%, #ffd27a 58%, #f0a23c 100%);
        -webkit-background-clip: text; background-clip: text; color: transparent;
        filter: drop-shadow(0 3px 10px rgba(0,0,0,.55));
      }
      .boot-mark span { font-size: .52em; letter-spacing: .38em; margin-left: .38em; }
      .boot-bar {
        width: 42vmin; max-width: 380px; height: 5px; border-radius: 999px;
        background: rgba(255,255,255,.13); overflow: hidden;
      }
      .boot-bar i {
        display: block; width: 0%; height: 100%; border-radius: 999px;
        background: linear-gradient(90deg, #6ad2ff, #ffd27a);
        transition: width .3s ease; box-shadow: 0 0 12px rgba(255,200,120,.7);
      }
      .boot-step {
        font-size: 2.5vmin; letter-spacing: .22em; text-transform: uppercase;
        color: rgba(233,240,250,.62); min-height: 1.2em;
      }
      @media (prefers-reduced-motion: reduce) {
        #boot, .boot-bar i { transition: none; }
      }
    </style>
