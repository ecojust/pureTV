  <script>
// Offline Simplified Chinese for ports whose upstream UI draws its own text.
(() => {
  const ignored = 'script,style,noscript,template,textarea,[contenteditable="true"],[translate="no"]';
  const attributes = ['title', 'placeholder', 'aria-label', 'alt'];
  let translate = text => text;
  let installed = false;

  function install({ strings, patterns = [] }) {
    if (installed) return;
    installed = true;

    function lookup(text) {
      if (Object.prototype.hasOwnProperty.call(strings, text)) return strings[text];
      const normalized = text.replace(/\s+/g, ' ');
      if (Object.prototype.hasOwnProperty.call(strings, normalized)) return strings[normalized];
      for (const [pattern, replacement] of patterns) {
        if (pattern.test(text)) return text.replace(pattern, replacement);
      }
      return text;
    }
    translate = value => {
      if (typeof value !== 'string') return value;
      const text = value.trim();
      if (!text) return value;
      let result = lookup(text);
      if (result === text && text.includes('\n')) {
        result = text.split('\n').map(line => translate(line)).join('\n');
      }
      return result === text ? value : value.replace(text, () => result);
    };

    // Canvas games often use measureText to wrap the same labels they draw.
    const proto = globalThis.CanvasRenderingContext2D?.prototype;
    if (proto) {
      for (const method of ['fillText', 'strokeText', 'measureText']) {
        const original = proto[method];
        proto[method] = function (value, ...args) {
          return original.call(this, translate(value), ...args);
        };
      }
    }

    // The observer also receives our writes. A translated label can still match
    // a dynamic pattern (for example numbers and unit abbreviations).
    const lastText = new WeakMap();
    const lastAttributes = new WeakMap();

    function textNode(node) {
      if (lastText.get(node) === node.data) return;
      const parent = node.parentElement;
      if (!parent || parent.closest(ignored)) return;
      const result = translate(node.data);
      if (result === node.data) return;
      // With no value attribute an option uses its label as the submitted value.
      if (parent.tagName === 'OPTION' && !parent.hasAttribute('value')) parent.setAttribute('value', parent.value);
      lastText.set(node, result);
      node.data = result;
    }

    function attribute(el, name) {
      const old = el.getAttribute(name);
      const written = lastAttributes.get(el);
      if (!old || written?.get(name) === old) return;
      const next = translate(old);
      if (old !== next) {
        const values = written || new Map();
        values.set(name, next);
        if (!written) lastAttributes.set(el, values);
        el.setAttribute(name, next);
      }
    }

    function visit(node) {
      if (node.nodeType === Node.TEXT_NODE) return textNode(node);
      if (node.nodeType !== Node.ELEMENT_NODE || node.closest(ignored)) return;
      for (const name of attributes) attribute(node, name);
      const walker = document.createTreeWalker(node, NodeFilter.SHOW_ELEMENT | NodeFilter.SHOW_TEXT, {
        acceptNode(child) {
          return child.nodeType === Node.ELEMENT_NODE && child.matches(ignored)
            ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT;
        },
      });
      while (walker.nextNode()) {
        const child = walker.currentNode;
        if (child.nodeType === Node.TEXT_NODE) textNode(child);
        else for (const name of attributes) attribute(child, name);
      }
    }

    document.documentElement.lang = 'zh-CN';
    visit(document.documentElement);
    new MutationObserver(records => {
      for (const record of records) {
        if (record.type === 'characterData') textNode(record.target);
        else if (record.type === 'attributes') {
          if (!record.target.closest(ignored)) attribute(record.target, record.attributeName);
        } else for (const node of record.addedNodes) visit(node);
      }
    }).observe(document.documentElement, {
      subtree: true, childList: true, characterData: true, attributes: true, attributeFilter: attributes,
    });
  }
  globalThis.PureTVChinese = { install, translate: text => translate(text) };
})();

    <script>
      /**
       * Loading-screen driver. Deliberately a classic (non-module) inline
       * script: it runs during parse, before the deferred module graph is even
       * fetched, so the bar exists and the tips rotate while the engine module
       * is still evaluating. `main.js` takes over by calling window.__BOOT__.set
       * from every `boot:progress` event; nothing else here talks to the engine.
       *
       * No RNG anywhere — the tip order is a fixed rotation, so a capture is
       * reproducible and two players see the same first line.
       */
      (function () {
        var root = document.getElementById('boot');
        var fill = document.getElementById('boot-fill');
        var phase = document.getElementById('boot-phase');
        var pctEl = document.getElementById('boot-pct');
        var tipEl = document.getElementById('boot-tip');

        /* Dry, fintech-literate, all caps. Rotated in this exact order. */
        var TIPS = [
          'T+2 IS NOT A FEATURE.',
          'THE LEDGER DOES NOT RECONCILE ITSELF.',
          'REAL-TIME MEANS TUESDAY, IN PRACTICE.',
          'COBOL DOES NOT NEGOTIATE.',
          'A CHARGEBACK IS A REFUND WITH LAWYERS.',
          'THE FAX IS STILL IN THE PAYMENT FLOW.',
          'COMPLIANCE IS A CONTACT SPORT.',
          'EVERY OUTAGE IS A BATCH JOB SOMEBODY LOVED.',
        ];

        var capture = false;
        try {
          capture = /(^|[?&])capture=1(&|$)/.test(location.search);
        } catch (e) {
          /* no location (never in a browser, but keep the driver total) */
        }

        // Capture harness: the screenshot must frame the game, never a loading
        // overlay, and the deterministic frame budget must not pay for a fade.
        // Gone before the first byte of engine work.
        if (capture) {
          root.style.display = 'none';
          window.__BOOT__ = { set: function () {}, done: function () {}, fail: function () {} };
          return;
        }

        var shown = 0;
        var tipTimer = setInterval(function () {
          shown = (shown + 1) % TIPS.length;
          tipEl.style.opacity = '0';
          setTimeout(function () {
            tipEl.textContent = TIPS[shown];
            tipEl.style.opacity = '1';
          }, 300);
        }, 2500);

        var last = 0;
        var lastPhase = '';
        var finished = false;

        function stop() {
          if (tipTimer) clearInterval(tipTimer);
          tipTimer = null;
        }

        window.__BOOT__ = {
          /** @param {number} pct 0..1, monotonic. @param {string} [detail] caption */
          set: function (pct, detail) {
            if (finished) return;
            var p = pct > 1 ? 1 : pct < 0 ? 0 : pct;
            if (p > last) {
              last = p;
              fill.style.transform = 'scaleX(' + p.toFixed(4) + ')';
              pctEl.textContent = Math.round(p * 100) + '%';
            }
            if (detail && detail !== lastPhase) {
              lastPhase = detail;
              phase.textContent = detail;
            }
          },
          /** Boot finished: land on 100%, fade out, drop the node. */
          done: function () {
            if (finished) return;
            finished = true;
            stop();
            fill.style.transform = 'scaleX(1)';
            pctEl.textContent = '100%';
            phase.textContent = 'CLEARED FOR DEPLOY';
            root.classList.add('gone');
            setTimeout(function () {
              if (root.parentNode) root.parentNode.removeChild(root);
            }, 500);
          },
          /** Boot threw: get out of the way so the error is legible. */
          fail: function () {
            finished = true;
            stop();
            root.style.display = 'none';
          },
        };
      })();
    </script>

    <script src="nerd-of-duty.js"></script>
  </body>
</html>
