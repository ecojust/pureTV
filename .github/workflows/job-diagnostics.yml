name: Run Backroad 0.1.3 software WebGL2 keyboard driving
on: workflow_dispatch
permissions:
  contents: write
jobs:
  drive:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          filter: blob:none
          sparse-checkout: |
            joystick-games/backroad-rally/dist
            joystick-games/backroad-rally/docs/browser-software-0.1.3
      - name: Verify unchanged shipping payload and record browser
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/proof"
          git fetch --no-tags --filter=blob:none --depth=1 origin e59dd4e39fcf5c9e5b82719904438e783cd43255
          tree=joystick-games/backroad-rally/dist
          test "$(git rev-parse HEAD:"$tree")" = "$(git rev-parse FETCH_HEAD:"$tree")"
          git rev-parse HEAD:"$tree" > "$RUNNER_TEMP/proof/dist-tree.txt"
          echo "e59dd4e39fcf5c9e5b82719904438e783cd43255" > "$RUNNER_TEMP/proof/candidate-commit.txt"
          google-chrome --version > "$RUNNER_TEMP/proof/chrome-version.txt"
          npm install --prefix "$RUNNER_TEMP/browser-deps" --no-audit --no-fund --ignore-scripts playwright-core@1.57.0
      - name: Drive the actual rally after the starting signal
        run: |
          set -euo pipefail
          python3 -m http.server 17427 --directory joystick-games/backroad-rally/dist > "$RUNNER_TEMP/server.log" 2>&1 &
          server=$!
          trap 'kill "$server" || true' EXIT
          export CHROMIUM_BIN="$(command -v google-chrome)" PLAYWRIGHT_CORE_MODULE="$RUNNER_TEMP/browser-deps/node_modules/playwright-core" BACKROAD_SCREENSHOT="$RUNNER_TEMP/proof/driving.png"
          node joystick-games/backroad-rally/docs/browser-software-0.1.3/drive.cjs > "$RUNNER_TEMP/proof/driving.log" 2>&1
      - name: Preserve original software rendering observations
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cp joystick-games/backroad-rally/docs/browser-software-0.1.3/drive.cjs "$RUNNER_TEMP/proof/"
          cd "$RUNNER_TEMP/proof"
          branch="build-assets/backroad-013-browser-driving-$GITHUB_RUN_ID-attempt-$GITHUB_RUN_ATTEMPT"
          gh auth setup-git
          git init --initial-branch "$branch"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .
          git commit -qm "Backroad Rally software WebGL2 driving from $GITHUB_SHA"
          git push "--force-with-lease=refs/heads/$branch:" "https://github.com/$GITHUB_REPOSITORY.git" "HEAD:refs/heads/$branch"
