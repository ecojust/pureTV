name: Record Manager 0.5.0 promotional footage
on:
  workflow_dispatch:
    inputs:
      job_id:
        description: Fixed recording marker (050-promo)
        required: true
permissions:
  contents: read
jobs:
  record:
    if: inputs.job_id == '050-promo'
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Record official Manager apps and live public Gitee content
        run: |
          set -o pipefail
          mkdir -p manager-promo/evidence
          python3 -u manager-promo/run.py 2>&1 | tee manager-promo/evidence/transcript.txt
      - name: Preserve recordings and public verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manager-050-native-promo-${{ github.run_id }}-${{ github.run_attempt }}
          path: manager-promo/evidence/
          if-no-files-found: error
          retention-days: 7
