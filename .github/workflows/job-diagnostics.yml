name: Retain the original Alien Shooter rendering-performance report
'on':
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  retain-original-rendering-performance:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        ref: d89960a69ad80c9ee6e55f835671c672013fa19d
        persist-credentials: false
    - name: Verify the source revision
      run: test "$(git rev-parse HEAD)" = d89960a69ad80c9ee6e55f835671c672013fa19d
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Install game browser test tools
      timeout-minutes: 5
      working-directory: desktop
      run: npm ci --prefer-offline --no-audit --no-fund
    - name: Select game test browser
      timeout-minutes: 5
      working-directory: desktop
      run: "tank_chrome_path=\"$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)\"\nif [ -n \"$tank_chrome_path\" ]; then\n  echo \"CHROMIUM_PATH=$tank_chrome_path\" >> \"$GITHUB_ENV\"\nelse\n  npx playwright install --with-deps chromium\nfi\n"
    - name: performance.mjs
      if: ${{ !cancelled() }}
      env:
        ALIEN_SHOOTER_UI_CAPTURE_DIR: ${{ runner.temp }}/puretv-alien-shooter-previews
      run: node resource/apps/alien-shooter/tests/performance.mjs --samples 6 --warmup 1 --regressions --output "$RUNNER_TEMP/puretv-alien-shooter-performance"
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: alien-shooter-rendering-performance
        path: ${{ runner.temp }}/puretv-alien-shooter-performance/
        if-no-files-found: warn
