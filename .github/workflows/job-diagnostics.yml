name: Read failed job diagnostics
on:
  workflow_dispatch:
    inputs:
      job_id:
        description: Failed GitHub Actions job ID
        required: true
permissions:
  actions: read
jobs:
  diagnostics:
    runs-on: ubuntu-latest
    steps:
      - name: Report verification log tail
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_ID: ${{ inputs.job_id }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import os, re, subprocess
          job = os.environ['JOB_ID']
          assert job.isdigit()
          result = subprocess.run(['gh', 'api', '--allow-escape-sequences', f"repos/{os.environ['REPOSITORY']}/actions/jobs/{job}/logs"], capture_output=True, text=True)
          log = re.sub(r'\x1b\[[0-?]*[ -/]*[@-~]', '', result.stdout + result.stderr)
          # Diagnostics need error context, never credential-bearing download URLs.
          log = re.sub(r"https?://[^\s<>\"']+", '[URL omitted]', log)
          log = re.sub(r'\b(?:gh[pousr]_[A-Za-z0-9_]+|github_pat_[A-Za-z0-9_]+)\b', '[token omitted]', log)
          log = re.sub(r'(?im)((?:authorization|(?:gh|github)[_-]token)\s*[:=]\s*)(?:bearer\s+|basic\s+)?[^\s]+', r'\1[token omitted]', log)
          log = re.sub(r'(?im)^.*androidboot\.qemu\.adb\.pubkey=.*$', '[emulator public key omitted]', log)
          lines = log.splitlines()
          primary = [i for i, line in enumerate(lines) if re.search(r'FAILURE: Build failed|\* What went wrong:', line) and '##[error]' not in line]
          fallback = [i for i, line in enumerate(lines) if re.search(r'(?:error:|Error:|TimeoutError|ui\.mjs:|> Task .+ FAILED|Execution failed for task|failed with exit code|emulator: ERROR)', line)]
          # Boot polling can log transient adb failures before the fatal step.
          fatal = [i for i in fallback if '##[error]' in lines[i]]
          matches = primary or fatal or fallback
          if matches:
              before = '\n'.join(lines[max(0, matches[0] - 50):matches[0]])[-3500:]
              print('::notice title=Failure preceding context::' + before.replace('%','%25').replace('\r','%0D').replace('\n','%0A'))
              start = max(0, matches[0] - 2)
              selected = '\n'.join(lines[start:start + 65])[:3500]
          else:
              selected = log[-3500:]
          print('::notice title=Failed job log::' + selected.replace('%','%25').replace('\r','%0D').replace('\n','%0A'))
          PY
