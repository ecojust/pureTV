name: Read the original Alien Shooter rendering report
'on':
  workflow_dispatch: {}
permissions:
  actions: read
  contents: read
jobs:
  retain:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/download-artifact@v4
      with:
        artifact-ids: '14651496179'
        run-id: '44778860361'
        github-token: ${{ github.token }}
        path: original
    - name: Read original performance JSON
      run: "python - <<'PYTHON'\nfrom pathlib import Path\nimport base64, hashlib, zlib\nfiles=list(Path('original').rglob('performance.json'))\nassert len(files)==1, files\nraw=files[0].read_bytes()\nprint('RETAINED_PERFORMANCE_SHA256='+hashlib.sha256(raw).hexdigest())\ncompressed=base64.b64encode(zlib.compress(raw)).decode()\nfor offset in range(0,len(compressed),1800):\n    print('RETAINED_PERFORMANCE_DATA='+compressed[offset:offset+1800])\nPYTHON"
