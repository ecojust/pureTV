name: Read public HiFiNi contract
on:
  workflow_dispatch:
    inputs:
      job_id:
        required: true
        description: Probe identifier
permissions:
  contents: read
jobs:
  diagnostics:
    runs-on: ubuntu-24.04
    steps:
      - name: Inspect ordinary public responses
        run: |
          python - <<'PROBE'
          import urllib.request,urllib.parse,urllib.error,re,json,html
          def fetch(url):
              request=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 (Linux; Android 9) AppleWebKit/537.36 Chrome/120.0 Safari/537.36'})
              try:
                  with urllib.request.urlopen(request,timeout=25) as response:
                      data=response.read(1024*1024).decode('utf-8','replace')
                      links=list(dict.fromkeys(re.findall(r'thread-([0-9]+)\.htm',data)))
                      result={'url':url,'status':response.status,'final':response.url,'bytes':len(data),'threads':links[:5],'title':re.findall(r'<title[^>]*>(.*?)</title>',data,re.S)[:1]}
                      if '/thread-' in url:
                          scripts=re.findall(r'<script[^>]*>(.*?)</script>',data,re.S|re.I)
                          player=[s for s in scripts if re.search(r'APlayer|aplayer|music:',s)][:2]
                          def redact(text):
                              text=re.sub(r'https?://[^\s\'\"<>]+',lambda m:urllib.parse.urlsplit(m[0])._replace(query='',fragment='').geturl(),text)
                              return text[:2200]
                          result['playerSnippets']=[redact(s) for s in player]
                          result['audioTags']=[redact(t) for t in re.findall(r'<audio[^>]*>.*?</audio>',data,re.S|re.I)[:1]]
                          result['messageClasses']=re.findall(r'class=[\'\"]([^\'\"]*(?:message|lyric)[^\'\"]*)',data)[:10]
                      print('::notice::'+json.dumps(result,ensure_ascii=False).replace('%','%25'))
                      return links
              except Exception as error:
                  print('::notice::'+json.dumps({'url':url,'error':str(error)}).replace('%','%25'));return []
          fetch('https://www.hifini.net/thread-6544.htm')
          home=fetch('https://www.hifini.net/')
          found=fetch('https://www.hifini.net/search-'+urllib.parse.quote('夜')+'-1-0-1.htm')
          if found or home: fetch('https://www.hifini.net/thread-'+(found or home)[0]+'.htm')
          PROBE
