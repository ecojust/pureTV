name: Hosted games for Android TV
on:
  push:
    branches: [master]
    paths: &inputs
      - resource/apps/hosted-games/src/**
      - resource/apps/hosted-games/build.py
      - joystick-games/tools/android-zxing.py
      - resource/game-kit/android/src/main/java/com/ecojust/gamekit/LanGameServer.java
      - resource/game-kit/android/src/main/java/com/ecojust/gamekit/WifiController*.java
      - resource/game-kit/web/controller.*
      - tools/pc-games/hosted-games.json
      - tools/puretv-release-certificate-v2.sha256
      - tools/hosted-games-tv/**
      - .github/workflows/hosted-games-tv.yml
  pull_request:
    paths: *inputs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /resource/apps/hosted-games/
            /joystick-games/tools/android-zxing.py
            /resource/game-kit/android/src/main/java/
            /resource/game-kit/web/controller.*
            /tools/pc-games/hosted-games.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-35 build-tools;34.0.0
      - uses: actions/cache@v4
        with:
          path: ~/.cache/puretv/zxing-core-3.5.3.jar
          key: zxing-core-3.5.3-8d8064c1636fdaef7189dd9055c7d59950a8940a12f2293956446ec3c109fd82
      - name: Verify the cached QR encoder or fetch it from a Maven mirror
        shell: bash
        run: |
          cached="$HOME/.cache/puretv/zxing-core-3.5.3.jar"
          verify=(python3 joystick-games/tools/android-zxing.py --output "$RUNNER_TEMP/zxing.jar")
          if [[ ! -f "$cached" ]] || ! "${verify[@]}" --archive "$cached" --receipt "$RUNNER_TEMP/cache.json"; then
            "${verify[@]}" --receipt "$RUNNER_TEMP/download.json"
            install -Dm644 "$RUNNER_TEMP/zxing.jar" "$cached"
          fi
      - name: Build the unsigned game launcher
        run: |
          python3 resource/apps/hosted-games/build.py --sdk "$ANDROID_HOME" --zxing "$RUNNER_TEMP/zxing.jar" --output "$RUNNER_TEMP/unsigned.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: hosted-games-tv-unsigned
          path: ${{ runner.temp }}/unsigned.apk
          if-no-files-found: error
          retention-days: 7

  sign:
    needs: build
    if: github.event_name == 'workflow_dispatch' && github.repository == 'ecojust/pureTV' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: /tools/puretv-release-certificate-v2.sha256
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: build-tools;34.0.0
      - uses: actions/download-artifact@v4
        with:
          name: hosted-games-tv-unsigned
          path: ${{ runner.temp }}
      - name: Sign and verify the launcher with the pureTV certificate
        shell: bash
        env:
          PURETV_KEYSTORE_BASE64: ${{ secrets.PURETV_KEYSTORE_BASE64 }}
          PURETV_KEYSTORE_PASSWORD: ${{ secrets.PURETV_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          umask 077
          tools="$ANDROID_HOME/build-tools/34.0.0"
          pin="$(cat "$GITHUB_WORKSPACE/tools/puretv-release-certificate-v2.sha256")"
          "$tools/aapt" dump badging unsigned.apk > badging.txt
          grep -Fq "package: name='com.ecojust.hostedgames'" badging.txt
          grep -q '^leanback-launchable-activity:' badging.txt
          version="$(sed -n "s/^package: .*versionName='\([0-9]\+\.[0-9]\+\.[0-9]\+\)'.*/\1/p" badging.txt)"
          test -n "$version"
          trap 'rm -f hosted-signing.jks' EXIT
          printf '%s' "$PURETV_KEYSTORE_BASE64" | base64 -d > hosted-signing.jks
          keytool -exportcert -keystore hosted-signing.jks -alias puretv -storepass:env PURETV_KEYSTORE_PASSWORD > hosted-signing.der
          echo "$pin  hosted-signing.der" | sha256sum --check
          mkdir signed
          apk="hosted-games-$version.apk"
          "$tools/apksigner" sign --ks hosted-signing.jks --ks-key-alias puretv --ks-pass env:PURETV_KEYSTORE_PASSWORD --key-pass env:PURETV_KEYSTORE_PASSWORD --v4-signing-enabled false --out "signed/$apk" unsigned.apk
          "$tools/apksigner" verify --verbose --print-certs "signed/$apk" > signer.txt
          grep -Fxq "Signer #1 certificate SHA-256 digest: $pin" signer.txt
          "$tools/zipalign" -c 4 "signed/$apk"
          cd signed
          sha256sum "$apk" > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: hosted-games-tv-signed
          path: ${{ runner.temp }}/signed/
          if-no-files-found: error
          retention-days: 14

  television:
    needs: sign
    strategy:
      fail-fast: false
      matrix:
        case: [controllers, bandit, fish-loop, noir-extreme, struggle-bus, vespertine, daejeon-campus]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /tools/hosted-games-tv/
            /tools/pc-games/hosted-games.json
            /resource/apps/hosted-games/src/
      - uses: actions/download-artifact@v4
        with:
          name: hosted-games-tv-signed
          path: ${{ runner.temp }}/signed
      - name: Verify package and enable KVM
        run: |
          cd "$RUNNER_TEMP/signed"
          sha256sum --check SHA256SUMS.txt
          sudo chmod a+rw /dev/kvm
      - name: Install runtime test dependencies
        run: python3 -m pip install Pillow==11.3.0 websocket-client==1.8.0
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          emulator-build: '16970787'
          api-level: 36
          target: android-tv
          arch: x86_64
          profile: tv_1080p
          disable-animations: false
          emulator-options: -no-window -memory 2048 -gpu lavapipe -noaudio -no-boot-anim -no-snapshot
          script: python3 tools/hosted-games-tv/qa.py --case "${{ matrix.case }}" --apk "$RUNNER_TEMP"/signed/hosted-games-*.apk --out "$RUNNER_TEMP/hosted-games-qa"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hosted-games-tv-case-${{ matrix.case }}
          path: ${{ runner.temp }}/hosted-games-qa/
          if-no-files-found: warn
          retention-days: 14

  collect:
    needs: [sign, television]
    if: always() && needs.sign.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: /tools/hosted-games-tv/qa-report.py
      - uses: actions/download-artifact@v4
        with:
          pattern: hosted-games-tv-case-*
          path: ${{ runner.temp }}/cases
      - name: Combine independent Android TV test results
        run: python3 tools/hosted-games-tv/qa-report.py --input "$RUNNER_TEMP/cases" --out "$RUNNER_TEMP/runtime"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hosted-games-tv-runtime
          path: ${{ runner.temp }}/runtime/
          if-no-files-found: error
          retention-days: 14

  export:
    needs: [sign, television, collect]
    if: always() && needs.sign.result == 'success'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: hosted-games-tv-signed
          path: ${{ runner.temp }}/signed
      - uses: actions/download-artifact@v4
        id: diagnostics
        continue-on-error: true
        with:
          name: hosted-games-tv-runtime
          path: ${{ runner.temp }}/runtime
      - name: Export the package and bounded game evidence on a new build-assets branch
        shell: bash
        env:
          TV_RESULT: ${{ needs.television.result }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/export"
          cd "$RUNNER_TEMP/export"
          git init -q
          release=release-staging/hosted-games
          mkdir -p "$release"
          (cd "$RUNNER_TEMP/signed" && sha256sum --check SHA256SUMS.txt)
          for input in "$RUNNER_TEMP/signed"/hosted-games-*.apk "$RUNNER_TEMP/signed/SHA256SUMS.txt"; do
            test -f "$input"
            test ! -L "$input"
            test "$(stat -c %s "$input")" -lt 10000000
            cp "$input" "$release/"
          done
          # Export only bounded redacted evidence and the six gameplay frames.
          # Controller setup screens include an ephemeral LAN pairing code.
          for name in report.json catalog-preview.png {bandit,fish-loop,noir-extreme,struggle-bus,vespertine,daejeon-campus}-{played.png,failure.xml,author.xml,guide.xml}; do
            input="$RUNNER_TEMP/runtime/$name"
            if test -f "$input" && test ! -L "$input" && test "$(stat -c %s "$input")" -lt 5000000; then
              cp "$input" "$release/$name"
            fi
          done
          jq -n --arg sha "$GITHUB_SHA" --arg run "$GITHUB_RUN_ID" --arg attempt "$GITHUB_RUN_ATTEMPT" \
            --arg result "$TV_RESULT" '{sourceSha:$sha, runId:$run, attempt:$attempt, television:$result}' > "$release/build.json"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- "$release"
          git commit -m "Stage hosted games TV build $GITHUB_RUN_ID ($GITHUB_SHA)"
          branched="build-assets/hosted-games-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          gh auth setup-git
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          git push --force-with-lease="refs/heads/$branched:" origin "HEAD:refs/heads/$branched"
