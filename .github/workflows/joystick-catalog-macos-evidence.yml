name: Read original joystick catalog macOS evidence
on:
  workflow_dispatch:
    inputs:
      source_run: {required: true, type: string}
      source_sha: {required: true, type: string}
      batch: {required: true, type: string}
      kind: {required: true, type: choice, options: [packages, qa-arm64, qa-intel]}
permissions: {actions: read, contents: write}
jobs:
  evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN: ${{ inputs.source_run }}
      SOURCE_SHA: ${{ inputs.source_sha }}
      BATCH: ${{ inputs.batch }}
      KIND: ${{ inputs.kind }}
    steps:
      - name: Validate original artifact and extract original bytes
        run: |
          python3 - <<'PYTHON'
          """Copy packages and the original native QA evidence for one frozen batch, without running it."""
          import base64,datetime,hashlib,json,os,re,shutil,subprocess,tempfile,zipfile
          from pathlib import Path,PurePosixPath
          env=os.environ;run=env['SOURCE_RUN'];source=env['SOURCE_SHA'];batch=env['BATCH'];repo='ecojust/pureTV'
          def gh(args):return subprocess.check_output(['gh','api',*args])
          def api(path):return json.loads(gh(['repos/'+repo+'/'+path]))
          def H(path):return hashlib.file_digest(path.open('rb'),'sha256').hexdigest()
          assert re.fullmatch('[0-9]+',run) and re.fullmatch('[0-9a-f]{40}',source) and batch in ['puzzle-01','puzzle-02','puzzle-03']
          expected={'44715153569':('ec5161417eaaf4b6be0585d04da60e59fb8d060f','puzzle-01'),'44714845423':('18836937d8564c0e1534e1798c1dfb3096164bb0','puzzle-02'),'44715155021':('ec5161417eaaf4b6be0585d04da60e59fb8d060f','puzzle-03')}
          assert expected[run]==(source,batch),'Reader is restricted to the three frozen final macOS batches'
          r=api('actions/runs/'+run);assert r['path']=='.github/workflows/joystick-catalog-macos.yml' and r['head_sha']==source and r['run_attempt']==1 and r['repository']['full_name']==repo
          jobs=api('actions/runs/'+run+'/attempts/1/jobs?per_page=100')['jobs']
          art=api('actions/runs/'+run+'/artifacts?per_page=100')['artifacts']
          work=Path(env['RUNNER_TEMP']);out=work/'mac-puzzle-original';out.mkdir()
          manifest={'artifactSourceSha':source,'sourceRunId':int(run),'batch':batch,'originalWorkflow':r['path'],'gamesRerun':False,'readerRunId':int(env['GITHUB_RUN_ID']),'readerSource':env['GITHUB_SHA'],'artifacts':{},'packages':{},'files':{}}
          registry=json.loads(base64.b64decode(api('contents/joystick-games/catalog-registry.json?ref='+source)['content']));games=registry['batches'][batch];assert len(games)==3
          kind=env['KIND'];assert kind in ['packages','qa-arm64','qa-intel']
          if kind=='packages':
           name='joystick-catalog-macos-packages-'+batch;job=next(j for j in jobs if j['name'].startswith('build ('+batch+','))
          else:
           runner='macos-latest' if kind=='qa-arm64' else 'macos-15-intel'
           name='joystick-catalog-macos-qa-'+batch+'-'+runner;job=next(j for j in jobs if batch in j['name'] and runner in j['name'] and j['name'].startswith('verify ('))
          assert job['status']=='completed'
          a=next(x for x in art if x['name']==name and not x['expired'])
          assert a['workflow_run']['id']==int(run) and a['workflow_run']['head_sha']==source and job['started_at']<=a['created_at']<=job['completed_at']
          assert a['size_in_bytes']<768*1024**2 and re.fullmatch('sha256:[a-f0-9]{64}',a['digest'])
          zpath=work/'immutable.zip'
          with zpath.open('wb') as f:subprocess.run(['gh','api','repos/'+repo+'/actions/artifacts/'+str(a['id'])+'/zip'],stdout=f,check=True)
          assert zpath.stat().st_size==a['size_in_bytes'] and 'sha256:'+H(zpath)==a['digest']
          manifest['artifacts'][kind]={k:a[k] for k in ('id','name','digest','size_in_bytes','created_at')};manifest.update(originalJobId=job['id'],originalJobConclusion=job['conclusion'])
          dest=out/kind
          with zipfile.ZipFile(zpath) as z:
           seen=set()
           for member in z.infolist():
            rel=PurePosixPath(member.filename)
            assert not rel.is_absolute() and '..' not in rel.parts and not '\\' in member.filename and member.filename not in seen
            assert member.external_attr>>16 & 0o170000 !=0o120000;seen.add(member.filename)
            if member.is_dir():continue
            p=dest/rel;p.parent.mkdir(exist_ok=True,parents=True)
            with z.open(member) as src,p.open('wb') as target:shutil.copyfileobj(src,target)
            assert p.stat().st_size==member.file_size
           if kind=='packages':
            for game in games:
             p=dest/game
             if not p.exists():continue
             meta=json.loads((p/'build-manifest.json').read_text());assert meta['sourceCommit']==source and meta['game']==game
             assert set(meta['architectures'])=={'arm64','x86_64'} and meta['signature']=='ad-hoc' and not meta['appleNotarized'] and set(Path(f).suffix for f in meta['packages'])=={'.zip','.dmg'}
             assert meta['bundleIdentifier']==registry['games'][game]['packageName']
             for n,item in meta['packages'].items():assert Path(n).name==n and (p/n).stat().st_size==item['bytes'] and H(p/n)==item['sha256']
             manifest['packages'][game]=meta['packages']
            assert manifest['packages']
           else:
            rep=json.loads((dest/'batch-report.json').read_text());assert rep['sourceCommit']==source and rep['batch']==batch and rep['runner']==runner
           for p in dest.rglob('*'):
            if p.is_file():
             assert p.stat().st_size<100000000
             manifest['files'][p.relative_to(out).as_posix()]={'bytes':p.stat().st_size,'sha256':H(p)}
          (out/'export-manifest.json').write_text(json.dumps(manifest,indent=2)+'\n')
          print('Bound original artifact',name,a['id'],len(manifest['files']),'files')
          PYTHON
      - name: Preserve only on a new immutable evidence branch
        run: |
          set -euo pipefail
          branch="build-assets/joystick-puzzle-macos-evidence-${GITHUB_RUN_ID}-attempt-${GITHUB_RUN_ATTEMPT}"
          cd "$RUNNER_TEMP/mac-puzzle-original"
          gh auth setup-git
          git init -b evidence
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f .
          git commit -qm "Preserve original ${SOURCE_RUN} ${BATCH} ${KIND} evidence [skip ci]"
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git push --force-with-lease=refs/heads/$branch: origin HEAD:refs/heads/$branch
