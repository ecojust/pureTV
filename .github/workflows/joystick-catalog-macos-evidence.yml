name: Archive Backroad public Mac package runtime evidence
on: workflow_dispatch
jobs:
  archive:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ecojust/pureTV
          run-id: '44679547282'
          artifact-ids: '14602994521'
          merge-multiple: true
          path: ${{ runner.temp }}/native
      - name: Preserve original report, runtime frames and permission observations
        working-directory: ${{ runner.temp }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir evidence
          cd evidence
          jq -e '.status == "passed" and .game == "backroad-rally" and .qaRunId == 44679547282 and .qaSourceCommit == "48953c316b11c1264d21661ae80368216f0a1f00" and .binarySha256 == "f1726ff1d388ca320a0187b067f94b841ad42ef27efe101c13c5c7fce5a2494f" and .storageRestart.status == "passed"' ../native/report.json
          gzip -nc ../native/report.json > report.json.gz
          cp ../native/network-prompts*.txt .
          cp ../native/diagnostics/*.png .
          sha256sum ../native/report.json | sed 's#../native/##' > report.sha256
          git init --initial-branch build-assets/backroad-relaunch-44679547282
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .
          git commit -m 'Preserve Backroad Rally native Mac captures from run 44679547282'
          gh auth setup-git
          git push https://github.com/ecojust/pureTV.git HEAD:refs/heads/build-assets/backroad-relaunch-44679547282
