name: Preserve original Kart Rush Intel Tahoe diagnostic evidence
on: workflow_dispatch
permissions:
  actions: read
  contents: write
jobs:
  archive:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check original artifact provenance and retain exact archive
        working-directory: ${{ runner.temp }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir evidence
          cd evidence
          gh api repos/ecojust/pureTV/actions/artifacts/14607626110 > artifact.json
          jq -e '.workflow_run.id == 44687922302 and .workflow_run.head_sha == "5d03e6b2c801c64528e7698849fb35a9f3d6feeb" and .name == "kart-rush-original-macos26-intel" and .digest == "sha256:b95e16892a534a68fe2e8e317c0f8d3f4c5b319ca31b2980b0c0e947c5aad616"' artifact.json
          gh api repos/ecojust/pureTV/actions/artifacts/14607626110/zip > evidence.zip
          echo 'b95e16892a534a68fe2e8e317c0f8d3f4c5b319ca31b2980b0c0e947c5aad616  evidence.zip' | sha256sum -c
          unzip -tq evidence.zip
          ref=build-assets/kart-rush-intel26-44687922302
          git init --initial-branch="$ref"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add artifact.json evidence.zip
          git commit -m 'Preserve exact native Kart Rush Intel Tahoe graphics evidence'
          gh auth setup-git
          git push --force-with-lease="refs/heads/$ref:" https://github.com/ecojust/pureTV.git "HEAD:refs/heads/$ref"
