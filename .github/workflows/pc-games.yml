name: Catalog desktop player

on:
  workflow_dispatch:
    inputs:
      target:
        description: Desktop package to build
        type: choice
        options: [catalog, standalone, standalone-macos, standalone-windows, icons-android, icons-macos, icons-windows]
        default: catalog
      android_shards:
        description: Android icon build batches (JSON array, 0–7)
        type: string
        default: '[0,1,2,3,4,5,6,7]'
      android_pilot:
        description: Check the first three Android games in each selected batch without publishing
        type: boolean
        default: false
      android_verified_run:
        description: Restore verified Android packages from a run whose release upload failed
        type: string
        required: false
  push:
    branches: [master, 'feat/catalog-game-controls-*']
    paths:
      - 'tools/pc-games/**'
      - '.github/workflows/pc-games.yml'

permissions:
  contents: read

jobs:
  android-icons:
    if: inputs.target == 'icons-android'
    permissions:
      actions: read
      contents: write
    uses: ./.github/workflows/game-icons-android.yml
    with:
      shards: ${{ inputs.android_shards || '[0,1,2,3,4,5,6,7]' }}
      pilot: ${{ inputs.android_pilot || false }}
      verified_run: ${{ inputs.android_verified_run || '' }}
    secrets: inherit

  macos-icons:
    if: inputs.target == 'icons-macos'
    permissions:
      contents: write
    uses: ./.github/workflows/game-icons-macos.yml

  windows-icons:
    if: inputs.target == 'icons-windows'
    permissions:
      contents: write
    uses: ./.github/workflows/game-icons-windows.yml

  games:
    if: startsWith(inputs.target, 'standalone')
    uses: ./.github/workflows/standalone-games.yml
    with:
      target: ${{ inputs.target }}

  windows:
    if: ${{ !startsWith(inputs.target, 'standalone') && !startsWith(inputs.target, 'icons-') }}
    runs-on: windows-2022
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            tools/pc-games
            puretv-joystick
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build and test dependencies
        run: python -m pip install -r tools/pc-games/requirements.txt pyinstaller==6.16.0 playwright==1.56.0
      - name: Verify player and build Windows executable
        working-directory: tools/pc-games
        run: |
          python -m unittest discover -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test test_bridge.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python package.py --output dist
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m PyInstaller --clean --onefile --name pureTV-Games --add-data 'catalog.json:.' --add-data 'pc-bridge.js:.' --collect-all zeroconf --recursive-copy-metadata zeroconf launcher.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $games = .\dist\pureTV-Games.exe --list
          if ($LASTEXITCODE -ne 0 -or $games.Count -eq 0) { throw 'The packaged catalog did not open' }
      - name: Start the Windows executable and play with keyboard and Wi-Fi protocol
        run: python tools/pc-games/smoke.py --exe tools/pc-games/dist/pureTV-Games.exe --channel msedge
      - name: Record verified download checksums
        shell: pwsh
        run: |
          Get-ChildItem tools/pc-games/dist/pureTV-Games* -File | ForEach-Object {
            $digest = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            Write-Output "$digest  $($_.Name)  $($_.Length)"
          }
      - uses: actions/upload-artifact@v4
        with:
          name: pureTV-Games-windows-x64
          path: |
            tools/pc-games/dist/pureTV-Games.exe
            tools/pc-games/dist/pureTV-Games-portable.zip
          if-no-files-found: error
