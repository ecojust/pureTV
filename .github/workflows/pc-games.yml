name: Stage Nova Lancer 0.1.0 in its verified release draft
on:
  workflow_dispatch:
    inputs:
      manifest_sha256:
        description: SHA-256 of the locally verified SHA256SUMS.txt
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: stage-nova-lancer-draft-453447634
  cancel-in-progress: false
jobs:
  stage:
    if: github.repository == 'ecojust/pureTV' && github.ref == 'refs/heads/build-assets/nova-lancer-stage-nov21'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            nova-release-assets
      - name: Verify the five packages and add missing assets to draft 453447634
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_MANIFEST_SHA256: ${{ inputs.manifest_sha256 }}
        run: python3 nova-release-assets/stage.py
