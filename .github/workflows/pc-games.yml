name: Published game input acceptance
on:
  workflow_dispatch:
    inputs:
      games:
        type: string
        required: true
      paths:
        type: string
        required: true
permissions:
  contents: write
jobs:
  play:
    timeout-minutes: 22
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        game: ${{ fromJSON(inputs.games) }}
        path: ${{ fromJSON(inputs.paths) }}
    env:
      GAME: ${{ matrix.game }}
      MODE: ${{ matrix.path }}
      LP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            joystick-games/tools
            joystick-games/qa/controller-input
            joystick-games/${{ matrix.game }}
            resource/game-kit/android/src/main/java/com/ecojust/gamekit
            tools/pc-games
            puretv-joystick
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare verified game and room dependencies
        run: |
          python -m pip install -q playwright==1.56.0 -r tools/pc-games/requirements.txt
          mkdir -p qa-results payloads player
          unzip -q tools/pc-games/packages/pureTV-Games-portable.zip -d player
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          game = os.environ['GAME']
          root = Path('joystick-games') / game
          row = json.loads((root / 'packages.json').read_text())['android']
          apk = root / row['file']
          assert hashlib.sha256(apk.read_bytes()).hexdigest() == row['sha256']
          (Path('payloads') / (game+'.zip')).symlink_to(apk.resolve())
          PY
          if [[ $MODE == phone ]]; then
            curl -fsSL --retry 2 -o android-json.jar https://repo.maven.apache.org/maven2/com/vaadin/external/google/android-json/0.0.20131108.vaadin1/android-json-0.0.20131108.vaadin1.jar
            curl -fsSL --retry 2 -o zxing.jar https://repo.maven.apache.org/maven2/com/google/zxing/core/3.5.3/core-3.5.3.jar
            echo 'dfb7bae2f404cfe0b72b4d23944698cb716b7665171812a0a4d0f5926c0fac79  android-json.jar' | sha256sum -c -
            echo '8d8064c1636fdaef7189dd9055c7d59950a8940a12f2293956446ec3c109fd82  zxing.jar' | sha256sum -c -
          fi
          google-chrome --version
      - name: Play from the ordinary game entry
        run: |
          bash joystick-games/qa/controller-input/run-review.sh
      - name: Preserve the results at an immutable commit
        if: always()
        run: |
          if test -d qa-results && test -n "$(ls -A qa-results)"; then
            git config user.name github-actions
            git config user.email github-actions@users.noreply.github.com
            git add --sparse -f qa-results
            git commit -m "Record $GAME $MODE acceptance on runner $GITHUB_RUN_ID"
            git push origin "HEAD:refs/heads/qa/pr50-results-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$GAME-$MODE"
          fi
