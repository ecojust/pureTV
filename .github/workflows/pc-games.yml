name: Export original game verification artifact
on: workflow_dispatch
permissions:
  actions: read
  contents: write
jobs:
  export:
    if: github.repository == 'ecojust/pureTV' && github.ref == 'refs/heads/build-assets/selected-games-artifact-14944941878'
    runs-on: ubuntu-24.04
    steps:
      - name: Verify the original Actions artifact and save its exact archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          gh api repos/ecojust/pureTV/actions/artifacts/14944941878/zip > original.zip
          echo 'f0868c461ada7b2afeb72a9689b4405e18f0f7d3dfb8683cfcb6beb2b925857b  original.zip' | sha256sum -c
          mkdir verified-output
          cd verified-output
          split -b 48M -d -a 4 ../original.zip archive.part-
          echo 'f0868c461ada7b2afeb72a9689b4405e18f0f7d3dfb8683cfcb6beb2b925857b  original.zip' > original.sha256
          git init -b files
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .
          git commit -m 'Preserve the verified original artifact 14944941878 from Actions run 45442541226'
          gh auth setup-git
          git push https://github.com/ecojust/pureTV.git HEAD:refs/heads/build-assets/selected-games-artifact-14944941878-files
