name: Signed portable player on macOS
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            tools/pc-games
            puretv-joystick
            tools/readme-app-games.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install player and browser test dependencies
        run: |
          python -m pip install -r tools/pc-games/requirements.txt playwright==1.56.0
          /usr/bin/sw_vers
          uname -m
          test -x '/Applications/Google Chrome.app/Contents/MacOS/Google Chrome'
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: 14641245660
          run-id: 44756990162
          github-token: ${{ github.token }}
          path: signed
      - name: Package production player and exercise signed game files in Chrome
        run: |
          git show HEAD:LICENSE > LICENSE
          python tools/pc-games/package.py --output dist
          python tools/pc-games/qa/macos_portable_probe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: portable-macos15-original-inputs
          path: desktop-evidence
          if-no-files-found: warn
