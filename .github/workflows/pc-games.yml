name: Intel WKWebView game diagnostics
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    if: github.repository == 'ecojust/pureTV' && github.ref == 'refs/heads/build-assets/seven-intel-diagnostic-gogh-strike-3831360c'
    runs-on: macos-15-intel
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            joystick-games/gogh-strike/dist
            joystick-games/shared/macos/tools
            intel-diagnostic
      - name: Probe default WebGL and load the exact game files in visible WKWebViews
        run: |
          set -euo pipefail
          mkdir -p intel-diagnostic/evidence
          git ls-files -z joystick-games/gogh-strike/dist | xargs -0 shasum -a256 > intel-diagnostic/evidence/game-digests.txt
          swiftc joystick-games/shared/macos/tools/webgl-probe.swift -o "$RUNNER_TEMP/probe"
          swiftc intel-diagnostic/WKInspect.swift -o "$RUNNER_TEMP/inspect"
          "$RUNNER_TEMP/probe" "$PWD/intel-diagnostic/evidence/webgl.json"
          python3 -m http.server 18392 --bind 127.0.0.1 --directory joystick-games > "$RUNNER_TEMP/server.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          until curl -fsS -o /dev/null http://127.0.0.1:18392/gogh-strike/dist/tv.html; do sleep 1; done
          for game in gogh-strike; do
            "$RUNNER_TEMP/inspect" "http://127.0.0.1:18392/$game/dist/tv.html" "$PWD/intel-diagnostic/evidence/$game.json"
          done
          cp "$RUNNER_TEMP/server.log" intel-diagnostic/evidence/server.log
          git add -f intel-diagnostic/evidence
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Record independent Intel WKWebView game and GPU observations'
          git push origin HEAD:refs/heads/build-assets/seven-intel-diagnostic-gogh-strike-3831360c
      - uses: actions/upload-artifact@v4
        with:
          name: intel-webgl-evidence
          path: intel-diagnostic/evidence
