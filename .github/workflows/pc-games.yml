name: Public released desktop player on Apple Silicon
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            tools/pc-games
            puretv-joystick
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download and verify the public portable player without authentication
        run: |
          mkdir -p download/player
          curl -fsSL --retry 2 'https://github.com/ecojust/pureTV/releases/download/catalog-player-v1.0.0/pureTV-Games-portable.zip' -o download/pureTV-Games-portable.zip
          echo 'c934ec300a27698d0bcae291cdc67bc228f8b17df01a26d351e57b55e93b7c3d  download/pureTV-Games-portable.zip' | shasum -a 256 -c -
          unzip -q download/pureTV-Games-portable.zip -d download/player
          cd download/player
          python3 -m venv .venv
          .venv/bin/python -m pip install -r requirements.txt playwright==1.56.0
      - name: Start published Tetris with an empty cache and play over keyboard and TCP
        run: download/player/.venv/bin/python -u tools/pc-games/qa/macos_released_player.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-macos-apple-silicon-tetris-0.5.7
          path: desktop-evidence
          if-no-files-found: warn
