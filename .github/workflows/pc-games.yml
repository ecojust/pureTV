name: Read original Windows job and workflow ZIP diagnostics
on: workflow_dispatch
permissions:
  actions: read
  contents: write
jobs:
  original-log:
    if: github.repository == 'ecojust/pureTV' && github.ref == 'refs/heads/build-assets/pc-log-138614741083'
    runs-on: ubuntu-24.04
    steps:
      - name: Read original GitHub job and workflow log endpoints
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/original"
          cd "$RUNNER_TEMP/original"
          gh api repos/ecojust/pureTV/actions/jobs/138614741083 > job.json
          jq '{id,run_id,head_sha,name,conclusion}' job.json > identity.json
          curl -sSL -w '%{http_code}\n' -H "Authorization: Bearer $GH_TOKEN" https://api.github.com/repos/ecojust/pureTV/actions/jobs/138614741083/logs -o job.body > job.status || true
          curl -sSL -w '%{http_code}\n' -H "Authorization: Bearer $GH_TOKEN" https://api.github.com/repos/ecojust/pureTV/actions/runs/45441821479/logs -o run.body > run.status || true
          if [ -s run.body ] && unzip -tq run.body > /dev/null 2>&1; then unzip -l run.body > run-files.txt; fi
          sha256sum *.body > payload.sha256
          git init -b evidence
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .
          git commit -m 'Preserve original Windows catalog CI log responses for run 45441821479'
          gh auth setup-git
          git push https://github.com/ecojust/pureTV.git HEAD:refs/heads/build-assets/pc-log-138614741083-files
