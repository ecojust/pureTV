name: Catalog desktop player

on:
  workflow_dispatch:
  push:
    branches: [master, 'feat/catalog-game-controls-*']
    paths:
      - 'tools/pc-games/**'
      - '.github/workflows/pc-games.yml'

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            tools/pc-games
            puretv-joystick
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build and test dependencies
        run: python -m pip install -r tools/pc-games/requirements.txt pyinstaller==6.16.0 playwright==1.56.0
      - name: Verify player and build Windows executable
        working-directory: tools/pc-games
        run: |
          python -m unittest discover -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test test_bridge.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python package.py --output dist
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m PyInstaller --clean --onefile --name pureTV-Games --add-data 'catalog.json:.' --add-data 'pc-bridge.js:.' --collect-all zeroconf --recursive-copy-metadata zeroconf launcher.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $games = .\dist\pureTV-Games.exe --list
          if ($LASTEXITCODE -ne 0 -or $games.Count -eq 0) { throw 'The packaged catalog did not open' }
      - name: Start the Windows executable and play with keyboard and Wi-Fi protocol
        run: python tools/pc-games/smoke.py --exe tools/pc-games/dist/pureTV-Games.exe --channel msedge
      - uses: actions/upload-artifact@v4
        with:
          name: pureTV-Games-windows-x64
          path: |
            tools/pc-games/dist/pureTV-Games.exe
            tools/pc-games/dist/pureTV-Games-portable.zip
          if-no-files-found: error
