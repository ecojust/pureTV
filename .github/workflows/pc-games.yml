name: Stage verified standalone game packages
on:
  workflow_dispatch:
    inputs:
      run:
        description: Verified game package workflow run
        required: true
      platform:
        description: Platform to stage
        required: true
        type: choice
        options: [macos, windows]
      source:
        description: Full commit SHA of the native build
        required: true
permissions:
  contents: write
  actions: read
jobs:
  stage:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_ID: ${{ inputs.run }}
      SYSTEM: ${{ inputs.platform }}
      SOURCE: ${{ inputs.source }}
      TAG: standalone-games-2026.11.21
    steps:
      - name: Stage verified artifacts in the existing draft
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os,re,subprocess
          from pathlib import Path
          def gh(*args):
              return subprocess.check_output(['gh',*args])
          repo=os.environ['GH_REPO']
          api=lambda part: json.loads(gh('api',f'repos/{repo}/{part}'))
          run,source,system,tag=[os.environ[k] for k in ('RUN_ID','SOURCE','SYSTEM','TAG')]
          assert run.isdigit() and re.fullmatch('[0-9a-f]{40}',source)
          assert system in ('macos','windows')
          info=api(f'actions/runs/{run}')
          assert info['head_sha']==source and info['head_repository']['full_name']==repo and info['head_branch']=='fix/game-client-downloads' and info['path']=='.github/workflows/pc-games.yml'
          jobs=api(f'actions/runs/{run}/jobs')['jobs']
          job,=[j for j in jobs if j['name'].startswith('games / build ('+system+',')]
          assert job['conclusion']=='success'
          gh('run','download',run,'-n','standalone-'+system,'-D','packages')
          root=Path('packages')
          report=root/f'verification-{system}.json'
          rows=json.loads(report.read_text())
          assert len(rows)==(16 if system=='macos' else 21)
          files={report.name:report}
          for row in rows:
              slug=row['id']
              assert re.fullmatch('[a-z0-9-]+',slug) and row['normalLaunch'] and row['controllerKey']=='A'
              state=row['wkGameState'] if system=='macos' else row['browser']['initialGameState']
              assert state and state.lower() not in ('loading','error')
              name=slug+('-macos.dmg' if system=='macos' else '-windows-x64-setup.exe')
              assert name==row['installer'] and name not in files
              p=root/name
              assert hashlib.sha256(p.read_bytes()).hexdigest()==row['installerSha256']
              files[name]=p
          draft=json.loads(gh('release','view',tag,'--json','assets,isDraft,tagName'))
          assert draft['isDraft'] and draft['tagName']==tag
          existing={a['name']:a for a in draft['assets']}
          for name,p in files.items():
              if name in existing:
                  assert existing[name]['digest']=='sha256:'+hashlib.sha256(p.read_bytes()).hexdigest()
              else:
                  gh('release','upload',tag,str(p))
          if system=='windows':
              # Check the draft payload digests against both native verification reports.
              gh('release','download',tag,'-p','verification-macos.json','-D','summary')
              mac_rows=json.loads(Path('summary/verification-macos.json').read_text())
              assert len(mac_rows)==16
              all_rows={r['installer']:r['installerSha256'] for r in rows+mac_rows}
              assert len(all_rows)==37
              draft=json.loads(gh('release','view',tag,'--json','isDraft,assets'))
              assert draft['isDraft']
              assets={a['name']:a for a in draft['assets']}
              assert all(assets[n]['digest']=='sha256:'+d for n,d in all_rows.items())
              sums=Path('SHA256SUMS.txt')
              sums.write_text(''.join(f'{all_rows[n]}  {n}\n' for n in sorted(all_rows)))
              evidence=Path('keyboard-gameplay.json')
              import base64
              record=api('contents/tools/pc-games/qa/standalone-keyboard-2026-11-21.json?ref=c6b55e565a60e9f5ec6773f3ce80b4ff0bf2015b')
              evidence.write_bytes(base64.b64decode(record['content']))
              played=json.loads(evidence.read_bytes())
              assert len(played['results'])==21 and all(r['ok'] for r in played['results'])
              for p in [sums,evidence]:
                  if p.name not in assets:
                      gh('release','upload',tag,str(p))
                  else:
                      assert assets[p.name]['digest']=='sha256:'+hashlib.sha256(p.read_bytes()).hexdigest()
          print(f'Staged {len(rows)} verified {system} packages and their report.')
          PY
