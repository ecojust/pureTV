name: Verify original launcher integration HTTP evidence
on: workflow_dispatch
permissions:
  actions: read
  contents: read
jobs:
  inspect:
    if: github.repository == 'ecojust/pureTV' && github.ref == 'refs/heads/build-assets/launcher-maven-diagnostic-45442541226'
    runs-on: ubuntu-24.04
    steps:
      - name: Verify original report identities and enumerate HTTP causes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import collections, hashlib, io, re, subprocess, xml.etree.ElementTree as ET, zipfile
          for name,(artifact,digest) in {'pixel': [14945705398, 'sha256:e6eb80bca84b2d5c8d2b6470718ba45df0e194abf707bccdcc3555a3ba46ae4c'], 'moss': [14945106822, 'sha256:6ff93bf55183cb16557fde78bcdcb350da88348494ef6014fbf694122075429e'], 'aster': [14944941878, 'sha256:f0868c461ada7b2afeb72a9689b4405e18f0f7d3dfb8683cfcb6beb2b925857b'], 'drift': [14944106883, 'sha256:607f0a44e47f83ccacf3f818fa5391e75bce5a74a82e6b70f2c7653b1a94baa8']}.items():
              data=subprocess.check_output(['gh','api','repos/ecojust/pureTV/actions/artifacts/'+str(artifact)+'/zip'])
              assert 'sha256:'+hashlib.sha256(data).hexdigest()==digest
              count=collections.Counter()
              with zipfile.ZipFile(io.BytesIO(data)) as report:
                  for path in report.namelist():
                      if '/test-results/' not in path or not path.endswith('.xml'): continue
                      for case in ET.fromstring(report.read(path)).iter('testcase'):
                          for failure in case.findall('failure')+case.findall('error'):
                              causes=[line.strip() for line in failure.text.splitlines() if line.strip().startswith('Caused by: java.io.IOException:')]
                              count.update(causes or ['Other error: '+failure.get('type','')])
              print(name,artifact,digest,dict(count),flush=True)
          PY
