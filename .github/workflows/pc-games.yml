name: Export original game verification artifact
on: workflow_dispatch
permissions:
  actions: read
  contents: write
jobs:
  export:
    if: github.repository == 'ecojust/pureTV' && github.ref == 'refs/heads/build-assets/selected-games-artifact-14944190578'
    runs-on: ubuntu-24.04
    steps:
      - name: Verify the original Actions artifact and save its exact archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          gh api repos/ecojust/pureTV/actions/artifacts/14944190578/zip > original.zip
          echo '267a6b84fa33d02600c0a8907d25d92ec16620b6570a0ad4811f81c44860f877  original.zip' | sha256sum -c
          mkdir verified-output
          cd verified-output
          split -b 48M -d -a 4 ../original.zip archive.part-
          echo '267a6b84fa33d02600c0a8907d25d92ec16620b6570a0ad4811f81c44860f877  original.zip' > original.sha256
          git init -b files
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .
          git commit -m 'Preserve the verified original artifact 14944190578 from Actions run 45438957573'
          gh auth setup-git
          git push https://github.com/ecojust/pureTV.git HEAD:refs/heads/build-assets/selected-games-artifact-14944190578-files
