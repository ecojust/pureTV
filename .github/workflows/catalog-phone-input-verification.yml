name: Frozen catalogue television QR and phone input
on:
  push:
    branches:
      - qa/catalog-phone-input-20261120
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - shard: backroad
            games: backroad-rally last-track story-thief glup
          - shard: royale
            games: kart-royale kart-rush emberbrood atlas-of-ink starsling
          - shard: ponpoko
            games: ponpoko-kart penguintrack cf-transport-ship starbase-spooky bumble-basket oathstones
          - shard: night
            games: night-racer dirt-crown turbo-kart-rush qq-speed alchemists-lattice solder-and-rain neon-arcana
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /joystick-games/qa/controller-input/
            /joystick-games/*/dist/
            /joystick-games/*/game.json
            /resource/game-kit/web/controller.*
            /resource/game-kit/android/src/main/java/com/ecojust/gamekit/
            /puretv-joystick/joystick_sdk.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Open the scanned original room and send real touchscreen movement
        env:
          GAMES: ${{ matrix.games }}
        run: |
          python -m pip install 'playwright==1.62.0'
          curl --fail --location --retry 3 https://repo.maven.apache.org/maven2/com/google/zxing/core/3.5.3/core-3.5.3.jar --output "$RUNNER_TEMP/zxing.jar"
          curl --fail --location --retry 3 https://repo.maven.apache.org/maven2/com/vaadin/external/google/android-json/0.0.20131108.vaadin1/android-json-0.0.20131108.vaadin1.jar --output "$RUNNER_TEMP/android-json.jar"
          echo "8d8064c1636fdaef7189dd9055c7d59950a8940a12f2293956446ec3c109fd82  $RUNNER_TEMP/zxing.jar" | sha256sum -c -
          echo "dfb7bae2f404cfe0b72b4d23944698cb716b7665171812a0a4d0f5926c0fac79  $RUNNER_TEMP/android-json.jar" | sha256sum -c -
          python joystick-games/qa/controller-input/payloads.py --output "$RUNNER_TEMP/games" $GAMES
          python joystick-games/qa/controller-input/phone.py --android-json "$RUNNER_TEMP/android-json.jar" --zxing "$RUNNER_TEMP/zxing.jar" --chromium "$(command -v google-chrome)" --payloads "$RUNNER_TEMP/games" --output "$RUNNER_TEMP/result" --timeout 300 $GAMES
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frozen-phone-${{ matrix.shard }}
          path: ${{ runner.temp }}/result/
