name: Build localized game installers
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Frozen source commit
        required: true
      batches:
        description: JSON matrix with id, os, mode
        required: true
permissions:
  contents: write
jobs:
  package:
    name: ${{ matrix.id }} ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.batches) }}
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      GH_TOKEN: ${{ github.token }}
      FROZEN: ${{ inputs.source_sha }}
      GAME: ${{ matrix.id }}
      BUILD_MODE: ${{ matrix.mode }}
    defaults:
      run:
        shell: bash
    steps:
      - run: |
          git config --global core.autocrlf false
          git config --global core.longpaths true
      - uses: actions/checkout@v4
        with:
          path: ci
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: /tools/ci/desktop-cn.py
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          path: game
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /tools/*.py
            /tools/*.json
            /tools/pc-games/*.py
            /tools/pc-games/*.js
            /tools/pc-games/*.swift
            /tools/pc-games/*.json
            /tools/pc-games/requirements.txt
            /README.md
            /LICENSE
            /puretv-joystick/joystick_sdk.py
            /.github/workflows/*.yml
            /joystick-games/catalog-registry.json
            /joystick-games/tools/*.py
            /joystick-games/shared/macos/Sources/
            /joystick-games/shared/macos/Web/
            /joystick-games/shared/windows/Web/
            /joystick-games/shared/web/
            /joystick-games/${{ matrix.id }}/dist/
            /joystick-games/${{ matrix.id }}/game.json
            /joystick-games/${{ matrix.id }}/resource.json
            /joystick-games/${{ matrix.id }}/NOTICE.md
            /joystick-games/${{ matrix.id }}/LICENSE*
            /joystick-games/${{ matrix.id }}/upstream.json
            /joystick-games/${{ matrix.id }}/src/
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare build dependencies
        working-directory: game
        run: |
          python -m pip install Pillow==11.3.0
          if [[ "$BUILD_MODE" = apk && "$RUNNER_OS" = macOS ]]; then
            curl --retry 3 -fsSL https://www.python.org/ftp/python/3.12.10/python-3.12.10-macos11.pkg -o "$RUNNER_TEMP/python.pkg"
            echo "8373e58da4ea146b3eb1c1f9834f19a319440b6b679b06050b1f9ee3237aa8e4  $RUNNER_TEMP/python.pkg" | shasum -a 256 -c -
            sudo installer -pkg "$RUNNER_TEMP/python.pkg" -target /
            /Library/Frameworks/Python.framework/Versions/3.12/bin/python3 -m venv "$RUNNER_TEMP/game-venv"
            echo "$RUNNER_TEMP/game-venv/bin" >> "$GITHUB_PATH"
            echo "SSL_CERT_FILE=/etc/ssl/cert.pem" >> "$GITHUB_ENV"
            SKIP_CYTHON=1 "$RUNNER_TEMP/game-venv/bin/python" -m pip install --no-binary=zeroconf -r tools/pc-games/requirements.txt pyinstaller==6.16.0 Pillow==11.3.0
          elif [[ "$BUILD_MODE" = apk ]]; then
            python -m pip install -r tools/pc-games/requirements.txt pyinstaller==6.16.0 playwright==1.56.0
          elif [[ "$RUNNER_OS" = Windows ]]; then
            python -m pip install pefile==2023.2.7
            if ! test -f '/c/Program Files (x86)/NSIS/makensis.exe'; then choco install nsis --version=3.10 -y --no-progress; fi
          fi
      - name: Assemble, install and verify the frozen game
        working-directory: game
        run: python ../ci/tools/ci/desktop-cn.py
      - name: Stage verified files in the draft
        working-directory: game
        run: |
          tag=games-zh-cn-2026.11.25
          test "$(gh release view "$tag" --json isDraft -q .isDraft)" = true
          flags=()
          if [[ "$GAME" = cf-transport-ship && "$RUNNER_OS" = macOS && "$FROZEN" != a5c902437c87fe11fd7b1c974251e5f8c108cd5f ]]; then
            gh release download "$tag" -p cf-transport-ship-macos-verification.json -O "$RUNNER_TEMP/pilot.json"
            python -c "import json,os,pathlib; assert json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'pilot.json').read_text())['sourceCommit']=='a5c902437c87fe11fd7b1c974251e5f8c108cd5f'"
            flags+=(--clobber)
          fi
          gh release upload "$tag" "${flags[@]}" "$RUNNER_TEMP"/localized/*
