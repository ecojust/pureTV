name: Original signed Used Car Racing mobile room and Android exit dialog
permissions:
  contents: read
  actions: read
jobs:
  plan:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.selection.outputs.matrix }}
      selection: ${{ steps.selection.outputs.selection }}
    steps:
    - uses: actions/checkout@v4
      with:
        filter: blob:none
        sparse-checkout-cone-mode: false
        sparse-checkout: 'tools/controller-emulator-batch.py

          tools/controller-release.py

          tools/resource_catalog.py

          '
    - name: Validate the requested batches before creating the matrix
      id: selection
      env:
        REQUESTED_BATCHES: ${{ inputs.batches }}
        BUNDLE_MANIFEST: ${{ inputs.bundle_manifest }}
        ACCEPTANCE_MODE: ${{ inputs.acceptance_mode }}
      run: "python3 - <<'PY'\nimport importlib.util,json,os,sys\nsys.path.insert(0,'tools')\n\
        spec=importlib.util.spec_from_file_location('runtime_batch','tools/controller-emulator-batch.py')\n\
        batch=importlib.util.module_from_spec(spec);spec.loader.exec_module(batch)\n\
        scope=json.loads(os.environ['BUNDLE_MANIFEST']).get('scope', 'all')\nplan=batch.runtime_plan(os.environ['REQUESTED_BATCHES'],os.environ.get('ACCEPTANCE_MODE')\
        \ or 'complete',scope)\nplan['qaSourceSha']=os.environ['GITHUB_SHA']\nwith\
        \ open(os.environ['GITHUB_OUTPUT'],'a') as out:\n    out.write('matrix='+json.dumps(plan['matrix'],separators=(',',':'))+'\\\
        n')\n    out.write('selection='+json.dumps(plan,separators=(',',':'))+'\\\
        n')\nprint(json.dumps(plan,indent=2))\nPY\n"
  runtime:
    name: Original phone page on the installed Android TV release
    needs: plan
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      PYTHONUNBUFFERED: '1'
      PURETV_DISPOSABLE_EMULATOR: '1'
      RUNTIME_SELECTION: ${{ needs.plan.outputs.selection }}
    steps:
    - uses: actions/checkout@v4
      with:
        sparse-checkout-cone-mode: false
        sparse-checkout: ${{ (fromJSON(inputs.bundle_manifest).scope != '' && fromJSON(inputs.bundle_manifest).scope
          != 'all') && '/tools/' || '' }}
    - name: Check out selected runtime sources and original upgrade APKs
      if: fromJSON(inputs.bundle_manifest).scope != '' && fromJSON(inputs.bundle_manifest).scope
        != 'all'
      env:
        CONTROLLER_RELEASE_SCOPE: ${{ fromJSON(inputs.bundle_manifest).scope }}
      run: python3 tools/controller-release.py checkout-home-inputs
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
    - uses: android-actions/setup-android@v3
      with:
        packages: platform-tools build-tools;34.0.0
    - name: Parse immutable artifact references
      env:
        BUNDLE_MANIFEST: ${{ inputs.bundle_manifest }}
      run: "python3 - <<'PY'\nimport json,os,re\nfrom pathlib import Path\nmanifest=json.loads(os.environ['BUNDLE_MANIFEST'])\n\
        assert re.fullmatch('[a-f0-9]{40}',manifest['sourceSha'])\n(Path(os.environ['RUNNER_TEMP'])/'bundle-manifest.json').write_text(json.dumps(manifest)+'\\\
        n')\nselection=json.loads(os.environ['RUNTIME_SELECTION'])\nassert selection['qaSourceSha']==os.environ['GITHUB_SHA']\n\
        (Path(os.environ['RUNNER_TEMP'])/'runtime-selection.json').write_text(json.dumps(selection,indent=2)+'\\\
        n')\nlegacy_source=manifest.get('legacySourceSha',manifest['sourceSha'])\n\
        assert re.fullmatch('[a-f0-9]{40}',legacy_source)\nwith open(os.environ['GITHUB_ENV'],'a')\
        \ as out:\n    assert selection['acceptanceMode'] in ['complete','client-status']\n\
        \    out.write('ARTIFACT_SOURCE='+manifest['sourceSha']+'\\nLEGACY_ARTIFACT_SOURCE='+legacy_source+'\\\
        nACCEPTANCE_MODE='+selection['acceptanceMode']+'\\n')\nPY\n"
    - name: Fetch and verify the already signed game and observer APKs
      env:
        GH_TOKEN: ${{ github.token }}
      run: python3 tools/controller-runtime-inputs.py --manifest "$RUNNER_TEMP/bundle-manifest.json"
        --group '${{ matrix.group }}' --output "$RUNNER_TEMP/controller-runtime-input"
        --build-tools "$ANDROID_HOME/build-tools/34.0.0"
    - name: Install the browser used for the original virtual controller
      run: 'set -euo pipefail

        mkdir "$RUNNER_TEMP/controller-browser"

        cd "$RUNNER_TEMP/controller-browser"

        npm install --no-audit --no-fund --package-lock=false playwright@1.64.1 pngjs@7.0.0

        npx playwright install --with-deps chromium

        node - <<''JS'' >> "$GITHUB_ENV"

        console.log(''PURETV_PACKAGE=''+process.cwd()+''/package.json'');

        console.log(''CHROMIUM_PATH=''+require(''playwright'').chromium.executablePath());

        JS

        '
    - name: Enable disposable emulator acceleration
      run: 'test -e /dev/kvm

        sudo chmod a+rw /dev/kvm

        command -v ffprobe >/dev/null || sudo apt-get install -y --no-install-recommends
        ffmpeg

        '
    - name: Independently verify the pinned official emulator archive
      if: matrix.emulatorBuild != ''
      env:
        EMULATOR_ARCHIVE: ${{ toJSON(matrix.emulatorArchive) }}
      run: "python3 - <<'PY'\nimport hashlib,json,os,urllib.request\nfrom pathlib\
        \ import Path\nexpected=json.loads(os.environ['EMULATOR_ARCHIVE'])\nreceipt={'expected':expected,'method':'Independent\
        \ streaming download of the same official URL subsequently installed by emulator-runner;\
        \ its separate installer download is not intercepted.','status':'running'}\n\
        try:\n    digest=hashlib.sha256();size=0\n    with urllib.request.urlopen(expected['url'],timeout=120)\
        \ as response:\n        receipt['responseUrl']=response.url\n        while\
        \ chunk:=response.read(1024*1024):\n            digest.update(chunk);size+=len(chunk)\n\
        \    receipt.update({'actualSha256':digest.hexdigest(),'actualBytes':size})\n\
        \    assert digest.hexdigest()==expected['sha256'] and size==expected['bytes'],\
        \ 'Official emulator archive does not match its published identity'\n    receipt['status']='verified'\n\
        except Exception as error:\n    receipt.update({'status':'failed','error':repr(error)});raise\n\
        finally:\n    (Path(os.environ['RUNNER_TEMP'])/'emulator-archive-verification.json').write_text(json.dumps(receipt,indent=2)+'\\\
        n')\nPY\n"
    - name: Configure host Mesa OpenGL and a CPU Vulkan ICD for the Android graphics
        transport
      if: matrix.batch == 'retry-used-car-mesa'
      run: 'set -euo pipefail

        sudo apt-get update -qq

        sudo apt-get install -y --no-install-recommends xvfb mesa-utils mesa-vulkan-drivers
        vulkan-tools

        out="$RUNNER_TEMP/controller-host-renderer"

        mkdir -p "$out"

        dpkg-query -W xvfb mesa-utils mesa-vulkan-drivers vulkan-tools > "$out/packages.txt"

        mapfile -t drivers < <(dpkg-query -L mesa-vulkan-drivers:amd64 | grep -E ''/lvp_icd(\.x86_64)?\.json$'')

        test "${#drivers[@]}" -eq 1

        Xvfb -displayfd 3 -screen 0 1280x720x24 -nolisten tcp -ac +extension GLX 3>"$out/display-number"
        >"$out/xvfb.log" 2>&1 &

        for i in {1..40}; do test -s "$out/display-number" && break; sleep .25; done

        export DISPLAY=":$(cat "$out/display-number")" LIBGL_ALWAYS_SOFTWARE=1 GALLIUM_DRIVER=llvmpipe

        export VK_DRIVER_FILES="${drivers[0]}" VK_ICD_FILENAMES="${drivers[0]}"

        cat "$VK_DRIVER_FILES" > "$out/mesa-icd.json"

        glxinfo -B > "$out/host-gl.txt"

        grep -i ''OpenGL renderer string:.*llvmpipe'' "$out/host-gl.txt"

        vulkaninfo --summary > "$out/host-vulkan.txt"

        grep -i ''deviceName.*llvmpipe'' "$out/host-vulkan.txt"

        env | grep -E ''^(DISPLAY|LIBGL_ALWAYS_SOFTWARE|GALLIUM_DRIVER|VK_DRIVER_FILES|VK_ICD_FILENAMES)=''
        >> "$GITHUB_ENV"

        '
    - name: Drive with the original phone page and cancel the native Android exit
        dialog
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: ${{ matrix.apiLevel }}
        target: android-tv
        arch: ${{ matrix.arch }}
        profile: ${{ matrix.batch == 'retry-used-car-mesa' && 'tv_720p' || 'tv_1080p'
          }}
        avd-name: ControllerGamesValidation
        force-avd-creation: true
        disable-animations: true
        emulator-build: ${{ matrix.emulatorBuild }}
        emulator-options: ${{ matrix.emulatorOptions }}
        script: python3 tools/readme-controller-qa/used-phone.py "$RUNNER_TEMP/controller-runtime-input"
          "$RUNNER_TEMP/used-phone-result"
    - name: Retain original source and SHA for the phone-only test
      if: always()
      run: 'mkdir -p "$RUNNER_TEMP/used-phone-result/sources"

        cp tools/readme-controller-qa/used-phone.{mjs,py} "$RUNNER_TEMP/used-phone-result/sources/"

        cp "$RUNNER_TEMP/bundle-manifest.json" "$RUNNER_TEMP/used-phone-result/"

        cp "$RUNNER_TEMP/controller-host-renderer/host-gl.txt" "$RUNNER_TEMP/used-phone-result/"

        cp "$RUNNER_TEMP/controller-host-renderer/host-vulkan.txt" "$RUNNER_TEMP/used-phone-result/"

        '
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: original-used-car-phone-dialog
        path: ${{ runner.temp }}/used-phone-result
        if-no-files-found: error
  export-phone:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    needs: runtime
    if: always()
    steps:
    - uses: actions/download-artifact@v4
      with:
        name: original-used-car-phone-dialog
        path: evidence
    - name: Preserve the real per-run report and SHA manifest
      env:
        GH_TOKEN: ${{ github.token }}
      run: 'set -euo pipefail

        cd evidence

        python - <<''EOF''

        from pathlib import Path

        import hashlib,json

        p=Path(''.'');files={str(f):{''bytes'':f.stat().st_size,''sha256'':hashlib.file_digest(f.open(''rb''),''sha256'').hexdigest()}
        for f in sorted(p.rglob(''*'')) if f.is_file()}

        (p/''files.json'').write_text(json.dumps(files,indent=2)+''\n'')

        EOF

        git init -q

        git config user.name github-actions[bot]

        git config user.email 41898282+github-actions[bot]@users.noreply.github.com

        git add .

        git commit -qm "Record phone-only driving and native exit dialog observations
        in the signed release"

        git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"

        gh auth setup-git

        git push origin "HEAD:refs/heads/build-assets/used-car-phone-dialog-$GITHUB_RUN_ID-attempt-$GITHUB_RUN_ATTEMPT"

        '
'on':
  workflow_dispatch:
    inputs:
      bundle_manifest:
        description: 'JSON: sourceSha, optional legacySourceSha, legacyRunId, legacyAttempt,
          kitRuns mapping Game Kit IDs to successful signing run IDs; optional scope
          (all, home-12, arcade-7, arcade-recovery-6, coast-1 or used-car-1)'
        type: string
        required: true
      batches:
        description: Optional JSON array of predefined batch names; empty means all
          batches in the selected scope
        type: string
        required: false
        default: ''
      acceptance_mode:
        description: Complete gameplay acceptance or controller client-status UI acceptance
          only
        type: choice
        options:
        - complete
        - client-status
        default: complete
        required: false
