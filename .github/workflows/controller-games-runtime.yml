name: README games signed APK controller runtime

on:
  push:
    branches: [feat/readme-games-controller]
    paths: ['.github/workflows/controller-games-runtime.yml']
  workflow_dispatch:
    inputs:
      bundle_manifest:
        description: 'JSON: sourceSha, legacyRunId, legacyAttempt, kitRuns mapping all nine Game Kit IDs to successful signing run IDs'
        type: string
        required: true

permissions:
  contents: read
  actions: read

jobs:
  runtime:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        group: [arcade, worlds, kit]
    env:
      PYTHONUNBUFFERED: '1'
      PURETV_DISPOSABLE_EMULATOR: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools build-tools;34.0.0
      - name: Parse immutable artifact references
        env:
          BUNDLE_MANIFEST: ${{ inputs.bundle_manifest }}
        run: |
          python3 - <<'PY'
          import json,os,re
          from pathlib import Path
          manifest=json.loads(os.environ['BUNDLE_MANIFEST'])
          assert re.fullmatch('[a-f0-9]{40}',manifest['sourceSha'])
          (Path(os.environ['RUNNER_TEMP'])/'bundle-manifest.json').write_text(json.dumps(manifest)+'\n')
          with open(os.environ['GITHUB_ENV'],'a') as out:out.write('ARTIFACT_SOURCE='+manifest['sourceSha']+'\n')
          PY
      - name: Fetch and verify the already signed game and observer APKs
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 tools/controller-runtime-inputs.py
          --manifest "$RUNNER_TEMP/bundle-manifest.json"
          --group '${{ matrix.group }}'
          --output "$RUNNER_TEMP/controller-runtime-input"
          --build-tools "$ANDROID_HOME/build-tools/34.0.0"
      - name: Install the browser used for the original virtual controller
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/controller-browser"
          cd "$RUNNER_TEMP/controller-browser"
          npm install --no-audit --no-fund --package-lock=false playwright@1.64.1 pngjs@7.0.0
          npx playwright install --with-deps chromium
          node - <<'JS' >> "$GITHUB_ENV"
          console.log('PURETV_PACKAGE='+process.cwd()+'/package.json');
          console.log('CHROMIUM_PATH='+require('playwright').chromium.executablePath());
          JS
      - name: Enable disposable emulator acceleration
        run: |
          test -e /dev/kvm
          sudo chmod a+rw /dev/kvm
          command -v ffprobe >/dev/null || sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Upgrade and operate actual release APKs with the original pureTV SDK
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: android-tv
          arch: x86_64
          profile: tv_1080p
          avd-name: ControllerGamesValidation
          force-avd-creation: true
          disable-animations: true
          emulator-options: -no-window -memory 3072 -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: >-
            python3 tools/controller-emulator-batch.py --group '${{ matrix.group }}'
            --input "$RUNNER_TEMP/controller-runtime-input"
            --output "$RUNNER_TEMP/controller-runtime-output"
            --artifact-source "$ARTIFACT_SOURCE" --adb "$ANDROID_HOME/platform-tools/adb"
            --serial emulator-5554
      - name: Preserve input verification and exact executed QA sources
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os,shutil,json,hashlib
          root=Path(os.environ['RUNNER_TEMP']);out=root/'controller-runtime-output';out.mkdir(exist_ok=True)
          for name in ['bundle-manifest.json','controller-runtime-input/input-verification.json']:
              path=root/name
              if path.is_file():shutil.copy2(path,out/path.name)
          source=out/'executed-sources';source.mkdir(exist_ok=True)
          paths=[Path('tools/controller-emulator-batch.py'),Path('tools/controller-runtime-inputs.py'),Path('.github/workflows/controller-games-runtime.yml'),Path('tools/controller-release.py'),Path('tools/resource_catalog.py'),Path('resource/game-kit/fetch-signed.py'),Path('resource/game-kit/qa/common.mjs'),Path('tools/readme-controller-qa/baseline-inventory.json')]
          paths += [p for p in Path('tools/readme-controller-qa').rglob('*') if p.is_file() and p.suffix in ['.py','.mjs']]
          records={}
          for p in paths:
              dest=source/p;dest.parent.mkdir(parents=True,exist_ok=True);shutil.copy2(p,dest)
              records[p.as_posix()]={'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()}
          (out/'executed-source-manifest.json').write_text(json.dumps({'qaSourceSha':os.environ['GITHUB_SHA'],'files':records},indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: controller-runtime-${{ matrix.group }}
          path: ${{ runner.temp }}/controller-runtime-output/
          if-no-files-found: error

  export:
    if: always() && github.event_name == 'workflow_dispatch'
    needs: runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: controller-runtime-*
          path: ${{ runner.temp }}/controller-runtime-export/evidence
      - name: Describe actual runtime results without changing raw reports
        env:
          RUNTIME_RESULT: ${{ needs.runtime.result }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os,json,hashlib
          out=Path(os.environ['RUNNER_TEMP'])/'controller-runtime-export';rows={}
          for p in out.rglob('*'):
              if p.is_file():rows[p.relative_to(out).as_posix()]={'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()}
          (out/'export-manifest.json').write_text(json.dumps({'qaSourceSha':os.environ['GITHUB_SHA'],'runId':os.environ['GITHUB_RUN_ID'],'runtimeResult':os.environ['RUNTIME_RESULT'],'files':rows},indent=2)+'\n')
          PY
      - name: Export original evidence on a new isolated branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          export_branch="build-assets/controller-runtime-${GITHUB_RUN_ID}-attempt-${GITHUB_RUN_ATTEMPT}"
          test -z "$(git ls-remote --heads origin "refs/heads/$export_branch")"
          git init --initial-branch "$export_branch" "$RUNNER_TEMP/controller-runtime-export"
          git -C "$RUNNER_TEMP/controller-runtime-export" config user.name github-actions[bot]
          git -C "$RUNNER_TEMP/controller-runtime-export" config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git -C "$RUNNER_TEMP/controller-runtime-export" add .
          git -C "$RUNNER_TEMP/controller-runtime-export" commit -q -m "Actual controller runtime evidence ${GITHUB_RUN_ID}"
          gh auth setup-git
          git -C "$RUNNER_TEMP/controller-runtime-export" remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          git -C "$RUNNER_TEMP/controller-runtime-export" push origin "HEAD:refs/heads/$export_branch"
