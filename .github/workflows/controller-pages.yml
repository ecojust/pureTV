name: Publish secure driving controller

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact source commit verified by the Android build
        required: true
        type: string
      build_run_id:
        description: Successful Android build with controller and relay checks
        required: true
        type: string

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: secure-driving-controller-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Verify the exact tested controller source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess
          repository = os.environ['REPOSITORY']
          source = os.environ['SOURCE_SHA']
          run_id = os.environ['BUILD_RUN_ID']
          assert repository == 'ecojust/pureTV'
          assert re.fullmatch(r'[0-9a-f]{40}', source)
          assert re.fullmatch(r'[1-9][0-9]*', run_id)
          run = json.loads(subprocess.check_output(['gh', 'api', f'repos/{repository}/actions/runs/{run_id}']))
          assert run['status'] == 'completed' and run['conclusion'] == 'success'
          assert run['head_sha'] == source and run['path'] == '.github/workflows/android.yml'
          assert run['repository']['full_name'] == repository and run['head_repository']['full_name'] == repository
          PY
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
      - name: Build only the versioned public controller assets
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          python3 tools/build-controller-site.py --output controller-site
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          manifest = json.loads(Path('controller-site/manifest.json').read_text())
          assert manifest['buildCommit'] == os.environ['SOURCE_SHA']
          assert manifest['versions'] and all(not entry['workingTreeModified'] for entry in manifest['versions'])
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: controller-site
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the tested controller
        id: deployment
        uses: actions/deploy-pages@v4
