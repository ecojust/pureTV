name: Retrieve redacted TV test diagnostics for build 46104774692
on:
  push:
    branches: [recover-hosted-46104774692]
    paths: ['.github/workflows/hosted-games-recovery.yml']
permissions:
  contents: write
  actions: read
jobs:
  diagnostics:
    if: github.repository == 'ecojust/pureTV' && github.ref == 'refs/heads/recover-hosted-46104774692'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Extract and sanitize the XML from the recorded runtime
        shell: bash
        run: |
          set -euo pipefail
          artifact=15247605792
          gh api "repos/ecojust/pureTV/actions/artifacts/$artifact" > metadata.json
          jq -e '.name=="hosted-games-tv-runtime" and .workflow_run.id==46104774692 and .workflow_run.head_sha=="81de663df4e3de8e72138921d2703a187a87cecd"' metadata.json
          gh api "repos/ecojust/pureTV/actions/artifacts/$artifact/zip" > input.zip
          echo '5cffece1f040929049828aa966ce85752c5a37b792b32cdd3731e9fd4e4ba106  input.zip' | sha256sum --check
          mkdir diagnostics
          python3 - <<'PY'
          from pathlib import Path
          import re, zipfile, xml.etree.ElementTree as ET
          with zipfile.ZipFile('input.zip') as archive:
              for entry in archive.infolist():
                  name = entry.filename
                  if not re.fullmatch(r'(bandit|fish-loop|noir-extreme|struggle-bus|vespertine|daejeon-campus)-(card|author|guide|failure)\.xml', name):
                      continue
                  assert entry.file_size < 1024 * 1024
                  xml = ET.fromstring(archive.read(entry))
                  for node in xml.iter():
                      for attr, value in node.attrib.items():
                          if re.search(r'https?://|[?&](?:room|token|key)=|room=|bearer\s+|邀请码[:：]|加入码[:：]',value,re.I):
                              node.set(attr, '[omitted]')
                  ET.ElementTree(xml).write(Path('diagnostics')/name,encoding='utf-8')
          assert list(Path('diagnostics').glob('*-failure.xml'))
          PY
          cd diagnostics
          git init -q
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- '*.xml'
          git commit -qm "Redacted accessibility diagnostics from artifact $artifact"
          git remote add origin https://github.com/ecojust/pureTV.git
          gh auth setup-git
          branch=build-assets/recovered-hosted-46104774692-xml
          git push --force-with-lease="refs/heads/$branch:" origin "HEAD:refs/heads/$branch"
