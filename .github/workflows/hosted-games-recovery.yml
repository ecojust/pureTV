name: Observe the two remaining author games on the signed Android TV client
on:
  push:
    branches: [recover-hosted-46104774692]
    paths: ['.github/workflows/hosted-games-recovery.yml']
permissions:
  contents: read
env:
  QA_SHA: cb9fff5d99690c94b03f71f34fa131d8e173da35
  APK_SHA: a72fddf7b643ba2d1f4f5090386ce94d962902ae0bc635a44fa68acf70c60699
jobs:
  replay:
    if: github.repository == 'ecojust/pureTV'
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    strategy:
      fail-fast: false
      matrix:
        game: [noir-extreme, daejeon-campus]
    env:
      GAME: ${{ matrix.game }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.QA_SHA }}
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /tools/hosted-games-tv/
            /joystick-games/tools/android-environment-diagnostics.py
      - name: Fetch the signed app from its frozen commit
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 https://raw.githubusercontent.com/ecojust/pureTV/e9992b9ec69875593178dc5208d3b170a7304aec/resource/apps/hosted-games/hosted-games-0.1.0.apk -o "$RUNNER_TEMP/hosted.apk"
          echo "$APK_SHA  $RUNNER_TEMP/hosted.apk" | sha256sum --check
          test "$(git rev-parse HEAD)" = "$QA_SHA"
          python3 -m pip install Pillow==11.3.0 websocket-client==1.8.0
          if ! command -v tesseract >/dev/null || ! tesseract --list-langs 2>/dev/null | grep -qx kor; then
            sudo apt-get -qo Acquire::Retries=3 update
            sudo apt-get -qo Acquire::Retries=3 install -y --no-install-recommends tesseract-ocr tesseract-ocr-eng tesseract-ocr-kor
          fi
          sudo chmod a+rw /dev/kvm
          mkdir -p "$RUNNER_TEMP/qa" "$RUNNER_TEMP/share"
          cat > "$RUNNER_TEMP/test-guest.sh" <<'SH'
          #!/usr/bin/env bash
          set -u
          adb="$ANDROID_HOME/platform-tools/adb"
          mem() {
            timeout 8 "$adb" -s emulator-5554 shell cat /proc/meminfo | tr -d '\r' | grep -E '^(MemAvailable|MemFree|MemTotal|SwapFree|SwapTotal):'
          }
          mem > "$RUNNER_TEMP/share/guest-memory-before.txt" || true
          python3 tools/hosted-games-tv/visual.py --case "$GAME" --apk "$RUNNER_TEMP/hosted.apk" --out "$RUNNER_TEMP/qa"
          result=$?
          mem > "$RUNNER_TEMP/share/guest-memory-after.txt" || true
          timeout 8 "$adb" -s emulator-5554 shell dumpsys activity exit-info com.ecojust.hostedgames | grep -Eo 'reason=[0-9]+ \([^)]{0,80}\)' | head -20 > "$RUNNER_TEMP/share/guest-exit-reasons.txt" || true
          exit "$result"
          SH
      - name: Test the author game and retain bounded host diagnostics
        id: play
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 36
          emulator-build: '16970787'
          target: android-tv
          arch: x86_64
          profile: tv_1080p
          disable-animations: false
          emulator-options: -no-window -memory 2048 -gpu lavapipe -noaudio -no-boot-anim -no-snapshot
          script: python3 joystick-games/tools/android-environment-diagnostics.py --output "$RUNNER_TEMP/host" -- bash "$RUNNER_TEMP/test-guest.sh"
      - name: Preserve safe per-title results even if the emulator exits
        if: always()
        shell: bash
        env:
          CASE_RESULT: ${{ steps.play.outcome }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/share"
          cd "$RUNNER_TEMP"
          python3 - <<'PY'
          from pathlib import Path
          import json, os, re, xml.etree.ElementTree as ET
          game=os.environ['GAME']
          total=frames=0
          for p in sorted(Path('qa').glob('*')):
              if not p.is_file() or p.is_symlink() or p.stat().st_size>5000000: continue
              if p.name=='report.json':
                  (Path('share')/p.name).write_bytes(p.read_bytes())
              elif re.fullmatch(re.escape(game)+r'-visual-[a-zA-Z0-9_-]{1,40}\.png',p.name):
                  size=p.stat().st_size
                  if frames<14 and total+size<32000000:
                      (Path('share')/p.name).write_bytes(p.read_bytes())
                      frames+=1
                      total+=size
          host=Path('host/report.json')
          if host.is_file() and host.stat().st_size<100_000: Path('share/host-environment.json').write_bytes(host.read_bytes())
          samples=Path('host/samples.jsonl')
          if samples.is_file() and samples.stat().st_size<=2_097_152: Path('share/host-samples.jsonl').write_bytes(samples.read_bytes())
          meta={'case':game,'apkSha256':os.environ['APK_SHA'],'qaSha':os.environ['QA_SHA'],'runId':os.environ['GITHUB_RUN_ID'],'emulatorStep':os.environ['CASE_RESULT'],'requestedGpu':'lavapipe','emulatorBuild':'16970787'}
          Path('share/replay.json').write_text(json.dumps(meta,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: replay-${{ matrix.game }}
          path: ${{ runner.temp }}/share/
          if-no-files-found: error
          retention-days: 7

  preserve:
    if: github.repository == 'ecojust/pureTV'
    runs-on: ubuntu-24.04
    timeout-minutes: 44
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Export each case as its artifact becomes available
        shell: bash
        run: |
          set -euo pipefail
          gh auth setup-git
          games=(noir-extreme daejeon-campus)
          prefix="repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          while true; do
            gh api "$prefix/artifacts" > manifest.json
            for game in "${games[@]}"; do
              test ! -f "$game.done" || continue
              name="replay-$game"
              id="$(jq -r --arg n "$name" '.artifacts[]|select(.name==$n and (.expired|not) and .size_in_bytes<36000000)|.id' manifest.json)"
              [[ "$id" =~ ^[0-9]+$ ]] || continue
              digest="$(jq -r --argjson id "$id" '.artifacts[]|select(.id==$id)|.digest|split(":")[1]' manifest.json)"
              gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" > package.zip
              echo "$digest  package.zip" | sha256sum --check
              mkdir "$game"
              python3 - "$game" <<'PY'
          from pathlib import Path
          import re,sys,zipfile
          dest=Path(sys.argv[1])
          with zipfile.ZipFile('package.zip') as z:
              for e in z.infolist():
                  n=e.filename
                  assert re.fullmatch(r'[a-z0-9-]+\.(?:json|jsonl|xml|png|txt)',n)
                  assert 0<=e.file_size<=5000000 and z.namelist().count(n)==1
                  (dest/n).write_bytes(z.read(e))
          PY
              git -C "$game" init -q
              git -C "$game" config user.name github-actions[bot]
              git -C "$game" config user.email 41898282+github-actions[bot]@users.noreply.github.com
              git -C "$game" add .
              git -C "$game" commit -qm "Retain $game TV replay $GITHUB_RUN_ID from $QA_SHA"
              git -C "$game" remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
              branch="build-assets/hosted-replay-$GITHUB_RUN_ID-$game"
              git -C "$game" push --force-with-lease="refs/heads/$branch:" origin "HEAD:refs/heads/$branch"
              touch "$game.done"
            done
            count="$(find . -maxdepth 1 -name '*.done' | wc -l)"
            if test "$count" = 2; then break; fi
            gh api "$prefix/jobs" > jobs.json
            if jq -e '[.jobs[]|select(.name|startswith("replay ("))]|length==2 and all(.status=="completed")' jobs.json; then
              echo "Missing a visual case artifact"; exit 1
            fi
            sleep 15
          done

  previous-fish-frames:
    if: github.repository == 'ecojust/pureTV'
    permissions:
      actions: read
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Retain original fish frames from the same signed APK test
        shell: bash
        run: |
          set -euo pipefail
          id=15247419126
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$id" > meta.json
          jq -e '.name=="hosted-games-tv-case-fish-loop" and .workflow_run.id==46105928279 and .workflow_run.head_sha=="f23e13df65206fa84bfa315356bfb57ee53d9606"' meta.json
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" > input.zip
          echo "f4b30e4d9f804c4265b1a6d2f0c902c0706d0de5f5143903ecce828579303fcd  input.zip" | sha256sum --check
          mkdir evidence
          python3 - <<'PY'
          from pathlib import Path
          import json,os,zipfile
          with zipfile.ZipFile('input.zip') as z:
              report=json.loads(z.read('report.json'))
              assert report['apkSha256']==os.environ['APK_SHA']
              for name in ('report.json','fish-loop-before.png','fish-loop-after.png'):
                  assert z.namelist().count(name)==1 and 0<z.getinfo(name).file_size<5000000
                  (Path('evidence')/name).write_bytes(z.read(name))
          PY
          cd evidence
          git init -q
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .
          git commit -qm "Retain unmodified Fish Loop frames from artifact $id and APK $APK_SHA"
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          gh auth setup-git
          branch="build-assets/hosted-replay-$GITHUB_RUN_ID-original-fish"
          git push --force-with-lease="refs/heads/$branch:" origin "HEAD:refs/heads/$branch"
