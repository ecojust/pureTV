name: Read Android build report
on:
  workflow_dispatch:
    inputs:
      run_id:
        required: true
        type: string
      artifact:
        required: true
        type: string
permissions:
  actions: read
  contents: read
jobs:
  diag:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact }}
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
          path: report
      - name: Capture exact failing tests and build diagnostics as annotations
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          for f in Path('report').rglob('*'):
              if f.is_file() and f.suffix in ['.log','.xml','.txt']:
                  lines=[line.strip() for line in f.read_text(errors='replace').splitlines() if re.search(r'FAIL|failed|Exception|Could not|was expected|Caused by:|HTTP 4|AssertionError|Unresolved reference|error:|not found',line,re.I)]
                  for line in lines[:25]:
                      line=re.sub(r'https?://[^ ]+','remote',line)
                      print('::warning::'+f.name+': '+line[:450].replace('%','%25'))
          PY
