name: Inspect original Backroad Android signatures
on:
  workflow_dispatch:
    inputs:
      artifact_id:
        description: Original signed artifact ID
        type: string
        required: true
permissions:
  actions: read
  contents: read
jobs:
  receipts:
    runs-on: ubuntu-24.04
    steps:
      - name: Download signed production package and observer
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ inputs.artifact_id }}
          run-id: '44692629288'
          github-token: ${{ github.token }}
          merge-multiple: true
          path: original
      - name: Verify both original APK identities
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ inputs.artifact_id }}
        run: |
          python - <<'PYREC'
          import hashlib,json,os,pathlib,subprocess
          def api(path):return json.loads(subprocess.check_output(['gh','api','repos/ecojust/puretv/'+path]))
          art=api('actions/artifacts/'+os.environ['ARTIFACT_ID'])
          assert (art['id'],art['size_in_bytes'],art['digest'])==(14609686313,104997004,'sha256:8c1d487ec789b37d0107e87433499a1aa086f058f3b613accf2323b6aef83dc5')
          assert art['workflow_run']['id']==44692629288 and art['name']=='joystick-android-signed'
          r=api('actions/runs/44692629288')
          assert r['head_sha']=='7eba342f8fcc2a2efe84123b6cc27a9fafd22a1e'
          assert any(j['name']=='sign' and j['conclusion']=='success' for j in api('actions/runs/44692629288/jobs')['jobs'])
          root=pathlib.Path('original')
          pin='eb31978a5bd768fe3cedf483530c51df1e901cf00da5c822d3a7e98fc492cf23'
          def digest(path):return hashlib.file_digest(path.open('rb'),'sha256').hexdigest()
          def inspect(kind,path,filename):
              receipt=path/filename
              info=json.loads(receipt.read_text())
              assert info['sourceSha']==r['head_sha'] and str(info['runId'])=='44692629288'
              ident=info.get('apkIdentity',info)
              apks=list(path.glob('*.apk'));assert len(apks)==1
              apk=apks[0]
              assert (ident['certificateSha256'],ident['bytes'],ident['sha256'])==(pin,apk.stat().st_size,digest(apk))
              data={k:ident[k] for k in ('packageName','versionName','versionCode','bytes','sha256','certificateSha256')}
              data['receiptSha256']=digest(receipt)
              if kind=='game':
                  assert info['signatureVerified'] and info['versionName']=='0.1.4'
                  data['sourceInputCount']=len(info['sourceInputs'])
              return data
          result={'source':r['head_sha'],'artifactId':art['id'],'artifactArchiveDigest':art['digest'],'game':inspect('game',root/'packages/backroad-rally','signing-receipt.json'),'observer':inspect('observer',root/'observers/backroad-rally','observer-signing-receipt.json')}
          print('FROZEN_SIGNED_BYTES '+json.dumps(result),flush=True)
          PYREC
