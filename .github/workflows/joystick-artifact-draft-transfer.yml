name: Transfer signed TV racing test packages
on: workflow_dispatch
permissions:
  actions: read
  contents: write
jobs:
  packages:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Fetch original signed ponpoko-kart
        uses: actions/download-artifact@v4
        with:
          artifact-ids: '14605519412'
          run-id: '44685477973'
          github-token: ${{ github.token }}
          merge-multiple: true
          path: original/ponpoko-kart
      - name: Fetch original signed kart-royale
        uses: actions/download-artifact@v4
        with:
          artifact-ids: '14606610194'
          run-id: '44684303462'
          github-token: ${{ github.token }}
          merge-multiple: true
          path: original/kart-royale
      - name: Recheck individual APK signatures and upload original files
        run: |
          set -euo pipefail
          BUILD_TOOLS="$ANDROID_HOME/build-tools/34.0.0"
          export BUILD_TOOLS
          python - <<'PYTHON'
          import hashlib, json, os, pathlib, re, subprocess
          from urllib.parse import quote
          release_id=452313702
          repo='ecojust/pureTV'
          pin='eb31978a5bd768fe3cedf483530c51df1e901cf00da5c822d3a7e98fc492cf23'
          games=[('ponpoko-kart', '5028fba2c1945cd4c5aa4d71fd0aade671a55040', '44685477973', '14605519412', 'f8a58ec80d0a648583a4adb3a475f68be3b7163f570f15a6b93191731a9b7975'), ('kart-royale', '620fa8829d0b273ebcb6ec1539b97461c283c45c', '44684303462', '14606610194', '3bbe0e794aaed3faa3f1f8327a8f2a3ab9a5699d4971a245dfad5c53afab2f46')]
          def api(path):
           return json.loads(subprocess.check_output(['gh','api','repos/'+repo+'/'+path]))
          def upload(path,content_type):
           name=path.name
           size=path.stat().st_size
           sha=hashlib.file_digest(path.open('rb'),'sha256').hexdigest()
           assets=api(f'releases/{release_id}/assets')
           matches=[item for item in assets if item['name']==name]
           if not matches:
            response=subprocess.check_output(['curl','--silent','--show-error','--fail','-X','POST','-H','Authorization: Bearer '+os.environ['GH_TOKEN'],'-H','Content-Type: '+content_type,'--data-binary','@'+str(path),'https://uploads.github.com/repos/'+repo+'/releases/'+str(release_id)+'/assets?name='+quote(name)])
            matches=[json.loads(response)]
           assert len(matches)==1 and (matches[0]['state'],matches[0]['size'],matches[0]['digest'])==('uploaded',size,'sha256:'+sha),name
           print(name,size,sha,flush=True)
           return sha
          release=api('releases/'+str(release_id))
          assert not release['draft'] and release['prerelease'] and release['tag_name']=='joystick-racing-nine-test-20261120' and release['target_commitish']=='1446d344a0fcdbbb8b4936f97b4f5c7804018ec5'
          checksums=[]
          build_tools=pathlib.Path(os.environ['BUILD_TOOLS'])
          for game,source,run_id,artifact_id,archive_digest in games:
           run=api('actions/runs/'+run_id)
           jobs=api('actions/runs/'+run_id+'/jobs')['jobs']
           assert run['head_sha']==source and run['run_attempt']==1 and run['path']=='.github/workflows/joystick-catalog-android.yml'
           for job in ['build ('+game+')','sign']:
            assert [j['conclusion'] for j in jobs if j['name']==job]==['success']
           artifact=api('actions/artifacts/'+artifact_id)
           assert artifact['name']=='joystick-android-signed' and artifact['workflow_run']['id']==int(run_id) and artifact['digest']=='sha256:'+archive_digest
           folder=pathlib.Path('original')/game/'packages'/game
           info=json.loads((folder/'signing-receipt.json').read_text())
           version='0.1.2'
           package='com.ecojust.joystick.'+game.replace('-','')
           code=3
           assert (info['game'],info['sourceSha'],str(info['runId']),info['signatureVerified'],info['certificateSha256'],info['packageName'],info['versionName'],info['versionCode'])==(game,source,run_id,True,pin,package,version,code)
           apk=folder/(game+'-'+version+'.apk')
           digest=hashlib.file_digest(apk.open('rb'),'sha256').hexdigest()
           assert info['bytes']==apk.stat().st_size and info['sha256']==digest
           signer=subprocess.check_output([str(build_tools/'apksigner'),'verify','--print-certs',str(apk)],text=True)
           assert re.findall(r'Signer #\d+ certificate SHA-256 digest: (\w+)',signer)==[pin]
           badging=subprocess.check_output([str(build_tools/'aapt'),'dump','badging',str(apk)],text=True)
           assert f"package: name='{package}' versionCode='{code}' versionName='{version}'" in badging
           assert upload(apk,'application/vnd.android.package-archive')==digest
           checksums.append(digest+'  '+apk.name+'\n')
          path=pathlib.Path('SHA256SUMS-Ponpoko-Royale-0.1.2.txt')
          path.write_text(''.join(checksums))
          upload(path,'text/plain')
          PYTHON
