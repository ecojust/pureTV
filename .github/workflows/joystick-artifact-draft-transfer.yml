controls-v1.0.0","target":"20e50e1e1e5ef4b2cdd8f1fa4f482916258b7284","files":[["packages/kart-royale/kart-royale-0.1.5.apk","kart-royale-0.1.5.apk",null],["packages/turbo-kart-rush/turbo-kart-rush-0.1.2.apk","turbo-kart-rush-0.1.2.apk",null],["packages/kart-rush/kart-rush-0.1.1.apk","kart-rush-0.1.1.apk",null]]}]}
        shell: bash
        run: |
          python - <<'PY'
          """Run on a GitHub-hosted runner with a pinned original Actions artifact and existing draft."""
          import hashlib
          import json
          import os
          import subprocess
          import zipfile
          from pathlib import Path

          def api(path):
              return json.loads(subprocess.check_output(['gh', 'api', 'repos/ecojust/pureTV/' + path]))

          def digest(path):
              with path.open('rb') as f:
                  d = hashlib.sha256()
                  for block in iter(lambda: f.read(1024 * 1024), b''):
                      d.update(block)
                  return 'sha256:' + d.hexdigest()

          def stage(spec):
              assert os.environ['GITHUB_REPOSITORY']=='ecojust/pureTV'
              run=api('actions/runs/'+str(spec['run']))
              assert run['head_sha']==spec['source'] and run['path']==spec['workflow']
              assert run['head_repository']['full_name']==run['repository']['full_name']=='ecojust/pureTV'
              jobs=api('actions/runs/'+str(spec['run'])+'/jobs?per_page=100')['jobs']
              assert any(j['name']==spec['job'] and j['conclusion']=='success' for j in jobs)
              artifact=api('actions/artifacts/'+str(spec['artifact']))
              assert artifact['workflow_run']['id']==run['id'] and artifact['name']==spec['artifact_name'] and not artifact['expired']
              def release():
                  r=api('releases/'+str(spec['release']))
                  assert r['draft'] and r['tag_name']==spec['tag'] and r['target_commitish']==spec['target']
                  return r
              release()
              archive=Path('original.zip')
              with archive.open('wb') as f:
                  subprocess.run(['gh','api','repos/ecojust/pureTV/actions/artifacts/'+str(artifact['id'])+'/zip'],check=True,stdout=f)
              assert archive.stat().st_size==artifact['size_in_bytes'] and digest(archive)==artifact['digest']
              with zipfile.ZipFile(archive) as z:
                  for row in spec['files']:
                      inside,name,sha=row
                      assert name==Path(name).name and name in {p[1] for p in spec['files']}
                      info=z.getinfo(inside)
                      assert z.namelist().count(inside)==1 and info.file_size<512*1024*1024
                      out=Path(name)
                      with out.open('wb') as f, z.open(info) as source:
                          for block in iter(lambda:source.read(1024*1024),b''):
                              f.write(block)
                      fingerprint=digest(out)
                      assert sha is None or fingerprint=='sha256:'+sha
                      assets={a['name']:a for a in release()['assets']}
                      if name not in assets:
                          subprocess.run(['gh','release','upload',spec['tag'],str(out),'-R','ecojust/pureTV'],check=True)
                      result=next(a for a in release()['assets'] if a['name']==name)
                      assert result['digest']==fingerprint and result['size']==out.stat().st_size
                      print(name, result['size'], fingerprint)

          args=json.loads(os.environ['FIXED_SPEC'])
          for group in args.get('groups',[args]):
              stage(group)
          PY
