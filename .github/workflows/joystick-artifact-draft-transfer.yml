name: Verify Android QR build dependency from public Maven Central and runner cache
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dependency:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /joystick-games/tools/android-zxing.py
            /joystick-games/tools/android-zxing-tests.py
      - name: Verify the actual Google mirror and replay the cache with no network
        shell: bash
        run: |
          set -euo pipefail
          python3 -B joystick-games/tools/android-zxing-tests.py
          python3 - <<'PY'
          import importlib.util, pathlib, os
          path=pathlib.Path('joystick-games/tools/android-zxing.py')
          spec=importlib.util.spec_from_file_location('qr',path)
          qr=importlib.util.module_from_spec(spec);spec.loader.exec_module(qr)
          qr.URLS=qr.URLS[-1:]
          root=pathlib.Path(os.environ['RUNNER_TEMP'])
          fetched=qr.download(root/'mirror.jar',root/'mirror.json')
          cached=qr.download(root/'cached.jar',root/'cached.json',archive=root/'mirror.jar')
          assert fetched['sha256']==cached['sha256']==qr.EXPECTED_SHA256
          print(fetched)
          print(cached)
          PY
