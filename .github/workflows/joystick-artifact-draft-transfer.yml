name: Diagnose bilingual browser acceptance
on: workflow_dispatch
permissions:
  actions: read
  contents: read
jobs:
  diag:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Read only original Used Car Racing test failure
        run: |
          gh api repos/ecojust/pureTV/actions/jobs/138913561046/logs > "$RUNNER_TEMP/job.log"
          python3 - <<'PYRUN'
          import os,re
          from pathlib import Path
          lines=(Path(os.environ['RUNNER_TEMP'])/'job.log').read_text(errors='replace').splitlines()
          hits=[i for i,l in enumerate(lines) if re.search(r'AssertionError|Error:|FAILED|ERR_ASSERTION|timed out',l,re.I)]
          for i in hits[:12]:
              snippet=' '.join(lines[max(0,i-3):i+6]);snippet=re.sub(r'https?://[^ ]+','remote',snippet)
              snippet=re.sub(r'[0-9]{4}-[0-9]{2}-[0-9]{2}T[^ ]+ ','',snippet)
              print('::warning::'+snippet[:1700].replace('%','%25'))
          PYRUN
