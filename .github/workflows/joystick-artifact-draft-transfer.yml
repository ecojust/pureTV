name: Stage verified original packages for the catalog
on: workflow_dispatch
permissions:
  actions: read
  contents: write
jobs:
  stage:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check source, original archive and existing draft before copying selected files
        env:
          GH_TOKEN: ${{ github.token }}
          FIXED_SPEC: >-
            {"mode":"raw","label":"compact TV updates 0.5.7","release":452834419,"tag":"catalog-tv-controls-v1.0.0","target":"20e50e1e1e5ef4b2cdd8f1fa4f482916258b7284","files":[["adventure-island-0.5.7.apk","https://raw.githubusercontent.com/ecojust/pureTV/7f5adc1d00668aa4b79ca012d4e9a49b31bec4f4/packages/adventure-island/adventure-island-0.5.7.apk",103871,"7d8f7c4f906ddfa2a4033ae188dd72872fb4cf08936ab38c832f6a51bf90979e"],["bomb-jack-0.5.7.apk","https://raw.githubusercontent.com/ecojust/pureTV/7f5adc1d00668aa4b79ca012d4e9a49b31bec4f4/packages/bomb-jack/bomb-jack-0.5.7.apk",99837,"b4c8c74f1372f5ab6990808e8dd124ce5103e55f2eefae7268d7855d858fe3b2"],["jackal-0.5.7.apk","https://raw.githubusercontent.com/ecojust/pureTV/7f5adc1d00668aa4b79ca012d4e9a49b31bec4f4/packages/jackal/jackal-0.5.7.apk",12542767,"88b92be1646651b40485426ef82542dba771028edc5f92c02357561dbb5cca88"],["jewel-0.5.7.apk","https://raw.githubusercontent.com/ecojust/pureTV/7f5adc1d00668aa4b79ca012d4e9a49b31bec4f4/packages/jewel/jewel-0.5.7.apk",95679,"f854f3211fd25a735c1c36ed5e925017b4ada967adb33abd2ed99a02c1fbbfd6"],["super-mario-0.5.7.apk","https://raw.githubusercontent.com/ecojust/pureTV/7f5adc1d00668aa4b79ca012d4e9a49b31bec4f4/packages/super-mario/super-mario-0.5.7.apk",107967,"8b04baec0bfa1d939331bc6e7fece8cb7e50caa13a79b903d881b67ba9b69fb8"],["tetris-0.5.7.apk","https://raw.githubusercontent.com/ecojust/pureTV/7f5adc1d00668aa4b79ca012d4e9a49b31bec4f4/packages/tetris/tetris-0.5.7.apk",95679,"5d0dd8a2ecbe54047f27c0d6f1a6794cc1e57f67b3b77bdee624d455f34a04a8"]]}
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          import re
          import subprocess
          from pathlib import Path
          from urllib.request import urlopen

          spec=json.loads(os.environ['FIXED_SPEC'])
          assert os.environ['GITHUB_REPOSITORY']=='ecojust/pureTV'
          def release():
              data=json.loads(subprocess.check_output(['gh','api','repos/ecojust/pureTV/releases/'+str(spec['release'])]))
              assert data['draft'] and data['tag_name']==spec['tag'] and data['target_commitish']==spec['target']
              return {asset['name']:asset for asset in data['assets']}
          assets=release()
          for row in spec['files']:
              name, url, size, digest=row
              assert re.fullmatch(r'[a-z0-9-]+-[0-9]+\.[0-9]+\.[0-9]+\.apk',name)
              assert re.fullmatch(r'https://raw\.githubusercontent\.com/ecojust/pureTV/[a-f0-9]{40}/[a-zA-Z0-9_./-]+',url)
              assert 0<size<100*1024*1024 and len(digest)==64
              if name not in assets:
                  block_hash=hashlib.sha256()
                  with urlopen(url,timeout=90) as source,Path(name).open('xb') as out:
                      assert source.status==200
                      for block in iter(lambda:source.read(1024*1024),b''):
                          out.write(block)
                          assert out.tell()<=size
                          block_hash.update(block)
                  assert Path(name).stat().st_size==size and block_hash.hexdigest()==digest
                  subprocess.run(['gh','release','upload',spec['tag'],name,'-R','ecojust/pureTV'],check=True)
                  Path(name).unlink()
                  assets=release()
              assert assets[name]['size']==size and assets[name]['digest']=='sha256:'+digest
              print(name,size,digest)
          PY
