name: Replace verified Chinese game candidates in the unreleased draft
on:
  workflow_dispatch:
    inputs:
      group:
        type: choice
        options: [legacy, neon]
        required: true
      run_id:
        type: string
        required: true
      export:
        type: string
        required: true
      source:
        type: string
        required: true
permissions:
  contents: write
  actions: read
concurrency:
  group: replace-zh-game-drafts-${{ inputs.group }}
  cancel-in-progress: false
jobs:
  replace:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          path: workflow
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /replace-draft.py
            /replacement-plan.json
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.export }}
          path: export
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /neon-rush/
            /packages/
          persist-credentials: false
      - name: Replace each draft attachment only after the candidate matches its frozen receipt and local verification
        env:
          GH_TOKEN: ${{ github.token }}
          SIGN_RUN: ${{ inputs.run_id }}
          SOURCE: ${{ inputs.source }}
          GROUP: ${{ inputs.group }}
          EXPORT_SHA: ${{ inputs.export }}
        run: python3 workflow/replace-draft.py
