name: Stage verified original packages for the catalog
on: workflow_dispatch
permissions:
  actions: read
  contents: write
jobs:
  stage:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check source, original archive and existing draft before copying selected files
        env:
          GH_TOKEN: ${{ github.token }}
          FIXED_SPEC: >-
            {"mode":"raw","label":"compact TV updates 0.5.6","release":452834419,"tag":"catalog-tv-controls-v1.0.0","target":"20e50e1e1e5ef4b2cdd8f1fa4f482916258b7284","files":[["coast-kart-0.5.6.apk","https://raw.githubusercontent.com/ecojust/pureTV/71ddc1f90ecf84b447b474cad3b1e086abc2c025/packages/coast-kart/coast-kart-0.5.6.apk",276105,"6354689d6c220f58a8bbe24c380ecf346491c4e1f3edf26c51eb18394fd9601b"]]}
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          import re
          import subprocess
          from pathlib import Path
          from urllib.request import urlopen

          spec=json.loads(os.environ['FIXED_SPEC'])
          assert os.environ['GITHUB_REPOSITORY']=='ecojust/pureTV'
          def release():
              data=json.loads(subprocess.check_output(['gh','api','repos/ecojust/pureTV/releases/'+str(spec['release'])]))
              assert data['draft'] and data['tag_name']==spec['tag'] and data['target_commitish']==spec['target']
              return {asset['name']:asset for asset in data['assets']}
          assets=release()
          for row in spec['files']:
              name, url, size, digest=row
              assert re.fullmatch(r'[a-z0-9-]+-[0-9]+\.[0-9]+\.[0-9]+\.apk',name)
              assert re.fullmatch(r'https://raw\.githubusercontent\.com/ecojust/pureTV/[a-f0-9]{40}/[a-zA-Z0-9_./-]+',url)
              assert 0<size<100*1024*1024 and len(digest)==64
              if name not in assets:
                  block_hash=hashlib.sha256()
                  with urlopen(url,timeout=90) as source,Path(name).open('xb') as out:
                      assert source.status==200
                      for block in iter(lambda:source.read(1024*1024),b''):
                          out.write(block)
                          assert out.tell()<=size
                          block_hash.update(block)
                  assert Path(name).stat().st_size==size and block_hash.hexdigest()==digest
                  subprocess.run(['gh','release','upload',spec['tag'],name,'-R','ecojust/pureTV'],check=True)
                  Path(name).unlink()
                  assets=release()
              assert assets[name]['size']==size and assets[name]['digest']=='sha256:'+digest
              print(name,size,digest)
          PY
