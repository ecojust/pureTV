name: Transfer original Windows kart test installers
on: workflow_dispatch
permissions:
  contents: write
jobs:
  transfer:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Upload archived installer and portable package after byte verification
        run: |
          set -euo pipefail
          repo=ecojust/pureTV
          release_id=452313702
          gh api "repos/$repo/releases/$release_id" | jq -e '.draft and .prerelease and .tag_name=="joystick-racing-nine-test-20261120"'
          export_commit=6e83e301c08fa2d5faffdca07881c15c8aecbf91
          folder=joystick-windows-packages-kart-royale
          for file in KartRoyale-0.1.0-windows-x64-setup.exe KartRoyale-0.1.0-windows-x64.zip; do
            curl --fail --silent --show-error -o "$file" "https://raw.githubusercontent.com/$repo/$export_commit/$folder/$file"
          done
          cat > SHA256SUMS-Windows.txt <<'SUMS'
          51d6071f3b6ea8d995efd8d8caa1f815ece1a50fbdccdb2405dcde5234aeaa65  KartRoyale-0.1.0-windows-x64-setup.exe
          f4075dd6b1db30abbdd5138226e90a30d5d5bc05857ce5e69cf12a3a8fb0f297  KartRoyale-0.1.0-windows-x64.zip
          SUMS
          sha256sum --check --strict SHA256SUMS-Windows.txt
          for file in KartRoyale-0.1.0-windows-x64-setup.exe KartRoyale-0.1.0-windows-x64.zip SHA256SUMS-Windows.txt; do
            digest="sha256:$(sha256sum "$file" | cut -d' ' -f1)"
            size=$(stat -c %s "$file")
            if ! gh api "repos/$repo/releases/$release_id/assets" | jq -e --arg name "$file" 'any(.[]; .name==$name)' >/dev/null; then
              curl --silent --show-error --fail -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Content-Type: application/octet-stream" --data-binary "@$file" "https://uploads.github.com/repos/$repo/releases/$release_id/assets?name=$file" | jq -e --arg sha "$digest" '.digest==$sha'
            fi
            gh api "repos/$repo/releases/$release_id/assets" | jq -e --arg name "$file" --arg digest "$digest" --argjson size "$size" 'any(.[]; .name==$name and .state=="uploaded" and .size==$size and .digest==$digest)'
          done
