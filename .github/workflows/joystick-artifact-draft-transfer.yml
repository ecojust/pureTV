name: Publish a verified original racing APK
on: workflow_dispatch
permissions:
  contents: write
jobs:
  copy-original:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ecojust/pureTV
      RELEASE_ID: '452406828'
      SOURCE: a5b51e14b506995bc8da67f024f00d107962518d
      FILE_NAME: backroad-rally-0.1.2.apk
      APK_DIGEST: 67f61471e0e23e9ea963475425d5c43fa9d3265167f9028bd55dc319494fbe3c
      APK_SIZE: '105024551'
    steps:
      - name: Verify the original Android release file
        run: |
          set -euo pipefail
          gh api "repos/$REPO/releases/$RELEASE_ID" | jq -e --arg source "$SOURCE" '.draft and .tag_name=="joystick-backroad-rally-android-v0.1.2" and .target_commitish==$source'
          gh api "repos/$REPO/releases/assets/770746982" | jq -e --arg name "$FILE_NAME" --arg sha "sha256:$APK_DIGEST" --argjson bytes "$APK_SIZE" '.name==$name and .state=="uploaded" and .digest==$sha and .size==$bytes'
          curl --fail --show-error --silent --location --retry 3 "https://github.com/$REPO/releases/download/joystick-racing-nine-test-20261120/$FILE_NAME" --output "$FILE_NAME"
          test "$(stat -c %s "$FILE_NAME")" = "$APK_SIZE"
          echo "$APK_DIGEST  $FILE_NAME" > SHA256SUMS.txt
          sha256sum --check --strict SHA256SUMS.txt
          SIGNER=$("$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs "$FILE_NAME" | awk '/^Signer #[0-9]+ certificate SHA-256 digest:/{print $NF}')
          test "$SIGNER" = eb31978a5bd768fe3cedf483530c51df1e901cf00da5c822d3a7e98fc492cf23
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$FILE_NAME" > badging.txt
          grep -Fq "package: name='com.ecojust.joystick.backroadrally' versionCode='3' versionName='0.1.2'" badging.txt
          grep -Fq "sdkVersion:'26'" badging.txt
          grep -Fq "targetSdkVersion:'35'" badging.txt
      - name: Copy the game and checksum to the versioned release
        run: |
          set -euo pipefail
          upload() {
            local name=$1 type=$2 digest bytes count
            digest="sha256:$(sha256sum "$name" | cut -d' ' -f1)"
            bytes=$(stat -c %s "$name")
            count=$(gh api "repos/$REPO/releases/$RELEASE_ID/assets" | jq --arg n "$name" '[.[]|select(.name==$n)]|length')
            if [ "$count" = 0 ]; then
              curl --fail --show-error --silent -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Content-Type: $type" --data-binary "@$name" "https://uploads.github.com/repos/$REPO/releases/$RELEASE_ID/assets?name=$name" | jq -e --arg sha "$digest" --argjson size "$bytes" '.digest==$sha and .size==$size'
            fi
            gh api "repos/$REPO/releases/$RELEASE_ID/assets" | jq -e --arg n "$name" --arg sha "$digest" --argjson size "$bytes" 'any(.[]; .name==$n and .state=="uploaded" and .size==$size and .digest==$sha)'
          }
          upload "$FILE_NAME" application/vnd.android.package-archive
          upload SHA256SUMS.txt text/plain
