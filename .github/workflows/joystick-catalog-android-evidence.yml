name: Verify offline puzzle ports with the original controller SDK
on: workflow_dispatch
permissions:
  contents: read

jobs:
  browser:
    strategy:
      fail-fast: false
      matrix:
        game: ["alchemists-lattice", "story-thief", "bumble-basket", "starsling", "neon-arcana", "atlas-of-ink", "starbase-spooky"]
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            docs/puzzle-nine
            joystick-games/${{ matrix.game }}/dist
            joystick-games/tools
            puretv-joystick
      - name: Verify the actual compiled game at both TV sizes
        env:
          GAME: ${{ matrix.game }}
        run: |
          mkdir -p "$RUNNER_TEMP/results/$GAME"
          pip install --disable-pip-version-check playwright==1.62.0
          python -B docs/puzzle-nine/verify-browser.py "$GAME" "$RUNNER_TEMP/results/$GAME" --chromium "$(command -v google-chrome)" > "$RUNNER_TEMP/results/$GAME/execution.log" 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-${{ matrix.game }}
          path: ${{ runner.temp }}/results/
  record:
    if: always()
    needs: browser
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: browser-*
          merge-multiple: true
          path: results
      - name: Store original observations and screenshots at an immutable reference
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd results
          export PUZZLE_QA_REF="build-assets/puzzle-browser-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          jq -n --arg source "$GITHUB_SHA" --arg gameSource "88fe1c90bc22aa44a1160c2cc75f937a993c0e72" --arg run "$GITHUB_RUN_ID" '{verificationCommit:$source,gameSource:$gameSource,runId:$run}' > provenance.json
          git init -q -b evidence
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .
          git commit -qm "Preserve puzzle SDK browser screenshots and original observations"
          gh auth setup-git
          git push --force-with-lease="refs/heads/$PUZZLE_QA_REF:" "https://github.com/$GITHUB_REPOSITORY.git" "HEAD:refs/heads/$PUZZLE_QA_REF"
