name: Read original puzzle Android packages and evidence
on: workflow_dispatch
permissions:
  contents: write
  actions: read
jobs:
  original:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - {game: atlas-of-ink, run: '44714846223', signed: '14618838084', report: '14620190854'}
          - {game: solder-and-rain, run: '44714845643', signed: '14619637029', report: '14620261920'}
          - {game: starsling, run: '44714845643', signed: '14619637029', report: '14620440344'}
    env:
      GAME: ${{ matrix.game }}
      RUN: ${{ matrix.run }}
      SIGNED: ${{ matrix.signed }}
      REPORT: ${{ matrix.report }}
      SOURCE: 18836937d8564c0e1534e1798c1dfb3096164bb0
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Verify original completed jobs and both frozen artifact IDs
        run: |
          python3 - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          def api(path):return json.loads(subprocess.check_output(['gh','api','repos/ecojust/pureTV/'+path]))
          g=os.environ['GAME'];run=os.environ['RUN'];sha=os.environ['SOURCE']
          origin=api('actions/runs/'+run);assert origin['head_sha']==sha and origin['run_attempt']==1 and origin['path']=='.github/workflows/joystick-catalog-android.yml' and origin['head_repository']['full_name']=='ecojust/pureTV'
          jobs=api('actions/runs/'+run+'/jobs?per_page=100')['jobs'];rows=[]
          for aname,jname,aid in [('joystick-android-signed','sign',os.environ['SIGNED']),('joystick-android-report-runtime-'+g,'runtime ('+g+')',os.environ['REPORT'])]:
              selected=[j for j in jobs if j['name']==jname];assert len(selected)==1
              job=selected[0];assert job['status']=='completed' and job['conclusion']=='success'
              art=api('actions/artifacts/'+aid);assert not art['expired'] and art['name']==aname and art['workflow_run']['id']==int(run) and art['workflow_run']['head_sha']==sha
              assert job['started_at']<=art['created_at']<=job['completed_at']
              rows.append({'jobId':job['id'],'jobConclusion':job['conclusion'],'artifact':{k:art[k] for k in ['id','name','digest','size_in_bytes']}})
          out=Path(os.environ['RUNNER_TEMP'])/'export';out.mkdir();(out/'original-artifacts.json').write_text(json.dumps(rows,indent=2)+'\n')
          PY
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ecojust/pureTV
          run-id: ${{ matrix.run }}
          artifact-ids: ${{ matrix.signed }}
          merge-multiple: true
          path: ${{ runner.temp }}/signed
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ecojust/pureTV
          run-id: ${{ matrix.run }}
          artifact-ids: ${{ matrix.report }}
          merge-multiple: true
          path: ${{ runner.temp }}/export/reports/joystick-android-report-runtime-${{ matrix.game }}
      - name: Verify unmodified original APK, observer, reports, wire, captures and video
        run: |
          python3 - <<'PY'
          import os,json,hashlib,shutil,subprocess
          from pathlib import Path
          t=Path(os.environ['RUNNER_TEMP']);out=t/'export';g=os.environ['GAME'];src=os.environ['SOURCE'];run=os.environ['RUN']
          def read(p):return json.loads(p.read_text())
          def record(p):return {'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()}
          for part in ['packages','observers']:shutil.copytree(t/'signed'/part/g,out/part/g)
          receipt=read(out/'packages'/g/'signing-receipt.json'); obs=read(out/'observers'/g/'observer-signing-receipt.json')['apkIdentity']
          assert str(receipt['runId'])==run and receipt['sourceSha']==src and receipt['certificateSha256']=='eb31978a5bd768fe3cedf483530c51df1e901cf00da5c822d3a7e98fc492cf23'
          apk=next((out/'packages'/g).glob('*.apk'));assert record(apk)=={k:receipt[k] for k in ['bytes','sha256']}
          sdk=Path(os.environ['ANDROID_HOME'])/'build-tools';signer=next(iter(sorted(sdk.glob('*/apksigner'),reverse=True)))
          result=subprocess.check_output([str(signer),'verify','--verbose','--print-certs',str(apk)],text=True)
          assert receipt['certificateSha256'] in result;(out/'apksigner.txt').write_text(result)
          parent=out/'reports'/('joystick-android-report-runtime-'+g); orig=read(parent/g/'executed-source.json');assert orig['sourceSha']==src and str(orig['runId'])==run
          for mode in ['normal','occupied']:
              folder=parent/(g+'-'+mode);r=read(folder/'report.json');assert r['game']==g and r['status']=='passed' and r['sourceCommit']==src
              assert r['defaultPortOccupiedFixture'] is (mode=='occupied') and r['modelWrites'] is False and r['clockOverrides'] is False
              assert all(r['apk'][k]==receipt[k] and r['observer'][k]==obs[k] for k in ['bytes','sha256'])
              assert r['tests'] and all(i['status']=='passed' for i in r['tests'])
              w=r['wire'];assert w['matchingAcks']==w['acceptedSdkMessages']>0 and not w['missingAcks'] and not w['duplicateAcks'] and not w['errors'] and set(w['keysSent'])==set('UP DOWN LEFT RIGHT A B X Y START'.split())
              for art in [r['video'],*r['captures']]:
                  assert Path(art['path']).name==art['path'] and record(folder/art['path'])=={k:art[k] for k in ['bytes','sha256']}
          files={p.relative_to(out).as_posix():record(p) for p in sorted(out.rglob('*')) if p.is_file()}
          assert all(f['bytes']<100_000_000 for f in files.values())
          (out/'export-manifest.json').write_text(json.dumps({'sourceSha':src,'runId':run,'runAttempt':1,'games':[g],'signResult':'success','runtimeResult':'success','scope':'Original completed individual game in a multi-game run','exportRunId':os.environ['GITHUB_RUN_ID'],'exporterSourceSha':os.environ['GITHUB_SHA'],'gamesRerun':False,'files':files},indent=2)+'\n')
          PY
          branch="build-assets/puzzle-android-original-${GAME}-${GITHUB_RUN_ID}"
          gh auth setup-git
          cd "$RUNNER_TEMP/export"
          git init -q --initial-branch "$branch"
          git config user.name 'github-actions[bot]'
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .
          git commit -q -m "Original $GAME Android package and two-mode reports from $RUN"
          git remote add origin https://github.com/ecojust/pureTV.git
          git push "--force-with-lease=refs/heads/$branch:" origin "HEAD:refs/heads/$branch"
