name: Verify published Android upgrades from signed controller builds
on: workflow_dispatch
permissions:
  contents: read
  actions: read
jobs:
  upgrade:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/joystick-upgrade/
            /tools/puretv-release-certificate-v2.sha256
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools build-tools;34.0.0
      - name: Retrieve original signed artifact 14640280629
        uses: actions/download-artifact@v4
        with:
          artifact-ids: 14640280629
          run-id: 44757260595
          repository: ecojust/pureTV
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/signed-upgrades/44757260595
          merge-multiple: true
      - name: Retrieve original signed artifact 14639688129
        uses: actions/download-artifact@v4
        with:
          artifact-ids: 14639688129
          run-id: 44758693480
          repository: ecojust/pureTV
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/signed-upgrades/44758693480
          merge-multiple: true
      - name: Retrieve original signed artifact 14639668138
        uses: actions/download-artifact@v4
        with:
          artifact-ids: 14639668138
          run-id: 44758693540
          repository: ecojust/pureTV
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/signed-upgrades/44758693540
          merge-multiple: true
      - name: Retrieve original signed artifact 14640177463
        uses: actions/download-artifact@v4
        with:
          artifact-ids: 14640177463
          run-id: 44758693772
          repository: ecojust/pureTV
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/signed-upgrades/44758693772
          merge-multiple: true
      - name: Retrieve original signed artifact 14640587725
        uses: actions/download-artifact@v4
        with:
          artifact-ids: 14640587725
          run-id: 44758694102
          repository: ecojust/pureTV
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/signed-upgrades/44758694102
          merge-multiple: true
      - name: Retrieve original signed artifact 14640222574
        uses: actions/download-artifact@v4
        with:
          artifact-ids: 14640222574
          run-id: 44758694225
          repository: ecojust/pureTV
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/signed-upgrades/44758694225
          merge-multiple: true
      - name: Independently verify both APKs and the original signing run
        run: python3 .github/joystick-upgrade/probe.py prepare
      - name: Enable existing disposable runner acceleration
        run: |
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
      - name: Install old packages and replace them using the Android Package Manager
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: android-tv
          arch: x86_64
          profile: tv_720p
          force-avd-creation: true
          disable-animations: true
          emulator-options: -no-window -noaudio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -memory 2048
          script: python3 .github/joystick-upgrade/probe.py exercise
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-controller-upgrade-receipts
          path: ${{ runner.temp }}/upgrade-evidence
          retention-days: 30
          if-no-files-found: warn
  export:
    needs: upgrade
    if: always()
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: android-controller-upgrade-receipts
          path: ${{ runner.temp }}/receipts
      - name: Preserve exact original diagnostics for both successful and unsuccessful replacements
        env:
          GH_TOKEN: ${{ github.token }}
          UPGRADES_RESULT: ${{ needs.upgrade.result }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/receipts"
          python - <<'PY_REPORT'
          import hashlib, json, os
          from pathlib import Path
          records={p.name: {'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()} for p in Path('.').glob('*.json')}
          Path('manifest.json').write_text(json.dumps(dict(source=os.environ['GITHUB_SHA'],run=os.environ['GITHUB_RUN_ID'],status=os.environ['UPGRADES_RESULT'],files=records),indent=2)+'\n')
          PY_REPORT
          branch="build-assets/joystick-controls-upgrade-${GITHUB_RUN_ID}-attempt-${GITHUB_RUN_ATTEMPT}"
          git init -q --initial-branch "$branch" .
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- *.json
          git commit -qm "Android Package Manager upgrade observations ${GITHUB_RUN_ID}"
          gh auth setup-git
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          git push "--force-with-lease=refs/heads/$branch:" origin "HEAD:refs/heads/$branch"
