name: Read signed Backroad 0.1.1 APK
on: workflow_dispatch
permissions:
  contents: write
  actions: read
jobs:
  read:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Verify source, signer job and original artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/ecojust/pureTV/actions/artifacts/14604367849 | jq -e '.name == "joystick-android-signed" and (.expired | not) and .workflow_run.id == 44681226359 and .workflow_run.head_sha == "65a782561c91b45beae64d9b1a7874a27adf2830" and .size_in_bytes == 104996606 and .digest == "sha256:8ae777830cfbbdc341663ab7c45145dcd40e75408a6df363d250482d13991c34"'
          gh api repos/ecojust/pureTV/actions/runs/44681226359/attempts/1/jobs | jq -e '[.jobs[] | select(.name == "sign" and .conclusion == "success")] | length == 1'
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ecojust/pureTV
          run-id: 44681226359
          artifact-ids: 14604367849
          merge-multiple: true
          path: signed
      - name: Verify original APK against signing receipt and preserve receipt
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir receipt
          cd signed/packages/backroad-rally
          apk=backroad-rally-0.1.1.apk
          sha256sum -c SHA256SUMS.txt
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs "$apk" > ../../../receipt/verified-signature.txt
          python3 - <<'PY'
          import hashlib,json,pathlib
          p=pathlib.Path('backroad-rally-0.1.1.apk')
          r=json.loads(pathlib.Path('signing-receipt.json').read_text())
          assert r['sourceSha']=='65a782561c91b45beae64d9b1a7874a27adf2830' and str(r['runId'])=='44681226359'
          assert r['versionName']=='0.1.1' and r['versionCode']==2 and r['packageName']=='com.ecojust.joystick.backroadrally'
          assert r['sha256']==hashlib.file_digest(p.open('rb'),'sha256').hexdigest() and r['bytes']==p.stat().st_size
          out=pathlib.Path('../../../receipt')
          assert r['certificateSha256'] in (out/'verified-signature.txt').read_text().lower()
          (out/'package.json').write_text(json.dumps(dict(filename=p.name,**{k:r[k] for k in ('packageName','versionName','versionCode','sha256','bytes','certificateSha256','sourceSha','runId')}),indent=2)+'\n')
          PY
          cp signing-receipt.json build-receipt.json SHA256SUMS.txt ../../../receipt/
          cp ../../observers/backroad-rally/observer-signing-receipt.json ../../../receipt/
          cd ../../../receipt
          branch="build-assets/backroad-011-signing-receipt-$GITHUB_RUN_ID-attempt-$GITHUB_RUN_ATTEMPT"
          gh auth setup-git
          git init --initial-branch "$branch"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .
          git commit -qm 'Original Backroad Rally 0.1.1 APK and verified release signing certificate'
          git push "--force-with-lease=refs/heads/$branch:" "https://github.com/$GITHUB_REPOSITORY.git" "HEAD:refs/heads/$branch"
