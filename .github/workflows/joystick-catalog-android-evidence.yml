name: Verify published Android upgrades from signed controller builds
on: workflow_dispatch
permissions:
  contents: read
  actions: read
jobs:
  upgrade:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    strategy:
      max-parallel: 4
      fail-fast: false
      matrix:
        include:
          - game: glup
            run: '44758693480'
            artifact: '14639688129'
          - game: sugarplum-drop
            run: '44758693540'
            artifact: '14639668138'
          - game: starsling
            run: '44758693772'
            artifact: '14640177463'
          - game: solder-and-rain
            run: '44758693772'
            artifact: '14640177463'
          - game: oathstones
            run: '44758693772'
            artifact: '14640177463'
          - game: alchemists-lattice
            run: '44758694102'
            artifact: '14640587725'
          - game: story-thief
            run: '44758694102'
            artifact: '14640587725'
          - game: bumble-basket
            run: '44758694102'
            artifact: '14640587725'
          - game: neon-arcana
            run: '44758694225'
            artifact: '14640222574'
          - game: atlas-of-ink
            run: '44758694225'
            artifact: '14640222574'
    env:
      UPGRADE_GAME: ${{ matrix.game }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/joystick-upgrade/
            /tools/puretv-release-certificate-v2.sha256
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools build-tools;34.0.0
      - name: Retrieve this game’s signed source artifact
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ matrix.artifact }}
          run-id: ${{ matrix.run }}
          repository: ecojust/pureTV
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/signed-upgrades/${{ matrix.run }}
          merge-multiple: true
      - name: Independently verify both APKs and the original signing run
        run: python3 .github/joystick-upgrade/probe.py prepare
      - name: Enable existing disposable runner acceleration
        run: |
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
      - name: Install old packages and replace them using the Android Package Manager
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: android-tv
          arch: x86_64
          profile: tv_720p
          force-avd-creation: true
          disable-animations: true
          emulator-options: -no-window -noaudio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -memory 2048
          script: python3 .github/joystick-upgrade/probe.py exercise
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-upgrade-${{ matrix.game }}
          path: ${{ runner.temp }}/upgrade-evidence
          retention-days: 30
          if-no-files-found: warn
  export:
    needs: upgrade
    if: always()
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: android-upgrade-*
          path: ${{ runner.temp }}/originals
          merge-multiple: false
      - name: Aggregate distinct original operations
        run: |
          python - <<'PY_EVIDENCE'
          from pathlib import Path
          import json,os,shutil
          temp=Path(os.environ['RUNNER_TEMP'])
          dest=temp/'receipts';dest.mkdir()
          games={};signatures=[];images={}
          for directory in sorted((temp/'originals').glob('android-upgrade-*')):
              slug=directory.name.removeprefix('android-upgrade-')
              if (directory/'verified-signatures.json').exists(): signatures.extend(json.loads((directory/'verified-signatures.json').read_bytes()))
              if (directory/'upgrade-report.json').exists():
                  report=json.loads((directory/'upgrade-report.json').read_bytes())
                  assert set(report['games'])=={slug} and slug not in games and report['androidApi']=='36'
                  games[slug]=report['games'][slug];images[slug]=report['image']
              diagnostics=directory/'diagnostics'/slug
              if diagnostics.is_dir():shutil.copytree(diagnostics,dest/'diagnostics'/slug)
          (dest/'verified-signatures.json').write_text(json.dumps(signatures,indent=2)+'\n')
          (dest/'upgrade-report.json').write_text(json.dumps(dict(androidApi='36',imageByGame=images,physicalDevice=False,games=games),indent=2)+'\n')
          PY_EVIDENCE
      - name: Preserve exact original diagnostics for both successful and unsuccessful replacements
        env:
          GH_TOKEN: ${{ github.token }}
          UPGRADES_RESULT: ${{ needs.upgrade.result }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/receipts"
          python - <<'PY_REPORT'
          import hashlib, json, os
          from pathlib import Path
          records={p.as_posix(): {'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()} for p in Path('.').rglob('*') if p.is_file()}
          Path('manifest.json').write_text(json.dumps(dict(source=os.environ['GITHUB_SHA'],run=os.environ['GITHUB_RUN_ID'],status=os.environ['UPGRADES_RESULT'],files=records),indent=2)+'\n')
          PY_REPORT
          branch="build-assets/joystick-controls-upgrade-${GITHUB_RUN_ID}-attempt-${GITHUB_RUN_ATTEMPT}"
          git init -q --initial-branch "$branch" .
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- .
          git commit -qm "Android Package Manager upgrade observations ${GITHUB_RUN_ID}"
          gh auth setup-git
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          git push "--force-with-lease=refs/heads/$branch:" origin "HEAD:refs/heads/$branch"
