name: Kart Rush original Mac game on Intel Tahoe
on: workflow_dispatch
permissions:
  contents: read
jobs:
  observe:
    runs-on: macos-26-intel
    timeout-minutes: 25
    env:
      RUNNER_KIND: macos-26-intel
      ARTIFACT_SOURCE_COMMIT: b7b7af12f1eb61f777d89edad7368a69a14bb9e3
      ARTIFACT_SOURCE_RUN: '44605303936'
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /joystick-games/tools/*.py
            /joystick-games/catalog-registry.json
            /joystick-games/shared/macos/tools/*
            /joystick-games/shared/macos/Sources/*
            /joystick-games/shared/macos/Web/*
            /joystick-games/kart-rush/qa-plan.json
            /joystick-games/kart-rush/macos/KartRush-0.1.0-macos-universal.zip
            /puretv-joystick/joystick_sdk.py
      - name: Bind published binary and observe native hardware
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          mkdir evidence
          uname -m | tee evidence/architecture.txt
          test "$(uname -m)" = x86_64
          sysctl -n machdep.cpu.brand_string | tee evidence/cpu.txt
          sysctl -n sysctl.proc_translated > evidence/translated.txt 2>/dev/null || true
          sw_vers > evidence/os.txt
          system_profiler -json SPDisplaysDataType > evidence/displays.json
          swift -e 'import Metal; print(MTLCopyAllDevices().map{$0.name})' | tee evidence/metal.txt
          pkg="$GITHUB_WORKSPACE/joystick-games/kart-rush/macos/KartRush-0.1.0-macos-universal.zip"
          echo "8ea5efefc2338332bd3dfd78205bed8111fbdd0f8e1455fc002579147ada5913  $pkg" | shasum -a 256 -c
          ditto -x -k "$pkg" installed
          codesign --verify --strict --deep 'installed/Kart Rush.app'
          binary='installed/Kart Rush.app/Contents/MacOS/KartRush'
          echo "4af8f6b45c89d68fe2135f08e5f295528382b187935fff3e5cdd1b0472f23dff  $binary" | shasum -a 256 -c
          lipo -archs "$binary" | tee evidence/architectures.txt
          shasum -a 256 "$pkg" "$binary" > evidence/SHA256SUMS.txt
      - name: Sample real pixels independently from both WKWebView graphics contexts
        run: |
          source=joystick-games/shared/macos/tools/kart-intel-graphics-probe.swift
          xcrun swiftc "$source" -o "$RUNNER_TEMP/probe"
          codesign --force --sign - "$RUNNER_TEMP/probe"
          for context in webgl2 webgl; do
            "$RUNNER_TEMP/probe" "$RUNNER_TEMP/evidence/$context.json" "$context"
            cat "$RUNNER_TEMP/evidence/$context.json"
          done
      - name: Play the original installed Kart Rush app using its original TCP SDK
        run: |
          python3 joystick-games/tools/macos-verify.py --game kart-rush --app "$RUNNER_TEMP/installed/Kart Rush.app" --output "$RUNNER_TEMP/evidence/native" --launch-architecture x86_64
      - name: Report the original observations
        if: always()
        run: |
          python3 - <<'PY'
          import json,os,pathlib
          base=pathlib.Path(os.environ['RUNNER_TEMP'])/'evidence'
          for n in ('displays.json','metal.txt','webgl.json','webgl2.json'):
              p=base/n
              if p.exists():print(n,p.read_text()[:6000])
          p=base/'native/report.json'
          if p.exists():
              r=json.loads(p.read_text()); print('GAME', {k:r.get(k) for k in ('status','phase','failurePhase','renderer','nativeProcessArchitecture','error')},[(t['name'],t['status']) for t in r['tests']])
          p=base/'native/diagnostics/state.json'
          if p.exists():
              state=json.loads(p.read_text()); print('FINAL', {k:state.get(k) for k in ('active','ready','processArchitecture','frontmostApplication','lastJavaScriptError')},str(state.get('game'))[:2000])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kart-rush-original-macos26-intel
          path: ${{ runner.temp }}/evidence/
