name: Reuse signed joystick catalog macOS packages for runtime QA
on:
  workflow_dispatch:
    inputs:
      source_run:
        description: Original catalog macOS run with successful selected build jobs
        required: true
        type: string
      source_sha:
        description: Exact original 40-character package source commit
        required: true
        type: string
      source_attempt:
        description: Exact original run attempt
        required: true
        default: '1'
        type: string
      batches:
        description: Comma-separated original registry batches, or all
        required: true
        default: all
        type: string
permissions:
  contents: read
  actions: read
env:
  ARTIFACT_SOURCE_COMMIT: ${{ inputs.source_sha }}
  ARTIFACT_SOURCE_RUN: ${{ inputs.source_run }}
  ARTIFACT_SOURCE_ATTEMPT: ${{ inputs.source_attempt }}
jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      verify_matrix: ${{ steps.plan.outputs.verify_matrix }}
      package_artifact_ids: ${{ steps.plan.outputs.package_artifact_ids }}
      build_artifact_ids: ${{ steps.plan.outputs.build_artifact_ids }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          sparse-checkout: |
            joystick-games
            puretv-joystick
            .github/workflows
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          path: artifact-source
          sparse-checkout: |
            joystick-games
            puretv-joystick
            .github/workflows
      - name: Validate original build jobs, artifacts and QA regressions
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_BATCHES: ${{ inputs.batches }}
        run: |
          set -euo pipefail
          for test_name in catalog-reuse catalog-tools native-observation local-network-prompts; do
            python3 "joystick-games/shared/macos/tests/$test_name.test.py" 2>&1 | tee "$RUNNER_TEMP/$test_name-tests.log"
          done
          python3 joystick-games/tools/macos-catalog-reuse.py plan \
            --source-run "$ARTIFACT_SOURCE_RUN" --source-sha "$ARTIFACT_SOURCE_COMMIT" \
            --source-attempt "$ARTIFACT_SOURCE_ATTEMPT" --batches "$REQUESTED_BATCHES" \
            --artifact-source-checkout artifact-source --output "$RUNNER_TEMP/plan"
          python3 - <<'PY'
          import hashlib,importlib.util,json,os,shutil,subprocess
          from pathlib import Path
          out=Path(os.environ['RUNNER_TEMP'])/'plan';provenance=json.loads((out/'source-provenance.json').read_text());matrix=json.loads((out/'matrix.json').read_text())
          source=os.environ['ARTIFACT_SOURCE_COMMIT'];qa_source=os.environ['GITHUB_SHA']
          assert provenance['artifactSourceCommit']==source and provenance['qaSourceCommit']==qa_source
          assert provenance['artifactRunId']==int(os.environ['ARTIFACT_SOURCE_RUN']) and provenance['artifactRunAttempt']==int(os.environ['ARTIFACT_SOURCE_ATTEMPT'])
          assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()==qa_source
          spec=importlib.util.spec_from_file_location('qa_plan','joystick-games/tools/qa-plan.py');qa_plan=importlib.util.module_from_spec(spec);spec.loader.exec_module(qa_plan)
          registry_path=Path('joystick-games/catalog-registry.json');registry=json.loads(registry_path.read_text())
          assert registry_path.read_bytes()==(Path('artifact-source')/registry_path).read_bytes(), 'Registry must match original packages'
          selected=provenance['batches'];games=provenance['games'];renderers={};test_scripts={}
          paths=[Path('joystick-games/shared/macos/tools/allow-local-network.py'),registry_path,Path('.github/workflows/joystick-catalog-macos-runtime.yml'),Path('joystick-games/tools/qa-plan.py'),Path('puretv-joystick/joystick_sdk.py'),*sorted(Path('joystick-games/tools').glob('macos-*.py'))]
          for game in games:
              assert game in registry['games'] and game not in ['cf-transport-ship','qq-speed']
              plan_path=Path('joystick-games')/game/'qa-plan.json';renderers[game]=qa_plan.accepted_renderers(qa_plan.load_plan(plan_path));paths.append(plan_path)
              test_scripts[game]=json.loads((Path('artifact-source/joystick-games')/game/'package.json').read_text()).get('scripts',{}).get('test') or None
          paths += [Path('joystick-games/shared/macos/tests')/(name+'.test.py') for name in ['catalog-reuse','catalog-tools','native-observation','local-network-prompts']]
          paths += [Path('joystick-games/shared/macos/tests/fixtures/catalog-webgl-versions.json'),Path('joystick-games/shared/macos/tests/fixtures/catalog-network-prompts-44152197128.json')]
          for name in ['catalog-reuse','catalog-tools','native-observation','local-network-prompts']:shutil.copy2(Path(os.environ['RUNNER_TEMP'])/(name+'-tests.log'),out/(name+'-tests.log'))
          files={}
          for p in paths:
              data=p.read_bytes();assert data==subprocess.check_output(['git','show',qa_source+':'+p.as_posix()]), 'Uncommitted QA input'
              files[p.as_posix()]={'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest()}
              target=out/'executed-source'/p;target.parent.mkdir(parents=True,exist_ok=True);target.write_bytes(data)
          record={'sourceCommit':source,'qaSourceCommit':qa_source,'artifactRunId':provenance['artifactRunId'],'artifactRunAttempt':provenance['artifactRunAttempt'],'runId':int(os.environ['GITHUB_RUN_ID']),'runAttempt':int(os.environ['GITHUB_RUN_ATTEMPT']),'batches':selected,'games':games,'renderers':renderers,'originalTestScripts':test_scripts,'inputFiles':files,'productionPackagesRebuilt':False}
          (out/'plan.json').write_text(json.dumps(record,indent=2)+'\n');(out/'catalog-registry.json').write_bytes(registry_path.read_bytes());(out/'executed-workflow.yml').write_bytes(Path('.github/workflows/joystick-catalog-macos-runtime.yml').read_bytes())
          with open(os.environ['GITHUB_OUTPUT'],'a') as stream:
              stream.write('verify_matrix='+json.dumps(matrix,separators=(',',':'))+'\n')
              stream.write('package_artifact_ids='+','.join(str(item['packageArtifactId']) for item in selected)+'\n')
              stream.write('build_artifact_ids='+','.join(str(item['buildArtifactId']) for item in selected)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: joystick-catalog-macos-runtime-plan
          path: ${{ runner.temp }}/plan/
          if-no-files-found: warn
          retention-days: 30
  verify:
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.verify_matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    env:
      GAMES_JSON: ${{ toJSON(matrix.games) }}
      BATCH: ${{ matrix.batch }}
      RUNNER_KIND: ${{ matrix.runner }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          sparse-checkout: |
            joystick-games
            puretv-joystick
            .github/workflows
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          path: artifact-source
          sparse-checkout: |
            joystick-games
            puretv-joystick
            .github/workflows
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ecojust/pureTV
          run-id: ${{ inputs.source_run }}
          artifact-ids: ${{ matrix.packageArtifactId }}
          merge-multiple: true
          path: ${{ runner.temp }}/packages
      - name: Run each installed app with real native gameplay and original SDK
        run: |
          python3 - <<'PY'
          import datetime,hashlib,importlib.util,json,os,signal,subprocess,sys,traceback
          from pathlib import Path
          temp=Path(os.environ['RUNNER_TEMP']);out=temp/'qa';out.mkdir();source=os.environ['ARTIFACT_SOURCE_COMMIT'];qa_source=os.environ['GITHUB_SHA']
          spec=importlib.util.spec_from_file_location('qa_plan','joystick-games/tools/qa-plan.py');qa_plan=importlib.util.module_from_spec(spec);spec.loader.exec_module(qa_plan)
          assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()==qa_source
          arm=os.environ['RUNNER_KIND']=='macos-latest';expected_arch='arm64' if arm else 'x86_64'
          assert subprocess.check_output(['uname','-m'],text=True).strip()==expected_arch, 'Runner architecture changed'
          report={'sourceCommit':source,'qaSourceCommit':qa_source,'artifactRunId':int(os.environ['ARTIFACT_SOURCE_RUN']),'batch':os.environ['BATCH'],'runner':os.environ['RUNNER_KIND'],'expectedArchitecture':expected_arch,'status':'running','games':[]}
          def save(): (out/'batch-report.json').write_text(json.dumps(report,indent=2)+'\n')
          def execute(argv,log,timeout=900):
            result={'command':list(map(str,argv)),'status':'running','log':str(log.relative_to(out)),'startedAt':datetime.datetime.now(datetime.timezone.utc).isoformat()};log.parent.mkdir(parents=True,exist_ok=True)
            with log.open('w') as stream:
              try:
                process=subprocess.Popen(result['command'],stdout=stream,stderr=subprocess.STDOUT,start_new_session=True)
                try:process.wait(timeout=timeout)
                except subprocess.TimeoutExpired:
                  os.killpg(process.pid,signal.SIGKILL);process.wait();raise
                result.update(returncode=process.returncode,status='passed' if process.returncode==0 else 'failed')
              except Exception:result.update(status='failed',error=traceback.format_exc());stream.write(result['error'])
            print(str(log)+': '+result['status'],flush=True);return result
          # Reuse jobs do not execute the build's shared suite. Compile and run
          # the unchanged production HTTP server on this actual QA runner too.
          asset_inputs={}
          asset_sources=['.github/workflows/joystick-catalog-macos-runtime.yml','joystick-games/shared/macos/Sources/LocalAssetServer.swift','joystick-games/shared/macos/tests/local-assets.test.py']
          asset_sources += [path.as_posix() for path in sorted(Path('joystick-games/tools/fixtures/audio').glob('*')) if path.is_file()]
          for name in asset_sources:
            data=Path(name).read_bytes();assert data==subprocess.check_output(['git','show',qa_source+':'+name]), 'Uncommitted asset HTTP test input'
            target=out/'executed-source'/name;target.parent.mkdir(parents=True,exist_ok=True);target.write_bytes(data)
            asset_inputs[name]={'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest()}
          (out/'local-assets-source-inputs.json').write_text(json.dumps({'qaSourceCommit':qa_source,'artifactSourceCommit':source,'runnerArchitecture':expected_arch,'files':asset_inputs},indent=2)+'\n')
          os.environ['PURETV_ASSET_TEST_EVIDENCE']=str(out/'local-assets-compile')
          report['localAssetHttp']=execute(['python3','joystick-games/shared/macos/tests/local-assets.test.py'],out/'local-assets.log')
          save()
          if arm:
            available=subprocess.run(['/usr/bin/arch','-x86_64','/usr/bin/true'],capture_output=True).returncode==0
            if not available:report['rosettaInstallation']=execute(['sudo','/usr/sbin/softwareupdate','--install-rosetta','--agree-to-license'],out/'rosetta-install.log',1200)
          save()
          for game in json.loads(os.environ['GAMES_JSON']):
            record={'game':game,'status':'running','checks':[]};report['games'].append(record);save()
            package=temp/'packages'/game;game_out=out/game;game_out.mkdir()
            try:
              meta=json.loads((package/'build-manifest.json').read_text());assert meta['sourceCommit']==source and meta['game']==game
              renderers=qa_plan.accepted_renderers(qa_plan.load_plan(Path('joystick-games')/game/'qa-plan.json'))
              install=execute(['python3','joystick-games/tools/macos-packages.py','--directory',str(package),'--artifact-source-checkout',str(Path('artifact-source').resolve()),'--output',str(game_out/'package-verification.json')],game_out/'package-verification.log');record['checks'].append(install);save()
              if install['status']=='passed':
                app=package/'installed'/meta['appName']
                for mode,extra in [('native',[]),*([('occupied-port',['--occupy-default-port']),('rosetta',['--launch-architecture','x86_64'])] if arm else [])]:
                  result=execute(['python3','joystick-games/tools/macos-verify.py','--game',game,'--app',str(app),'--output',str(game_out/mode),*extra],game_out/(mode+'.log'));record['checks'].append(result);save()
                  if result['status']=='passed':
                    try:
                      observed=json.loads((game_out/mode/'report.json').read_text())
                      assert observed['status']=='passed', 'Catalog gameplay cannot be waived as limited graphics'
                      assert observed['initialization']['observedGame']['renderer'] in renderers
                      assert observed['nativeProcessArchitecture']==('x86_64' if mode=='rosetta' else expected_arch)
                    except Exception:result.update(status='failed',error=traceback.format_exc())
                    save()
              record['status']='passed' if record['checks'] and all(item['status']=='passed' for item in record['checks']) else 'failed'
            except Exception:record.update(status='failed',error=traceback.format_exc())
            save()
          report['status']='passed' if report['localAssetHttp']['status']=='passed' and all(item['status']=='passed' for item in report['games']) else 'failed';save()
          sys.exit(0 if report['status']=='passed' else 1)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: joystick-catalog-macos-runtime-${{ matrix.batch }}-${{ matrix.runner }}
          path: ${{ runner.temp }}/qa/
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 30
  export:
    if: needs.plan.result == 'success' && needs.verify.result == 'success'
    needs: [plan, verify]
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: joystick-catalog-macos-runtime-plan
          path: ${{ runner.temp }}/export/provenance
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ecojust/pureTV
          run-id: ${{ inputs.source_run }}
          artifact-ids: ${{ needs.plan.outputs.build_artifact_ids }}
          path: ${{ runner.temp }}/export/build-evidence
      - uses: actions/download-artifact@v4
        with:
          pattern: joystick-catalog-macos-runtime-*-macos-*
          path: ${{ runner.temp }}/export/evidence
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ecojust/pureTV
          run-id: ${{ inputs.source_run }}
          artifact-ids: ${{ needs.plan.outputs.package_artifact_ids }}
          path: ${{ runner.temp }}/export/packages
      - name: Validate every package and original report, then export an immutable branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib,json,os,re,subprocess
          from pathlib import Path
          out=Path(os.environ['RUNNER_TEMP'])/'export';source=os.environ['ARTIFACT_SOURCE_COMMIT'];qa_source=os.environ['GITHUB_SHA'];run=os.environ['GITHUB_RUN_ID'];attempt=os.environ['GITHUB_RUN_ATTEMPT'];repo=os.environ['GITHUB_REPOSITORY']
          assert re.fullmatch(r'[a-f0-9]{40}',source) and run.isdigit() and attempt.isdigit()
          plan=json.loads((out/'provenance/plan.json').read_text());assert plan['sourceCommit']==source and plan['qaSourceCommit']==qa_source and plan['artifactRunId']==int(os.environ['ARTIFACT_SOURCE_RUN']) and plan['artifactRunAttempt']==int(os.environ['ARTIFACT_SOURCE_ATTEMPT']) and plan['runId']==int(run) and plan['runAttempt']==int(attempt)
          registry=json.loads((out/'provenance/catalog-registry.json').read_text())
          def matches(path,item):return path.is_file() and not path.is_symlink() and path.stat().st_size==item['bytes'] and hashlib.sha256(path.read_bytes()).hexdigest()==item['sha256']
          assert matches(out/'provenance/catalog-registry.json',plan['inputFiles']['joystick-games/catalog-registry.json'])
          assert matches(out/'provenance/executed-workflow.yml',plan['inputFiles']['.github/workflows/joystick-catalog-macos-runtime.yml'])
          count=0
          for batch in plan['batches']:
            name=batch['batch'];games=batch['games'];assert games==registry['batches'][name]
            build=json.loads((out/'build-evidence'/('joystick-catalog-macos-build-'+name)/'build-report.json').read_text())
            assert build['sourceCommit']==source and build['status']=='passed' and [item['game'] for item in build['games']]==games
            assert build['shared'] and all(item['status']=='passed' for item in build['shared'])
            for game in games:
              record=next(item for item in build['games'] if item['game']==game);assert record['status']==record['build']['status']=='passed' and len(record['tests'])==3
              assert record['originalTestScript']==plan['originalTestScripts'][game] and record['testProvided'] is (plan['originalTestScripts'][game] is not None)
              assert [item['name'] for item in record['tests']]==['dependencies','original-tests','frozen-dist']
              assert record['tests'][0]['status']==record['tests'][2]['status']=='passed'
              assert record['tests'][1]['status']==('passed' if plan['originalTestScripts'][game] else 'not_provided')
              package=out/'packages'/('joystick-catalog-macos-packages-'+name)/game;meta=json.loads((package/'build-manifest.json').read_text());entry=registry['games'][game]
              assert meta['game']==game and meta['sourceCommit']==source and meta['committedInputsVerified'] is True
              assert meta['bundleIdentifier']==entry['packageName'] and meta['appName']==entry['appName']+'.app' and set(meta['architectures'])=={'arm64','x86_64'} and meta['signature']=='ad-hoc' and meta['appleNotarized'] is False
              assert len(meta['packages'])==2 and {Path(key).suffix for key in meta['packages']}=={'.zip','.dmg'}
              for filename,item in meta['packages'].items():assert Path(filename).name==filename and matches(package/filename,item), filename
              executable=meta['appFiles']['Contents/MacOS/'+entry['executable']]['sha256']
              for runner in ['macos-latest','macos-15-intel']:
                folder=out/'evidence'/('joystick-catalog-macos-runtime-'+name+'-'+runner);batch_qa=json.loads((folder/'batch-report.json').read_text())
                assert batch_qa['sourceCommit']==source and batch_qa['qaSourceCommit']==qa_source and batch_qa['status']=='passed' and [item['game'] for item in batch_qa['games']]==games
                record=next(item for item in batch_qa['games'] if item['game']==game);assert record['status']=='passed' and len(record['checks'])==(4 if runner=='macos-latest' else 2) and all(item['status']=='passed' for item in record['checks'])
                evidence=folder/game;installed=json.loads((evidence/'package-verification.json').read_text())
                assert installed['status']=='passed' and installed['game']==game and installed['sourceCommit']==installed['artifactSourceCommit']==source and installed['qaSourceCommit']==qa_source and installed['artifactRunId']==int(os.environ['ARTIFACT_SOURCE_RUN']) and installed['artifactRunAttempt']==int(os.environ['ARTIFACT_SOURCE_ATTEMPT']) and installed['originalPackageBytesReused'] is True and installed['zipDmgAndInstalledCopyVerified'] is True
                assert installed['completeFileSetVerified'] is True and set(installed['architectures'])=={'arm64','x86_64'} and installed['signature']=='ad-hoc' and installed['appleNotarized'] is False
                for mode in (['native','occupied-port','rosetta'] if runner=='macos-latest' else ['native']):
                  report=json.loads((evidence/mode/'report.json').read_text());assert report['status']=='passed' and report['game']==game
                  assert report['qaSourceCommit']==qa_source and report['artifactSourceCommit']==source and str(report['artifactRunId'])==os.environ['ARTIFACT_SOURCE_RUN'] and report['binarySha256']==executable
                  assert report['initialization']['observedGame']['renderer'] in plan['renderers'][game]
                  assert report['nativeProcessArchitecture']==('x86_64' if runner=='macos-15-intel' or mode=='rosetta' else 'arm64')
                  assert report['tests'] and all(item['status']=='passed' for item in report['tests'])
                  storage=report['storageRestart'];assert storage['initialHydrationEqual'] is True and storage['newOriginVerified'] is True
                  assert report['freshInstallSetup']['reusedAcrossRestartOnly'] is True
                  if report['qaPlan'].get('storageRestartRequired'):assert storage['status']=='passed' and storage['nativeSavedAfterQuit'], 'Required real save/restart evidence missing'
                  frozen_inputs={**meta['inputFiles'],**plan['inputFiles']}
                  for filename,checksum in report['sourceHashes'].items():assert filename in frozen_inputs and checksum==frozen_inputs[filename]['sha256'], filename
                  assert matches(evidence/mode/'executed-macos-verify.py',plan['inputFiles']['joystick-games/tools/macos-verify.py'])
                  assert matches(evidence/mode/'executed-allow-local-network.py',plan['inputFiles']['joystick-games/shared/macos/tools/allow-local-network.py'])
              count+=1
          assert count==len(plan['games'])
          files={}
          for path in sorted(out.rglob('*')):
            assert not path.is_symlink(), path
            if path.is_file():
              assert path.stat().st_size<100000000, 'Git export file exceeds supported size: '+str(path)
              files[path.relative_to(out).as_posix()]={'bytes':path.stat().st_size,'sha256':hashlib.sha256(path.read_bytes()).hexdigest()}
          branch=f'build-assets/joystick-catalog-macos-runtime-{run}-attempt-{attempt}'
          manifest={'sourceCommit':source,'artifactSourceCommit':source,'qaSourceCommit':qa_source,'artifactRunId':int(os.environ['ARTIFACT_SOURCE_RUN']),'artifactRunAttempt':int(os.environ['ARTIFACT_SOURCE_ATTEMPT']),'runId':int(run),'runAttempt':int(attempt),'exportBranch':branch,'games':plan['games'],'installPackagesValidated':True,'nativeGameplayVerified':['arm64','x86_64','rosetta-x86_64'],'renderers':plan['renderers'],'physicalControllerTested':False,'appleNotarized':False,'files':files}
          (out/'export-manifest.json').write_text(json.dumps(manifest,indent=2)+'\n')
          def git(*args):return subprocess.run(['git','-C',str(out),*args],check=True)
          git('init','-b','export');git('config','user.name','github-actions[bot]');git('config','user.email','41898282+github-actions[bot]@users.noreply.github.com');git('add','.');git('commit','-m',f'Export validated catalog macOS {run} attempt {attempt} [skip ci]')
          subprocess.run(['gh','auth','setup-git'],check=True);remote='https://github.com/'+repo+'.git';git('remote','add','origin',remote)
          assert not subprocess.check_output(['git','ls-remote','--heads',remote,'refs/heads/'+branch],text=True).strip(), 'Immutable export branch already exists'
          git('push','--force-with-lease=refs/heads/'+branch+':','origin','HEAD:refs/heads/'+branch)
          PY
  preserve-failure:
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.verify.result != 'success' }}
    needs: [plan, verify]
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: joystick-catalog-macos-runtime-plan
          path: ${{ runner.temp }}/evidence-only/provenance
      - uses: actions/download-artifact@v4
        with:
          pattern: joystick-catalog-macos-runtime-*-macos-*
          path: ${{ runner.temp }}/evidence-only/evidence
      - name: Preserve failed original reports without installation packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib,json,os,re,subprocess
          from pathlib import Path
          out=Path(os.environ['RUNNER_TEMP'])/'evidence-only';plan=json.loads((out/'provenance/plan.json').read_text())
          assert plan['qaSourceCommit']==os.environ['GITHUB_SHA'] and plan['sourceCommit']==os.environ['ARTIFACT_SOURCE_COMMIT']
          assert plan['runId']==int(os.environ['GITHUB_RUN_ID']) and plan['runAttempt']==int(os.environ['GITHUB_RUN_ATTEMPT'])
          allowed={'.json','.log','.txt','.png','.py','.swift','.plist','.yml'};files={};total=0
          for path in sorted(out.rglob('*')):
              assert not path.is_symlink()
              if path.is_file():
                  assert path.suffix in allowed and path.stat().st_size<100_000_000, path
                  data=path.read_bytes();total+=len(data);files[path.relative_to(out).as_posix()]={'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest()}
          assert total<500_000_000
          branch='build-assets/joystick-catalog-macos-runtime-evidence-'+os.environ['GITHUB_RUN_ID']+'-attempt-'+os.environ['GITHUB_RUN_ATTEMPT']
