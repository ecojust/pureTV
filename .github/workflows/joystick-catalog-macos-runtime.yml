name: Backroad Rally published Mac relaunch verification
on: workflow_dispatch
permissions:
  contents: read
jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      ARTIFACT_SOURCE_COMMIT: 68d343d22c762c904eb83854d4ab9c4113a7c30f
      ARTIFACT_SOURCE_RUN: '44608415225'
      RUNNER_KIND: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /joystick-games/tools/*.py
            /joystick-games/catalog-registry.json
            /joystick-games/shared/macos/tools/*
            /joystick-games/shared/macos/Sources/*
            /joystick-games/shared/macos/Web/*
            /joystick-games/backroad-rally/qa-plan.json
            /puretv-joystick/joystick_sdk.py
      - name: Verify and open original published app
        working-directory: ${{ runner.temp }}
        run: |
          set -eu
          test "$(uname -m)" = arm64
          curl -fsSL --retry 3 -o Backroad.zip https://github.com/ecojust/pureTV/releases/download/joystick-backroad-rally-v0.1.0/BackroadRally-0.1.0-macos-universal.zip
          echo '61ac58f2f75ff5ede9850d43e1bc77448731f870dd309efbb2af5d9236d57323  Backroad.zip' | shasum -a 256 -c
          ditto -x -k Backroad.zip installed
          codesign --verify --strict --deep 'installed/Backroad Rally.app'
          echo 'f1726ff1d388ca320a0187b067f94b841ad42ef27efe101c13c5c7fce5a2494f  installed/Backroad Rally.app/Contents/MacOS/BackroadRally' | shasum -a 256 -c
      - name: Exercise normal controller, disconnect, foreground and save restoration
        run: |
          python3 joystick-games/tools/macos-verify.py --game backroad-rally --app "$RUNNER_TEMP/installed/Backroad Rally.app" --output "$RUNNER_TEMP/native"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backroad-macos-native-relaunch
          path: ${{ runner.temp }}/native/
