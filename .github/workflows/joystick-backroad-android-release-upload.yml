name: Upload approved puzzle-game originals into their draft
on:
  workflow_dispatch:
    inputs:
      game:
        description: Reviewed game slug
        required: true
        type: choice
        options: [alchemists-lattice, atlas-of-ink, bumble-basket, neon-arcana, oathstones, solder-and-rain, starbase-spooky, starsling, story-thief]
permissions:
  contents: write
concurrency:
  group: verified-puzzle-transfer-${{ inputs.game }}
  cancel-in-progress: false
jobs:
  transfer:
    if: github.repository == 'ecojust/pureTV' && github.ref == 'refs/heads/qa/puzzle-nine-verified-upload-20261120'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: .github/puzzle-transfer-approved
      - name: Verify and transfer the approved original assets
        env:
          GH_TOKEN: ${{ github.token }}
          GAME: ${{ inputs.game }}
        run: python3 .github/puzzle-transfer-approved/upload.py "$GAME"
