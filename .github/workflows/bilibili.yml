name: Bili TV build

on:
  push:
    branches: [master, feat/bilibili-tv]
    paths:
      - 'resource/apps/bilibili/**'
      - 'resource/launcher/puretv/settings.gradle'
      - 'resource/launcher/puretv/build.gradle'
      - 'resource/launcher/puretv/gradle.properties'
      - 'resource/launcher/puretv/gradle/**'
      - '.github/workflows/bilibili.yml'
  pull_request:
    paths:
      - 'resource/apps/bilibili/**'
      - 'resource/launcher/puretv/settings.gradle'
      - 'resource/launcher/puretv/build.gradle'
      - 'resource/launcher/puretv/gradle.properties'
      - 'resource/launcher/puretv/gradle/**'
      - '.github/workflows/bilibili.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bilibili-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Install build SDK and preview font
        run: |
          sdkmanager "platforms;android-35" "build-tools;34.0.0"
          if [ -z "$(fc-list :lang=zh)" ]; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends fonts-wqy-zenhei
            fc-cache -f
          fi
      - name: Build, test, lint and capture native UI
        working-directory: resource/launcher/puretv
        env:
          BILIBILI_UI_CAPTURE_DIR: ${{ runner.temp }}/bilibili-previews
        run: |
          set -o pipefail
          ./gradlew --no-daemon --continue :bilibili:assembleDebug :bilibili:verifyReleaseSize :bilibili:testDebugUnitTest :bilibili:lintDebug 2>&1 | tee "$RUNNER_TEMP/bilibili-build.log"
      - name: Report test and lint failures
        if: failure()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          def report(title, message):
              escaped = message.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print('::error title='+title+'::'+escaped)
          for path in Path('resource/apps/bilibili/build/test-results').rglob('TEST-*.xml'):
              for case in ET.parse(path).getroot().iter('testcase'):
                  for failure in case.findall('failure')+case.findall('error'):
                      name = case.get('classname', '')+'.'+case.get('name', '')
                      report('BiliTV test', name+'\n'+(failure.text or failure.get('message', ''))[:5000])
          for path in Path('resource/apps/bilibili/build/reports').glob('lint-results*.xml'):
              for issue in ET.parse(path).getroot().findall('issue'):
                  if issue.get('severity') in ('Error', 'Fatal'):
                      locations = ['{file}:{line}'.format(file=item.get('file', ''), line=item.get('line', '')) for item in issue.findall('location')]
                      report('BiliTV lint', issue.get('id', '')+': '+issue.get('message', '')+'\n'+'\n'.join(locations))
          PY
      - name: Verify unsigned APK and collect previews
        run: |
          python3 - <<'PY'
          import json, os, re, shutil, struct, subprocess, sys
          from pathlib import Path
          sys.path.insert(0, 'tools')
          from resource_catalog import apk_info
          tools = Path(os.environ['ANDROID_HOME']) / 'build-tools/34.0.0'
          apks = list(Path('resource/apps/bilibili/build/outputs/apk/release').glob('*.apk'))
          assert len(apks) == 1, 'Expected one release APK'
          info = apk_info(apks[0], tools, allow_unsigned=True)
          gradle = Path('resource/apps/bilibili/build.gradle').read_text()
          assert info['packageName'] == 'com.ecojust.bilitv'
          assert info['versionName'] == re.search(r"versionName '([^']+)'", gradle)[1]
          assert info['versionCode'] == int(re.search(r'versionCode (\d+)', gradle)[1])
          assert info['certificateSha256'] is None, 'Build job must not sign APKs'
          assert 0 < info['bytes'] < 10000000
          badging = subprocess.check_output([str(tools/'aapt'), 'dump', 'badging', str(apks[0])], text=True)
          assert re.search(r"^sdkVersion:'19'$", badging, re.M)
          assert re.search(r"^targetSdkVersion:'29'$", badging, re.M)
          output = Path('bilibili-output'); output.mkdir()
          shutil.copyfile(apks[0], output/'unsigned.apk')
          previews = Path(os.environ['RUNNER_TEMP'])/'bilibili-previews'
          for name in ('bilibili-tv.png', 'bilibili-tv.en.png'):
              data = (previews/name).read_bytes()
              assert data[:8] == b'\x89PNG\r\n\x1a\n' and len(data) > 24
              assert min(struct.unpack('>II', data[16:24])) > 0
          shutil.copytree(previews, output/'previews')
          info.update(sourceSha=os.environ['GITHUB_SHA'], sourceRun=os.environ['GITHUB_RUN_ID'],
                      minSdk=19, targetSdk=29, physicalTvTested=False, previewData='simulated')
          (output/'build-metadata.json').write_text(json.dumps(info, indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: bilibili-build
          path: bilibili-output/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bilibili-test-reports
          path: |
            resource/apps/bilibili/build/reports/
            resource/apps/bilibili/build/test-results/
            ${{ runner.temp }}/bilibili-build.log
            ${{ runner.temp }}/bilibili-previews/
          if-no-files-found: warn
          retention-days: 14

  sign:
    needs: build
    if: github.event_name != 'pull_request' && github.repository == 'ecojust/pureTV' && (github.ref == 'refs/heads/feat/bilibili-tv' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: build-tools;34.0.0
      - uses: actions/download-artifact@v4
        with:
          name: bilibili-build
          path: bilibili-input
      - name: Sign with the existing pureTV release certificate
        env:
          PURETV_KEYSTORE_BASE64: ${{ secrets.PURETV_KEYSTORE_BASE64 }}
          PURETV_KEYSTORE_PASSWORD: ${{ secrets.PURETV_KEYSTORE_PASSWORD }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, re, shutil, subprocess, sys, tempfile
          from pathlib import Path
          sys.path.insert(0, 'tools')
          from resource_catalog import apk_info, digest
          tools = Path(os.environ['ANDROID_HOME'])/'build-tools/34.0.0'
          source = Path('bilibili-input')
          metadata = json.loads((source/'build-metadata.json').read_text())
          unsigned = source/'unsigned.apk'
          assert metadata['sourceSha'] == os.environ['GITHUB_SHA']
          assert metadata['sourceRun'] == os.environ['GITHUB_RUN_ID']
          assert metadata['packageName'] == 'com.ecojust.bilitv'
          assert metadata['certificateSha256'] is None
          assert metadata['sha256'] == digest(unsigned)
          assert re.fullmatch(r'\d+\.\d+\.\d+', metadata['versionName'])
          key_data = os.environ.get('PURETV_KEYSTORE_BASE64')
          assert key_data and os.environ.get('PURETV_KEYSTORE_PASSWORD'), 'Existing pureTV signing secrets are required'
          expected = Path('tools/puretv-release-certificate-v2.sha256').read_text().strip()
          assert re.fullmatch(r'[a-f0-9]{64}', expected)
          output = Path('bilibili-release'); output.mkdir()
          with tempfile.TemporaryDirectory(prefix='bilibili-sign-', dir=os.environ['RUNNER_TEMP']) as temporary:
              temporary = Path(temporary)
              key = temporary/'puretv.jks'
              key.write_bytes(base64.b64decode(''.join(key_data.split()), validate=True)); key.chmod(0o600)
              certificate = subprocess.check_output(['keytool', '-exportcert', '-alias', 'puretv', '-keystore', str(key), '-storepass:env', 'PURETV_KEYSTORE_PASSWORD'])
              assert hashlib.sha256(certificate).hexdigest() == expected, 'Unexpected release key'
              aligned = temporary/'aligned.apk'
              subprocess.run([str(tools/'zipalign'), '-f', '4', str(unsigned), str(aligned)], check=True)
              apk = output/('bilibili-'+metadata['versionName']+'.apk')
              subprocess.run([str(tools/'apksigner'), 'sign', '--min-sdk-version', '19', '--v1-signing-enabled', 'true', '--v2-signing-enabled', 'true', '--v3-signing-enabled', 'true', '--v4-signing-enabled', 'false', '--ks', str(key), '--ks-key-alias', 'puretv', '--ks-pass', 'env:PURETV_KEYSTORE_PASSWORD', '--key-pass', 'env:PURETV_KEYSTORE_PASSWORD', '--out', str(apk), str(aligned)], check=True)
          subprocess.run([str(tools/'apksigner'), 'verify', '--min-sdk-version', '19', str(apk)], check=True)
          subprocess.run([str(tools/'zipalign'), '-c', '4', str(apk)], check=True)
          signed = apk_info(apk, tools)
          assert signed['certificateSha256'] == expected
          assert all(signed[key] == metadata[key] for key in ('packageName', 'versionCode', 'versionName'))
          assert 0 < signed['bytes'] < 10000000
          signed.update(sourceSha=metadata['sourceSha'], buildRun='https://github.com/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs/'+os.environ['GITHUB_RUN_ID'],
                        minSdk=19, targetSdk=29, signatureVerified=True, physicalTvTested=False, previewData='simulated')
          (output/'metadata.json').write_text(json.dumps(signed, indent=2)+'\n')
          (output/'SHA256SUMS.txt').write_text(signed['sha256']+'  '+apk.name+'\n')
          shutil.copytree(source/'previews', output/'previews')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: bilibili-release
          path: bilibili-release/
          if-no-files-found: error
          retention-days: 14

  export:
    needs: [build, sign]
    if: always() && github.event_name != 'pull_request' && github.repository == 'ecojust/pureTV' && (github.ref == 'refs/heads/feat/bilibili-tv' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve available test diagnostics
        id: reports
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: bilibili-test-reports
          path: bilibili-export-input/reports
      - name: Retrieve verified release
        if: needs.sign.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: bilibili-release
          path: bilibili-export-input/release
      - name: Stage bounded diagnostics and verified release files
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          SIGN_RESULT: ${{ needs.sign.result }}
          REPORT_DOWNLOAD: ${{ steps.reports.outcome }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, re, shutil
          from pathlib import Path
          source = Path('bilibili-export-input')
          output = Path('release-staging/bilibili')
          assert not output.exists(), 'Refusing to reuse a staging directory'
          output.mkdir(parents=True)
          records = []; skipped = []; total = 0
          def copy(path, relative, maximum):
              global total
              assert path.is_file() and not path.is_symlink(), 'Only regular artifact files may be exported'
              size = path.stat().st_size
              assert 0 < size <= maximum, 'Artifact exceeds its export size bound: '+str(relative)
              total += size
              assert total <= 25000000, 'Export exceeds 25 MB'
              target = output/relative
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copyfile(path, target)
              records.append({'path':relative.as_posix(), 'bytes':size,
                              'sha256':hashlib.sha256(target.read_bytes()).hexdigest()})
          reports = source/'reports'
          if reports.is_dir():
              for path in sorted(reports.rglob('*')):
                  if path.is_symlink():
                      raise AssertionError('Report symlink is not allowed')
                  if not path.is_file() or path.suffix.lower() not in ('.xml', '.log', '.png'):
                      continue
                  relative = Path('reports')/path.relative_to(reports)
                  if path.stat().st_size == 0 or path.stat().st_size > 4000000:
                      skipped.append({'path':relative.as_posix(), 'reason':'empty or larger than 4 MB'})
                      continue
                  copy(path, relative, 4000000)
          if os.environ['SIGN_RESULT'] == 'success':
              release = source/'release'
              metadata = json.loads((release/'metadata.json').read_text())
              assert metadata['sourceSha'] == os.environ['GITHUB_SHA']
              assert metadata['buildRun'].endswith('/actions/runs/'+os.environ['GITHUB_RUN_ID'])
              assert metadata['signatureVerified'] is True
              assert metadata['packageName'] == 'com.ecojust.bilitv'
              assert re.fullmatch(r'\d+\.\d+\.\d+', metadata['versionName'])
              assert metadata['certificateSha256'] == Path('tools/puretv-release-certificate-v2.sha256').read_text().strip()
              apk = release/('bilibili-'+metadata['versionName']+'.apk')
              assert apk.stat().st_size == metadata['bytes']
              assert hashlib.sha256(apk.read_bytes()).hexdigest() == metadata['sha256']
              for path in (apk, release/'metadata.json', release/'SHA256SUMS.txt'):
                  copy(path, Path('release')/path.name, 10000000 if path == apk else 64000)
              for path in sorted((release/'previews').glob('*.png')):
                  copy(path, Path('release/previews')/path.name, 4000000)
          manifest = {'sourceSha':os.environ['GITHUB_SHA'], 'runId':os.environ['GITHUB_RUN_ID'],
                      'runUrl':'https://github.com/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs/'+os.environ['GITHUB_RUN_ID'],
                      'buildResult':os.environ['BUILD_RESULT'], 'signResult':os.environ['SIGN_RESULT'],
                      'reportDownload':os.environ['REPORT_DOWNLOAD'], 'files':records, 'skipped':skipped}
          (output/'export-metadata.json').write_text(json.dumps(manifest, indent=2)+'\n')
          PY
      - name: Export to a new temporary build-assets branch
        run: |
          export_branch="build-assets/bilibili-${GITHUB_RUN_ID}"
          if git ls-remote --exit-code --heads origin "$export_branch" >/dev/null; then
            echo "::error::This run already has an export branch; it will not be overwritten."
            exit 1
          fi
          git checkout -b "$export_branch"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -f release-staging/bilibili
          git commit -m "Stage BiliTV build ${GITHUB_RUN_ID} diagnostics and verified artifacts"
          git push origin "HEAD:refs/heads/$export_branch"
