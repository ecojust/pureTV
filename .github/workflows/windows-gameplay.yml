name: Play a public catalogue release on Windows x64
on:
  push:
    branches: [qa/windows-launcher-two-20261120]
permissions:
  contents: read
jobs:
  play:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /tools/pc-games/qa/play_windows.py
            /tools/pc-games/qa/public_ember.py
            /joystick-games/qa/controller-input/sdk.py
            /puretv-joystick/joystick_sdk.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright==1.62.0 pyinstaller==6.16.0
      - name: Download the public Windows EXE, let it fetch Emberbrood, and play in Edge
        run: python tools/pc-games/qa/public_ember.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-windows-gameplay-evidence
          path: ${{ runner.temp }}/sample-results/
  retain:
    needs: play
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: public-windows-gameplay-evidence
          path: ${{ runner.temp }}/report
      - name: Preserve original measurements and rendered gameplay
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$RUNNER_TEMP/report"
          test -f public-emberbrood.json
          git init -q
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add .
          git commit -qm "Record the public Windows launcher playing Emberbrood from run $GITHUB_RUN_ID"
          gh auth setup-git
          git push "https://github.com/$GITHUB_REPOSITORY.git" "HEAD:refs/heads/build-assets/public-player-gameplay-$GITHUB_RUN_ID"
