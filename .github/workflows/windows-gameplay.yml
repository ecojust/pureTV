name: Windows x64 launcher gameplay samples
on:
  push:
    branches: [qa/windows-launcher-two-20261120]
permissions:
  contents: read
  actions: read
jobs:
  play:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /tools/pc-games/
            /joystick-games/qa/controller-input/
            /puretv-joystick/joystick_sdk.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Wait for the signed Emberbrood APK from its frozen build
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          for ($i=0; $i -lt 65; $i++) {
            $signed = gh api repos/ecojust/pureTV/actions/runs/44762298740/artifacts --jq '.artifacts[] | select(.name=="joystick-android-signed") | .id'
            if ($signed) { Write-Host "Original signed artifact $signed"; exit 0 }
            Start-Sleep -Seconds 10
          }
          throw 'Original signed artifact never appeared'
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 44762298740
          name: joystick-android-signed
          path: ${{ runner.temp }}/signed-ember
      - name: Bind two original APKs to the desktop launcher test catalogue
        shell: pwsh
        run: |
          $gameDir = Join-Path $env:RUNNER_TEMP sample-files
          New-Item -ItemType Directory $gameDir -Force | Out-Null
          $ember = @(Get-ChildItem "$env:RUNNER_TEMP/signed-ember" -Recurse -File -Filter 'emberbrood-0.1.2.apk')
          if ($ember.Count -ne 1) { throw 'Expected exactly one signed Emberbrood 0.1.2' }
          Copy-Item $ember[0].FullName "$gameDir/emberbrood.apk"
          curl.exe --fail --location --retry 3 https://raw.githubusercontent.com/ecojust/pureTV/49a4b5083cf67caae4cb397a124dc854acf89c93/packages/ponpoko-kart/ponpoko-kart-0.1.6.apk --output "$gameDir/ponpoko-kart.apk"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install -r tools/pc-games/requirements.txt pyinstaller==6.16.0 playwright==1.62.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/pc-games/qa/play_windows.py --prepare
      - name: Build the normal x64 desktop executable
        working-directory: tools/pc-games
        run: python -m PyInstaller --clean --onefile --name pureTV-Games --add-data 'catalog.json:.' --add-data 'pc-bridge.js:.' --collect-all zeroconf --recursive-copy-metadata zeroconf launcher.py
      - name: Play the original race and adventure in Microsoft Edge
        run: python tools/pc-games/qa/play_windows.py --exe tools/pc-games/dist/pureTV-Games.exe
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-gameplay-samples
          path: ${{ runner.temp }}/sample-results/
  retain:
    needs: play
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-gameplay-samples
          path: ${{ runner.temp }}/receipts
      - name: Preserve the original Windows reports and screenshots
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$RUNNER_TEMP/receipts"
          test "$(find . -name '*.json' | wc -l)" -ge 1
          git init -q
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add .
          git commit -qm "Preserve original Windows x64 gameplay from $GITHUB_RUN_ID"
          gh auth setup-git
          git push "https://github.com/$GITHUB_REPOSITORY.git" "HEAD:refs/heads/build-assets/windows-gameplay-two-$GITHUB_RUN_ID"
