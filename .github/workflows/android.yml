name: Android build
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      stage_resources:
        description: Stage verified launcher/app APKs and bilingual native previews
        type: boolean
        default: false
      resource_scope:
        description: Games to browser-test and stage; all native apps are still built and checked
        type: choice
        default: all
        options:
          - all
          - used-car-racing
          - alien-shooter
permissions:
  contents: read
concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the gameplay artwork renderer
        run: python3 -m pip install Pillow==11.3.0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify release certificate and game publication policies
        run: |
          python -m unittest discover -s tools/tests -p 'test_release_certificates.py'
          python -m unittest discover -s tools/tests -p 'test_game_publication_policy.py'
      - name: Verify official login form autofill
        run: node --test resource/apps/hifini/src/test/js/login-autofill.test.mjs
      - name: Verify CCTV website player presentation
        run: node --test resource/apps/cctv/src/test/js/player-focus.test.mjs
      - name: Verify Tank TV game rules
        run: node --test joystick-games/tank/tests/game.test.cjs
      - name: Verify Jackal TV game rules
        run: |
          node joystick-games/jackal/tools/build-levels.cjs --check
          node --test joystick-games/jackal/tests/game.test.cjs joystick-games/jackal/tests/enemies.test.cjs joystick-games/jackal/tests/scenes.test.cjs
      - name: Verify classic puzzle game rules
        run: node --test joystick-games/jewel/tests/*.test.cjs joystick-games/tetris/tests/*.test.cjs
      - name: Verify Super Mario TV game rules
        run: node --test joystick-games/super-mario/tests/*.test.cjs
      - name: Verify Used Car Racing physics and track rules
        run: node --test joystick-games/used-car-racing/tests/*.test.cjs
      - name: Verify Alien Shooter rules and baked resources
        run: |
          node --test joystick-games/alien-shooter/tests/*.test.cjs
          node joystick-games/alien-shooter/tools/bake-materials.mjs --verify
      - name: Prepare verified Jackal preview artwork
        run: |
          python joystick-games/jackal/tools/extract-artwork.py --output "$RUNNER_TEMP/puretv-jackal-art"
          echo "JACKAL_ART_DIR=$RUNNER_TEMP/puretv-jackal-art" >> "$GITHUB_ENV"
      - name: Install game browser test tools
        timeout-minutes: 5
        working-directory: desktop
        run: npm ci --prefer-offline --no-audit --no-fund
      - name: Select game test browser
        timeout-minutes: 5
        working-directory: desktop
        run: |
          tank_chrome_path="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -n "$tank_chrome_path" ]; then
            echo "CHROMIUM_PATH=$tank_chrome_path" >> "$GITHUB_ENV"
          else
            npx playwright install --with-deps chromium
            node -e 'console.log("CHROMIUM_PATH="+require("playwright").chromium.executablePath())' >> "$GITHUB_ENV"
          fi
      - name: Build and test Neon Rush game content
        working-directory: joystick-games/neon-rush
        run: |
          npm ci --no-audit --no-fund
          npm install --prefix "$RUNNER_TEMP/neon-test-tools" --no-audit --no-fund --no-package-lock pngjs@7.0.0
          npm run build:check
          NODE_PATH="$RUNNER_TEMP/neon-test-tools/node_modules" npm test
      - name: Install Chinese font for game previews
        timeout-minutes: 3
        run: |
          if [ -z "$(fc-list :lang=zh)" ]; then
            package_path=pool/universe/f/fonts-wqy-zenhei/fonts-wqy-zenhei_0.9.45-8build1_all.deb
            package_sha=7b44a781b0560a49d5bcfe2e5cf9a6f90e4863a8ad12794113e962bab38f030b
            package="$RUNNER_TEMP/preview-font.deb"
            for mirror in https://archive.ubuntu.com/ubuntu https://mirrors.edge.kernel.org/ubuntu; do
              if curl -fsSL --connect-timeout 8 --max-time 45 "$mirror/$package_path" -o "$package" &&
                 echo "$package_sha  $package" | sha256sum --check; then
                dpkg-deb --extract "$package" "$RUNNER_TEMP/preview-font"
                fonts_dir="${XDG_DATA_HOME:-$HOME/.local/share}/fonts"
                install -Dm644 "$RUNNER_TEMP/preview-font/usr/share/fonts/truetype/wqy/wqy-zenhei.ttc" "$fonts_dir/wqy-zenhei.ttc"
                fc-cache -f "$fonts_dir"
                break
              fi
            done
          fi
          test -n "$(fc-list :lang=zh)"
      - name: Install local HTTPS browser trust tools
        timeout-minutes: 3
        run: |
          command -v openssl
          if ! command -v certutil >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends libnss3-tools
          fi
          command -v certutil
      - name: Verify Tank TV phone controls and capture actual game UI
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.resource_scope == 'all' }}
        env:
          TANK_UI_CAPTURE_DIR: ${{ runner.temp }}/puretv-tank-previews
        run: |
          node joystick-games/tank/tests/compatibility.mjs
          node joystick-games/tank/tests/controller.mjs
          node joystick-games/tank/tests/capture.mjs
      - name: Verify Jackal TV phone controls and capture actual game UI
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.resource_scope == 'all' }}
        env:
          JACKAL_UI_CAPTURE_DIR: ${{ runner.temp }}/puretv-jackal-previews
        run: |
          node joystick-games/jackal/tests/compatibility.mjs
          node joystick-games/jackal/tests/controller.mjs
          node joystick-games/jackal/tests/capture.mjs
      - name: Verify Magic Jewelry TV controls, compatibility and game UI
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.resource_scope == 'all' }}
        env:
          JEWEL_UI_CAPTURE_DIR: ${{ runner.temp }}/puretv-jewel-previews
        run: |
          node joystick-games/jewel/tests/compatibility.mjs
          node joystick-games/jewel/tests/controller.mjs
          node joystick-games/jewel/tests/capture.mjs
      - name: Verify Tetris TV controls, compatibility and game UI
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.resource_scope == 'all' }}
        env:
          TETRIS_UI_CAPTURE_DIR: ${{ runner.temp }}/puretv-tetris-previews
        run: |
          node joystick-games/tetris/tests/compatibility.mjs
          node joystick-games/tetris/tests/controller.mjs
          node joystick-games/tetris/tests/capture.mjs
      - name: Verify Super Mario TV controls, compatibility and game UI
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.resource_scope == 'all' }}
        env:
          SUPER_MARIO_UI_CAPTURE_DIR: ${{ runner.temp }}/puretv-super-mario-previews
        run: |
          node joystick-games/super-mario/tests/compatibility.mjs
          node joystick-games/super-mario/tests/controller.mjs
          node joystick-games/super-mario/tests/capture.mjs
      - name: Verify Used Car Racing controls, 3D runtime and bilingual previews
        env:
          USED_CAR_UI_CAPTURE_DIR: ${{ runner.temp }}/puretv-used-car-racing-previews
          GAME_RENDER_OUTPUT: ${{ runner.temp }}/puretv-used-car-rendering-checks
        run: |
          node joystick-games/used-car-racing/tests/compatibility.mjs
          node joystick-games/used-car-racing/tests/rendering.mjs
          node joystick-games/used-car-racing/tests/gallery.mjs
          node joystick-games/used-car-racing/tests/controller.mjs
          node joystick-games/used-car-racing/tests/secure-controller.mjs
          node joystick-games/used-car-racing/tests/integration.mjs
      - name: Verify Alien Shooter phone controls and actual game scenes
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.resource_scope == 'all' || inputs.resource_scope == 'alien-shooter' }}
        env:
          ALIEN_SHOOTER_UI_CAPTURE_DIR: ${{ runner.temp }}/puretv-alien-shooter-previews
        run: |
          node joystick-games/alien-shooter/tests/controller.mjs
          node joystick-games/alien-shooter/tests/performance.mjs --samples 6 --warmup 1 --regressions --output "$RUNNER_TEMP/puretv-alien-shooter-performance"
          node joystick-games/alien-shooter/tests/integration.mjs
          node joystick-games/alien-shooter/tests/runtime-performance.mjs
          node joystick-games/alien-shooter/tests/animation.mjs --output "$RUNNER_TEMP/puretv-alien-shooter-animation"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Install SDK
        run: sdkmanager "platforms;android-35" "build-tools;34.0.0"
      - name: Build the Neon Rush Android APK
        run: |
          python joystick-games/tools/android-zxing.py --output "$RUNNER_TEMP/zxing.jar" --receipt "$RUNNER_TEMP/zxing.json"
          python resource/game-kit/build.py --game joystick-games/neon-rush --output "$RUNNER_TEMP/neon-rush" --cache "$RUNNER_TEMP/neon-rush-cache" --zxing "$RUNNER_TEMP/zxing.jar"
      # Staged game builds stay unsigned; the game publication workflow owns signing.
      - name: Prepare release signing
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.stage_resources }}
        env:
          PURETV_KEYSTORE_BASE64: ${{ secrets.PURETV_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$PURETV_KEYSTORE_BASE64" ]; then
            python3 - <<'PYTHON'
          import base64, os
          from pathlib import Path
          key = Path(os.environ['RUNNER_TEMP']) / 'pureTV.jks'
          key.write_bytes(base64.b64decode(os.environ['PURETV_KEYSTORE_BASE64']))
          key.chmod(0o600)
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write(f'PURETV_KEYSTORE_PATH={key}\n')
          PYTHON
          fi
      - name: Build and lint
        env:
          # Robolectric downloads large Android runtime jars separately from Gradle.
          JAVA_TOOL_OPTIONS: -Drobolectric.dependency.repo.url=https://maven-central.storage-download.googleapis.com/maven2
          PURETV_KEYSTORE_PASSWORD: ${{ secrets.PURETV_KEYSTORE_PASSWORD }}
          CLEAN_UI_CAPTURE_DIR: ${{ runner.temp }}/puretv-tv-previews
          HIFINI_UI_CAPTURE_DIR: ${{ runner.temp }}/puretv-hifini-previews
          SHORTVIDEO_UI_CAPTURE_DIR: ${{ runner.temp }}/puretv-shortvideo-previews
          WEBTV_UI_CAPTURE_DIR: ${{ runner.temp }}/puretv-webtv-previews
          CCTV_UI_CAPTURE_DIR: ${{ runner.temp }}/puretv-cctv-previews
        working-directory: resource/launcher/puretv
        run: |
          set -o pipefail
          ./gradlew --no-daemon --continue "-PjackalArtworkDir=$JACKAL_ART_DIR" assembleDebug assembleRelease lintDebug testDebugUnitTest :hifini:verifyReleaseSize :hifini:lintDebug :hifini:testDebugUnitTest :shortvideo:verifyReleaseSize :shortvideo:lintDebug :shortvideo:testDebugUnitTest :webtv:verifyReleaseSize :webtv:lintDebug :webtv:testDebugUnitTest :cctv:verifyReleaseSize :cctv:lintDebug :cctv:testDebugUnitTest :tank:verifyReleaseSize :tank:lintDebug :tank:testDebugUnitTest :jackal:verifyReleaseSize :jackal:lintDebug :jackal:testDebugUnitTest :jewel:verifyReleaseSize :tetris:verifyReleaseSize :super-mario:verifyReleaseSize :used-car-racing:verifyReleaseSize :used-car-racing:lintDebug :used-car-racing:testDebugUnitTest :used-car-racing:assembleDebugAndroidTest :alien-shooter:verifyReleaseSize :alien-shooter:lintDebug :alien-shooter:testDebugUnitTest 2>&1 | tee "$RUNNER_TEMP/android-build.log"
      - name: Report Android build or test failures
        if: failure()
        run: |
          python - <<'PYTHON'
          import os, pathlib, xml.etree.ElementTree as ET
          messages=[]
          modules = [pathlib.Path('resource/launcher/puretv/app'), *pathlib.Path('resource/apps').iterdir(), *pathlib.Path('joystick-games').iterdir()]
          for report in (xml for module in modules for xml in module.glob('build/test-results/*/TEST-*.xml')):
              for case in ET.parse(report).getroot().iter('testcase'):
                  for failure in case.findall('failure'):
                      messages.append(case.attrib.get('name','test')+': '+(failure.text or '')[:3000])
          log=pathlib.Path(os.environ['RUNNER_TEMP'])/'android-build.log'
          if log.exists(): messages.append(log.read_text(errors='replace')[-3500:])
          for message in messages:
              print('::error::'+message.replace('%','%25').replace('\r','%0D').replace('\n','%0A'))
          PYTHON
      - name: Verify launcher identity and signing status
        env:
          PURETV_KEYSTORE_PASSWORD: ${{ secrets.PURETV_KEYSTORE_PASSWORD }}
        run: python tools/verify-release-apks.py
      - uses: actions/upload-artifact@v4
        with:
          name: pureTV-release-metadata
          path: resource/launcher/puretv/release-metadata.json
      - uses: actions/upload-artifact@v4
        with:
          name: pureTV-tv-previews
          path: ${{ runner.temp }}/puretv-tv-previews/*.png
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: pureTV-debug
          path: resource/launcher/puretv/app/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: pureTV-release
          path: resource/launcher/puretv/release-output/*.apk
      - uses: actions/upload-artifact@v4
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.resource_scope == 'all' }}
        with:
          name: hifini-tv-previews
          path: ${{ runner.temp }}/puretv-hifini-previews/*.png
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.resource_scope == 'all' }}
        with:
          name: shortvideo-tv-previews
          path: ${{ runner.temp }}/puretv-shortvideo-previews/*.png
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.resource_scope == 'all' }}
        with:
          name: webtv-previews
          path: ${{ runner.temp }}/puretv-webtv-previews/*.png
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.resource_scope == 'all' }}
        with:
          name: cctv-tv-previews
          path: ${{ runner.temp }}/puretv-cctv-previews/*.png
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.resource_scope == 'all' }}
        with:
          name: tank-tv-previews
          path: ${{ runner.temp }}/puretv-tank-previews/*.png
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.resource_scope == 'all' }}
        with:
          name: jackal-tv-previews
          path: ${{ runner.temp }}/puretv-jackal-previews/*.png
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.resource_scope == 'all' }}
        with:
          name: hifini-tv
          path: resource/apps/hifini/build/outputs/apk/**/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.resource_scope == 'all' }}
        with:
          name: shortvideo-tv
          path: resource/apps/shortvideo/build/outputs/apk/**/*.apk
      - uses: actions/upload-artifact@v4
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.resource_scope == 'all' }}
        with:
          name: webtv
          path: resource/apps/webtv/build/outputs/apk/**/*.apk
      - uses: actions/upload-artifact@v4
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.resource_scope == 'all' }}
        with:
          name: cctv-tv
          path: resource/apps/cctv/build/outputs/apk/**/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.resource_scope == 'all' }}
        with:
          name: tank-tv
          path: joystick-games/tank/build/outputs/apk/**/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.resource_scope == 'all' }}
        with:
          name: jackal-tv
          path: joystick-games/jackal/build/outputs/apk/**/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.resource_scope == 'all' }}
        with:
          name: jewel-tv-previews
          path: ${{ runner.temp }}/puretv-jewel-previews/*.png
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.resource_scope == 'all' }}
        with:
          name: jewel-tv
          path: joystick-games/jewel/build/outputs/apk/**/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.resource_scope == 'all' }}
        with:
          name: tetris-tv-previews
          path: ${{ runner.temp }}/puretv-tetris-previews/*.png
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.resource_scope == 'all' }}
        with:
          name: tetris-tv
          path: joystick-games/tetris/build/outputs/apk/**/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.resource_scope == 'all' }}
        with:
          name: super-mario-tv-previews
          path: ${{ runner.temp }}/puretv-super-mario-previews/*.png
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.resource_scope == 'all' }}
        with:
          name: super-mario-tv
          path: joystick-games/super-mario/build/outputs/apk/**/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: used-car-racing-tv-previews
          path: ${{ runner.temp }}/puretv-used-car-racing-previews/*.png
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: used-car-racing-tv
          path: joystick-games/used-car-racing/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.resource_scope == 'all' || inputs.resource_scope == 'alien-shooter' }}
        with:
          name: alien-shooter-tv-previews
          path: ${{ runner.temp }}/puretv-alien-shooter-previews/*.png
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: ${{ always() && (github.event_name != 'workflow_dispatch' || inputs.resource_scope == 'all' || inputs.resource_scope == 'alien-shooter') }}
        with:
          name: alien-shooter-rendering-performance
          path: ${{ runner.temp }}/puretv-alien-shooter-performance/
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: ${{ always() && (github.event_name != 'workflow_dispatch' || inputs.resource_scope == 'all' || inputs.resource_scope == 'alien-shooter') }}
        with:
          name: alien-shooter-character-motion
          path: ${{ runner.temp }}/puretv-alien-shooter-animation/
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.resource_scope == 'all' || inputs.resource_scope == 'alien-shooter' }}
        with:
          name: alien-shooter-tv
          path: joystick-games/alien-shooter/build/outputs/apk/**/*.apk
          if-no-files-found: error

  lan-tls-platform:
    name: Local HTTPS with Android ${{ matrix.api }} Keystore
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        api: [26, 35]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: used-car-racing-tv
          path: platform-apks
      - name: Enable Android emulator acceleration
        run: |
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm
      - name: Verify actual Android Keystore and trusted local TLS
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash tools/verify-used-car-lan-tls-platform.sh platform-apks
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: used-car-lan-tls-platform-${{ matrix.api }}
          path: ${{ runner.temp }}/usedcar-lan-tls-platform.log
          if-no-files-found: warn

  stage-resources:
    name: Stage verified launcher and app resource inputs
    needs: [build, lan-tls-platform]
    if: github.event_name == 'workflow_dispatch' && inputs.stage_resources
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: resource-artifacts
      - name: Stage APK, metadata and actual rendered TV previews
        env:
          RESOURCE_SCOPE: ${{ inputs.resource_scope || 'all' }}
        run: |
          python - <<'PYTHON'
          import hashlib,json,os,shutil
          from pathlib import Path
          root=Path('resource-artifacts');output=Path('release-staging');output.mkdir()
          scope=os.environ['RESOURCE_SCOPE'];assert scope in ('all','used-car-racing','alien-shooter'),scope
          metadata=json.loads((root/'pureTV-release-metadata/release-metadata.json').read_text());info=metadata['launcher']
          assert info['sourceSha']==os.environ['GITHUB_SHA']
          apk=root/'pureTV-release'/info['releaseName'];assert hashlib.file_digest(apk.open('rb'),'sha256').hexdigest()==info['sha256']
          shutil.copyfile(apk,output/info['releaseName']);shutil.copyfile(root/'pureTV-release-metadata/release-metadata.json',output/'release-metadata.json')
          apps=['hifini','shortvideo','webtv','cctv','tank','jackal','jewel','tetris','super-mario','used-car-racing','alien-shooter'] if scope=='all' else [scope]
          for app in apps:
              apks=list((root/({'hifini':'hifini-tv','shortvideo':'shortvideo-tv','webtv':'webtv','cctv':'cctv-tv','tank':'tank-tv','jackal':'jackal-tv','jewel':'jewel-tv','tetris':'tetris-tv','super-mario':'super-mario-tv','used-car-racing':'used-car-racing-tv','alien-shooter':'alien-shooter-tv'}[app])).rglob('*.apk'))
              apks=[p for p in apks if 'release' in p.name]
              assert len(apks)==1,apks
              shutil.copyfile(apks[0],output/(app+'.apk'))
          if scope=='all':
              for artifact,names in [('hifini-tv-previews',['hifini-tv.png','hifini-tv.en.png']),('shortvideo-tv-previews',['shortvideo-tv.png','shortvideo-tv.en.png']),('webtv-previews',['webtv-controls.png','webtv-controls.en.png']),('cctv-tv-previews',['cctv-live.png','cctv-live.en.png'])]:
                  for name in names:shutil.copyfile(root/artifact/name,output/name)
          games=['tank','jackal','jewel','tetris','super-mario','used-car-racing','alien-shooter'] if scope=='all' else [scope]
          for game in games:
