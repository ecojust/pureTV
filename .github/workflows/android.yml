name: Android build
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      stage_resources:
        description: Stage verified launcher/app APKs and bilingual native previews
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify official login form autofill
        run: node --test resource/apps/hifini/src/test/js/login-autofill.test.mjs
      - name: Verify CCTV website player presentation
        run: node --test resource/apps/cctv/src/test/js/player-focus.test.mjs
      - name: Verify Tank TV game rules
        run: node --test resource/apps/tank/tests/game.test.cjs
      - name: Install Tank TV browser test tools
        timeout-minutes: 5
        working-directory: desktop
        run: npm ci --prefer-offline --no-audit --no-fund
      - name: Select Tank TV test browser
        timeout-minutes: 5
        working-directory: desktop
        run: |
          tank_chrome_path="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -n "$tank_chrome_path" ]; then
            echo "CHROMIUM_PATH=$tank_chrome_path" >> "$GITHUB_ENV"
          else
            npx playwright install --with-deps chromium
          fi
      - name: Verify Tank TV phone controls and capture actual game UI
        env:
          TANK_UI_CAPTURE_DIR: ${{ runner.temp }}/puretv-tank-previews
        run: |
          node resource/apps/tank/tests/controller.mjs
          node resource/apps/tank/tests/capture.mjs
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Install SDK
        run: sdkmanager "platforms;android-35" "build-tools;34.0.0"
      - name: Prepare release signing
        env:
          PURETV_KEYSTORE_BASE64: ${{ secrets.PURETV_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$PURETV_KEYSTORE_BASE64" ]; then
            python3 - <<'PYTHON'
          import base64, os
          from pathlib import Path
          key = Path(os.environ['RUNNER_TEMP']) / 'pureTV.jks'
          key.write_bytes(base64.b64decode(os.environ['PURETV_KEYSTORE_BASE64']))
          key.chmod(0o600)
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write(f'PURETV_KEYSTORE_PATH={key}\n')
          PYTHON
          fi
      - name: Build and lint
        env:
          PURETV_KEYSTORE_PASSWORD: ${{ secrets.PURETV_KEYSTORE_PASSWORD }}
          CLEAN_UI_CAPTURE_DIR: ${{ runner.temp }}/puretv-tv-previews
          MUSIC_UI_CAPTURE_DIR: ${{ runner.temp }}/puretv-music-previews
          HIFINI_UI_CAPTURE_DIR: ${{ runner.temp }}/puretv-hifini-previews
          SHORTVIDEO_UI_CAPTURE_DIR: ${{ runner.temp }}/puretv-shortvideo-previews
          WEBTV_UI_CAPTURE_DIR: ${{ runner.temp }}/puretv-webtv-previews
          CCTV_UI_CAPTURE_DIR: ${{ runner.temp }}/puretv-cctv-previews
        working-directory: resource/launcher/puretv
        run: |
          set -o pipefail
          ./gradlew --no-daemon --continue assembleDebug assembleRelease lintDebug testDebugUnitTest :music:verifyReleaseSize :music:lintDebug :music:testDebugUnitTest :hifini:verifyReleaseSize :hifini:lintDebug :hifini:testDebugUnitTest :shortvideo:verifyReleaseSize :shortvideo:lintDebug :shortvideo:testDebugUnitTest :webtv:verifyReleaseSize :webtv:lintDebug :webtv:testDebugUnitTest :cctv:verifyReleaseSize :cctv:lintDebug :cctv:testDebugUnitTest :tank:verifyReleaseSize :tank:lintDebug :tank:testDebugUnitTest 2>&1 | tee "$RUNNER_TEMP/android-build.log"
      - name: Report Android build or test failures
        if: failure()
        run: |
          python - <<'PYTHON'
          import os, pathlib, xml.etree.ElementTree as ET
          messages=[]
          for report in pathlib.Path('resource').rglob('TEST-*.xml'):
              for case in ET.parse(report).getroot().iter('testcase'):
                  for failure in case.findall('failure'):
                      messages.append(case.attrib.get('name','test')+': '+(failure.text or '')[:3000])
          log=pathlib.Path(os.environ['RUNNER_TEMP'])/'android-build.log'
          if log.exists(): messages.append(log.read_text(errors='replace')[-3500:])
          for message in messages:
              print('::error::'+message.replace('%','%25').replace('\r','%0D').replace('\n','%0A'))
          PYTHON
      - name: Verify launcher identity and signing status
        env:
          PURETV_KEYSTORE_PASSWORD: ${{ secrets.PURETV_KEYSTORE_PASSWORD }}
        run: python tools/verify-release-apks.py
      - uses: actions/upload-artifact@v4
        with:
          name: pureTV-release-metadata
          path: resource/launcher/puretv/release-metadata.json
      - uses: actions/upload-artifact@v4
        with:
          name: pureTV-tv-previews
          path: ${{ runner.temp }}/puretv-tv-previews/*.png
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: pureTV-debug
          path: resource/launcher/puretv/app/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: pureTV-release
          path: resource/launcher/puretv/release-output/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: music-tv-previews
          path: ${{ runner.temp }}/puretv-music-previews/*.png
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: hifini-tv-previews
          path: ${{ runner.temp }}/puretv-hifini-previews/*.png
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: shortvideo-tv-previews
          path: ${{ runner.temp }}/puretv-shortvideo-previews/*.png
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: webtv-previews
          path: ${{ runner.temp }}/puretv-webtv-previews/*.png
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: cctv-tv-previews
          path: ${{ runner.temp }}/puretv-cctv-previews/*.png
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: tank-tv-previews
          path: ${{ runner.temp }}/puretv-tank-previews/*.png
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: music-tv
          path: resource/apps/music/build/outputs/apk/**/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: hifini-tv
          path: resource/apps/hifini/build/outputs/apk/**/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: shortvideo-tv
          path: resource/apps/shortvideo/build/outputs/apk/**/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: webtv
          path: resource/apps/webtv/build/outputs/apk/**/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: cctv-tv
          path: resource/apps/cctv/build/outputs/apk/**/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: tank-tv
          path: resource/apps/tank/build/outputs/apk/**/*.apk
          if-no-files-found: error

  stage-resources:
    name: Stage verified launcher and app resource inputs
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.stage_resources
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: resource-artifacts
      - name: Stage APK, metadata and actual rendered TV previews
        run: |
          python - <<'PYTHON'
          import hashlib,json,os,shutil
          from pathlib import Path
          root=Path('resource-artifacts');output=Path('release-staging');output.mkdir()
          metadata=json.loads((root/'pureTV-release-metadata/release-metadata.json').read_text());info=metadata['launcher']
          assert info['sourceSha']==os.environ['GITHUB_SHA']
          apk=root/'pureTV-release'/info['releaseName'];assert hashlib.file_digest(apk.open('rb'),'sha256').hexdigest()==info['sha256']
          shutil.copyfile(apk,output/info['releaseName']);shutil.copyfile(root/'pureTV-release-metadata/release-metadata.json',output/'release-metadata.json')
          for app in ['music','hifini','shortvideo','webtv','cctv','tank']:
              apks=list((root/({'music':'music-tv','hifini':'hifini-tv','shortvideo':'shortvideo-tv','webtv':'webtv','cctv':'cctv-tv','tank':'tank-tv'}[app])).rglob('*.apk'))
              apks=[p for p in apks if 'release' in p.name]
              assert len(apks)==1,apks
              shutil.copyfile(apks[0],output/(app+'.apk'))
          for artifact,names in [('music-tv-previews',['music-tv.png','music-tv.en.png']),('hifini-tv-previews',['hifini-tv.png','hifini-tv.en.png']),('shortvideo-tv-previews',['shortvideo-tv.png','shortvideo-tv.en.png']),('webtv-previews',['webtv-controls.png','webtv-controls.en.png']),('cctv-tv-previews',['cctv-live.png','cctv-live.en.png']),('tank-tv-previews',['tank-tv.png','tank-tv.en.png','tank-controller.png','tank-controller.en.png'])]:
              for name in names:shutil.copyfile(root/artifact/name,output/name)
          for name in ['home-render.png','apps-render.png','home-render.en.png','apps-render.en.png']:
              shutil.copyfile(root/'pureTV-tv-previews'/name,output/name)
          PYTHON
          git checkout -b "build-assets/resources-${GITHUB_RUN_ID}"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -f release-staging
          git commit -m "Stage verified launcher resource inputs"
          git push origin HEAD
