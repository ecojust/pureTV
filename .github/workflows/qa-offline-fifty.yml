name: Collect offline game acceptance
on:
  push:
    branches: [qa-offline-library-50]
permissions:
  actions: read
  contents: write
jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools/desktop-offline-qa
      - name: Preserve only the verified test receipts on this QA branch
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ecojust/pureTV
        run: |
          set -euo pipefail
          gh run download 46115580251 -p 'offline-shard-*' -D "$RUNNER_TEMP/results"
          out=tools/desktop-offline-qa/shard-receipts.json
          python - "$RUNNER_TEMP/results" "$out" <<'PY'
          import json, sys
          from pathlib import Path
          source, out = map(Path, sys.argv[1:])
          receipts = sorted(source.glob('offline-shard-*/shard-*.json'))
          assert len(receipts) == 5
          results, digests, browsers = [], set(), set()
          for path in receipts:
              data = json.loads(path.read_text())
              digests.add((path.parent / 'game-library.sha256').read_text().strip())
              browsers.add(data['browser'])
              results.extend(data['games'])
          assert len(results) == len({r['id'] for r in results}) == 50 and len(digests) == 1
          out.write_text(json.dumps({'run': 46115580251, 'libraryRun': 46115322667, 'librarySha256': digests.pop(),
              'browser': sorted(browsers), 'games': results}, ensure_ascii=False, indent=2)+'\n')
          PY
          git config user.name github-actions[bot]
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$out"
          git commit -m 'Preserve per-game offline validation receipts'
          git push origin HEAD:refs/heads/qa-offline-library-50
