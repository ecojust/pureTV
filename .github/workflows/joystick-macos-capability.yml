name: Intel WKWebView pixel and frozen puzzle diagnosis
on: workflow_dispatch
permissions:
  contents: read
  actions: read
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        label: [macos-15-intel, macos-26-intel]
    runs-on: ${{ matrix.label }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: qa/puzzle-intel-render
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ecojust/pureTV
          run-id: 44713386724
          artifact-ids: 14617933985
          merge-multiple: true
          path: packages/puzzle-01
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ecojust/pureTV
          run-id: 44714845423
          artifact-ids: 14618858589
          merge-multiple: true
          path: packages/puzzle-02
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ecojust/pureTV
          run-id: 44713647487
          artifact-ids: 14618822058
          merge-multiple: true
          path: packages/puzzle-03
      - name: Record default WK and actual unmodified signed-package pages
        run: python3 qa/puzzle-intel-render/run.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: original-puzzle-wk-probe-${{ matrix.label }}
          path: observations/
