name: Signed Android gameplay artwork updates
on:
  workflow_call:
    inputs:
      shards:
        description: JSON array of Android shard numbers for a selective retry
        required: false
        type: string
        default: '[0,1,2,3,4,5,6,7]'
      pilot:
        description: Verify three packages per selected shard without staging any release assets
        required: false
        type: boolean
        default: false
    secrets:
      PURETV_KEYSTORE_BASE64:
        required: true
      PURETV_KEYSTORE_PASSWORD:
        required: true

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(inputs.shards) }}
    env:
      SHARD: ${{ matrix.shard }}
      PYTHONUNBUFFERED: '1'
      PURETV_DISPOSABLE_EMULATOR: '1'
      ARTWORK_PILOT: ${{ inputs.pilot }}
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /tools/*.py
            /tools/*.json
            /tools/*.sha256
            /tools/android-icon-probe/
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;34.0.0
      - name: Locate an already verified and staged shard
        id: cached
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m pip install Pillow==11.3.0
          complete=false
          if [[ "$ARTWORK_PILOT" != true ]]; then
            complete=$(python tools/android_game_icons.py cached --shard "$SHARD" --shards 8)
          fi
          echo "complete=$complete" >> "$GITHUB_OUTPUT"
      - name: Install artwork and APK tooling
        if: steps.cached.outputs.complete == 'false'
        run: |
          curl --fail --silent --show-error --location --retry 4 https://github.com/iBotPeaches/Apktool/releases/download/v2.12.1/apktool_2.12.1.jar -o "$RUNNER_TEMP/apktool.jar"
          echo "66cf4524a4a45a7f56567d08b2c9b6ec237bcdd78cee69fd4a59c8a0243aeafa  $RUNNER_TEMP/apktool.jar" | sha256sum -c -
          bash tools/android-icon-probe/build.sh "$RUNNER_TEMP/probe"
      - name: Sign updates and compare their complete package contents
        if: steps.cached.outputs.complete == 'false'
        env:
          PURETV_KEYSTORE_BASE64: ${{ secrets.PURETV_KEYSTORE_BASE64 }}
          PURETV_KEYSTORE_PASSWORD: ${{ secrets.PURETV_KEYSTORE_PASSWORD }}
        run: |
          python tools/android_game_icons.py prepare --sample-size "${{ inputs.pilot && 3 || 0 }}" --shard "$SHARD" --shards 8 --apktool "$RUNNER_TEMP/apktool.jar" \
            --tools "$ANDROID_HOME/build-tools/34.0.0" --originals "$RUNNER_TEMP/originals" \
            --output "$RUNNER_TEMP/signed" --report "$RUNNER_TEMP/android-icons-$SHARD.json"
      - name: Enable KVM for Android TV
        if: steps.cached.outputs.complete == 'false'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Upgrade each installed game and render its actual launcher resources
        if: steps.cached.outputs.complete == 'false'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: android-tv
          arch: x86_64
          profile: tv_1080p
          emulator-options: -no-window -memory 3072 -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          disable-animations: false
          script: >-
            python tools/android_game_icons.py device --adb "$ANDROID_HOME/platform-tools/adb"
            --probe "$RUNNER_TEMP/probe/probe.apk" --originals "$RUNNER_TEMP/originals"
            --output "$RUNNER_TEMP/signed" --report "$RUNNER_TEMP/android-icons-$SHARD.json"
      - name: Stage only verified updates in the client artwork draft
        if: steps.cached.outputs.complete == 'false' && !inputs.pilot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python tools/android_game_icons.py upload --output "$RUNNER_TEMP/signed" --report "$RUNNER_TEMP/android-icons-$SHARD.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-icons-${{ matrix.shard }}
          path: ${{ runner.temp }}/android-icons-${{ matrix.shard }}.json
          if-no-files-found: ignore
