<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <meta name="theme-color" content="#0d0b14">
    <meta name="description" content="The Story Thief of Greymantle — a point-and-click fairy-tale adventure. The stories of Brackenford are vanishing, and the light is on in the Warlock's tower.">
    <title>The Story Thief of Greymantle</title>

    <style>/* The Story Thief of Greymantle — layout and storybook styling */

:root {
    --ink: #2a1a12;
    --ink-soft: #5a4232;
    --parch: #f4ecd8;
    --parch-dark: #e4d4b0;
    --gold: #f4c542;
    --night: #0d0b14;
    --night2: #1b1f3b;
    --line: #6b4226;
    --serif: Georgia, 'Palatino Linotype', 'Book Antiqua', Palatino, serif;
    --gw: 640px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
    width: 100%;
    height: 100%;
    background: radial-gradient(ellipse at 50% 30%, #1b1f3b 0%, #0d0b14 70%);
    color: var(--parch);
    font-family: var(--serif);
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
}

button { font-family: inherit; cursor: pointer; }
[hidden] { display: none !important; }

#back {
    position: fixed; top: 8px; left: 8px; z-index: 99999;
    font-family: Arial, Helvetica, sans-serif; font-size: 13px;
    color: #fff; background: rgba(0, 0, 0, 0.55);
    padding: 6px 12px; border-radius: 6px; text-decoration: none;
    border: 1px solid rgba(255, 255, 255, 0.25);
}
#back:hover { background: rgba(0, 0, 0, 0.8); }

/* ---------- stage ---------- */

#app {
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
}

#viewport {
    position: relative;
    width: 640px;
    height: 400px;
    background: #000;
    box-shadow: 0 0 0 2px #3a2418, 0 0 0 5px #6b4226, 0 10px 40px rgba(0, 0, 0, 0.7);
    touch-action: manipulation;
}

#screen {
    display: block;
    width: 100%;
    height: 100%;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    cursor: crosshair;
}

#hover {
    position: absolute;
    pointer-events: none;
    padding: 3px 9px;
    font-size: 14px;
    white-space: nowrap;
    color: var(--parch);
    background: rgba(13, 11, 20, 0.82);
    border: 1px solid rgba(244, 197, 66, 0.45);
    border-radius: 4px;
    text-shadow: 0 1px 0 #000;
}

#toasts {
    position: absolute;
    top: 8px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    pointer-events: none;
    z-index: 5;
}
.toast {
    padding: 4px 12px;
    font-size: 14px;
    background: rgba(13, 11, 20, 0.85);
    border: 1px solid rgba(244, 236, 216, 0.3);
    border-radius: 14px;
    white-space: nowrap;
    animation: toastIn 0.25s ease-out;
    transition: opacity 0.5s, transform 0.5s;
}
.toast b { color: var(--gold); font-weight: normal; }
.toast.pts { color: var(--gold); }
.toast.ink { font-style: italic; color: #a8c8e8; }
.toast.out { opacity: 0; transform: translateY(-6px); }
@keyframes toastIn { from { opacity: 0; transform: translateY(6px); } }

/* ---------- bar: verbs, satchel, system ---------- */

#bar {
    width: var(--gw);
    max-width: 100%;
    display: flex;
    align-items: stretch;
    gap: 8px;
    padding: 8px 6px 6px;
    background: linear-gradient(#3a2418, #2a1a12);
    border: 2px solid #6b4226;
    border-top: none;
    border-radius: 0 0 8px 8px;
}

#verbs { display: flex; gap: 4px; }

.verb {
    width: 52px;
    min-height: 50px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    background: #1c2029;
    color: var(--parch-dark);
    border: 2px solid #555c6a;
    border-radius: 6px;
    font-size: 11px;
    letter-spacing: 0.5px;
}
.verb canvas { width: 28px; height: 28px; image-rendering: pixelated; }
.verb:hover { border-color: var(--parch-dark); }
.verb.on { border-color: var(--gold); background: #2b3a67; color: #fff; box-shadow: 0 0 8px rgba(244, 197, 66, 0.35); }

#inv {
    flex: 1;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(40px, 1fr));
    gap: 4px;
    align-content: center;
    min-width: 0;
}

.slot {
    aspect-ratio: 1;
    min-height: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #1c2029;
    border: 2px solid #3a2418;
    border-radius: 5px;
    box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.6);
}
.slot canvas { width: 32px; height: 32px; image-rendering: pixelated; }
.slot:not(:disabled):hover { border-color: var(--parch-dark); }
.slot.on { border-color: var(--gold); background: #2b3a67; }
.slot:disabled { cursor: default; opacity: 0.55; }

#sys { display: flex; flex-direction: column; align-items: stretch; gap: 4px; min-width: 64px; }
#score {
    text-align: center;
    font-size: 13px;
    color: var(--gold);
    padding: 2px 4px;
    background: #1c2029;
    border-radius: 4px;
}
#score.bump { animation: bump 0.6s; }
@keyframes bump { 30% { transform: scale(1.25); color: #fff; } }
#sys > div + div, .sysbtn-row { display: flex; gap: 4px; }
.sysbtn {
    flex: 1;
    min-height: 34px;
    font-size: 18px;
    background: #1c2029;
    color: var(--parch);
    border: 2px solid #555c6a;
    border-radius: 6px;
    position: relative;
}
.sysbtn:hover { border-color: var(--parch-dark); }
#b-book[data-count]:not([data-count=""])::after {
    content: attr(data-count);
    position: absolute;
    top: -6px; right: -6px;
    min-width: 17px; height: 17px;
    padding: 0 3px;
    font-size: 11px; line-height: 17px;
    border-radius: 9px;
    background: #b8332f;
    color: #fff;
    font-family: Arial, sans-serif;
}

/* ---------- message box ---------- */

#msg {
    position: fixed;
    inset: 0;
    z-index: 50;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    padding: 16px 16px max(16px, 12vh);
    background: rgba(13, 11, 20, 0.25);
}

#msg-box {
    position: relative;
    width: min(600px, 100%);
    max-height: 70vh;
    overflow-y: auto;
    padding: 18px 22px 22px;
    color: var(--ink);
    background: var(--parch);
    background-image: radial-gradient(ellipse at 30% 20%, rgba(255, 255, 255, 0.5), transparent 60%),
        radial-gradient(ellipse at 80% 90%, rgba(160, 112, 60, 0.18), transparent 60%);
    border: 3px double #6b4226;
    border-radius: 4px;
    box-shadow: 0 8px 30px rgba(0, 0, 0, 0.6);
    font-size: 18px;
    line-height: 1.5;
    cursor: pointer;
    animation: msgIn 0.18s ease-out;
}
@keyframes msgIn { from { opacity: 0; transform: translateY(8px); } }

#msg.speech #msg-box { padding-top: 26px; }
#msg-who {
    position: absolute;
    top: -2px;
    left: 16px;
    transform: translateY(-50%);
    padding: 2px 12px;
    background: #2a1a12;
    border: 2px solid #6b4226;
    border-radius: 12px;
    font-size: 15px;
    font-variant: small-caps;
    letter-spacing: 1px;
}
#msg-box { overflow: visible; }
#msg-text p + p { margin-top: 0.6em; }
#msg-text em { color: #6e1f24; }

#msg-more {
    position: absolute;
    right: 12px;
    bottom: 4px;
    font-size: 12px;
    color: var(--ink-soft);
    animation: blink 1s infinite;
}
@keyframes blink { 50% { opacity: 0.2; } }

#msg-choices { display: flex; flex-direction: column; gap: 6px; }
#msg-text:not(:empty) + #msg-choices:not(:empty) { margin-top: 12px; }

.choice {
    display: flex;
    align-items: baseline;
    gap: 10px;
    text-align: left;
    padding: 8px 12px;
    font-size: 17px;
    line-height: 1.35;
    color: var(--ink);
    background: rgba(207, 161, 104, 0.18);
    border: 1px solid rgba(107, 66, 38, 0.4);
    border-radius: 4px;
}
.choice:hover, .choice:focus-visible { background: #2b3a67; color: var(--parch); outline: none; }
.choice .num { font-size: 13px; opacity: 0.6; min-width: 1em; }

/* ---------- the Book of Tales ---------- */

#book, #menu {
    position: fixed;
    inset: 0;
    z-index: 60;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    background: rgba(13, 11, 20, 0.7);
}

#book-sheet {
    width: min(620px, 100%);
    max-height: 90vh;
    display: flex;
    flex-direction: column;
    color: var(--ink);
    background: var(--parch);
    border: 10px solid #6e1f24;
    border-radius: 6px;
    box-shadow: inset 0 0 40px rgba(160, 112, 60, 0.35), 0 10px 40px rgba(0, 0, 0, 0.7);
}
#book-body { overflow-y: auto; padding: 26px 30px 10px; line-height: 1.6; font-size: 17px; }
#book-body h2 { text-align: center; font-variant: small-caps; letter-spacing: 2px; font-weight: normal; font-size: 26px; color: #6e1f24; }
.book-sub { text-align: center; font-style: italic; color: var(--ink-soft); margin: 4px 0 22px; font-size: 15px; }
.entry { margin-bottom: 1em; }
.entry p:first-child::first-letter {
    float: left;
    font-size: 2.9em;
    line-height: 0.9;
    padding: 4px 6px 0 0;
    color: #b8332f;
}
.entry::after { content: '❦'; display: block; text-align: center; color: #a0703c; margin-top: 0.6em; clear: both; }
.book-end { text-align: center; font-style: italic; color: var(--ink-soft); font-size: 14px; margin: 6px 0 12px; }
#book-close, #menu-sheet button, #pg-btns button, #title-btns button {
    margin: 10px auto 16px;
    padding: 9px 22px;
    font-size: 16px;
    color: var(--parch);
    background: #2b3a67;
    border: 2px solid var(--gold);
    border-radius: 5px;
}
#book-close:hover, #menu-sheet button:hover, #pg-btns button:hover, #title-btns button:hover,
#book-close:focus-visible, #menu-sheet button:focus-visible, #pg-btns button:focus-visible, #title-btns button:focus-visible {
    background: #3f5f9a;
    outline: none;
}

/* ---------- menu ---------- */

#menu-sheet {
    width: min(320px, 100%);
    display: flex;
    flex-direction: column;
    padding: 18px;
    background: #1b1f3b;
    border: 3px double var(--gold);
    border-radius: 6px;
}
#menu-sheet h2 { text-align: center; font-weight: normal; font-variant: small-caps; letter-spacing: 2px; margin-bottom: 8px; color: var(--gold); }
#menu-sheet button { margin: 4px 0; width: 100%; }

/* ---------- storybook pages ---------- */

.pages {
    position: fixed;
    inset: 0;
    /* Above the title (80) so How to Play shows from it; below #fade (90). */
    z-index: 85;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    overflow-y: auto;
    background: radial-gradient(ellipse at 50% 40%, #1b1f3b, #0d0b14 75%);
}
#pg-sheet {
    width: min(660px, 100%);
    margin: auto;
    padding: 24px 28px 8px;
    color: var(--ink);
    background: var(--parch);
    border: 3px double #6b4226;
    border-radius: 4px;
    box-shadow: 0 10px 50px rgba(0, 0, 0, 0.8);
    animation: pageIn 0.4s ease-out;
}
@keyframes pageIn { from { opacity: 0; transform: translateY(10px) rotate(-0.4deg); } }
#pg-title { text-align: center; font-weight: normal; font-variant: small-caps; letter-spacing: 2px; color: #6e1f24; font-size: 28px; margin-bottom: 12px; }
#pg-art { display: flex; justify-content: center; margin-bottom: 14px; }
.pg-canvas { width: 100%; max-width: 600px; height: auto; image-rendering: pixelated; border: 3px solid #3a2418; }
.death .pg-canvas { width: 192px; }
#pg-text { font-size: 18px; line-height: 1.6; }
#pg-text p + p { margin-top: 0.7em; }
#pg-text em { color: #6e1f24; }
#pg-btns { display: flex; flex-wrap: wrap; justify-content: center; gap: 0 10px; margin-top: 10px; }
.pages.death #pg-sheet { background: #e4d4b0; }
.pages.death #pg-title { color: #6e1f24; }
.pages.help #pg-text { font-size: 16px; }

/* ---------- title ---------- */

#title {
    position: fixed;
    inset: 0;
    z-index: 80;
    display: flex;
    align-items: flex-end;
    padding-bottom: 6vh;
    justify-content: center;
    background: var(--night);
}
#title-art { position: absolute; inset: 0; }
#title-art canvas { width: 100%; height: 100%; object-fit: cover; image-rendering: pixelated; }
#title-card {
    position: relative;
    text-align: center;
    padding: 20px 30px 16px;
    margin: 16px;
    background: rgba(13, 11, 20, 0.62);
    border: 3px double rgba(244, 197, 66, 0.7);
    border-radius: 6px;
    backdrop-filter: blur(1px);
}
#title-pre { font-style: italic; color: #a8c8e8; letter-spacing: 1px; }
#title-card h1 {
    font-weight: normal;
    font-variant: small-caps;
    font-size: clamp(34px, 7vw, 58px);
    line-height: 1;
    letter-spacing: 2px;
    color: var(--gold);
    text-shadow: 0 2px 0 #6e1f24, 0 0 24px rgba(244, 197, 66, 0.35);
    margin: 8px 0 14px;
}
#title-card h1 small { font-size: 0.55em; color: var(--parch); text-shadow: 0 2px 0 #000; }
#title-btns { display: flex; flex-direction: column; align-items: center; }
#title-btns button { margin: 4px 0; min-width: 230px; }
#t-endings { margin-top: 6px; font-size: 14px; color: #a8c8e8; font-style: italic; min-height: 1em; }

#fade {
    position: fixed;
    inset: 0;
    z-index: 90;
    pointer-events: none;
    background: var(--night);
    opacity: 1;
}

/* ---------- small screens ---------- */

@media (max-width: 700px) {
    #app { justify-content: flex-start; padding-top: 48px; }
    #bar { flex-wrap: wrap; gap: 6px; }
    #verbs { order: 1; }
    #sys { order: 2; flex-direction: row; align-items: center; margin-left: auto; }
    #score { font-size: 12px; }
    .sysbtn { min-width: 44px; min-height: 44px; }
    #inv { order: 3; flex-basis: 100%; grid-template-columns: repeat(8, 1fr); }
    .slot { min-height: 34px; }
    .slot canvas { width: 26px; height: 26px; }
    .verb { width: 48px; min-height: 46px; }
    #msg { padding-bottom: 16px; }
    #msg-box { font-size: 16px; padding: 16px 16px 20px; }
    .choice { font-size: 15px; }
    #pg-sheet { padding: 18px 16px 6px; }
    #pg-text { font-size: 16px; }
    #book-body { padding: 20px 18px 8px; font-size: 16px; }
}

/* ---------- phones on their side: the bar goes beside the scene ---------- */

#app.side {
    flex-direction: row;
    justify-content: center;
    align-items: center;
    gap: 6px;
    padding: 4px;
}
#app.side #bar {
    width: 188px;
    max-width: none;
    max-height: calc(100vh - 8px);
    overflow-y: auto;
    flex-direction: column;
    flex-wrap: nowrap;
    gap: 6px;
    padding: 6px;
    border: 2px solid #6b4226;
    border-radius: 8px;
}
#app.side #verbs { order: 0; display: grid; grid-template-columns: 1fr 1fr; }
#app.side .verb { width: auto; min-height: 44px; flex-direction: row; gap: 6px; }
#app.side .verb canvas { width: 22px; height: 22px; }
#app.side #inv { order: 1; flex: none; grid-template-columns: repeat(4, 1fr); }
#app.side .slot { min-height: 38px; }
#app.side .slot canvas { width: 26px; height: 26px; }
#app.side #sys { order: 2; flex-direction: row; align-items: center; margin: 0; }
#app.side #score { flex: 1; }
#app.side .sysbtn { min-width: 44px; min-height: 40px; flex: none; }
#app.side ~ #msg { padding-bottom: 8px; }
#tv-guide {position:fixed;bottom:0;left:0;right:0;background:#171321;color:#f5dcad;font:13px/24px system-ui;text-align:center;z-index:40;pointer-events:none}
#tv-pause:not([hidden]) {position:fixed;inset:0;background:#171321bf;color:#f7dca4;display:grid;place-items:center;z-index:220}
#tv-pause section {text-align:center;background:#302639;border:2px solid #b39a72;padding:1rem 3rem}
#tv-pause p {font:700 26px Georgia,serif}
#tv-pause button {font-size:18px;padding:8px 16px}
#puretv-controller-panel {top:6px!important;right:6px!important}
#hover.tv-target {background:#241b2b;border:1px solid #f2cd76;max-width:90%;white-space:normal}
#bar button.tv-selected {outline:3px solid #f6ce6f;outline-offset:1px}
#app {height:calc(100% - 24px)}

/* A fixed gutter keeps the real controller identity and instructions off the playfield. */
:root { --tv-gutter: 216px; }
#puretv-controller-panel { z-index: 200 !important; }
.screen { right: var(--tv-gutter) !important; padding-top: 16px !important; }
#hud { right: calc(var(--tv-gutter) + 12px) !important; }
#btn-pause, #b-pause { right: calc(var(--tv-gutter) + 12px) !important; }
#back, #back-link { display: none !important; }
#tv-controls { position: fixed; z-index: 20; right: 12px; bottom: 16px; width: 192px;
  color: #c5d6e7; font: 14px/1.65 system-ui, sans-serif; white-space: pre-line; }
#tv-controls strong { display: block; color: #fff; font-size: 17px; margin-bottom: 8px; }
button:focus, select:focus, input:focus { outline: 3px solid #f6c65d !important; outline-offset: 2px; }
.sheet { max-height: calc(100vh - 32px); }
@media (max-height: 560px) {
  .sheet { padding: 12px; }
  .logo { font-size: 42px; }
  .menu { gap: 7px; }
  .btn { min-height: 38px; padding: 7px 14px; }
  #tv-controls { font-size: 12px; }
}
</style>
</head>
<body>
    <div id="tv-pause" role="dialog" aria-label="Paused" hidden><section><p>Paused</p><button id="tv-resume">Resume · START</button></section></div>
    <aside id="tv-guide">← → Targets · ↑ ↓ Verbs · A Interact · B Satchel · X Book · Y Menu · START Pause</aside>

    <div id="app">
        <div id="viewport">
            <canvas id="screen" aria-label="The adventure scene. Click to walk, look, use or talk."></canvas>
            <div id="hover" hidden></div>
            <div id="toasts" aria-live="polite"></div>
        </div>
        <div id="bar">
            <div id="verbs" role="toolbar" aria-label="Verbs">
                <button id="v-walk" class="verb" title="Walk (1)"><span>Walk</span></button>
                <button id="v-look" class="verb" title="Look (2)"><span>Look</span></button>
                <button id="v-use" class="verb" title="Use (3)"><span>Use</span></button>
                <button id="v-talk" class="verb" title="Talk (4)"><span>Talk</span></button>
            </div>
            <div id="inv" aria-label="Satchel"></div>
            <div id="sys">
                <div id="score" title="Score">0</div>
                <button id="b-book" class="sysbtn" title="The Book of Tales (B)" aria-label="The Book of Tales">📖</button>
                <button id="b-menu" class="sysbtn" title="Menu (Esc)" aria-label="Menu">☰</button>
            </div>
        </div>
    </div>

    <!-- narration / dialogue -->
    <div id="msg" hidden>
        <div id="msg-box" role="dialog" aria-live="polite">
            <div id="msg-who"></div>
            <div id="msg-text"></div>
            <div id="msg-choices"></div>
            <div id="msg-more" aria-hidden="true">▼</div>
        </div>
    </div>

    <!-- the Book of Tales -->
    <div id="book" hidden>
        <div id="book-sheet" role="dialog" aria-modal="true" aria-label="The Book of Tales">
            <div id="book-body"></div>
            <button id="book-close">Close the Book</button>
        </div>
    </div>

    <!-- menu -->
    <div id="menu" hidden>
        <div id="menu-sheet" role="dialog" aria-modal="true" aria-label="Menu">
            <h2>Menu</h2>
            <button data-act="save">Save your tale</button>
            <button data-act="load">Restore saved tale</button>
            <button data-act="help">How to play</button>
            <button data-act="sound" id="m-sound">Sound: On</button>
            <button data-act="speed" id="m-speed">Text: Normal</button>
            <button data-act="restart">Begin a new tale</button>
            <button data-act="title">Back to the title</button>
            <button data-act="close">Return to the story</button>
        </div>
    </div>

    <!-- storybook pages: prologue, death, endings, help -->
    <div id="pages" class="pages" hidden>
        <div id="pg-sheet">
            <h1 id="pg-title"></h1>
            <div id="pg-art"></div>
            <div id="pg-text"></div>
            <div id="pg-btns"></div>
        </div>
    </div>

    <!-- title -->
    <div id="title" hidden>
        <div id="title-art"></div>
        <div id="title-card">
            <div id="title-pre">A Tale of the Longest Night</div>
            <h1>The Story Thief<br><small>of Greymantle</small></h1>
            <div id="title-btns">
                <button id="t-new">Begin a New Tale</button>
                <button id="t-continue" hidden>Continue your Tale</button>
                <button id="t-howto">How to Play</button>
            </div>
            <div id="t-endings"></div>
        </div>
