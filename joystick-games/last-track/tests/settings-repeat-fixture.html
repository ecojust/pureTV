<!doctype html><meta charset="utf-8"><link rel="stylesheet" href="../dist/styles.css"><div id="ui-root"></div>

import {createInput} from '../dist/src/ui/input.js';
import {createSettingsSheet} from '../dist/src/ui/screens/settingsSheet.js';

window.PureGameHost={snapshot:()=>JSON.stringify({players:[{id:1,connected:true,transport:'wifi',controllerId:'Settings-Unit',session:'1',buttons:raw.buttons}]}),getInfo:()=>JSON.stringify({})};
