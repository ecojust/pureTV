<!doctype html><meta charset="utf-8"><title>Last Track adapter unit fixture (no game renderer)</title><style>.hidden{display:none}</style><div id="ui-root"></div>
<script type="module">
import {createPureTv} from '../dist/src/puretv.js';
import {createInput} from '../dist/src/ui/input.js';
const result={scope:'Adapter-only unit fixture, no game simulation/renderer loaded; not gameplay or native-platform acceptance',checks:[],errors:[]};
const state={buttons:{},online:true,calls:0};
window.PureGameHost={snapshot:()=>{state.calls++;return JSON.stringify({players:[{id:1,connected:state.online,transport:'wifi',controllerId:'Unit-Only',session:'1',cancelSeq:0,buttons:state.buttons}]})},getInfo:()=>JSON.stringify({wifiController:{port:63485}})};
const game={flow:{state:'race'},save:{cash:0},bus:{on(){}},getSnapshot:()=>null,host:null,pbr:null,audio:null};
game.input=createInput({isRaceActive:()=>game.flow.state==='race'});
game.pause=()=>{game.input.clear();game.flow.state='paused'};
game.resume=()=>{game.input.clear();game.flow.state='race'};
try{
 const adapter=createPureTv(game,document.getElementById('ui-root'));let t=0;
 const frame=()=>adapter.frame(t+=16);const check=(name,pass)=>{result.checks.push({name,pass});if(!pass)throw Error(name)};
 frame();state.buttons={START:true};frame();check('START enters pause',game.flow.state==='paused');for(let i=0;i<55;i++)frame();check('held START does not resume itself',game.flow.state==='paused');state.buttons={};frame();state.buttons={START:true};frame();for(let i=0;i<55;i++)frame();check('resume then hold START >800ms stays running',game.flow.state==='race');
 state.buttons={};frame();window.PureGame.focus(false);frame();check('focus loss pauses',game.flow.state==='paused');window.PureGame.focus(false);frame();state.buttons={START:true};frame();for(let i=0;i<55;i++)frame();check('second focus loss while already paused does not re-pause explicit resume',game.flow.state==='race');
 state.buttons={};frame();state.buttons={UP:true,RIGHT:true,A:true,B:true,X:true,Y:true};frame();const p=game.input.read();check('six simultaneous independent driving/actions',p.throttle===1&&p.steer===1&&p.fire&&p.handbrake&&p.cycleWeapon&&p.nitro);
 state.online=false;frame();const cancelled=game.input.read();check('disconnect pauses and clears held/pending actions',game.flow.state==='paused'&&cancelled.throttle===0&&cancelled.steer===0&&!cancelled.fire&&!cancelled.handbrake&&!cancelled.cycleWeapon&&!cancelled.nitro);
 state.online=true;state.buttons={START:true,A:true,Y:true};for(let i=0;i<55;i++)frame();check('held reconnect cannot resume or fire',game.flow.state==='paused'&&!game.input.read().fire);
 state.buttons={};frame();state.buttons={START:true};frame();for(let i=0;i<55;i++)frame();check('fresh START after reconnect resumes once',game.flow.state==='race');
 // Keep both wizard pages in the DOM as the original race settings screen does.
 state.buttons={};game.flow.state='raceSettings';frame();const root=document.getElementById('ui-root');root.innerHTML='<section class="screen"><div id="one"><button class="btn-back" id="leave">LEAVE</button><button class="btn-primary" id="next">NEXT: SETUP</button></div><div id="two" class="hidden"><button class="btn-back" id="previous">BACK</button><button class="btn-primary" id="start">START RACE</button></div></section>';
 let started=0,left=0;const one=document.getElementById('one'),two=document.getElementById('two');document.getElementById('next').onclick=()=>{one.classList.add('hidden');two.classList.remove('hidden')};document.getElementById('start').onclick=()=>started++;document.getElementById('leave').onclick=()=>left++;document.getElementById('previous').onclick=()=>{one.classList.remove('hidden');two.classList.add('hidden')};document.getElementById('next').focus();state.buttons={A:true};frame();state.buttons={};frame();check('wizard advances focus from hidden NEXT to visible START',document.activeElement.id==='start');state.buttons={A:true};frame();state.buttons={};frame();check('next controller A activates visible START exactly once',started===1);state.buttons={B:true};frame();state.buttons={};frame();check('B on second wizard page uses visible BACK instead of hidden LEAVE',left===0&&!one.classList.contains('hidden')&&two.classList.contains('hidden'));
 check('native snapshot consumed once per adapter frame',state.calls===window.JoystickGameQA.snapshot().controller.pollCount);
 adapter.destroy();game.input.dispose();result.passed=true;
}catch(e){result.errors.push(String(e));result.passed=false}
window.fixtureResult=result;
</script>
