name: Joystick games macOS
on:
  push:
    branches: [build/joystick-games-macos, build/joystick-games-macos-ci]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        game: [cf-transport-ship, qq-speed]
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            joystick-games
            puretv-joystick
            .github/workflows
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reproduce committed web assets and run game/bridge regressions
        env:
          GAME: ${{ matrix.game }}
        run: |
          set -euo pipefail
          cd "joystick-games/$GAME"
          npm ci --no-audit --no-fund
          npm test
          npm run build:check
          cd ../..
          node --test joystick-games/shared/macos/tests/web-bridge.test.mjs
          python3 joystick-games/shared/macos/tests/build-source.test.py
          python3 joystick-games/shared/macos/tests/native-observation.test.py
          xcrun swiftc -swift-version 5 joystick-games/shared/macos/Sources/ControllerServer.swift joystick-games/shared/macos/tests/ControllerServerTests.swift -o "$RUNNER_TEMP/controller-tests"
          "$RUNNER_TEMP/controller-tests" | tee "$RUNNER_TEMP/controller-tests.txt"
      - name: Build universal signed app, ZIP and DMG
        env:
          GAME: ${{ matrix.game }}
        run: |
          set -euo pipefail
          python3 joystick-games/tools/macos-build.py --game "$GAME" --output "$RUNNER_TEMP/package"
          cp "$RUNNER_TEMP/controller-tests.txt" "$RUNNER_TEMP/package/controller-tests.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: joystick-macos-package-${{ matrix.game }}
          path: |
            ${{ runner.temp }}/package/*-macos-universal.zip
            ${{ runner.temp }}/package/*-macos-universal.dmg
            ${{ runner.temp }}/package/SHA256SUMS.txt
            ${{ runner.temp }}/package/build-manifest.json
            ${{ runner.temp }}/package/controller-tests.txt
          if-no-files-found: error
          retention-days: 14
  verify:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        game: [cf-transport-ship, qq-speed]
        runner: [macos-latest, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    env:
      GAME: ${{ matrix.game }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            joystick-games
            puretv-joystick
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: joystick-macos-package-${{ matrix.game }}
          path: ${{ runner.temp }}/package
      - name: Verify and install identical ZIP and DMG package
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/qa"
          python3 joystick-games/tools/macos-packages.py --directory "$RUNNER_TEMP/package" --output "$RUNNER_TEMP/qa/package-verification.json" 2>&1 | tee "$RUNNER_TEMP/qa/package-verification.log"
      - name: Verify actual native app through the official SDK
        env:
          RUNNER_KIND: ${{ matrix.runner }}
        run: |
          set -euo pipefail
          if [ "$GAME" = cf-transport-ship ]; then APP='CF Transport Ship.app'; else APP='QQ Speed.app'; fi
          OPTIONS=()
          if [ "$RUNNER_KIND" = macos-15-intel ]; then OPTIONS+=(--allow-unavailable-webgl); fi
          python3 joystick-games/tools/macos-verify.py --game "$GAME" --app "$RUNNER_TEMP/package/installed/$APP" --output "$RUNNER_TEMP/qa/native" "${OPTIONS[@]}"
      - name: Verify stable initial fallback while port 63485 is occupied
        if: matrix.runner == 'macos-latest'
        run: |
          set -euo pipefail
          if [ "$GAME" = cf-transport-ship ]; then APP='CF Transport Ship.app'; else APP='QQ Speed.app'; fi
          python3 joystick-games/tools/macos-verify.py --game "$GAME" --app "$RUNNER_TEMP/package/installed/$APP" --output "$RUNNER_TEMP/qa/occupied-port" --occupy-default-port
      - name: Run Intel executable under Rosetta with graphics
        if: matrix.runner == 'macos-latest'
        run: |
          set -euo pipefail
          if [ "$GAME" = cf-transport-ship ]; then APP='CF Transport Ship.app'; else APP='QQ Speed.app'; fi
          if ! /usr/bin/arch -x86_64 /usr/bin/true; then sudo /usr/sbin/softwareupdate --install-rosetta --agree-to-license; fi
          python3 joystick-games/tools/macos-verify.py --game "$GAME" --app "$RUNNER_TEMP/package/installed/$APP" --output "$RUNNER_TEMP/qa/rosetta" --launch-architecture x86_64
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: joystick-macos-qa-${{ matrix.game }}-${{ matrix.runner }}
          path: ${{ runner.temp }}/qa/
          if-no-files-found: warn
          retention-days: 14
  export:
    if: always()
    needs: [build, verify]
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: joystick-macos-qa-*
          path: ${{ runner.temp }}/export/evidence
      - uses: actions/download-artifact@v4
        if: needs.build.result == 'success' && needs.verify.result == 'success'
        with:
          pattern: joystick-macos-package-*
          path: ${{ runner.temp }}/export/packages
      - name: Preserve immutable packages and all original evidence in isolated branch
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RESULT: ${{ needs.build.result }}
          VERIFY_RESULT: ${{ needs.verify.result }}
        run: |
          python3 - <<'PY'
          import datetime,hashlib,json,os,re,subprocess
          from pathlib import Path
          out=Path(os.environ['RUNNER_TEMP'])/'export';out.mkdir(exist_ok=True)
          source=os.environ['GITHUB_SHA'];run=os.environ['GITHUB_RUN_ID'];attempt=os.environ['GITHUB_RUN_ATTEMPT'];repo=os.environ['GITHUB_REPOSITORY']
          assert re.fullmatch('[a-f0-9]{40}',source) and run.isdigit() and attempt.isdigit()
          success=os.environ['BUILD_RESULT']==os.environ['VERIFY_RESULT']=='success'
          if success:
            for game in ['cf-transport-ship','qq-speed']:
              packages=out/'packages'/('joystick-macos-package-'+game);m=json.loads((packages/'build-manifest.json').read_text());assert m['sourceCommit']==source and m['game']==game
              for name,item in m['packages'].items():
                p=packages/name;assert p.stat().st_size==item['bytes'] and hashlib.sha256(p.read_bytes()).hexdigest()==item['sha256']
              for platform in ['macos-latest','macos-15-intel']:
                evidence=out/'evidence'/('joystick-macos-qa-'+game+'-'+platform)
                assert json.loads((evidence/'package-verification.json').read_text())['status']=='passed'
                native=json.loads((evidence/'native/report.json').read_text())
                assert native['status']=='passed' or (platform=='macos-15-intel' and native['status']=='limited_graphics' and not native['webglAvailable'])
                if platform=='macos-latest':
                  for mode in ['occupied-port','rosetta']:assert json.loads((evidence/mode/'report.json').read_text())['status']=='passed'
          else:assert not (out/'packages').exists(),'Never export packages as validated after failed runtime checks'
          files={}
          for p in sorted(out.rglob('*')):
            if p.is_file():
              assert not p.is_symlink() and p.stat().st_size<50000000
              files[p.relative_to(out).as_posix()]={'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()}
          assert sum(v['bytes'] for v in files.values())<150000000
          branch=f'build-assets/joystick-games-macos-{run}-attempt-{attempt}'
          (out/'export-manifest.json').write_text(json.dumps({'sourceCommit':source,'runId':int(run),'runAttempt':int(attempt),'exportBranch':branch,'buildResult':os.environ['BUILD_RESULT'],'verifyResult':os.environ['VERIFY_RESULT'],'installPackagesValidated':success,'files':files},indent=2)+'\n')
          def git(*args):subprocess.run(['git','-C',str(out),*args],check=True)
          git('init','-b','export');git('config','user.name','github-actions[bot]');git('config','user.email','41898282+github-actions[bot]@users.noreply.github.com');git('add','.');git('commit','-m',f'Export joystick games macOS {run} [skip ci]')
          subprocess.run(['gh','auth','setup-git'],check=True);git('remote','add','origin','https://github.com/'+repo+'.git');git('push','origin','HEAD:refs/heads/'+branch)
          PY
