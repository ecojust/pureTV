<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>光刃魔塔 · Saber Magic Tower</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden}
body{color:#eae8de;background:radial-gradient(ellipse at 32% 48%,#293340 0%,#161e2a 45%,#0e1420 84%);font:clamp(13px,1.5vw,18px)/1.5 system-ui,sans-serif;--edge:clamp(16px,3vw,50px)}
header{height:15vh;min-height:58px;padding:0 var(--edge);display:flex;align-items:center;gap:.9em;border-bottom:1px solid #aeb7bd25}
.sigil{font:3.1em/1 Georgia,serif;color:#edc798;text-shadow:0 0 16px #f0d4a455}small{display:block;letter-spacing:.15em;color:#bfac91;font-size:.7em;font-weight:650}
h1,h2,p{margin:0}h1,h2{font-family:Georgia,'Songti SC','Noto Serif CJK SC',serif;letter-spacing:.06em}
h1{font-size:1.35em}.floor{display:flex;gap:.5em;align-items:baseline;margin-left:auto}.floor strong{font:2.6em/1 Georgia,serif;color:#f1d6ab}.floor span{font-size:.84em;color:#aba69b}
main{height:85vh;display:grid;grid-template-columns:minmax(0,1fr) clamp(190px,24vw,350px)}
.stage{position:relative;overflow:hidden}.stage canvas{width:100%;height:calc(100% - 42px);display:block}
#notice{position:absolute;left:var(--edge);right:1em;bottom:3vh;color:#d7dccf;font-size:.85em;line-height:1.35;border-left:2px solid #d6b57e;padding-left:.7em}
.ledger{border-left:1px solid #aeb7bd24;padding:clamp(10px,3vh,30px) clamp(14px,2.4vw,40px);background:#10172288;overflow:auto}
.ledger h2{font-size:1.4em;margin:0 0 .6em}.stats{display:grid;grid-template-columns:1fr 1fr;gap:.35em 1em;border-block:1px solid #a9a38e34;padding:.6em 0}
.stats div{color:#a9b7c4;font-size:.8em;display:flex;justify-content:space-between;align-items:center}.stats strong{font-size:1.3em;color:#eff2e9;font-variant-numeric:tabular-nums}
#keys{display:flex;gap:1em;margin:.8em 0 1.3em}#keys i{font-style:normal;color:var(--key);font-size:.86em}
#activity{font-size:.83em;color:#b9c8d1}#activity b{display:block;color:#e4d6bd;margin-bottom:.4em}#activity progress{width:100%;height:8px;accent-color:#ed986a}
#overlay{position:fixed;inset:0;z-index:15;background:linear-gradient(90deg,#0b111cf7,#111927d9 43%,#0b142344);display:flex;align-items:center;padding:3vh calc(211px + 2vw) 3vh var(--edge)}

.card h2{font-size:clamp(24px,3.3vw,50px);line-height:1.25;margin:.22em 0}.card p{white-space:pre-line;color:#bec9ca;margin:.7em 0 1.1em;font-size:.87em;line-height:1.6}.card button{display:block;text-align:left;width:100%;background:#111a26;color:#c9d2d2;border:1px solid #8896a244;border-left-width:3px;border-radius:2px;font:inherit;font-size:.9em;padding:.43em .8em;margin:.3em 0;cursor:pointer}
.card button:focus{outline:0;border-color:#d5b384;color:#fff1d8;background:#3e3935}
#puretv-controller-panel[data-playing=true]{top:auto!important;bottom:6px;font-size:11px}
@media(max-height:520px){.ledger{padding-block:10px}#keys{margin:.4em 0 .6em}.card{padding:11px 18px}}
