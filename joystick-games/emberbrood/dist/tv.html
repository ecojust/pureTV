<link rel="icon" href="data:,"><style>/* ============================================================
   base.css - the shell, the palette, and the 8-bit type rules (GDD 13)
   Mobile-first: one column, thumb-reachable actions, no hover required.
   ============================================================ */
:root {
  --ink:        #f0e3d2;
  --ink-dim:    #b3a394;
  --ink-faint:  #7d7065;
  --bg:         #16110f;
  --bg-2:       #1f1815;
  --panel:      #261d19;
  --panel-2:    #2f2420;
  --line:       #40312a;
  --ember:      #ff8a3d;
  --ember-dark: #b3542a;
  --gold:       #f2c94c;
  --good:       #7fc96a;
  --bad:        #e05a4a;
  --cool:       #58a9d6;
  --violet:     #9d7fd0;

  --radius: 6px;
  --tap: 44px;
  --gutter: 14px;
  --maxw: 720px;

  --font: ui-monospace, "SF Mono", "Cascadia Mono", "Roboto Mono", Menlo, Consolas, "Courier New", monospace;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

/* `display: flex` on a panel beats the hidden attribute's `display: none`,
   which leaves an invisible full-screen overlay eating every tap. */
[hidden] { display: none !important; }

html, body {
  margin: 0; padding: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  font-size: 15px;
  line-height: 1.45;
  overscroll-behavior: none;
}

body {
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  /* A faint scanline wash: 8-bit without making anything unreadable. */
  background-image: repeating-linear-gradient(
    to bottom, rgba(255,255,255,0.016) 0 1px, transparent 1px 3px);
}

canvas { image-rendering: pixelated; image-rendering: crisp-edges; }

#app {
  width: 100%;
  max-width: var(--maxw);
  margin: 0 auto;
  flex: 1;
  display: flex;
  flex-direction: column;
  min-height: 0;
}

/* ---- top bar ---- */
#topbar {
  display: flex; gap: 6px; align-items: center;
  padding: calc(env(safe-area-inset-top, 0px) + 6px) var(--gutter) 6px;
  background: linear-gradient(180deg, var(--bg-2), var(--bg));
  border-bottom: 2px solid var(--line);
  position: sticky; top: 0; z-index: 30;
}
#topbar .chip:first-child { flex: 1; text-align: left; min-width: 0; }
#place { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: block; }

.chip {
  font: inherit; font-size: 12px;
  color: var(--ink); background: var(--panel);
  border: 1px solid var(--line); border-radius: var(--radius);
  padding: 6px 9px; min-height: 32px;
  display: inline-flex; align-items: center; gap: 5px;
}
button.chip { cursor: pointer; }
button.chip:active { background: var(--panel-2); }
#coin { color: var(--gold); }
#act { color: var(--ember); }

/* ---- screen ---- */
#screen {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: var(--gutter);
  padding-bottom: 24px;
}
#screen:focus { outline: none; }

/* ---- tab bar ---- */
#tabbar {
  display: flex;
  border-top: 2px solid var(--line);
  background: var(--bg-2);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  position: sticky; bottom: 0; z-index: 30;
}
#tabbar button {
  flex: 1; min-height: var(--tap);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;
  background: none; border: none; color: var(--ink-dim);
  font: inherit; font-size: 10px; letter-spacing: 0.5px; cursor: pointer;
  padding: 6px 2px;
}
#tabbar button .tabicon { font-size: 17px; line-height: 1; }
#tabbar button[aria-current="true"] { color: var(--ember); background: rgba(255,138,61,0.08); }
#tabbar button:active { background: rgba(255,255,255,0.05); }

/* ---- back to the games list ---- */
.back-link {
  position: fixed; left: 8px; bottom: calc(env(safe-area-inset-bottom, 0px) + 52px);
  z-index: 60;
  font-size: 10px; color: var(--ink-faint); text-decoration: none;
  background: rgba(22,17,15,0.85); border: 1px solid var(--line);
  border-radius: var(--radius); padding: 4px 7px;
}
.back-link:active { color: var(--ink); }

/* ---- headings and text ---- */
h1, h2, h3 { font-weight: 700; letter-spacing: 0.5px; margin: 0 0 8px; }
h1 { font-size: 20px; color: var(--ember); }
h2 { font-size: 15px; color: var(--ink); text-transform: uppercase; letter-spacing: 1.5px; }
h3 { font-size: 13px; color: var(--ink-dim); text-transform: uppercase; letter-spacing: 1px; }
p { margin: 0 0 10px; }
.dim { color: var(--ink-dim); }
.faint { color: var(--ink-faint); font-size: 12px; }
.good { color: var(--good); }
.bad { color: var(--bad); }
.gold { color: var(--gold); }
.ember { color: var(--ember); }
.center { text-align: center; }
.row { display: flex; gap: 8px; align-items: center; }
.row.wrap { flex-wrap: wrap; }
.spread { justify-content: space-between; }
.grow { flex: 1; min-width: 0; }
.stack { display: flex; flex-direction: column; gap: 8px; }
.sep { height: 1px; background: var(--line); margin: 12px 0; }
.truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ---- buttons ---- */
.btn {
  font: inherit; font-size: 13px;
  min-height: var(--tap);
  padding: 10px 14px;
  background: var(--panel); color: var(--ink);
  border: 2px solid var(--line); border-radius: var(--radius);
  cursor: pointer; text-align: left;
  display: flex; align-items: center; gap: 8px;
}
.btn:active { transform: translateY(1px); background: var(--panel-2); }
.btn[disabled] { opacity: 0.4; cursor: not-allowed; }
.btn.primary { border-color: var(--ember-dark); background: linear-gradient(180deg, #3a241a, var(--panel)); color: var(--ember); }
.btn.danger { border-color: #6d2f2a; color: var(--bad); }
.btn.wide { width: 100%; justify-content: center; text-align: center; }
.btn.small { min-height: 34px; padding: 6px 10px; font-size: 12px; }
.btn-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
.btn-grid.three { grid-template-columns: repeat(3, 1fr); }

/* ---- cards and panels ---- */
.card {
  background: var(--panel);
  border: 2px solid var(--line);
  border-radius: var(--radius);
  padding: 10px;
  margin-bottom: 10px;
}
.card.tight { padding: 8px; }
.card.clickable { cursor: pointer; }
.card.clickable:active { background: var(--panel-2); }
.card h3 { margin-bottom: 6px; }

/* ---- bars ---- */
.bar {
  height: 8px; background: #120d0b;
  border: 1px solid var(--line); border-radius: 2px; overflow: hidden;
}
.bar > i { display: block; height: 100%; background: var(--good); transition: width 220ms ease; }
.bar.mp > i { background: var(--cool); }
.bar.xp > i { background: var(--violet); }
.bar.bond > i { background: var(--ember); }
.bar.surge > i { background: linear-gradient(90deg, var(--ember), var(--gold)); }
.bar.thin { height: 5px; }

/* ---- overlay ---- */
.overlay {
  position: fixed; inset: 0; z-index: 80;
  background: rgba(10,7,6,0.88);
  display: flex; align-items: flex-end; justify-content: center;
  padding: 0;
}
.overlay-inner {
  width: 100%; max-width: var(--maxw);
  max-height: 92vh; overflow-y: auto;
  background: var(--bg-2);
  border-top: 3px solid var(--ember-dark);
  padding: 16px var(--gutter) calc(env(safe-area-inset-bottom, 0px) + 16px);
  animation: rise 160ms ease-out;
}
@keyframes rise { from { transform: translateY(24px); opacity: 0; } to { transform: none; opacity: 1; } }

/* ---- toasts ---- */
.toasts {
  position: fixed; left: 0; right: 0;
  bottom: calc(env(safe-area-inset-bottom, 0px) + 64px);
  z-index: 90;
  display: flex; flex-direction: column; align-items: center; gap: 6px;
  pointer-events: none; padding: 0 var(--gutter);
}
/* With a dialogue open the bottom of the screen is the text; put notices
   at the top so they never land in the middle of a sentence. */
.overlay-open .toasts {
  top: calc(env(safe-area-inset-top, 0px) + 54px);
  bottom: auto;
}

.toast {
  background: var(--panel-2); border: 2px solid var(--line);
  border-radius: var(--radius); padding: 8px 12px; font-size: 12px;
  max-width: 100%; animation: rise 140ms ease-out;
}
.toast.good { border-color: #3f6b35; color: var(--good); }
.toast.bad { border-color: #6d2f2a; color: var(--bad); }
.toast.gold { border-color: #7a6524; color: var(--gold); }

/* ---- sprites ---- */
.sprite { display: block; }
.item-icon { display: block; flex: none; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
}

/* Desktop and landscape get the same layout, just centred and a little larger. */
@media (min-width: 760px) {
  html, body { font-size: 16px; }
  #app { border-left: 2px solid var(--line); border-right: 2px solid var(--line); }
}

/* ============================================================
   ui.css - screens: title, map, location, roster, pack, journal
   ============================================================ */

/* ---- title ---- */
.title-screen { text-align: center; padding: 20px 0 8px; }
.title-screen .logo {
  font-size: 30px; letter-spacing: 3px; color: var(--ember);
  text-shadow: 0 2px 0 #7a3418, 0 0 18px rgba(255,138,61,0.35);
  margin: 10px 0 2px;
}
.title-screen .tagline { color: var(--ink-dim); font-size: 12px; margin-bottom: 18px; }
.title-dragons { display: flex; justify-content: center; gap: 4px; margin: 4px 0 14px; flex-wrap: wrap; }
.seed-row { display: flex; gap: 6px; margin: 10px 0; }
.seed-row input {
  flex: 1; min-width: 0; font: inherit; font-size: 13px;
  background: var(--panel); color: var(--ink);
  border: 2px solid var(--line); border-radius: var(--radius); padding: 10px;
  min-height: var(--tap);
}
.slot-row { display: flex; align-items: center; gap: 8px; }
.slot-row .meta { font-size: 11px; color: var(--ink-faint); }

/* ---- map ---- */
.map-wrap { position: relative; margin-bottom: 12px; }
#mapcanvas {
  width: 100%; height: auto; display: block;
  background: #0f0c0b; border: 2px solid var(--line); border-radius: var(--radius);
  touch-action: manipulation;
}
.map-legend { display: flex; flex-wrap: wrap; gap: 8px; font-size: 10px; color: var(--ink-faint); margin-top: 6px; }
.map-legend span::before { content: '\25A0'; margin-right: 3px; }

.node-list { display: flex; flex-direction: column; gap: 8px; }
.node-row { display: flex; align-items: center; gap: 10px; }
.node-row .kind { font-size: 10px; color: var(--ink-faint); text-transform: uppercase; letter-spacing: 1px; }
.node-row .name { font-size: 14px; }
.node-row.locked { opacity: 0.45; }

.place-head { display: flex; gap: 10px; align-items: flex-start; margin-bottom: 10px; }
.place-head .badge {
  font-size: 10px; text-transform: uppercase; letter-spacing: 1px;
  border: 1px solid var(--line); border-radius: 3px; padding: 2px 5px; color: var(--ink-faint);
}

/* ---- roster ---- */
.dragon-card { display: flex; gap: 10px; align-items: flex-start; }
.dragon-card .portrait { flex: none; }
.dragon-card .info { flex: 1; min-width: 0; }
.dragon-card .name-row { display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; }
.dragon-card .name { font-size: 14px; font-weight: 700; }
.dragon-card .lvl { font-size: 11px; color: var(--ink-dim); }
.dragon-card .tags { display: flex; gap: 4px; flex-wrap: wrap; margin: 3px 0; }

.el-tag {
  font-size: 9px; text-transform: uppercase; letter-spacing: 1px;
  border: 1px solid currentColor; border-radius: 3px; padding: 1px 4px; opacity: 0.95;
}
.pill {
  font-size: 9px; text-transform: uppercase; letter-spacing: 1px;
  background: var(--panel-2); border: 1px solid var(--line);
  border-radius: 3px; padding: 1px 5px; color: var(--ink-dim);
}
.pill.party { color: var(--ember); border-color: var(--ember-dark); }
.pill.ash { color: var(--violet); border-color: #5b4a7a; }
.pill.gen { color: var(--gold); border-color: #7a6524; }

.statgrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px 8px; font-size: 11px; margin-top: 6px; }
.statgrid div { display: flex; justify-content: space-between; gap: 4px; }
.statgrid .k { color: var(--ink-faint); }

.move-row { display: flex; align-items: center; gap: 8px; padding: 7px 8px; border-bottom: 1px solid var(--line); }
.move-row:last-child { border-bottom: none; }
.move-row .mname { flex: 1; min-width: 0; }
.move-row .cost { font-size: 11px; color: var(--cool); }
.move-row .pw { font-size: 11px; color: var(--ink-faint); }

/* ---- items ---- */
.item-row { display: flex; align-items: center; gap: 10px; width: 100%; }
.item-row .iname { flex: 1; min-width: 0; }
.item-row .count { font-size: 12px; color: var(--ink-dim); }
.item-row .price { font-size: 12px; color: var(--gold); }
.item-row .desc { font-size: 11px; color: var(--ink-faint); }
.kind-head { font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--ink-faint); margin: 12px 0 5px; }

.filter-row { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 8px; }
.filter-row button {
  font: inherit; font-size: 11px; white-space: nowrap;
  background: var(--panel); color: var(--ink-dim);
  border: 1px solid var(--line); border-radius: 12px; padding: 6px 11px; min-height: 32px; cursor: pointer;
}
.filter-row button[aria-pressed="true"] { background: var(--ember-dark); color: #fff; border-color: var(--ember); }

/* ---- journal ---- */
.quest-card .goal { font-size: 11px; color: var(--ink-dim); margin-top: 4px; }
.quest-card .prog { font-size: 11px; color: var(--ember); }
.quest-card.main { border-left: 4px solid var(--ember); }
.quest-card.side { border-left: 4px solid var(--cool); }
.quest-card.board { border-left: 4px solid var(--gold); }

/* ---- broodex ---- */
.dex-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; }
.dex-cell { text-align: center; padding: 6px; font-size: 10px; }
.dex-cell.unseen { opacity: 0.3; }

/* ---- scenes ---- */
.scene { padding: 6px 0; }
.scene .who { color: var(--ember); font-size: 12px; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 4px; }
.scene .line { font-size: 14px; line-height: 1.6; margin-bottom: 14px; }
.scene .line em { color: var(--gold); font-style: normal; }
.scene-nav { display: flex; gap: 8px; }
.choice-list { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
.choice-list .btn { text-align: left; }
.choice-list .locked-why { font-size: 11px; color: var(--ink-faint); }

/* ---- breeding ---- */
.pair-slots { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: center; }
.pair-slot {
  border: 2px dashed var(--line); border-radius: var(--radius);
  min-height: 104px; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 2px; padding: 6px; font-size: 11px; color: var(--ink-faint); cursor: pointer; text-align: center;
}
.pair-slot.filled { border-style: solid; color: var(--ink); }
.egg-row { display: flex; align-items: center; gap: 10px; }

/* ---- results and rewards ---- */
.reward-line { display: flex; align-items: center; gap: 8px; font-size: 13px; padding: 3px 0; }
.big-number { font-size: 22px; color: var(--gold); }

/* ---- settings ---- */
.setting-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line); }
.setting-row:last-child { border-bottom: none; }
.switch { min-width: 62px; }
input[type="range"] { width: 130px; accent-color: var(--ember); }

/* ============================================================
   battle.css - the fight screen (GDD 13)
   Top to bottom: enemies, turn queue, your brood, log, commands.
   The command strip is always within thumb reach.
   ============================================================ */

.battle {
  display: flex; flex-direction: column;
  gap: 8px; min-height: 100%;
}

.enemy-row { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; }
.enemy {
  flex: 1 1 96px; max-width: 150px;
  background: var(--panel); border: 2px solid var(--line); border-radius: var(--radius);
  padding: 5px; text-align: center; cursor: pointer; position: relative;
}
.enemy[aria-pressed="true"] { border-color: var(--ember); background: #35231b; }
.enemy.down { opacity: 0.32; }
.enemy .ename { font-size: 11px; margin-top: 2px; }
.enemy .elvl { font-size: 10px; color: var(--ink-faint); }
.enemy canvas { margin: 0 auto; }
.enemy .statuses { display: flex; gap: 2px; justify-content: center; font-size: 10px; min-height: 12px; }

.queue {
  display: flex; gap: 4px; overflow-x: auto; padding: 4px 0;
  border-top: 1px solid var(--line); border-bottom: 1px solid var(--line);
}
.queue-chip {
  font-size: 10px; white-space: nowrap;
  border: 1px solid var(--line); border-radius: 10px; padding: 3px 7px;
  background: var(--panel); color: var(--ink-dim);
}
.queue-chip.ally { color: var(--good); border-color: #3f6b35; }
.queue-chip.foe { color: var(--bad); border-color: #6d2f2a; }
.queue-chip.now { background: var(--panel-2); font-weight: 700; }

.surge-wrap { display: flex; align-items: center; gap: 8px; font-size: 10px; color: var(--ink-faint); }
.surge-wrap .bar { flex: 1; }

.ally-row { display: flex; gap: 6px; }
.ally {
  flex: 1; min-width: 0;
  background: var(--panel); border: 2px solid var(--line); border-radius: var(--radius);
  padding: 5px; position: relative;
}
.ally.acting { border-color: var(--ember); }
.ally.down { opacity: 0.4; }
.ally .aname { font-size: 11px; display: flex; justify-content: space-between; gap: 4px; }
.ally .hp-num { font-size: 10px; color: var(--ink-faint); }
.ally canvas { margin: 0 auto; }
.ally .statuses { display: flex; gap: 2px; font-size: 10px; min-height: 12px; flex-wrap: wrap; }
.ally .cmd { font-size: 9px; color: var(--ember); min-height: 12px; letter-spacing: 0.5px; }

.battle-log {
  background: #100c0a; border: 2px solid var(--line); border-radius: var(--radius);
  padding: 8px; font-size: 12px; line-height: 1.5;
  height: 108px; overflow-y: auto;
}
.battle-log p { margin: 0 0 3px; }
.battle-log .hit { color: var(--ink); }
.battle-log .crit { color: var(--gold); }
.battle-log .good { color: var(--good); }
.battle-log .bad { color: var(--bad); }
.battle-log .surge { color: var(--ember); font-weight: 700; }
.battle-log .boss { color: var(--violet); }

.command-strip { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.command-strip .btn { justify-content: center; text-align: center; font-size: 12px; min-height: 46px; padding: 6px; }

.target-hint { font-size: 11px; color: var(--ember); min-height: 16px; text-align: center; }

.move-pick { display: flex; flex-direction: column; gap: 6px; }
.move-pick .btn { justify-content: space-between; }
.move-pick .mult { font-size: 10px; letter-spacing: 1px; }
.mult.strong, .mult.sundered { color: var(--good); }
.mult.weak, .mult.shrugged { color: var(--bad); }

/* the damage number that pops off a hit */
.float-num {
  position: absolute; left: 50%; top: 8px;
  transform: translateX(-50%);
  font-size: 15px; font-weight: 700; pointer-events: none;
  animation: floatUp 700ms ease-out forwards;
}
.float-num.crit { color: var(--gold); font-size: 19px; }
.float-num.heal { color: var(--good); }
@keyframes floatUp {
  0% { opacity: 0; transform: translate(-50%, 6px); }
  25% { opacity: 1; }
  100% { opacity: 0; transform: translate(-50%, -26px); }
}

.shake { animation: shake 240ms; }
@keyframes shake {
  0%, 100% { transform: none; }
  20% { transform: translateX(-4px); }
  45% { transform: translateX(4px); }
  70% { transform: translateX(-2px); }
}

.flash-overlay {
  position: fixed; inset: 0; z-index: 70; pointer-events: none;
  animation: flash 520ms ease-out forwards;

questAnimationFrame(x)}var Is={intro:{id:"intro",music:"quiet",lines:[{who:null,text:"Maerin Colde kept a hatchery under a hill for forty years, and an argument with the Concord of Ash for nearly as long. She lost the argument. She did not stop having it."},{who:null,text:"She has been dead a fortnight. The house is yours, the hill is yours, and so is the argument."},{who:"Tolm Brill",text:"She left the ledger open on the table, Warden. Last entry's a week before she went. Says: *the grey ones can be brought back, I have done it twice, nobody will write it down but me.*"},{who:"Tolm Brill",text:"There's an egg in the warm room she never got to hatch. And there's a drake in the Guttering Roost that's been eating the light out of the valley since spring."},{who:"you",text:"Then I had better get on with it."}]},first_dragon:{id:"first_dragon",lines:[{who:null,text:"The warm room smells of old straw and hot stone. Something in the nearest nest is watching you with one eye open."},{who:"Tolm Brill",text:"She raised that one from a clutch out of the Low Fields. It's yours now, if it'll have you. They choose, mostly. She was firm about that."}]},vale_ashbound:{id:"vale_ashbound",lines:[{who:null,text:"The grey dragon in the hollow does not react to you at all. That is the worst part. It is not hunting, or guarding, or angry. It has simply stopped being anything."},{who:"you",text:"Maerin said the ash washes off."},{who:null,text:"*Clearwater draught, or a Radiant voice saying the right name*, said the ledger, in handwriting that got worse toward the end. *Either works. Both hurt them. Do it anyway.*"}]},cinderfang_pre:{id:"cinderfang_pre",lines:[{who:null,text:"The Guttering Roost is a chimney of black basalt with eleven hundred years of nesting in it and nothing nesting now."},{who:"Tolm Brill",text:"This is where she lost the last hatchling. She came back down carrying it and didn't say a word to anyone for four days."},{who:null,text:"Somewhere above you, something drags itself over stone."}]},cinderfang_post:{id:"cinderfang_post",lines:[{who:null,text:"It lies in the ash it made. Under the grey its scales are the colour of a banked fire, and they have been that colour the whole time."},{who:"you",text:"She was right."},{who:null,text:"A letter comes up from Saltley within the week: the Tide line is failing, the chorus-hall has gone quiet, and does the Broodwell still exist, and if so, would it consider coming."}],setAct:2},kessa_meet:{id:"kessa_meet",lines:[{who:null,text:"She is waiting at Tidewatch with her coat buttoned to the throat and a dragon behind her that has clearly been built rather than born."},{who:"Kessa Vane",text:"Warden of the Broodwell. I read Colde's papers. All of them, twice, which is twice more than the Concord did."},{who:"Kessa Vane",text:"She was right about the ash. She was wrong about what happens if we let the Spire go out. Forty thousand people in Cindermarch heat their houses off that line."},{who:"you",text:"And the broods?"},{who:"Kessa Vane",text:"Yes. That's the whole of it, isn't it. And the broods."}]},morvaleth_pre:{id:"morvaleth_pre",lines:[{who:null,text:"The chorus-hall is under eleven feet of clear water and still, somehow, singing. The sound comes up through the soles of your boots before it reaches your ears."},{who:null,text:"They sang the Tide line here every evening for three hundred years, in shifts, so it was never not being sung. Then the Concord drew the line through the Spire, and there was nothing left to sing to, and they kept going anyway until the water came in."}]},morvaleth_post:{id:"morvaleth_post",lines:[{who:null,text:"The singing stops. In the quiet you can hear the hall dripping, and something under the floor letting go of something it had been holding."},{who:"Kessa Vane",text:"You'll want to come to Cindermarch now. I'd rather you saw it than imagined it."},{who:"Kessa Vane",text:"I'll sign you through the Slag Gate. Don't thank me. I'm doing it because you're going to go anyway and I'd rather know where you are."}],setAct:3,give:["concord_writ"]},cindermarch_arrive:{id:"cindermarch_arrive",lines:[{who:null,text:"Cindermarch is warm the way a body is warm. Nine furnaces, forty thousand people, and light in every window at three in the morning."},{who:"Kessa Vane",text:"Good. Now look up."},{who:null,text:"The Spire goes up past where you can comfortably look. All five Emberlines come down out of the sky and into it, and none of them come out."},{who:"Kessa Vane",text:"That is a dragon in there. I've known since I was twenty-six. I have gone on lighting my kitchen with it every night since."}]},kessa_fight_pre:{id:"kessa_fight_pre",lines:[{who:"Kessa Vane",text:'"You want me to unmake a hundred years of light on the word of a dead woman and a bag of eggs."'},{who:"Kessa Vane",text:"I'm not going to stand aside and I'm not going to pretend that's a moral position. Show me you can hold what you're asking for."},{who:null,text:"Aurex comes forward. It has three kinds of scale on it and none of them agree."}]},kessa_fight_post:{id:"kessa_fight_post",lines:[{who:null,text:"Aurex kneels. Kessa puts her hand flat on its neck and leaves it there a while."},{who:"Kessa Vane",text:"Right."},{who:"Kessa Vane",text:"The Gale and the Stone lines are the thinnest. If you're going to do this you need keepers for both, and there aren't any left alive that remember how."},{who:"you",text:"Then I will make some."},{who:"Kessa Vane",text:"Yes. I thought you'd say that. Go up to Windward, and take this \u2014 the Riven Throne won't let you near it otherwise."}],setAct:4,give:["riven_token","emberline_lens"]},peaks_arrive:{id:"peaks_arrive",lines:[{who:"Halla Keld",text:"Warden. You'll be wanting the Throne, and you'll be wanting it in the two hours before the afternoon wind."},{who:"Halla Keld",text:"Ythrax has held that peak alone for ninety years. Not guarding anything. There's nothing up there. It just won't leave."}]},ythrax_post:{id:"ythrax_post",lines:[{who:null,text:"It folds onto the stone, enormous and tired, and lets you get close enough to touch it."},{who:null,text:"You have a dragon with you that was born in your hatchery, out of two animals you chose, carrying a line that ended before you were born. Ythrax looks at it for a long time."},{who:"Halla Keld",text:"Well. That's the Gale line stood back up. There's one thing left and it's a hundred years down a stairwell."}],setAct:5,give:["spire_pass"]},spire_descent:{id:"spire_descent",lines:[{who:null,text:"Eleven hundred steps. The light gets older the whole way down: white at the top, then yellow, then the colour of a lamp somebody forgot to put out."},{who:"Kessa Vane",text:"I've been down here twice. Both times I turned round at the eight hundredth step and told myself it was procedure."}]},vaelorax_meet:{id:"vaelorax_meet",lines:[{who:null,text:"The chamber is not a furnace. It is a room built very carefully around a sleeping animal, and the animal has not been asleep for some time."},{who:"Vaelorax",text:'"Warden."'},{who:"Vaelorax",text:'"You have been carrying my brood around in your pockets for a season. I have been listening. Some of them are very young. One of them is new \u2014 I felt it hatch. That was well done."'},{who:"you",text:"I came to let you out."},{who:"Vaelorax",text:'"I know. Say the rest of it."'},{who:"you",text:"And I do not know what happens to Cindermarch when I do."},{who:"Vaelorax",text:'"No. Neither do I. Come on, then. We will do this properly, and afterwards you will choose, and I will abide it."'}]},ending_choice:{id:"ending_choice",lines:[{who:null,text:"The fire goes out of it slowly, the way you put down something heavy you have been holding for a hundred years."},{who:"Vaelorax",text:'"Now. The lines are loose and they will go somewhere. Say where."'}],choices:[{id:"unbind",text:"Let them go. Free Vaelorax and let the cities learn to burn wood again.",flag:"ending_unbind"},{id:"rekindle",text:"Split the five lines back out to the five broods I have restored.",flag:"ending_rekindle",requires:"canRekindle",locked:"You would need one dragon of each Elder lineage, grown to Wyrm or better."},{id:"succession",text:"Offer a dragon of my own brood, willingly, to hold the line in its place.",flag:"ending_succession",requires:"canSuccession",locked:"You would need a dragon you bred yourself: third generation, Elder-grown, and bonded to you completely."}]},ending_unbind:{id:"ending_unbind",ending:!0,title:"Unbound",lines:[{who:null,text:"It takes nine seconds. The Spire does not fall; it simply stops being lit, which turns out to be a different and much quieter thing."},{who:null,text:"Cindermarch has a hard winter and then a harder one. Forty thousand people learn to bank a fire. Eleven of them write to you, and four of those letters are kind."},{who:null,text:"Vaelorax goes up through the roof of the world and does not come back for a year. When it does, it brings eleven others, and they nest on the old lines like nothing had happened, which is not the same as nothing having happened."},{who:null,text:"Maerin would have said you took too long about it. She would have been wrong, and she would have known she was wrong, and she would have said it anyway."}]},ending_rekindle:{id:"ending_rekindle",ending:!0,title:"Rekindled",lines:[{who:null,text:"You do it the slow way: five lines, five broods, one at a time, with a Warden standing at each and a dragon willing to hold it."},{who:null,text:"It takes three years. Cindermarch keeps its light at a quarter of what it had, which is enough, and there is a brood on the Ember line above the city that the children get taken up to see."},{who:null,text:"Kessa Vane runs the Concord now and has made herself extremely unpopular by insisting that dragons be counted in the census."},{who:null,text:"The Broodwell is full. You have had to dig out the hill."}]},ending_succession:{id:"ending_succession",ending:!0,title:"Succession",lines:[{who:null,text:"It is not a sacrifice. That is the part nobody outside the Broodwell ever understands. You ask, and it considers the question the way it considers everything, and it says yes, and it means it."},{who:null,text:"Vaelorax goes out into a sky it has not seen since before your grandmother. Your dragon takes the lines up, all five, the way a thing raised warm and fed by hand and never once lied to can."},{who:null,text:"The light over Cindermarch changes colour that night and stays changed. People notice within the hour. Within a month there are three separate arguments about what to call it."},{who:null,text:"You visit. Often. It always knows you are coming."}]}},Wa=e=>Is[e]||null,qa={tolm:{id:"tolm",name:"Tolm Brill",node:"broodwell",blurb:"Maerin's neighbour. Feeds your dragons when you forget."},bryd:{id:"bryd",name:"Bryd Ashworth",node:"hollowbridge",blurb:"Keeps the inn on the bridge. Keeps the ledger too."},ilsa:{id:"ilsa",name:"Ilsa Saltley",node:"saltley",blurb:"Fourth Saltley to run the market and the first to admit it."},kessa:{id:"kessa",name:"Kessa Vane",node:"cindermarch",blurb:"Concord warden. The most honest person in the story."},halla:{id:"halla",name:"Halla Keld",node:"windward",blurb:"Climbs for a living. Thinks you are being silly."},darrow:{id:"darrow",name:"Darrow Pell",node:"cindermarch",blurb:"Forge-master. Will make anything, once, for parts."}};var Zo=[],ja=!1;function ao(e,t={}){let n=Wa(e);if(!n||u.flags[`scene_${e}`]&&!t.replay)return null;let o={scene:n,meta:t};return Zo.push(o),at(`scene_${e}`),Cs(n),v.emit("scene:queued",{scene:n,meta:t}),n}function Cs(e){e.setAct&&Nr(e.setAct);for(let t of e.give||[])pe(t,1);for(let t of e.flags||[])at(t);e.ending&&(u.ending=e.id,v.emit("game:ended",{ending:e.id,title:e.title}))}function za(){let e=Zo.shift()||null;return e&&v.emit("scene:started",e),e}function Va(e){v.emit("scene:finished",e),Zo.length||v.emit("scene:idle")}function En(){let e=u.roster.filter(a=>a.stage!=="egg"),t=new Set(e.map(a=>
