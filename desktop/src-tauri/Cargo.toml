[package]
name = "puretv-desktop"
version = "0.4.3"
edition = "2021"
description = "pureTV Android TV manager"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
getrandom = "0.3"
tiny_http = "0.12"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
puretv-core = { path = "../core" }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "native-tls-no-alpn"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
