        buttons[key] = !quarantine && raw[key] && !blocked[key];
        pressed[key] = buttons[key] && !previous[key];
        // A cancellation is not an intentional release (e.g. rewarded drift).
        released[key] = !cancelled && !quarantine && !buttons[key] && previous[key];
      }
      previous = buttons; source = nextSource; epoch = nextEpoch; resetPending = false;
      if (player) hasSeenController = true;
      return { buttons, pressed, released, connected: !!player, cancelled, players: copy(players), source };
    }
  };
}

function panel(document, options) {

  const title = document.createElement('strong'); title.className = 'ptv-host-title'; title.textContent = 'pureTV 手柄';
  const clients = document.createElement('div'); clients.id = 'puretv-controller-clients'; clients.hidden = true;

/** One owner per page. Call poll exactly once per animation frame, including menus. */
function createController(options = {}) {
  const root = window, document = root.document;
  const view = panel(document, options), reducer = createInputReducer();

  let frame = { buttons: empty(), pressed: empty(), released: empty(), connected: false, cancelled: false, players: [], source: '', pollCount: 0, info: {} };
  const previousHost = root.PureGame;
  function acceptInfo(value) {
    if (value && typeof value === 'object') info = copy(value);
  }
  function suspend() {
    localHeld = empty(); localPulse = empty(); reducer.cancel();
    options.onSuspend?.();
  }
  const hooks = {
    key(key, down) {
      const action = nativeKeys[key]; if (!action) return;
      if (down && !localHeld[action]) localPulse[action] = true;
      localHeld[action] = !!down;
    },
    focus(focused) { if (!focused) suspend(); },
    suspend(paused) { if (paused) suspend(); },
    resume() {},
    roomInfo: acceptInfo,
    networkChanged(value) { acceptInfo(value); suspend(); }
  };
  root.PureGame = hooks;
  const onVisibility = () => { if (document.hidden) suspend(); };
  root.addEventListener('blur', suspend);
  document.addEventListener('visibilitychange', onVisibility);
  function render() {
    root.PureTVControllerAdapter.renderClients(view.clients, frame.players, { language: 'zh' });
    view.element.dataset.playing = String(playing);
    view.element.hidden = playing && !frame.connected;
    const wifi = info.wifiController || {};
    const addresses = Array.isArray(wifi.addresses) ? wifi.addresses : Array.isArray(info.addresses) ? info.addresses : [];
    const address = addresses.filter(value => typeof value === 'string').join(' / ');
    const name = typeof wifi.serviceName === 'string' ? wifi.serviceName : '';
    const port = Number.isInteger(wifi.port) && wifi.port > 0 ? wifi.port : 63485;
    const activeSeat = frame.players.filter(p => p.connected === true && p.transport === 'wifi').map(p => Number(p.id)).sort((a, b) => a - b)[0];
    let status = frame.connected ? `单人游戏 · ${activeSeat}P 手柄操作` : '手柄按 GPIO 23 搜索连接';
    if (!root.PureGameHost) status = '浏览器预览 · 键鼠可玩\nWi-Fi 手柄需启动安装版';
    if (name) status += '\n' + name;
    if (address) status += '\n' + address;
    if (root.PureGameHost) status += '\nTCP ' + port;
    if (typeof wifi.error === 'string' && wifi.error) status += '\n' + wifi.error;
    if (wifi.state === 'failed' || wifi.state === 'unavailable') status += '\n手柄服务暂不可用';
    view.info.textContent = status;
  }
  return {
    poll() {
      let sample = { players: [] };
      const now = root.performance.now();
      try {
        if (root.PureGameHost?.getInfo && now - infoAt >= 1000) {
          acceptInfo(JSON.parse(root.PureGameHost.getInfo())); infoAt = now;
        }
        if (root.PureGameHost?.snapshot) sample = JSON.parse(root.PureGameHost.snapshot());
      } catch (_) { sample = { players: [] }; }
      const local = empty();
      for (const key of BUTTONS) local[key] = localHeld[key] || localPulse[key];
      localPulse = empty();
      frame = { ...reducer.read(sample, local), info: copy(info), pollCount: frame.pollCount + 1, native: !!root.PureGameHost, inputAvailable: !!root.PureGameHost };
      render();
      if (frame.cancelled) options.onCancel?.();
      return copy(frame);
    },
    peek() { return copy(frame); },
    setPlaying(value) { playing = !!value; render(); },
    cancel: suspend,
    destroy() {
      root.removeEventListener('blur', suspend); document.removeEventListener('visibilitychange', onVisibility);
      if (root.PureGame === hooks) root.PureGame = previousHost;
      view.element.remove();
    }
  };
}

const config = {"id":"echo-bridge","name":"回声桥梁","title":"Echo Bridge","accent":"#7ce4bf","background":"#18352f","rule":"瞄准下一座岛屿，轻点 A 搭桥前进。","action":"A：沿旋转指针建桥","help":"指针与岛屿对齐时搭桥，长度决定材料消耗。\n连续过桥可回收材料；不要落到画面下方。","stateFields":["player","islands","bridges","rotationAngle","currentIsland","activeBridge","scrollOffset","nextIslandDistance","islandSpawnY","lastIslandX","materialGauge"],"pixi":false,"audio":[{"key":"bgm","name":"bgm.mp3","url":"https://raw.githubusercontent.com/abagames/claude-one-button-game-creation/d81f02a0928b35d9c979e9918aa9dc3c2770821b/docs/echo-bridge/Bridges_to_Islands.mp3"}]};
const readGameState = () => ({player,islands,bridges,rotationAngle,currentIsland,activeBridge,scrollOffset,nextIslandDistance,islandSpawnY,lastIslandX,materialGauge});
const engine = window.__puretvCrisp;
let stage = 'menu', frames = 0, selected = 0, difficultyIndex = 0, help = false;
let reason = '', blockedA = true, lastGameHeld = false, inputFrame, pending = { held: false, pressed: false, released: false };
const runtimeErrors = [];

window.addEventListener('unhandledrejection',event => runtimeErrors.push(String(event.reason)));

const clone = value => JSON.parse(JSON.stringify(value));
const $ = id => document.getElementById(id);
document.documentElement.style.setProperty('--accent',config.accent);
document.documentElement.style.setProperty('--back',config.background);
$('game-name').textContent = config.name;
$('game-name-en').textContent = config.title;
$('rule').textContent = config.rule;
$('help').textContent = config.help;
function clearInput() { blockedA = true; lastGameHeld = false; pending = {held:false,pressed:false,released:false}; engine.cancel(); }
function pause(message = '已暂停 · START 继续') {
  if (stage !== 'playing') return;
  stage = 'paused'; reason = message; selected = 0; help = false;
  clearInput(); controller.cancel(); render();
}
const controller = createController({ width:196, onSuspend:() => pause('已暂停 · 失焦或后台，请按 START 继续'), onCancel:() => pause('已暂停 · 手柄连接变化，请按 START 继续') });
engine.initialize();
const canvas = document.querySelector('canvas');
$('game-board').append(canvas);
const gl = config.pixi ? (canvas.getContext('webgl2') || canvas.getContext('webgl')) : null;
const webglVersion = gl ? gl.getParameter(gl.VERSION) : null;
const renderer = gl ? (webglVersion.includes('WebGL 2') ? 'webgl2' : 'webgl1') : 'canvas2d';
function begin() {
  stage = 'playing'; selected = 0; help = false; reason = '';
  blockedA = true; lastGameHeld = false; pending = {held:false,pressed:false,released:false};
  engine.start(levels[difficultyIndex].value); render();
}
function resume() {
  if (stage !== 'paused') return;
  stage = 'playing'; selected = 0; help = false; reason = ''; blockedA = true;
  pending = {held:false,pressed:false,released:false}; engine.resume(); render();
}
function returnToMenu() { stage = 'menu'; reason = ''; selected = 0; help = false; clearInput(); render(); }
function optionsForStage() {
  if (stage === 'playing') return [];
  if (help) return [{label:'返回',run:() => { help = false; selected = 0; render(); }}];
  if (stage === 'paused') return [{label:'继续游戏',run:resume},{label:'重新开始',run:begin},{label:'玩法说明',run:() => {help=true;selected=0;render();}},{label:'返回主菜单',run:returnToMenu}];
  return [{label:stage === 'ended' ? '再玩一次' : '开始游戏',run:begin},{label:'难度：'+levels[difficultyIndex].name+'  ◀ ▶',run:() => cycleDifficulty(1)},{label:'玩法说明',run:() => {help=true;selected=0;render();}}];
}
function cycleDifficulty(direction) { difficultyIndex = (difficultyIndex+direction+levels.length)%levels.length; render(); }
function render() {
  document.body.dataset.stage = stage;
  controller.setPlaying(stage === 'playing');
  $('stage-label').textContent = stage === 'playing' ? config.action : stage === 'paused' ? reason : stage === 'ended' ? '本局结束 · 挑战更高得分' : '按 START 开始';
  $('help').hidden = !help;
  $('rule').hidden = help;
  const list = optionsForStage(); selected = Math.max(0,Math.min(selected,list.length-1));
  $('menu').replaceChildren(...list.map((option,i) => {

    button.setAttribute('aria-current',String(i === selected));

function navigate(frame) {
  if (frame.pressed.START) { if (stage === 'playing') pause(); else if (stage === 'paused') resume(); else begin(); return; }
  if (frame.pressed.B) {
    if (stage === 'playing') pause();
    else if (help) {help=false;selected=0;render();}
    else if (stage === 'paused' || stage === 'ended') returnToMenu();
    else {help=true;selected=0;render();}
    return;
  }
  if (stage === 'playing') return;
  const list=optionsForStage();
  if (frame.pressed.UP || frame.pressed.DOWN) { selected=(selected+(frame.pressed.UP?-1:1)+list.length)%list.length; render(); }
  if (!help && stage !== 'paused' && (frame.pressed.LEFT || frame.pressed.RIGHT)) cycleDifficulty(frame.pressed.LEFT?-1:1);
  if (frame.pressed.A && !blockedA) list[selected]?.run();

const keys={Enter:'Enter',Space:'Enter',KeyA:'Enter',KeyP:'p',Escape:'b',KeyB:'b',ArrowUp:'ArrowUp',ArrowDown:'ArrowDown',ArrowLeft:'ArrowLeft',ArrowRight:'ArrowRight'};
for (const type of ['keydown','keyup']) window.addEventListener(type,event => {

  if (stage === 'playing') {
    pending.held = !blockedA && inputFrame.buttons.A;
    pending.pressed ||= !blockedA && inputFrame.pressed.A;
    pending.released ||= !blockedA && inputFrame.released.A && (lastGameHeld || pending.pressed);
    if (engine.step(pending)) { lastGameHeld = pending.held; pending.pressed=false; pending.released=false; }

  }

  $('score').textContent = '得分 '+Math.floor(engine.snapshot().score);
  requestAnimationFrame(loop);
}
Object.defineProperty(window,'JoystickGameQA',{value:Object.freeze({snapshot:() => clone({
  game:config.id,renderer,webglVersion,stage,paused:stage === 'paused',frames,errors:runtimeErrors,
  gameplay:{...engine.snapshot(),...readGameState()},controller:controller.peek(),
  menu:{selected,difficulty:levels[difficultyIndex].name,help},
  input:{held:input.isPressed,pressed:input.isJustPressed,released:input.isJustReleased},
  layout:{width:innerWidth,height:innerHeight}
})})});
render(); requestAnimationFrame(loop);
