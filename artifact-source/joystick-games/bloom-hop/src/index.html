<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Bloom Hop</title>
<style>
  @font-face { font-family: 'Fredoka'; src: url('fonts/Fredoka.ttf') format('truetype'); font-weight: 300 700; font-display: block; }
  html, body { margin: 0; height: 100%; background: #1d4f55; overflow: hidden; }
  body { touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent; font-family: 'Fredoka', system-ui, sans-serif; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; outline: none; }
  #safe { position: fixed; visibility: hidden; pointer-events: none;
    top: env(safe-area-inset-top); right: env(safe-area-inset-right);
    bottom: env(safe-area-inset-bottom); left: env(safe-area-inset-left); }
  #fontwarm { position: absolute; left: -999px; font-family: 'Fredoka'; }
  :root { --rail: clamp(185px, 19vw, 240px); }
  #game { width: calc(100% - var(--rail)); }
  #safe { right: var(--rail); }
  body { background: #20484a; }
  #tv-help { position: fixed; right: 12px; bottom: 14px; width: calc(var(--rail) - 24px); color: #fff4dc;
    font: 500 clamp(12px,1.15vw,16px)/1.65 Fredoka,system-ui,sans-serif; }
  #tv-help strong { display:block; color:#f5c542; font-size:1.4em; }
</style></head><body>
<canvas id="game" tabindex="0" aria-label="Bloom Hop lily pond puzzle"></canvas><div id="safe"></div><div id="fontwarm">Bloom Hop</div>
<aside id="tv-help"><strong>Bloom Hop</strong>方向 · 跳至莲叶<br>A + 方向 · 弹开甲虫<br>B · 撤销　X · 使用道具<br>Y · 提示　START · 开始 / 暂停<br>菜单方向选择，A 确认</aside>
<script src="audio-bank.js"></script><script src="bloom-hop.js"></script></body></html>
