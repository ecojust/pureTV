    "There are ten thousand stories in this valley. I have woven an ending out of every one of them. Happy, sad, clever, strange. And not one — *not one* — is hers.": "山谷里有一万个故事，我编了每个故事的结局。快乐、悲伤、聪明、奇怪。没有一个——没有——是她的。",
    "There are toys on the floor. There are paper birds hanging from the ceiling. And in a bed under a patchwork quilt, a little girl is fast asleep.": "地板上有玩具，天花板上挂着纸鸟，在一块缝纫毛毯下的床上，一个小女孩快睡了。",
    "There is a long, hollow rumble, which you realise after a moment is Gubbins's stomach.": "有个很长的空洞的隆波，你意识到 一分钟后，Gubbins的胃。",
    "There is nothing there to use.": "这里没有可以使用的东西。",
    "There was once a... king? Who had a... thing?": "曾经有一位国王 谁有...",
    "There's no keyhole. This door opens to cleverness, not keys.": "没有钥匙孔，这扇门打开了 聪明，不是钥匙",
    "There's nothing else down there. You checked. It was cold.": "那边没有别的东西了 你查过了，很冷",
    "There's nothing left of it to use.": "它已经彻底坏了，没什么可用的了。",
    "There's nothing on the far side to tie it to. Besides, there's a perfectly good bridge right here.": "很远的一面没有东西可以绑起来，而且这里有座桥，很好",
    "They're not a few ballads. They're *everyone's*. My gran doesn't know my name.": "他们不是几个芭蕾舞演员，他们都是\"每个人的\",我的奶奶不知道我的名字。",
    "They're not being forgotten, love. They're being *taken*. There's a difference. When you forget a thing it leaves a hole the shape of itself — you can feel the edges of it. This leaves nothing at all. As if the story never was.": "亲爱的，这些故事没有被遗忘。它们是被*偷走*的。两者不一样。你忘记一样东西，心里会留下一个和它形状一样的洞，你还能摸到边缘。可这回什么也没留下，就像故事从来没存在过。",
    "Think better of it": "还是算了",
    "Three arms. WEST: BRACKENFORD. EAST: WENNA'S. NORTH: GREYMANTLE. Somebody has scratched *TURN BACK* underneath, and somebody else has scratched underneath *that*: *don't be so dramatic*.": "三个手臂，韦纳的北边，有人在下面抓了个\"转\", 有人在下面抓了个\"别那么戏剧化\"。",
    "Three drops for a hound. A whole vial for anything bigger. And don't you go drinking it.": "一只猎犬要三滴，一个瓶子，大一点的，别喝",
    "Three drops, mind. *Three.*": "记住，三滴。*三滴。*",
    "Through the little window, the moon, snagged in the branches of the pines like a kite.": "过小窗，月亮，如风筝般在松树枝间被勾搭。",
    "Through the window, the last of the sunset is draining out of the sky, and Greymantle stands against it like a sleeping giant with its collar turned up. At its very peak, a single light burns in the Warlock's tower.": "窗外，最后一点晚霞正从天际褪去。灰斗篷山立在暮色中，像个翻起衣领沉睡的巨人。山顶上，男巫的塔里有一盏孤灯。",
    "Tie up a troll? With washing line? You admire your own optimism.": "给巨魔绑上绳子 你欣赏你自己的乐观",
    "To use something you carry, click it in your satchel, then click where you want to use it. Click one item on another to combine them. Look at an item to examine it.": "要使用随身物品，先在背包里选中它，再点击使用的位置。先后点击两件物品可以尝试组合。用“观察”可以仔细检查物品。",
    "Toasted honey cake would be delicious. It would also be gone.": "烤热的蜂蜜蛋糕一定很好吃。吃了就没了。",
    "Too big, and the wrong shape. This keyhole wants something tiny and brass.": "太大了，形状不对 这个钥匙孔需要些小的和铜的",
    "Too shiny. That's somebody's whole *life* in there. Put it away.": "太亮了，那可是人的全部生命，收起来",
    "Torches burn in iron brackets either side of the door. They don't seem to burn down. Somebody, somewhere, is keeping the lights on.": "火炬烧在门的两边铁括号里，似乎没有烧掉，有人在某处把灯打开。",
    "Troll Toll": "巨石洞",
    "Turn back a page": "往回翻一页",
    "Turn the page": "翻到下一页",
    "Two brass candlesticks, a clock that stopped the year Grandad died and has never been wound since, and a little teal jar where Gran keeps her buttons and her grudges.": "两座黄铜烛台，一只自从爷爷去世那年停摆后就再没上过发条的钟，还有一只蓝绿色的小罐子，奶奶把纽扣和记下的小怨气都装在里面。",
    "Two slabs of stone, each as big as a barn door, fitted so closely you couldn't slide a hair between them. There is no handle and no keyhole.": "两块石板，每块都像谷仓门一样大，装得非常紧，你无法在它们之间滑动一根毛，没有把手，也没有钥匙孔。",
    "Two things drop out of the nest and land at your feet: a quill of real gold, and a small red button.": "双物从巢中掉出，在你的脚下降落:一毛笔的真金，和小红扣。",
    "UP": "上",
    "Use": "使用",
    "Use (3)": "使用(3)",
    "Use…": "使用……",
    "VERY WELL. THREE RIDDLES. Answer all three and I open. Answer one wrong and we start again from the beginning, and I shall be *extremely* disappointed in you.": "很好。三道谜语。全部答对，我就开门。答错一道，咱们就得从头再来。到时候，我会对你*非常*失望。",
    "Verbs": "动词",
    "WHO KNOCKS? No — don't answer. Nobody ever answers that one well.": "谁在敲门？不，别回答。这问题从来没人答得好。",
    "WOOF!": "呜！",
    "WRONG! And you were doing so well. That's the tragedy of it.": "错了！亏你先前还答得那么好，真是可惜。",
    "WRONG! Elsie got that one when she was five.": "错了！艾尔西五岁时就会答这道题。",
    "WRONG! Oh, *dear*. Oh dear, oh dear. From the top.": "错了！哎呀，*天哪*。哎呀呀。重新来过。",
    "Wait — not yet.": "等等——还不是时候。",
    "Walk": "行走",
    "Walk (1)": "走路(1) 脚步",
    "Well then, Rowan-Ashby-of-Brackenford. Toll's a story. You tell Gubbins a story, and Gubbins lets you over. That's the rule. Been the rule since Gubbins was a pebble.": "那么，罗文·阿什比·布拉肯福德，托尔是个故事，你告诉古宾斯一个故事，古宾斯让你过去，这是规矩，自从古宾斯是一块卵石以来，一直有规矩。",
    "Well?": "怎么样？",
    "Wenna": "温娜",
    "Wenna strips the petals into her cauldron with quick, knotty fingers, muttering what might be a recipe and might be a rhyme. The steam turns the exact blue of the flowers and smells of clean sheets.": "温娜用快速的，结结的手指把花瓣扯进她的酒缸，喃喃地说，这也许是一种食谱，也可能是韵律，蒸汽使花朵的蓝色完全变了，并闻到干净的床单的味道。",
    "Wenna swats your hand away without dropping a stitch. \"Hands off the knitting, dear.\"": "文娜不缝针就把你的手抽走 \"手拿开织布 亲爱的\"",
    "Wenna told you, I suppose. Then you know.": "想必是温娜告诉你的。那你已经知道了。",
    "Wenna's Cottage": "温娜的小屋",
    "Wenna's cottage is small and warm and entirely full: of herbs hanging from the beams, of jars on every shelf, of steam from the cauldron and the smell of soup. It's the sort of room where nothing bad has ever happened, or at least never been allowed to stay.": "文娜的小屋小而温暖，完全满:其中梁架上悬挂着草药，每个货架上都装着罐子，锅炉上蒸气和汤味，是那种没有发生坏事，或者至少从来没有被允许留下的房间。",
    "Wenna's hands go very still.": "温娜的双手突然一动不动。",
    "Wenna's needles slow, and stop.": "温娜手里的织针越来越慢，停了下来。",
    "Wenna's needles stop dead.": "温娜的织针一下子停住了。",
    "Wenna, you decide, probably knows best.": "温娜，你决定吧，也许最清楚",
    "What happened to Elsie?": "艾尔西怎么了？",
    "What have you got?": "有什么发现？",
    "What would you want for the golden feather?": "你想买什么金羽毛？",
    "What's happening to the stories, Gran?": "奶奶，故事到底怎么了？",
    "What's that, dear? No, you hang on to it.": "什么，亲爱的？不用，你自己收好。",
    "When I've finished. When she wakes. What are a few ballads against my daughter?": "我做完后，她醒来后，几个芭蕾舞团对我女儿有什么好评？",
    "Where did you get that?": "你从哪儿得到的？",
    "Where did you — she *kept* it. In the music box. Of course she kept it. I made her that box.": "你在哪里，她把它收起来，放进音乐盒里，当然她留着，我给她做了那个盒子。",
    "Where did you — that's *Corvin's*. His golden quill. He wrote Elsie's story with it, every night, a page at a time.": "你在哪里——那是\"考文的\",他的金笔，他用它写了艾尔西的故事，每晚，一个页。",
    "Who are you?": "你是谁？",
    "Who lives up on Greymantle?": "谁住在灰斗篷山上？",
    "Who made you?": "谁造你？",
    "Why are you doing this?": "你为什么要这么做？",
    "Why do you want a story?": "你为什么想要一个故事？",
    "Why the River Grumbles": "为什么是格鲁姆布尔斯河",
    "Why — that's the key to Elsie's music box! The little lighthouse. She lost it at the harvest fair, years ago. Made a wish on it and dropped it down the village well, and cried all the way home.": "——这是埃尔西音乐盒的关键!小灯塔，她几年前在收割会上丢失了它，在上面许下一个愿望，然后把它扔到村里井里，一路哭着回家。",
    "With a click, the lighthouse's lamp swings open. Inside, folded small, is a thin, hand-sewn book.": "点击后灯塔的灯具开着，内部，折叠的小，是薄薄的手缝书。",
    "With a grinding that you feel in your teeth, the great stone door slides down into the mountain, and a breath of warm air comes out of the dark beyond, smelling of candles and old paper.": "伴随着一阵连牙齿都能感觉到的轧轧声，巨大的石门滑进山体。从门后的黑暗中飘来一股暖风，带着蜡烛和旧纸的味道。",
    "With a noise like a landslide clearing its throat, the great stone face opens its eyes.": "巨石面部的眼球打开了 巨石面部的眼球",
    "Would you take something else instead?": "你会拿别的东西代替吗？",
    "Wrap up warm, dear. And come home.": "多穿点，亲爱的。记得回家。",
    "You again. Have you brought me a story this time?": "又是你。这次你给我带故事来了吗？",
    "You are Rowan Ashby.": "你叫罗温·阿什比。",
    "You are Rowan Ashby: twelve winters old, apprentice to nobody, and grandchild of the best storyteller in the valley. Your scarf is Gran's knitting, your boots are borrowed, and your courage is mostly your own.": "你是罗文·阿什比:12年冬天，无人学徒，是山谷中最优秀的故事家的孙子。 你的围巾是奶奶的织布，你的靴子是借来的，你的勇气大多是你自己的。",
    "You are Rowan, her grandchild. You have heard every one of her stories a hundred times, and tonight you cannot remember a single one either. Up on Greymantle, in the Warlock's tower, a light is burning. You have decided to do something about it.": "你是罗温，是她的孙辈。她讲的每个故事你都听过上百遍，可今晚，你也一个都想不起来了。抬头望向灰斗篷山，男巫塔上亮着一盏灯。你决定去查个究竟。",
    "You are not *that* hungry.": "你还没有饿到*那个地步*。",
    "You are not going to hit a dog. Least of all one who is looking at you like *that*.": "你不会撞到狗的 特别是所有像你这样看着你的人",
    "You are not locked. At least, not in any way a key could help with.": "你身上没有锁。至少没有哪把锁是钥匙能开的。",
    "You are not that hungry, and you would like to stay awake for the rest of the story.": "你还没那么饿。再说，你希望清醒地过完这个故事。",
    "You are not threatening a small child with a fire-poker. There are limits, even on a quest.": "你不能用火药威胁小孩，即使去探险也存在限制。",
    "You back away slowly. Brimble settles down again, looking slightly disappointed in the both of you.": "你慢慢退后，布兰布尔又安顿下来，看着你们两个都有点失望。",
    "You call \"Hello?\" down the well. \"Hello?\" says the well, unhelpfully.": "你叫\"你好\",在井下，\"你好?\" 说井，没有帮助。",
    "You can die. It is a Sierra tradition. You can always turn back a page.": "你有可能会死，这是 Sierra 冒险游戏的老传统了。不过，你总能往回翻一页，重新来过。",
    "You can't go without saying goodbye to Gran. You've never once gone out of that door without saying goodbye to Gran.": "你得先向奶奶道别。每次走出这扇门，你从来都没有忘了跟她说再见。",
    "You clear your throat and read a line aloud. Somewhere in the shelves, ten thousand stories hush to listen.": "你清喉咙大声读一句 书架里有十万个故事要静听",
    "You climb back up, untie Gran's rope, and coil it over your shoulder again. Your hands smell of well.": "爬上去，松开奶奶的绳子，再把绳子绑在肩上，你的手闻起来很好",
    "You climb down very, very carefully.": "你爬下来非常非常小心。",
    "You climb the ladder, rung by rung, until the shelves of glowing bottles are going past your nose like the lit windows of a very tall town.": "你爬梯子，跑来跑去，直到发光瓶的架子 穿过你的鼻子，就像一个非常高的小镇的灯光窗。",
    "You climb up, admire the view of ten thousand glowing bottles from above, and climb back down again. It is a long way up.": "你爬上去，欣赏上方一万个发光瓶的景色，然后又爬回下面，这是很长的路要走。",
    "You close the Book. Somewhere down in the valley, you are fairly sure, an old woman by a fire has just remembered your name.": "你合上《故事书》。你几乎可以肯定，此时山谷里，一位坐在炉火边的老妇人刚刚想起了你的名字。",
    "You consider tying yourself up for safekeeping, and decide against it.": "你考虑把自己捆好，以防万一。想想还是算了。",
    "You could drop the bone down the well. But why would you?": "你可以把骨头掉到井里，但你为什么要？",
    "You could feed the Unfinished Tale to the Loom — but it's tried a thousand endings. This one needs a person, not a machine.": "你可以把未完成的故事喂给Loom, 但是它已经尝试了一千个结局。这个需要一个人，而不是机器。",
    "You could hardly pour it down his throat. It needs to go *in* something he'd want to eat.": "你几乎不能倒进他的喉咙，它需要去 \"东西，他想吃。",
    "You could let it out...": "你可以让它出来...",
    "You could pull the cork right here — but a story let loose needs somewhere to go. Somewhere that knows the way home.": "你可以在这里拔开瓶塞——可一个被放出来的故事，总要有个去处。最好是个认得回家路的地方。",
    "You could toss Gran's penny in and make a wish. But you suspect the penny will be more use to you than a wish. Most things are.": "你可以把奶奶的一分钱扔进去许个愿 但你怀疑这分钱对你比愿望更有用",
    "You could write in the Book of Tales — but it appears to be writing itself, thank you, and would rather not be interrupted.": "你可以在《故事书》里写点什么，可它似乎正在自己写自己，多谢关心，最好别打扰。",
    "You dig the hooked end of Gran's poker into the wheel and prise out a lump of old wax the size of a plum. The ladder gives a squeak of pure relief.": "把奶奶的扑克牌 的上钩端挖进车轮里 然后把一块像梅子一样大的老蜡弄出来 梯子会发出纯净的解脱",
    "You don't have to know. You only have to write the next part.": "你不必知道结局，只要接着往下写就好。",
    "You don't know what they did. You could make something up, but it would be a story about *somebody else's* keeper, and *somebody else's* daughter. This one isn't yours to finish.": "你不知道他们后来做了什么。你当然可以现编，可那样写出来的只会是*别人*的守灯人和*别人*的女儿。这个故事不该由你来收尾。",
    "You don't know what to say. You aren't sure there is anything.": "你不知道该说什么。或许根本就没有什么可说。",
    "You don't touch Gran's mantelpiece. Nobody touches Gran's mantelpiece.": "你不会去碰奶奶的壁炉架。谁都不会。",
    "You edge toward the stair. Brimble's tail starts thumping the floor — *thud, thud, THUD* — and he gathers his enormous legs underneath him.": "你慢慢挪向楼梯。布林布尔用尾巴拍起地板——*咚，咚，咚！*——接着把几条粗大的腿收回身下。",
    "You fit the little brass key from the well into the keyhole. It turns sweetly, as if it has been waiting for exactly this.": "把井里的铜钥匙放进钥匙孔里，它变的很甜，好像它一直在等待着这个。",
    "You flip the penny. Heads. You decide that means something good.": "你把便士抛向空中。正面朝上。你决定这一定是个好兆头。",
    "You give Brimble a gentle pat. He smiles in his sleep.": "你给布兰布尔一个温柔的拍手 他睡着时会笑",
    "You give Gran a hug. She hugs you back a little too carefully, the way you'd hug someone you'd only just met.": "你抱了抱奶奶。她也抱住你，却显得格外小心，像是在拥抱一个刚认识的人。",
    "You give the fire a poke. It sends up a fountain of sparks, which is satisfying, and nothing else, which is not.": "你拨了拨炉火，火星喷泉般蹿起，这点倒挺令人满意。除此之外什么也没发生，这就不大令人满意了。",
    "You give the horse a push. It rocks, and settles, and waits for someone who will be better at playing with it.": "你推马，它会摇动，会安顿下来，等待一个能玩得更棒的人。",
    "You give the signpost a push. It points the same way, but slightly more firmly.": "你推一下路标，它指向相同方向，但更坚定一点。",
    "You give the troll a sharp poke with Gran's poker. He looks down at the poker, and then at you, with an expression of deep and sorrowful disappointment. Then he picks you up, very gently, and drops you in the Grumblewater — which carries you all the way to the sea. You have a great many adventures there, but none of them are this one.": "你用奶奶的扑克棒尖刺巨怪。他低头看着扑克，然后又看你，表达着深深的悲伤失望。然后他轻轻地把你接起来，把你扔进格鲁姆布莱特河里，这把你一路带到海里。你在那里经历了许多冒险，但没有一个是这样的。",
    "You give yourself a cautious prod. Yes. It is definitely pointy enough.": "你小心翼翼地戳了自己一下。嗯，确实够尖了。",
    "You go into me every night and come out of me every morning, and not one person has ever seen my door. WHAT AM I?": "每晚你都会走进我，每天清晨又从我这里离开。却从来没有一个人见过我的门。我是什么？",
    "You have a feeling you know whose it is.": "你隐约猜到这是谁的东西了。",
    "You haven't a match, a ladder, or the lighting-song. The lamp stays dark.": "你没有匹配，梯子，灯光的歌声，灯光一直暗着",
    "You heave at the ladder. It won't budge an inch — the wheel is gummed up with old wax. You'd need something to dig it out.": "你压在梯子上，它一寸都动不了，车轮被老蜡粘住了，你需要东西来挖出来。",
    "You hold it to your ear. Very small and very far away, Gran's voice is saying, *\"Once upon a time—\"*": "你把它贴在耳边。远远传来奶奶细小的声音：*“很久很久以前——”*",
    "You hold out the golden quill. Corvin stares at it as if it were a ghost.": "你拿着金毛笔，柯文看着它就像鬼一样",
    "You hold out the little hand-sewn book. Corvin takes it as if it might crumble.": "你拿着那本小手缝书 科尔文把它当做是会崩溃的",
    "You hold the Book of Tales up to the Loom. The threads bend toward it like plants toward a window — but they're caught fast. The Book can't take them home while the Loom holds them.": "你拿着《故事》的经典，到卢姆河边去。线条像植物一样向它弯曲，但那些植物被迅速捕捉。在卢姆河边，那本经典不能把他们带回家。",
    "You hold the Book of Tales up to the shelves. The bottles hum a little louder, but these aren't Gran's stories. Hers glow gold.": "你朝着架子举起《故事书》。瓶子的嗡鸣声大了一点，可这些不是奶奶的故事。她的会发出金光。",
    "You hold the Unfinished Tale up by her pillow. Her eyelids flicker.": "你将未完成的故事放在她的枕头边 她的眼皮闪烁着",
    "You hold up Gran's glowing bottle. The light falls across her face, warm and gold. But these are Gran's stories. Elsie is waiting for someone else's.": "你拿起奶奶的发光瓶，光光落在她脸上，温暖和金色，但这些是奶奶的故事，艾尔西在等别人的故事。",
    "You hold up Gran's lucky penny. It catches the moonlight.": "你拿起奶奶的幸运钱，它抓住月光",
    "You hold up the glowing bottle. Gran leans toward it like a plant toward a window, but frowns. \"Not in the bottle, love. Stories don't go back in through your ears. They go in the Book.\"": "你举起发光的小瓶。奶奶像一株朝向窗口的植物，向它靠过去，又皱起眉头。“不能留在瓶子里，亲爱的。故事可不是从耳朵里倒回去的。要把它们放进书里。”",
    "You hold up the little brass key. Tatters looks at it for a long time, head on one side.": "你拿着小铜钥匙 塔特斯看它很久了，头朝一边",
    "You hold your hands out to the fire. It helps, a little.": "你朝炉火伸出双手。暖和了一点儿。",
    "You kneel by the bed and whisper her name.": "你跪在床上低声说出她的名字",
    "You knock. From inside, a muffled voice says: \"Go away. Unless you know the second verse of *The Plough and the Pheasant*.\" You don't. Nobody does. That's rather the problem.": "你敲门，从里面，一个闷闷不乐的声音说，“走开，除非你知道第二段“犁和肥”。你没有，没有人知道，问题就在于此。",
    "You knock. The door flies open before your knuckles have finished, and an old woman peers up at you through a cloud of steam.": "你敲门，门在你的指关节还没关好就打开了 一个老女人的同伴在蒸汽云中朝你冲过去",
    "You knot Gran's washing-line rope around the winch post — twice, and then once more for luck — and lower yourself hand over hand into the dark.": "你把奶奶的洗线绳子绑在绞盘上——两次，然后再次为运气着想——然后把你的手放在黑暗中。",
    "You lay the golden quill on the quilt beside her hand. Her fingers curl toward it in her sleep, the way they must have curled around her father's pen when she was tiny.": "你把她的手指卷在她睡觉时 她父亲的笔上 一定是在她很小的时候",
    "You leave the notices where they are. It's the only place the village's stories still exist — as a list of everything it has lost.": "将通知留在原处，这是村里故事唯一继续存在的地方——作为它失去的一切的清单。",
    "You leave them alone. You know how *that* story goes, at least.": "别管他们，你知道故事会怎样",
    "You lift Gran's poker and bring it down on the Loom with everything you've got.": "你拿起奶奶的扑克牌 带着你拥有的一切 把它带到了Loom上",
    "You lift the rope off its peg and sling it over your shoulder. Every adventurer in every one of Gran's stories carried a rope. You never found out why. Perhaps tonight you will.": "你从木钉上取下绳子，甩到肩上。奶奶的故事里，每个冒险者都带着一根绳子。你一直不知道为什么。也许今晚就会知道了。",
    "You lower the poker. Corvin, who had turned at the sound of it, lets out a breath he didn't know he was holding.": "柯文，他转过身来，让他喘口气，他不知道自己在握着",
    "You lower the poker. Whatever this is, it isn't going to be solved by hitting it.": "放下扑克牌 不管是什么 都无法用击打它来解决",
    "You make a dash for the stair. Brimble, delighted, makes a dash for you. The stair is narrow. Brimble is not. The Book of Tales notes, in fairness to him, that he was only trying to say hello.": "Brimble很高兴，你很高兴，你也很高兴，楼梯很窄，布林姆布不是，《故事书》说他只是想问候你",
    "You make a small snowball, and then, lacking anyone to throw it at, eat it. It tastes of cold.": "你做了个小雪球，然后，缺乏人 扔它，吃它，它味道很冷。",
    "You mutter to the empty air. The empty air, as usual, has nothing to add.": "你对着空无一人的地方嘀咕了几句。和往常一样，空气没什么要补充的。",
    "You open the Book of Tales and begin to read to her — but it's not her story, and she doesn't stir.": "你打开\"故事书\",开始向她念——但这不是她的故事，她不会搅动。",
    "You open the Book of Tales to its blank pages, pull the cork from Gran's bottle, and tip it.": "你把《故事书》翻到空白处，拔掉奶奶那只瓶子的塞子，轻轻一倒。",
    "You open the Unfinished Tale to where the ink runs out, and lift the golden quill.": "你把《未写完的故事》翻到墨迹中断的那一页，拿起金羽毛笔。",
    "You open the little hand-sewn book. The handwriting is careful and tall, the handwriting of someone who wanted it read aloud.": "你打开手工缝订的小册子。字迹细长工整，一看就知道，写字的人盼着有人能把它大声读出来。",
    "You pat Brimble on the nose. He licks you from your knees to your eyebrows in one enthusiastic swipe.": "你拍Brimble的鼻子，他用一个热情的擦擦你的双膝舔你的眉毛",
    "You pat Gubbins on the knee. It is like patting a hillside that has feelings.": "你拍古宾斯的膝盖，就像拍山坡那样，有感情",
    "You peer down. The glint winks back up at you. It's far too far to reach, and the stones inside are slick with moss.": "你低头，闪闪闪的闪闪闪发光，太远了，里面的石头都飞得飞滑的",
    "You pick a small posy of moonbells. They go on glowing in your hand, and you yawn so widely your jaw clicks.": "你选一小堆月钟，它们继续在你手上发光，并打呼噜声如此的广。",
    "You pick it up again. It wants a hand that knows the story.": "你再捡一次，它想要一只知道故事的手",
    "You pull one down and flip through it. Blank. And another. Blank. In a third, the title page says *The* — just *The* — as if even the rest of the title ran off in the night.": "你抽出一本翻了翻。空白。另一本，也是空白。第三本的扉页上写着*那个*——只有*那个*——仿佛书名里其余的字也趁夜逃走了。",
    "You push against the great stone door. It is as shut as a door can be. Above you, the stone face clears its throat meaningfully.": "你推着大石门，它就像门一样闭着，在你上面，石头面能真正地清清喉咙。",
    "You put it carefully back. It isn't yours to open.": "你小心放回去，不是你的开口",
    "You put that down before you have somebody's eye out.": "快放下，别戳到别人的眼睛。",
    "You rap the poker on the stone lip. The face looks down at you with enormous, geological disappointment.": "你吹奏石嘴唇上的扑克牌，脸朝下看着你时，在地质上极其失望。",
    "You reach for the bone.": "你伸手去拿骨头。",
    "You reach toward the threads. They are warm, and they hum, and for a moment you hear Pell's mother singing a lullaby you had forgotten you knew. You snatch your hand back.": "你伸向线条，它们很温暖，哼哼，听到佩尔的母亲唱着摇篮曲，你忘了你知道，你把你的手拿回来。",
    "You reach up and knock on the stone chin.": "你伸手敲敲石头下巴。",
    "You roll it along the rail — past a hundred, a thousand glowing bottles — until it stops beneath the one that shines like Gran's fire.": "你沿着铁路滚，——过去一百个，一千个发光瓶—— 直到它停在像奶奶的火一样闪耀的灯下。",
    "You ruffle Pell's hair. She swats you away without looking up.": "你给佩尔梳头发 她不抬头就把你甩了",
    "You scratch Button behind the ears. Button purrs like a small, furry kettle and does not wake up.": "你挠了挠纽扣的耳后。它发出小小的呼噜声，像个毛茸茸的水壶，眼睛都没睁。",
    "You show Pell the blank Book of Tales. \"That's the most boring book I've ever seen,\" she says, with feeling.": "你给佩尔看空白的《故事》 \"这是我见过的最无聊的书\" 她说，有感觉的",
    "You show him the Book of Tales. The troll peers at the blank pages for a long time.": "你给他看《故事书》 长期在空白版的巨魔同行",
    "You sniff the moonbells and give an enormous yawn. Best not do that again until you're somewhere with a pillow.": "你闻了闻月铃花，打了一个大大的哈欠。下次还是等身边有枕头的时候再闻吧。",
    "You stay well back. Heroes in stories are always leaning over things. It never ends well.": "故事中的英雄总是在为事情着想，结果永远是不好的",
    "You step back from the edge. Somewhere, a sensible version of you nods approvingly.": "你从崖边退开一步。你仿佛看见，那个更理智的自己赞许地点了点头。",
    "You step carefully over the sleeping Brimble, climb the stair, pass through the golden archway — and stop.": "你小心地踩过睡梦中的布林布尔，爬上楼梯，穿过金色的拱门——然后停下来。",
    "You step out into the cold. Brackenford Green is lit only by its windows, and it is quiet — so quiet you can hear the Grumblewater muttering to itself away to the north.": "你走进寒冷的角落。布拉肯福德格林只靠它的窗户点着，它很安静——你听到北边的格鲁姆水流着。",
    "You step right up to the edge to admire the view. The view, it turns out, is best admired from a little further back. The Book of Tales records that you reached Brackenford again in record time, by the most direct route available.": "近距离看，风景最受欢迎。 《故事书》记录了您在创纪录的时间内，以最直接的路线，再次到达布拉肯福德。",
    "You straighten the frame. It was already straight. Wenna keeps it that way.": "你把框架理直了，已经是直了，文娜也照样",
    "You straighten your scarf and square your shoulders. Courage restored — slightly.": "你理了理围巾，挺起双肩。勇气恢复了一点点。",
    "You swing Gran's poker at the Warlock of Greymantle. Corvin Hale doesn't even turn round. He flicks two fingers, and you become a book: slim, handsomely bound in blue calfskin, with gilt edges and a ribbon bookmark. You are shelved in the library between *The Miller's Ballad* and *How the Baker's Grandmother Met a Bear*, and are very occasionally dusted.": "你挥棒奶奶的扑克牌在格雷曼特的沃洛克。科尔文·黑尔甚至不转身。他弹动两根手指，你变成了一本书: 瘦小、英俊的装在蓝色小牛皮上，有金丝网边缘和丝带书签。你被放在图书馆里，放在“米勒的巴拉德”和“贝克的祖母如何遇见一只熊”之间，偶尔也会被打灰。",
    "You swing a leg over the edge and start down the slick stones. For about four feet, it goes very well. The Book of Tales, which is honest to a fault, records that you reached the bottom considerably faster than you intended, and that it was not a *wishing* well, whatever the village children say.": "将一条腿伸到边缘，然后从浮石上开始。大约四英尺的高度，它非常顺利。《故事书》诚实地对一个错误负责，记录了你到达底部的速度远比你预期的要快得多，而且它不是一个“渴望”的好东西，不管乡村儿童怎么说。",
    "You swipe at the nest with the poker. The magpie screams bloody murder and dive-bombs your head until you stop.": "你用扑克牌在巢穴偷袭 黑猩猩尖叫着血腥的谋杀 并用俯冲炸弹轰击你的头直到你停下来",
    "You take one little sip. Then, because it is delicious, another. You wake up a hundred years later, which in a fairy story would be the beginning of something. Unfortunately, the Book of Tales records that you slept through the rest of your own adventure, the Warlock, the end of the world, and a very nice breakfast.": "你抿了一小口。味道好极了，于是又喝了一口。等你醒过来，已经过了一百年。放在童话里，这往往是某件大事的开头。可惜《故事书》记得很清楚：你一觉睡过了自己余下的冒险，睡过了男巫和世界末日，还错过了一顿很不错的早餐。",
    "You take the poker. It is heavy and black and it makes you feel about four inches taller. You would not, of course, *hit* anybody with it.": "你拿起火钳。它又黑又沉，让你觉得自己顿时长高了一截。当然，你是绝不会用它*打人*的。",
    "You think better of it. The troll, who saw all of that, thinks slightly less of you.": "你更想，看到这些的巨怪 对你的看法略微小些",
    "You tickle your own nose with the golden quill and sneeze. The magpie would be ashamed of you.": "你拿金羽毛笔挠了挠鼻子，打了个喷嚏。喜鹊看见肯定会替你害臊。",
    "You toss the drowsy bone. Brimble catches it out of the air with a snap like a door slamming, flops down, and begins to gnaw it with enormous contentment.": "Brimble把它从空气中抓住了，并用一个像门的撞击，软盘下，开始用巨大的满足感来捕捉它。",
    "You touch the third figure. The stone is warm, as if somebody's hand was on it not long ago.": "你摸到第三个图，石头很温暖 好像不久前有人在石头上",
    "You try to lever the slabs apart with the poker. You might as well try to lever the mountain apart with a spoon.": "你用扑克牌把板子拉开，不如用勺子把山拉开",
    "You try to squeeze past the troll. The troll is roughly the size and shape of a garden shed, and exactly as easy to squeeze past.": "巨怪的大小和形状都跟花园棚一样，很容易挤过去。",
    "You try to wind yourself up with the little key. You are, it turns out, already wound up quite enough.": "你试着用小钥匙给自己上发条。事实证明，你这根弦已经绷得够紧了。",
    "You tuck the Unfinished Tale between the pages of the Book of Tales. The Book promptly spits it out again, like a cat declining medicine. It seems to think the story isn't finished enough to keep.": "你把《未写完的故事》夹进《故事书》里。《故事书》马上又把它吐了出来，活像只不肯吃药的猫。看来它觉得这故事还没写完，不值得收藏。",
    "You tuck the quilt in a little more firmly around her. She sighs, but doesn't wake.": "你把她的毛毯套在她周围 她叹气，但不会醒过来",
    "You tug at the Warlock's sleeve. He looks down at you, briefly, as if you were a very small interruption in a very long night.": "你拖着沃洛克的袖子，他看着你，短暂地，好像你是一个非常漫长的夜晚的很小的中断。",
    "You unstopper the little blue vial. It smells of moonbells and warm blankets and every Sunday afternoon you ever napped through.": "你打开蓝色小瓶。里面有月铃花、暖被窝，还有你打着盹儿度过的每一个星期日下午的气息。",
    "You unstopper the vial and dribble the sleeping draught over the soup bone — three drops for a hound, Wenna said, so you use rather more than that, on account of Brimble being the size of a pony.": "你拔开瓶塞，把安眠药水滴在汤骨上。温娜说给猎犬用三滴。考虑到布林布尔足有小马驹那么大，你多滴了不少。",
    "You unwrap Gran's honey cake and hold it out on your palm.": "你解开奶奶的蜜蛋糕 放在手掌上",
    "You wade into the Grumblewater, which immediately stops grumbling and starts *shouting*. It sweeps you off your feet, under the bridge, and away down the valley in a great deal of a hurry. You are found three days later on a sandbar, very wet, very cross, and very much too late.": "你走进格鲁姆波尔水中，它立刻停止了抱怨，开始“呼喊 ”。 它将你从脚下、桥下、山谷下扫走，匆匆匆忙忙。三天后，你被发现在一个沙滩上，非常湿润，非常交叉，而且太迟了。",
    "You warm your hands. It is a very comforting brazier.": "手暖暖，这真是令人安慰的胸围",
    "You warm your hands. Your fingers come back to you one at a time.": "你烤着双手。指头一根接一根地恢复了知觉。",
    "You whisper back. The pines fall quiet, as if embarrassed to have been overheard.": "你悄悄回声，松树掉下来了，好像被人偷听了一样尴尬",
    "You wrap the honey cake in a handkerchief and tuck it in your satchel. Your stomach makes an objection, which you overrule.": "你把蜂蜜蛋糕用手帕包好，塞进背包。肚子提出了抗议，但你驳回了。",
    "You'd rather keep it. It took moonbells to make.": "你还是想把它留下来。做它可用掉了月铃花呢。",
    "You'd sooner not break a door with a lighthouse on it. It feels like it belongs to someone.": "你早点不要把灯塔砸开，感觉好像属于别人",
    "You're tempted. But Gran always said a honey cake is for sharing, and you have a feeling somebody out there needs it more than you do.": "你很想吃。可是奶奶总说蜂蜜蛋糕要和别人分享，你有种预感：一路上会有人比你更需要它。",
    "You've had quite enough of the well for one night.": "你今晚喝得够多了",
    "You've picked a posy already. Leave the rest to glow.": "你已经选了个保镖 剩下的留给你发光吧",
    "Your Loom takes stories. Take mine. All of it — tonight, and Gran, and everything. Weave Elsie an ending out of me, and give the rest back.": "带上我的，今晚，格兰，还有一切，帮我编一个结局，把剩下的还给我。",
    "Your head is as blank as Gran's book. You try again.": "你的头和奶奶的书一样空荡荡的 你再试一次",
    "Your satchel is empty.": "你的背包是空的。",
    "Your tale has been saved.": "故事进度已保存。",
    "Your tale resumes.": "你的故事继续了。",
    "a — I can't remember who rescues her. Gran Mab would know. Gran Mab knows everything.": "我不记得是谁救她了 奶奶会知道的 奶奶知道一切",

    [/^(.*?) \*Thank you for playing The Story Thief of Greymantle\. Luckily, this is the kind of book you can turn back a page in\.\*$/, "$1 * 谢谢你出演\"灰门贼的故事\" 幸运的是，这是你能够翻回一页的书。*"],
    [/^You take down a bottle at random\. The label reads: \*(.*?)\.\* It's warm, and it hums\.$/, (_, v1) => "标注是: *" + PureTVChinese.translate(v1) + ". * 温暖，哼哼。"],
    [/^Using the (.{0,240}?) on (.*?) achieves nothing, apart from a slight feeling of embarrassment\.$/, (_, v1, v2) => PureTVChinese.translate(v2) + "上使用" + PureTVChinese.translate(v1) + "号机除了略感尴尬外，没有实现任何目的。"],
    [/^You wave the (.{0,240}?) at (.*?)\. Nothing happens\. You put it away before anyone notices\.$/, (_, v1, v2) => "你挥动" + PureTVChinese.translate(v1) + "号，" + PureTVChinese.translate(v2) + "号，什么事都没有，你先把它收起来，再不通知别人"],
    [/^You try making conversation with (.*?)\. It's a short conversation\.$/, (_, v1) => "你试着和" + PureTVChinese.translate(v1) + "谈话，这是个简短的谈话。"],
    [/^You can't think of anything useful to do with (.*?)\.$/, "$1号，你根本想不出有什么有用的东西。"],
    [/^The (.{0,240}?) and (.*?) have nothing to say to one another\.$/, (_, v1, v2) => PureTVChinese.translate(v1) + "和" + PureTVChinese.translate(v2) + "号两条无话可说。"],
    [/^You can't see how the (.{0,240}?) and the (.*?) go together\.$/, (_, v1, v2) => "你看不出" + PureTVChinese.translate(v1) + "和" + PureTVChinese.translate(v2) + "之间有什么联系。"],
    [/^You can't think how the (.{0,240}?) would help with (.*?)\.$/, (_, v1, v2) => PureTVChinese.translate(v1) + "号怎么能帮助" + PureTVChinese.translate(v2) + "号"],
    [/^(.*?) times, each of them educational$/, "$1次，每一次都受过教育"],
    [/^Endings found: (.{0,240}?) of (.*?)$/, (_, v1, v2) => "已发现结局：" + PureTVChinese.translate(v1) + "／" + PureTVChinese.translate(v2)],
    [/^opacity (.*?)ms$/, (_, v1) => "透明度 " + PureTVChinese.translate(v1) + "毫秒"],
    [/^No scene (.*?)$/, (_, v1) => "没有场景" + PureTVChinese.translate(v1)],
    [/^\+(.*?) points$/, "＋$1 分"],
    [/^Walk to (.*?)$/, (_, v1) => "走向" + PureTVChinese.translate(v1)],
    [/^Use (.{0,240}?) on (.*?)$/, (_, v1, v2) => "对" + PureTVChinese.translate(v2) + "使用" + PureTVChinese.translate(v1)],
    [/^Talk to (.*?)$/, (_, v1) => "与" + PureTVChinese.translate(v1) + "交谈"],
    [/^Look at (.*?)$/, (_, v1) => "观察" + PureTVChinese.translate(v1)],
    [/^Using: (.*?)$/, (_, v1) => "正在使用：" + PureTVChinese.translate(v1)],
    [/^Sound: (.*?)$/, (_, v1) => "音效：" + PureTVChinese.translate(v1)],
    [/^toast (.*?)$/, (_, v1) => "吐司" + PureTVChinese.translate(v1) + "号"],
    [/^pages (.*?)$/, (_, v1) => "第" + PureTVChinese.translate(v1) + "页"],
    [/^Text: (.*?)$/, (_, v1) => "文字速度：" + PureTVChinese.translate(v1)],
    [/^It's (.*?)\.$/, (_, v1) => "这是" + PureTVChinese.translate(v1) + "。"],
    [/^Use (.*?)$/, (_, v1) => "使用" + PureTVChinese.translate(v1)],
    [/^Go (.*?)$/, (_, v1) => "前往" + PureTVChinese.translate(v1)],

<body>
    <div id="tv-pause" role="dialog" aria-label="Paused" hidden><section><p>Paused</p><button id="tv-resume">Resume · START</button></section></div>
    <aside id="tv-guide">← → Targets · ↑ ↓ Verbs · A Interact · B Satchel · X Book · Y Menu · START Pause</aside>

    <div id="app">
        <div id="viewport">
            <canvas id="screen" aria-label="The adventure scene. Click to walk, look, use or talk."></canvas>
            <div id="hover" hidden></div>
            <div id="toasts" aria-live="polite"></div>
        </div>
        <div id="bar">
            <div id="verbs" role="toolbar" aria-label="Verbs">
                <button id="v-walk" class="verb" title="Walk (1)"><span>Walk</span></button>
                <button id="v-look" class="verb" title="Look (2)"><span>Look</span></button>
                <button id="v-use" class="verb" title="Use (3)"><span>Use</span></button>
                <button id="v-talk" class="verb" title="Talk (4)"><span>Talk</span></button>
            </div>
            <div id="inv" aria-label="Satchel"></div>
            <div id="sys">
                <div id="score" title="Score">0</div>
                <button id="b-book" class="sysbtn" title="The Book of Tales (B)" aria-label="The Book of Tales">📖</button>
                <button id="b-menu" class="sysbtn" title="Menu (Esc)" aria-label="Menu">☰</button>
            </div>
        </div>
    </div>

    <!-- narration / dialogue -->
    <div id="msg" hidden>
        <div id="msg-box" role="dialog" aria-live="polite">
            <div id="msg-who"></div>
            <div id="msg-text"></div>
            <div id="msg-choices"></div>
            <div id="msg-more" aria-hidden="true">▼</div>
        </div>
    </div>

    <!-- the Book of Tales -->
    <div id="book" hidden>
        <div id="book-sheet" role="dialog" aria-modal="true" aria-label="The Book of Tales">
            <div id="book-body"></div>
            <button id="book-close">Close the Book</button>
        </div>
    </div>

    <!-- menu -->
    <div id="menu" hidden>
        <div id="menu-sheet" role="dialog" aria-modal="true" aria-label="Menu">
            <h2>Menu</h2>
            <button data-act="save">Save your tale</button>
            <button data-act="load">Restore saved tale</button>
            <button data-act="help">How to play</button>
            <button data-act="sound" id="m-sound">Sound: On</button>
            <button data-act="speed" id="m-speed">Text: Normal</button>
            <button data-act="restart">Begin a new tale</button>
            <button data-act="title">Back to the title</button>
            <button data-act="close">Return to the story</button>
        </div>
    </div>

    <!-- storybook pages: prologue, death, endings, help -->
    <div id="pages" class="pages" hidden>
        <div id="pg-sheet">
            <h1 id="pg-title"></h1>
            <div id="pg-art"></div>
            <div id="pg-text"></div>
            <div id="pg-btns"></div>
        </div>
    </div>

    <!-- title -->
    <div id="title" hidden>
        <div id="title-art"></div>
        <div id="title-card">
            <div id="title-pre">A Tale of the Longest Night</div>
            <h1>The Story Thief<br><small>of Greymantle</small></h1>
            <div id="title-btns">
                <button id="t-new">Begin a New Tale</button>
                <button id="t-continue" hidden>Continue your Tale</button>
                <button id="t-howto">How to Play</button>
            </div>
            <div id="t-endings"></div>
        </div>
    </div>

    <div id="fade"></div>
