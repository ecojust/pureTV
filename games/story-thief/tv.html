<!DOCTYPE html>
<html lang="en">

    <meta name="theme-color" content="#0d0b14">

    <title>The Story Thief of Greymantle</title>

    <style>/* The Story Thief of Greymantle — layout and storybook styling */

:root {
    --ink: #2a1a12;
    --ink-soft: #5a4232;
    --parch: #f4ecd8;
    --parch-dark: #e4d4b0;
    --gold: #f4c542;
    --night: #0d0b14;
    --night2: #1b1f3b;
    --line: #6b4226;
    --serif: Georgia, 'Palatino Linotype', 'Book Antiqua', Palatino, serif;
    --gw: 640px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
    width: 100%;
    height: 100%;
    background: radial-gradient(ellipse at 50% 30%, #1b1f3b 0%, #0d0b14 70%);
    color: var(--parch);
    font-family: var(--serif);
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
}

button { font-family: inherit; cursor: pointer; }
[hidden] { display: none !important; }

#back {
    position: fixed; top: 8px; left: 8px; z-index: 99999;
    font-family: Arial, Helvetica, sans-serif; font-size: 13px;
    color: #fff; background: rgba(0, 0, 0, 0.55);
    padding: 6px 12px; border-radius: 6px; text-decoration: none;
    border: 1px solid rgba(255, 255, 255, 0.25);
}
#back:hover { background: rgba(0, 0, 0, 0.8); }

/* ---------- stage ---------- */

#app {
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
}

#viewport {
    position: relative;
    width: 640px;
    height: 400px;
    background: #000;
    box-shadow: 0 0 0 2px #3a2418, 0 0 0 5px #6b4226, 0 10px 40px rgba(0, 0, 0, 0.7);
    touch-action: manipulation;
}

#screen {
    display: block;
    width: 100%;
    height: 100%;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    cursor: crosshair;
}

#hover {
    position: absolute;
    pointer-events: none;
    padding: 3px 9px;
    font-size: 14px;
    white-space: nowrap;
    color: var(--parch);
    background: rgba(13, 11, 20, 0.82);
    border: 1px solid rgba(244, 197, 66, 0.45);
    border-radius: 4px;
    text-shadow: 0 1px 0 #000;
}

#toasts {
    position: absolute;
    top: 8px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    pointer-events: none;
    z-index: 5;
}
.toast {
    padding: 4px 12px;
    font-size: 14px;
    background: rgba(13, 11, 20, 0.85);
    border: 1px solid rgba(244, 236, 216, 0.3);
    border-radius: 14px;
    white-space: nowrap;
    animation: toastIn 0.25s ease-out;
    transition: opacity 0.5s, transform 0.5s;
}
.toast b { color: var(--gold); font-weight: normal; }
.toast.pts { color: var(--gold); }
.toast.ink { font-style: italic; color: #a8c8e8; }
.toast.out { opacity: 0; transform: translateY(-6px); }
@keyframes toastIn { from { opacity: 0; transform: translateY(6px); } }

/* ---------- bar: verbs, satchel, system ---------- */

#bar {
    width: var(--gw);
    max-width: 100%;
    display: flex;
    align-items: stretch;
    gap: 8px;
    padding: 8px 6px 6px;
    background: linear-gradient(#3a2418, #2a1a12);
    border: 2px solid #6b4226;
    border-top: none;
    border-radius: 0 0 8px 8px;
}

#verbs { display: flex; gap: 4px; }

.verb {
    width: 52px;
    min-height: 50px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    background: #1c2029;
    color: var(--parch-dark);
    border: 2px solid #555c6a;
    border-radius: 6px;
    font-size: 11px;
    letter-spacing: 0.5px;
}
.verb canvas { width: 28px; height: 28px; image-rendering: pixelated; }
.verb:hover { border-color: var(--parch-dark); }
.verb.on { border-color: var(--gold); background: #2b3a67; color: #fff; box-shadow: 0 0 8px rgba(244, 197, 66, 0.35); }

#inv {
    flex: 1;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(40px, 1fr));
    gap: 4px;
    align-content: center;
    min-width: 0;
}

.slot {
    aspect-ratio: 1;
    min-height: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #1c2029;
    border: 2px solid #3a2418;
    border-radius: 5px;
    box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.6);
}
.slot canvas { width: 32px; height: 32px; image-rendering: pixelated; }
.slot:not(:disabled):hover { border-color: var(--parch-dark); }
.slot.on { border-color: var(--gold); background: #2b3a67; }
.slot:disabled { cursor: default; opacity: 0.55; }

#sys { display: flex; flex-direction: column; align-items: stretch; gap: 4px; min-width: 64px; }
#score {
    text-align: center;
    font-size: 13px;
    color: var(--gold);
    padding: 2px 4px;
    background: #1c2029;
    border-radius: 4px;
}
#score.bump { animation: bump 0.6s; }
@keyframes bump { 30% { transform: scale(1.25); color: #fff; } }
#sys > div + div, .sysbtn-row { display: flex; gap: 4px; }
.sysbtn {
    flex: 1;
    min-height: 34px;
    font-size: 18px;
    background: #1c2029;
    color: var(--parch);
    border: 2px solid #555c6a;
    border-radius: 6px;
    position: relative;
}
.sysbtn:hover { border-color: var(--parch-dark); }
#b-book[data-count]:not([data-count=""])::after {
    content: attr(data-count);
    position: absolute;
    top: -6px; right: -6px;
    min-width: 17px; height: 17px;
    padding: 0 3px;
    font-size: 11px; line-height: 17px;
    border-radius: 9px;
    background: #b8332f;
    color: #fff;
    font-family: Arial, sans-serif;
}

/* ---------- message box ---------- */

#msg {
    position: fixed;
    inset: 0;
    z-index: 50;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    padding: 16px 16px max(16px, 12vh);
    background: rgba(13, 11, 20, 0.25);
}

#msg-box {
    position: relative;
    width: min(600px, 100%);
    max-height: 70vh;
    overflow-y: auto;
    padding: 18px 22px 22px;
    color: var(--ink);
    background: var(--parch);
    background-image: radial-gradient(ellipse at 30% 20%, rgba(255, 255, 255, 0.5), transparent 60%),
        radial-gradient(ellipse at 80% 90%, rgba(160, 112, 60, 0.18), transparent 60%);
    border: 3px double #6b4226;
    border-radius: 4px;
    box-shadow: 0 8px 30px rgba(0, 0, 0, 0.6);
    font-size: 18px;
    line-height: 1.5;
    cursor: pointer;
    animation: msgIn 0.18s ease-out;
}
@keyframes msgIn { from { opacity: 0; transform: translateY(8px); } }

#msg.speech #msg-box { padding-top: 26px; }
#msg-who {
    position: absolute;
    top: -2px;
    left: 16px;
    transform: translateY(-50%);
    padding: 2px 12px;
    background: #2a1a12;
    border: 2px solid #6b4226;
    border-radius: 12px;
    font-size: 15px;
    font-variant: small-caps;
    letter-spacing: 1px;
}
#msg-box { overflow: visible; }
#msg-text p + p { margin-top: 0.6em; }
#msg-text em { color: #6e1f24; }

#msg-more {
    position: absolute;
    right: 12px;
    bottom: 4px;
    font-size: 12px;
    color: var(--ink-soft);
    animation: blink 1s infinite;
}
@keyframes blink { 50% { opacity: 0.2; } }

#msg-choices { display: flex; flex-direction: column; gap: 6px; }
#msg-text:not(:empty) + #msg-choices:not(:empty) { margin-top: 12px; }

.choice {
    display: flex;
    align-items: baseline;
    gap: 10px;
    text-align: left;
    padding: 8px 12px;
    font-size: 17px;
    line-height: 1.35;
    color: var(--ink);
    background: rgba(207, 161, 104, 0.18);
    border: 1px solid rgba(107, 66, 38, 0.4);
    border-radius: 4px;
}
.choice:hover, .choice:focus-visible { background: #2b3a67; color: var(--parch); outline: none; }
.choice .num { font-size: 13px; opacity: 0.6; min-width: 1em; }

/* ---------- the Book of Tales ---------- */

#book, #menu {
    position: fixed;
    inset: 0;
    z-index: 60;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    background: rgba(13, 11, 20, 0.7);
}

#book-sheet {
    width: min(620px, 100%);
    max-height: 90vh;
    display: flex;
    flex-direction: column;
    color: var(--ink);
    background: var(--parch);
    border: 10px solid #6e1f24;
    border-radius: 6px;
    box-shadow: inset 0 0 40px rgba(160, 112, 60, 0.35), 0 10px 40px rgba(0, 0, 0, 0.7);
}
#book-body { overflow-y: auto; padding: 26px 30px 10px; line-height: 1.6; font-size: 17px; }
#book-body h2 { text-align: center; font-variant: small-caps; letter-spacing: 2px; font-weight: normal; font-size: 26px; color: #6e1f24; }
.book-sub { text-align: center; font-style: italic; color: var(--ink-soft); margin: 4px 0 22px; font-size: 15px; }
.entry { margin-bottom: 1em; }
.entry p:first-child::first-letter {
    float: left;
    font-size: 2.9em;
    line-height: 0.9;
    padding: 4px 6px 0 0;
    color: #b8332f;
}
.entry::after { content: '❦'; display: block; text-align: center; color: #a0703c; margin-top: 0.6em; clear: both; }
.book-end { text-align: center; font-style: italic; color: var(--ink-soft); font-size: 14px; margin: 6px 0 12px; }
#book-close, #menu-sheet button, #pg-btns button, #title-btns button {
    margin: 10px auto 16px;
    padding: 9px 22px;
    font-size: 16px;
    color: var(--parch);
    background: #2b3a67;
    border: 2px solid var(--gold);
    border-radius: 5px;
}
#book-close:hover, #menu-sheet button:hover, #pg-btns button:hover, #title-btns button:hover,
#book-close:focus-visible, #menu-sheet button:focus-visible, #pg-btns button:focus-visible, #title-btns button:focus-visible {
    background: #3f5f9a;
    outline: none;
}

/* ---------- menu ---------- */

#menu-sheet {
    width: min(320px, 100%);
    display: flex;
    flex-direction: column;
    padding: 18px;
    background: #1b1f3b;
    border: 3px double var(--gold);
    border-radius: 6px;
}
#menu-sheet h2 { text-align: center; font-weight: normal; font-variant: small-caps; letter-spacing: 2px; margin-bottom: 8px; color: var(--gold); }
#menu-sheet button { margin: 4px 0; width: 100%; }

/* ---------- storybook pages ---------- */

.pages {
    position: fixed;
    inset: 0;
    /* Above the title (80) so How to Play shows from it; below #fade (90). */
    z-index: 85;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    overflow-y: auto;
    background: radial-gradient(ellipse at 50% 40%, #1b1f3b, #0d0b14 75%);
}
#pg-sheet {
    width: min(660px, 100%);
    margin: auto;
    padding: 24px 28px 8px;
    color: var(--ink);
    background: var(--parch);
    border: 3px double #6b4226;
    border-radius: 4px;
    box-shadow: 0 10px 50px rgba(0, 0, 0, 0.8);
    animation: pageIn 0.4s ease-out;
}
@keyframes pageIn { from { opacity: 0; transform: translateY(10px) rotate(-0.4deg); } }
#pg-title { text-align: center; font-weight: normal; font-variant: small-caps; letter-spacing: 2px; color: #6e1f24; font-size: 28px; margin-bottom: 12px; }
#pg-art { display: flex; justify-content: center; margin-bottom: 14px; }
.pg-canvas { width: 100%; max-width: 600px; height: auto; image-rendering: pixelated; border: 3px solid #3a2418; }
.death .pg-canvas { width: 192px; }
#pg-text { font-size: 18px; line-height: 1.6; }
#pg-text p + p { margin-top: 0.7em; }
#pg-text em { color: #6e1f24; }
#pg-btns { display: flex; flex-wrap: wrap; justify-content: center; gap: 0 10px; margin-top: 10px; }
.pages.death #pg-sheet { background: #e4d4b0; }
.pages.death #pg-title { color: #6e1f24; }
.pages.help #pg-text { font-size: 16px; }

/* ---------- title ---------- */

#title {
    position: fixed;
    inset: 0;
    z-index: 80;
    display: flex;
    align-items: flex-end;
    padding-bottom: 6vh;
    justify-content: center;
    background: var(--night);
}
#title-art { position: absolute; inset: 0; }
#title-art canvas { width: 100%; height: 100%; object-fit: cover; image-rendering: pixelated; }
#title-card {
    position: relative;
    text-align: center;
    padding: 20px 30px 16px;
    margin: 16px;
    background: rgba(13, 11, 20, 0.62);
    border: 3px double rgba(244, 197, 66, 0.7);
    border-radius: 6px;
    backdrop-filter: blur(1px);
}
#title-pre { font-style: italic; color: #a8c8e8; letter-spacing: 1px; }
#title-card h1 {
    font-weight: normal;
    font-variant: small-caps;
    font-size: clamp(34px, 7vw, 58px);
    line-height: 1;
    letter-spacing: 2px;
    color: var(--gold);
    text-shadow: 0 2px 0 #6e1f24, 0 0 24px rgba(244, 197, 66, 0.35);
    margin: 8px 0 14px;
}
#title-card h1 small { font-size: 0.55em; color: var(--parch); text-shadow: 0 2px 0 #000; }
#title-btns { display: flex; flex-direction: column; align-items: center; }
#title-btns button { margin: 4px 0; min-width: 230px; }
#t-endings { margin-top: 6px; font-size: 14px; color: #a8c8e8; font-style: italic; min-height: 1em; }

#fade {
    position: fixed;
    inset: 0;
    z-index: 90;
    pointer-events: none;
    background: var(--night);
    opacity: 1;
}

/* ---------- small screens ---------- */

@media (max-width: 700px) {
    #app { justify-content: flex-start; padding-top: 48px; }
    #bar { flex-wrap: wrap; gap: 6px; }
    #verbs { order: 1; }
    #sys { order: 2; flex-direction: row; align-items: center; margin-left: auto; }
    #score { font-size: 12px; }
    .sysbtn { min-width: 44px; min-height: 44px; }
    #inv { order: 3; flex-basis: 100%; grid-template-columns: repeat(8, 1fr); }
    .slot { min-height: 34px; }
    .slot canvas { width: 26px; height: 26px; }
    .verb { width: 48px; min-height: 46px; }
    #msg { padding-bottom: 16px; }
    #msg-box { font-size: 16px; padding: 16px 16px 20px; }
    .choice { font-size: 15px; }
    #pg-sheet { padding: 18px 16px 6px; }
    #pg-text { font-size: 16px; }
    #book-body { padding: 20px 18px 8px; font-size: 16px; }
}

/* ---------- phones on their side: the bar goes beside the scene ---------- */

#app.side {
    flex-direction: row;
    justify-content: center;
    align-items: center;
    gap: 6px;
    padding: 4px;
}
#app.side #bar {
    width: 188px;
    max-width: none;
    max-height: calc(100vh - 8px);
    overflow-y: auto;
    flex-direction: column;
    flex-wrap: nowrap;
    gap: 6px;
    padding: 6px;
    border: 2px solid #6b4226;
    border-radius: 8px;
}
#app.side #verbs { order: 0; display: grid; grid-template-columns: 1fr 1fr; }
#app.side .verb { width: auto; min-height: 44px; flex-direction: row; gap: 6px; }
#app.side .verb canvas { width: 22px; height: 22px; }
#app.side #inv { order: 1; flex: none; grid-template-columns: repeat(4, 1fr); }
#app.side .slot { min-height: 38px; }
#app.side .slot canvas { width: 26px; height: 26px; }
#app.side #sys { order: 2; flex-direction: row; align-items: center; margin: 0; }
#app.side #score { flex: 1; }
#app.side .sysbtn { min-width: 44px; min-height: 40px; flex: none; }
#app.side ~ #msg { padding-bottom: 8px; }
#tv-guide {position:fixed;bottom:0;left:0;right:0;background:#171321;color:#f5dcad;font:13px/24px system-ui;text-align:center;z-index:40;pointer-events:none}
#tv-pause:not([hidden]) {position:fixed;inset:0;background:#171321bf;color:#f7dca4;display:grid;place-items:center;z-index:220}
#tv-pause section {text-align:center;background:#302639;border:2px solid #b39a72;padding:1rem 3rem}
#tv-pause p {font:700 26px Georgia,serif}
#tv-pause button {font-size:18px;padding:8px 16px}
body[data-puretv-joining="true"] #tv-pause { right:min(236px,35vw); }
#hover.tv-target {background:#241b2b;border:1px solid #f2cd76;max-width:90%;white-space:normal}
#bar button.tv-selected {outline:3px solid #f6ce6f;outline-offset:1px}
#app {height:calc(100% - 24px)}
body[data-puretv-playing="true"] #tv-guide {display:none}
body[data-puretv-playing="true"] #app {height:100%}

/* Menus reserve a column for pairing and instructions. Gameplay uses the full viewport. */
:root { --tv-gutter: 216px; }
#puretv-controller-panel { z-index: 200 !important; }
.screen { right: var(--tv-gutter) !important; padding-top: 16px !important; }
#hud { right: calc(var(--tv-gutter) + 12px) !important; }
#btn-pause, #b-pause { right: calc(var(--tv-gutter) + 12px) !important; }
#back, #back-link { display: none !important; }
#tv-controls { position: fixed; z-index: 20; right: 12px; bottom: 16px; width: 192px;
  color: #c5d6e7; font: 14px/1.65 system-ui, sans-serif; white-space: pre-line; }
#tv-controls strong { display: block; color: #fff; font-size: 17px; margin-bottom: 8px; }
button:focus, select:focus, input:focus { outline: 3px solid #f6c65d !important; outline-offset: 2px; }
.sheet { max-height: calc(100vh - 32px); }
@media (max-height: 560px) {
  .sheet { padding: 12px; }
  .logo { font-size: 42px; }
  .menu { gap: 7px; }
  .btn { min-height: 38px; padding: 7px 14px; }
  #tv-controls { font-size: 12px; }
}

body[data-puretv-playing="true"] { --tv-gutter: 0px; }
body[data-puretv-playing="true"] #tv-controls { display: none; }
body[data-puretv-playing="true"] #puretv-controller-panel[data-playing=true] {
  top: auto !important; bottom: 6px; right: 6px;
}

<script>
// Offline Simplified Chinese for ports whose upstream UI draws its own text.
(() => {
  const ignored = 'script,style,noscript,template,textarea,[contenteditable="true"],[translate="no"]';
  const attributes = ['title', 'placeholder', 'aria-label', 'alt'];
  let translate = text => text;
  let installed = false;

  function install({ strings, patterns = [] }) {
    if (installed) return;
    installed = true;

    function lookup(text) {
      if (Object.prototype.hasOwnProperty.call(strings, text)) return strings[text];
      const normalized = text.replace(/\s+/g, ' ');
      if (Object.prototype.hasOwnProperty.call(strings, normalized)) return strings[normalized];
      for (const [pattern, replacement] of patterns) {
        if (pattern.test(text)) return text.replace(pattern, replacement);
      }
      return text;
    }
    translate = value => {
      if (typeof value !== 'string') return value;
      const text = value.trim();
      if (!text) return value;
      let result = lookup(text);
      if (result === text && text.includes('\n')) {
        result = text.split('\n').map(line => translate(line)).join('\n');
      }
      return result === text ? value : value.replace(text, () => result);
    };

    // Canvas games often use measureText to wrap the same labels they draw.
    const proto = globalThis.CanvasRenderingContext2D?.prototype;
    if (proto) {
      for (const method of ['fillText', 'strokeText', 'measureText']) {
        const original = proto[method];
        proto[method] = function (value, ...args) {
          return original.call(this, translate(value), ...args);
        };
      }
    }

    // The observer also receives our writes. A translated label can still match
    // a dynamic pattern (for example numbers and unit abbreviations).
    const lastText = new WeakMap();
    const lastAttributes = new WeakMap();

    function textNode(node) {
      if (lastText.get(node) === node.data) return;
      const parent = node.parentElement;
      if (!parent || parent.closest(ignored)) return;
      const result = translate(node.data);
      if (result === node.data) return;
      // With no value attribute an option uses its label as the submitted value.
      if (parent.tagName === 'OPTION' && !parent.hasAttribute('value')) parent.setAttribute('value', parent.value);
      lastText.set(node, result);
      node.data = result;
    }

    function attribute(el, name) {
      const old = el.getAttribute(name);
      const written = lastAttributes.get(el);
      if (!old || written?.get(name) === old) return;
      const next = translate(old);
      if (old !== next) {
        const values = written || new Map();
        values.set(name, next);
        if (!written) lastAttributes.set(el, values);
        el.setAttribute(name, next);
      }
    }

    function visit(node) {
      if (node.nodeType === Node.TEXT_NODE) return textNode(node);
      if (node.nodeType !== Node.ELEMENT_NODE || node.closest(ignored)) return;
      for (const name of attributes) attribute(node, name);
      const walker = document.createTreeWalker(node, NodeFilter.SHOW_ELEMENT | NodeFilter.SHOW_TEXT, {
        acceptNode(child) {
          return child.nodeType === Node.ELEMENT_NODE && child.matches(ignored)
            ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT;
        },
      });
      while (walker.nextNode()) {
        const child = walker.currentNode;
        if (child.nodeType === Node.TEXT_NODE) textNode(child);
        else for (const name of attributes) attribute(child, name);
      }
    }

    document.documentElement.lang = 'zh-CN';
    visit(document.documentElement);
    new MutationObserver(records => {
      for (const record of records) {

    "An old milestone. BRACKENFORD 1, it says on one side, and GREYMANTLE 7 on the other. Somebody has scratched a small frowning face next to the 7.": "古老的里程碑。BRACKENFORD 1,它说一边，GREYMANTLE 7在另一边。有人在7号旁边划伤了一张小皱眉的脸。",
    "And I threw my pen out of the window the night she fell asleep. So. There it is.": "我把我的笔从窗外扔了出来，当她睡着了。",
    "And at the heart of the mountain, Rowan Ashby gave the Loom the only story that was theirs to give — their own — so that a little girl could wake and ten thousand stories could go home. The Book of Tales does not know what happened next. Only Gran does.": "在山的中心，罗文·阿什比给了\"禄姆\"唯一一个他们自己的故事——让一个小女孩能够醒来，一万个故事可以回家，故事书不知道接下来会发生什么，只有格兰知道。",
    "And at the heart of the mountain, Rowan broke the Story Loom with Gran's iron poker, and every stolen story in the valley flew home at once. It was the right thing to do. It was not, perhaps, the whole of the right thing.": "而罗文在山的中心，用格兰的铁牌打破了故事库，谷中每件被盗的故事都立刻飞回家去，这是正确的事情，也许不是全部正确的事情。",
    "And every winter, on the longest night, there's a light burning in the Warlock's tower.": "每年冬天，一到最长的那一夜，男巫的塔里就会亮起一盏灯。",
    "And in the tower at the top of the mountain, Corvin Hale sat down on his daughter's bed with a golden quill and finished the story he had stopped telling. It was not the right ending. It was his. And it was enough: Elsie woke, and the Loom let go, and ten thousand stories went home.": "在山顶的塔里，柯文·黑尔用金笔坐在女儿的床上，完成了他停止讲的故事。这不是正确的结局，而是他的结局。够了:艾尔西醒了，卢姆人放手了，一万个故事都回家。",
    "And mind Brimble, once you're in. Corvin's hound. Big as a pony and soft as butter, and he'll knock you clean off the stair out of pure friendliness. Only thing that ever calmed him was a good bone — and at bath-time, I'll admit, I used to put a drop of sleeping draught on it.": "注意Brimble,一旦你加入，柯文的猎犬，大得像匹小马，软得像黄油，他会把你从楼梯上打得干净干净，唯一能让他平静下来的就是骨头，在洗澡的时候，我会承认，我曾经在楼梯上放了一滴睡水。",
    "And the keeper and his daughter": "于是守灯人和他的女儿",
    "And then she is still again. It isn't your voice she's listening for.": "她又来了，她没听好你的声音",
    "And then we got there without her.": "可等我们终于走到那里，她却已经不在了。",
    "And there it stops, mid-sentence. The last word trails off into a long, shaky line of ink, as if the pen had simply been put down and never picked up again. The rest of the pages are blank.": "句子就在这里断了。最后一个字拖出一道长而颤抖的墨迹，仿佛有人就此搁下了笔，再也没拿起来。后面的书页一片空白。",
    "And this. My lucky penny. Your grandad gave it me the day we were wed. Luck's not much, but it's lighter than a sword.": "还有这个。我的幸运便士。是你爷爷在我们结婚那天送给我的。运气也许帮不上大忙，好歹比剑轻。",
    "And, at the very bottom, in a hand you don't recognise: *FOUND: One happy ending, unclaimed. Enquire within.* There is no address. Nobody has taken it down.": "而在最底层，你却认不出: *FOUND:一个幸福的结局，无人称颂。请问内部。*没有地址，没有人把它拆下来。",
    "Another one. The miller's boy came last winter — he got as far as the troll. You've come further than anybody.": "另一个，米利尔的儿子去年冬天来过，他跑到巨怪那里去了，你比任何人都走得更远。",
    "As for the Book of Tales — it was full by the time you got it home. Gran's stories, every one of them. And at the very end, in a hand nobody recognised, one new one: about a child who climbed a mountain on the longest night of the year, and brought the stories home. You're reading it now.": "至于《故事书》,当你回家的时候，它已经满了。 奶奶的故事，每个都写。最后，没有人认出，还有一个新的故事: 一个孩子在一年中最长的夜晚爬上山，把故事带回家。你现在正在读它。",
    "As you close the journal, something slides out of its spine and rings on the floor: a slender silver key, with a lighthouse worked into its bow.": "当你关闭日记时，东西从它的脊椎滑出，和地板上的戒指: 一个细银的钥匙，灯塔在它的弓里工作。",
    "Ask before you take, dear. Half of those will cure you and the other half will turn you into a newt.": "吃之前先问，亲爱的 一半能治好你，另一半能把你变成新人",
    "Ask me your riddles.": "问个谜语",
    "At the Grumblewater bridge, a hungry troll named Gubbins asked for a story as his toll. Rowan had none left to give — but paid him in Gran's honey cake, which, Gubbins said, tasted exactly like one.": "在格伦不勒水桥，一个叫古宾斯的饥饿巨怪要求一个故事作为他的伤亡，罗文已经没有了，而是在格兰的蜜蛋糕里给他付了钱，古宾斯说，这蛋糕的味道完全像一个。",
    "At the door of Greymantle, a stone face asked Rowan three riddles, and the answers were a book, and sleep, and a story — for the face had learned its riddles from a little girl at bedtime.": "在格雷曼特尔的门前，一张石头脸向罗文问了三个谜题，答案是一本书，然后睡觉，还有一个故事——因为这张脸在睡觉时从一个小女孩那里学到了它的谜题。",
    "At the edge of the village, an old woman was waiting at a cottage door with a lamp. When she saw them coming up the path she put her hand to her mouth. *\"Rowan,\"* she said. *\"Oh, Rowan. Come in, love, come in and sit down — you look as though you've lost something.\"* She sat them by the fire, and tucked a blanket round their knees, and opened the Book of Tales on her lap. *\"Now, then,\"* said Gran. *\"Let me tell you a story. It starts on the longest night of the year, a long time ago, with a knock at my door...\"*": "村边，一位老妇人提着灯在小屋门前等候。看见他们沿小路走来，她抬手捂住了嘴。*“罗温，”*她说，*“哦，罗温。快进来，亲爱的，进来坐坐吧——你像是丢了什么似的。”* 她让他们在炉火边坐下，拿毯子裹住他们的膝头，在自己膝上翻开了《故事书》。*“好啦，”*奶奶说，*“让我给你们讲个故事。那是很久以前，在一年中最长的那一夜，有人敲响了我的门……”*",
    "At the foot of the stair, sprawled like a dropped fur coat, lies the biggest dog you have ever seen. His head comes up. His ears come up. His tail comes up — and starts to go.": "在楼梯的脚下，像脱落的毛衣一样伸展，躺着你们见过的最大一只狗，他的头朝上，他的耳朵朝上，他的尾巴朝上——开始走。",
    "At the top of the stair, an archway glows with warm golden light — the colour of every lit window you have ever come home to.": "在楼梯顶端，一个拱门道发光，上面放着温暖的金色光——你曾经回家的每一个点亮的窗户的颜色。",
    "At the very top, you close your fingers around the gold bottle. It is warm, like a hand. It hums very faintly — and for a moment you could swear you hear Gran's voice inside it, saying *\"Once upon a time—\"*": "在最上面，你把手指紧紧地绕在金瓶子上，很温暖，就像一只手，很微弱的哼声——有那么一瞬间，你可以发誓听到奶奶的声音，说:‘很久以前了，'",
    "Attack the Warlock": "攻击男巫",
    "Back away slowly": "慢慢后退",
    "Back to the title": "返回标题画面",
    "Begin": "开始",
    "Begin a New Tale": "开始新故事",
    "Begin a new tale": "开始新故事",
    "Behind them, at the top of a tower, a little girl had woken to a brand-new story, woven out of shining thread: about a lighthouse, and a keeper, and a child in a red scarf who climbed a mountain to bring the light back. Her father was holding her so tightly she complained. Ahead of them, all down the valley, the stories were coming home.": "在他们身后，在一座塔顶，一个小女孩醒来后，看到一个全新的故事，用闪光的线织成:关于灯塔，以及一名守护者，还有一个穿红领巾爬上山来带回光芒的孩子，她的父亲把她紧紧地抱住，她抱怨，在山谷下方，他们都快到家了。",
    "Behind you, in the bed, Elsie smiles in her sleep.": "在你身后，在床上，埃尔西在睡梦中微笑。",
    "Better not": "最好别这样",
    "Beyond the bridge the road climbs into the Whispering Pines.": "过了桥，道路向上延伸，通往低语松林。",
    "Beyond the door, a passage leads into a great hall inside the mountain, lit by braziers. A stair climbs one wall to an archway full of golden light.": "门外有一条通道通向山内一座大堂，由胸罩人点燃，楼梯爬上一堵墙，到一个充满金色光芒的拱门道。",
    "Book of Tales": "故事书",
    "Bound in Calfskin": "装订成册",
    "Brackenford Green": "布莱肯福德格林",
    "Brackenford Green, at the tail end of dusk. Every window is lit and every chimney is smoking, and not a single soul is singing — which, on the longest night of the year, is the eeriest thing you have ever heard.": "布莱肯福德格林，在黄昏的尾端，每个窗户都点着，每个烟囱都在抽烟，没有一个灵魂在唱歌——在一年中最长的夜晚，这是你听过的最恐怖的事情。",
    "Brimble": "布林布尔",
    "Brimble is asleep. The stair is clear — as long as you step over him quietly.": "布林布尔睡着了，楼梯很清澈——只要你悄悄地踩过他。",
    "Brimble is fast asleep across the foot of the stair, snoring like a blacksmith's bellows, his great paws twitching as he dreams of chasing something enormous and delicious.": "布林布尔在楼梯的脚对面迅速睡着了，像铁匠的鸣笛一样打呼噜，他的大爪子在梦想追逐巨大而美味的东西时抽搐。",
    "Brimble sniffs it hopefully, decides it isn't food, and goes back to wagging.": "Brimble有希望地嗅到它，决定它不是食物，然后回到摇晃。",
    "Brimble would love it. It's gone, though, isn't it? Gubbins had it.": "布林布尔会喜欢的，不过它不见了，不是吗？",
    "Brimble's eyes go as round as saucers. He lunges — you snatch the bone back just in time, and he dances on the spot, whining.": "Brimble的眼睛像酱油一样圆。他总是发牢骚，你及时把骨头拿回来，他当场跳舞，发出呜咽声。",
    "Bundles of herbs hang drying from every beam: rosemary, sage, lavender, and several things you are fairly sure are illegal in towns.": "药草的包子从每根梁上都挂着干燥的:玫瑰花，圣洁，薰衣草，以及你相当肯定的几个东西在城镇里是非法的。",
    "But high on Greymantle, in a round room at the top of the tower, Elsie Hale slept on. Corvin Hale sat by her bed for the rest of that winter. You would like to think that in the end he found the words — that one night he picked up a pen and finished the story himself, and that she woke up to hear it. The Book of Tales doesn't say. Perhaps that part hasn't been written yet.": "但高高在葛雷曼特尔身上，在塔顶的圆房里，艾尔西·黑尔睡了起来，科尔文·黑尔在那冬天的余下时间坐在她的床上，你想最后他发现这些话——有一天晚上他拿起笔亲自完成故事，她醒来听了，\"故事书\"没有说，也许那部分还没有写出来。",
    "But what would I write with it? I've written a thousand endings on that Loom. None of them were hers.": "可我能用它写什么呢？我在织故事机上织了一千种结局，没有一个属于她。",
    "But you're the stubbornest child in Brackenford, and I haven't got a single story left to keep you here with.": "可你是布雷肯福德最倔的孩子，我又连一个能留住你的故事都没有了。",
    "Button": "纽扣",
    "Button opens one eye, sniffs the honey cake, and closes the eye again. Cats have no interest in anything you actually want them to have.": "纽扣睁开一只眼，闻了闻蜂蜜蛋糕，又把眼睛闭上了。你越想让猫要什么，它越是没兴趣。",
    "Button the cat": "小猫纽扣",
    "Button, Gran's marmalade cat, asleep on the hearthrug in the exact shape of a cinnamon bun. Button has never had a story taken, because Button has never listened to one.": "奶奶的橘猫纽扣睡在炉边的小毯子上，蜷得像个肉桂卷。纽扣的故事从没被偷过——毕竟它从没听过故事。",
    "Bye, Pell.": "再见，佩尔。",
    "Bye, Rowan. If you find the end of my story, bring it back.": "再见，罗文 如果你找到我的故事的结局，就把它带回来",
    "COME BACK WHEN YOU'RE CLEVERER. Or colder. Colder usually works.": "等你变聪明了再回来。或者冷得受不了也行。冻上一冻往往挺管用。",
    "CORRECT!": "正确！",
    "CORRECT. Hmph. Beginner's luck.": "正确。哼，新手走运罢了。",
    "CORRECT. Well, well.": "正确。哟，还真行。",
    "Can we have it again tomorrow?": "明天能再讲一遍吗？",
    "Choose what to do from the bar beneath the picture, then click (or tap) on the scene:": "先在画面下方选择一个动作，再点击或轻触场景中想要互动的位置。",
    "Climb down anyway": "爬下来，反正",
    "Clockwise, dear, if you're going to stir it. Never widdershins. Unless you want frogs.": "顺时针，亲爱的，如果你要搅拌它，永远不要小白鲨，除非你要青蛙",
    "Close the Book": "合上书",
    "Coil of Rope": "一盘绳子",
    "Come back when you've got a story.": "有了故事再来吧。",
    "Come with me.": "跟我来。",
    "Continue": "继续游戏",
    "Continue your Tale": "继续你的故事",
    "Corvin": "科尔文",
    "Corvin Hale finished the lighthouse story that winter, a page every night, and read each one to his daughter before she went to sleep. And she did go to sleep — and every single morning, she woke up. In the spring they walked down the mountain together for the fair. Elsie rode on the troll's shoulders. And she asked Gran Mab for a story, and got one.": "科尔文·黑尔在那个冬天，每晚写一个页，在女儿睡觉前，她都给女儿读过，她确实睡了——每一天早上，她都醒了起来。在春天，他们一起走下山去参加集市，艾尔西骑着巨魔的肩膀，她问格兰马布要一个故事，然后得到了一个故事。",
    "Corvin Hale kneels among the broken threads with his head in his hands.": "科尔文·黑尔在断裂的线条中跪下，头部被他握着。",
    "Corvin Hale sinks to his knees among the broken threads.": "科尔文·黑尔在一地断线间跪了下来。",
    "Corvin Hale sits down, right there on the cold stone floor, with the Unfinished Tale on his knee and the golden quill in his hand. For a long moment he doesn't move at all.": "科尔文·黑尔坐着，就坐在冷石地板上，膝盖上刻着未完的\"故事\",手边挂着金笔，一瞬间他一动也不动。",
    "Corvin Hale, the Warlock of Greymantle: tall, grey, and much thinner than a warlock ought to be, in a long blue coat stitched all over with little gold stars. There is ink on his fingers. He looks like a man who has not slept in three years, because he hasn't.": "柯文·黑尔，格雷曼特尔的沃洛克:高大，灰色，比沃洛克要薄得多，他身穿长蓝色的外套，缝满了小金星。他的手指上有墨水，他看起来像一个三年没睡过的人，因为他没有睡过。",
    "Corvin Hale. The Warlock of Greymantle, they call him now, but I remember him when he was just Corvin — a gangly young thing with ink on his fingers, who came down every year for the harvest fair.": "科尔文·黑尔。如今大家都叫他灰斗篷山的男巫。我还记得他只叫科尔文的时候呢——一个瘦高的小伙子，手指总沾着墨水，每年都下山赶丰收集市。",
    "Corvin Hale. Wenna said he stopped writing the night Elsie fell asleep. So this is where his pen went.": "科尔文·黑尔。温娜说，艾尔西陷入沉睡的那个晚上，他就不再写作了。原来他的笔在这里。",
    "Corvin barely glances at it.": "科尔文只扫了一眼。",
    "Corvin glances at the Book of Tales, and then looks again, and sees that it's full.": "考文观\"纪事\",后又复视之，见其满矣。",
    "Corvin goes absolutely still.": "科尔文突然一动也不动。",
    "Corvin looks at you for a long, long time. Then he takes your hand — his is cold, and ink-stained, and shaking — and turns you gently toward the Loom.": "科尔文看着你，很长一段时间。然后，他拿你的手——他的手是冷的，是墨水的，是摇摆的——然后，他使你轻轻地走向乐园。",
    "Corvin turns round to face you properly for the first time.": "科尔文转过身来，第一次正眼看着你。",
    "Corvin? *Know* him! I was nurse to his girl for seven years. Elsie. Sweetest child in the county, and the worst in the world at bedtimes.": "柯文，你知道我曾经是他的女朋友的护士七年，艾尔西，郡里最可爱的孩子，睡前最差的",
    "Could you make me a sleeping draught?": "你能帮我调一剂安眠药水吗？",
    "DOWN": "下来",
    "Did you steal Pell's button?": "你偷了佩尔的按钮吗？",
    "Do it.": "动手。",
    "Do you know the Warlock?": "你认识男巫吗？",
    "Do you understand what you're asking? The Loom would take *all* of it. Your name. Your grandmother. You'd walk out of this mountain without the faintest idea who you are.": "你明白自己在请求什么吗？织故事机会拿走你的*一切*。你的名字，你的奶奶。你离开这座山时，连自己是谁都不知道。",
    "Don't be long, love. It's cold out, and I've nothing to tell you when you get back.": "亲爱的，早点回来。外面冷得很，我却连个等你回来讲给你听的故事都没有了。",
    "Down in the valley, every light in Brackenford is burning, and more are coming on all the time.": "下谷，布拉肯福德每光照烧，时有余来。",
    "Drink it": "喝下去",
    "Drowsy Bone": "安眠骨头",
    "Drug a honey cake? Gran would never forgive you. Some things are sacred.": "给蜂蜜蛋糕下药？奶奶绝不会原谅你。有些东西可是神圣的。",
    "Elsie": "艾尔西",
    "Elsie Hale.": "艾尔西·黑尔。",
    "Elsie Hale. She'd be ten now, if she had grown at all.": "艾尔西·黑尔。如果她还能长大，现在该有十岁了。",
    "Elsie waited up for the next part. Night after night she waited. And then one night she fell asleep waiting — and she never woke up.": "艾尔西在等待下一部分，她夜复一夜地等待，然后有一天晚上她睡着了，等待着——她从未醒来。",
    "Elsie's Chamber": "埃尔西的会议厅",
    "Empty bottles. Every one of them.": "瓶子都是空的。每一只都是。",
    "Enter": "回车键",
    "Every night. Every single night, for as long as you like.": "每天晚上。每一个晚上，只要你愿意听。",
    "Every page is blank.": "每一页都是空白的。",
    "Every story in the valley is here. It's the most beautiful thing you've ever seen, and it makes you want to cry.": "谷中每事皆在此，此最美之物，令欲哭而无不至。",
    "Far below you, down through the whole mountain, there comes a sound like ten thousand corks popping at once.": "远在你下面，穿过整个山，听到的声音像一万个螺旋 一次跳跃。",
    "Fast": "快",
    "For a moment his hands stop on the threads.": "他停下手里的丝线，愣了一会儿。",
    "Fresh snow, still falling. Yours are the only footprints. Nobody has come this way in a long time.": "新鲜的雪，还在下，只有你的脚印，很久没有人来过这里了",
    "Give the stories back. They aren't yours.": "把故事还回来。它们不属于你。",
    "Go home, child. Tell them I'm sorry. I am sorry. It doesn't change anything.": "回家去吧，孩子，告诉他们我很抱歉，对不起，这没什么改变",
    "Go on over, Rowan-Ashby-of-Brackenford. Toll's paid. Toll's paid twice.": "过去吧，布雷肯福德的罗温·阿什比。过桥费付清了，付了足足两份。",
    "Go on, then, my — my —": "那就去吧，我的……我的……",
    "Golden Quill": "金羽毛笔",
    "Good boy?": "乖孩子？",
    "Good. Good. Don't — don't say that again unless you mean it. I might not be strong enough to say no twice.": "好，好，别，除非你是认真的，我可能不够强壮，不敢说两次不",
    "Goodbye, Gran.": "再见，奶奶。",
    "Goodbye, Tatters.": "再见，塔特斯",
    "Goodbye, Wenna.": "再见，温娜。",
    "Goodbye.": "再见",
    "Gran": "奶奶",
    "Gran looks at you for a long moment over the tops of her spectacles.": "奶奶从眼镜上方望着你，久久没有出声。",
    "Gran — Mab Ashby, storyteller of Brackenford — in her rocking chair by the fire, with the empty Book of Tales in her lap. She looks smaller tonight. Stories, you realise, took up a lot of room in her.": "炉边的摇椅上坐着奶奶，也就是布雷肯福德的说书人梅布·阿什比。空白的《故事书》摊在她膝上。今夜的她看起来小了一圈。你这才意识到，故事原来在她心里占了那么大的地方。",
    "Gran's Book of Tales: red leather, gold clasp, and — since this morning — nothing but empty pages. Or almost nothing. Something has started writing in it, in a hand you don't recognise.": "奶奶的《故事书》，红皮金扣。从今早起，里面只有空白的纸页了。或者说，几乎是空白的：有谁已经开始在里面写字了，笔迹你却认不出来。",
    "Gran's Cottage": "奶奶的小屋",
    "Gran's books — hundreds of them, fat and thin and leather and cloth. Every one of them, you already know without looking, has gone as white inside as a fresh snowfall.": "奶奶的书，足足有几百本，厚薄不一，有的包着皮，有的裹着布。不必打开你也知道，里面全都白得像刚落下的雪。",
    "Gran's cottage": "奶奶的小屋 外婆的小屋 外婆的小屋",
    "Gran's cottage, low and thatched, with smoke curling out of the chimney. It has been your home for as long as you can remember, which is exactly as long as you've been alive.": "奶奶的小屋，低矮的，有烟雾卷起，烟囱里有烟雾。这是你的家，你还记得的，这正是你活着的时间。",
    "Gran's cottage: one room, one fire, one rocking chair, and more books than any cottage has a right to. It has always smelled of woodsmoke and honey. Tonight it smells of woodsmoke, honey, and something missing.": "奶奶的小屋里有一间房、一炉火、一把摇椅，还有多得不像话的书。这里向来有木柴的烟香和蜂蜜的甜香。今晚这两种气味还在，却分明少了什么。",
    "Gran's forgotten too, Pell.": "奶奶也忘了，佩尔",
    "Gran's kitchen table, scrubbed white, with a candle, a mug of cold tea, and the ghost of a thousand suppers.": "奶奶的餐桌刷洗得发白。桌上一支蜡烛，一杯凉茶，仿佛还留着千百顿晚饭的影子。",
    "Gran's lucky penny, worn smooth by sixty years of thumbs. Grandad gave it to her. It shines like it's proud of something.": "奶奶的幸运便士，历经六十年无数次摩挲，表面已经光滑发亮。这是爷爷送给她的，它亮得像是在为什么事骄傲。",
    "Graniteface": "岩石脸",
    "Graniteface: a huge stone face with a nose like a church door and eyes that glow a faint, patient teal. It is watching you with the air of a schoolmaster who has seen a great many wrong answers.": "花岗岩面:一个巨大的石面，鼻子像教堂的门，眼睛发光，有晕晕的耐心。它正用一位校长的气息看着你，他看到了许多错误的答案。",
    "Greymantle": "灰尘",
    "Greymantle. Every child in Brackenford grows up in its shadow, and every one of them has been told not to go up there. At its very peak, a light is burning in the Warlock's tower.": "格雷曼特尔，布拉肯福德的每个孩子都在其阴影中长大，他们每个人都被告知不要上去，在它的最高峰，瓦洛克的塔内正在燃烧着一盏灯。",
    "Gubbins": "古宾斯",
    "Gubbins *likes* stories. Travellers used to tell Gubbins all sorts. Knights and witches and clever foxes. Gubbins liked the ones with dinners in them best. Great big feasts. Pies.": "古宾斯*喜欢*故事，游民们经常告诉古宾斯各种说法，骑士和女巫以及聪明的狐狸，古宾斯喜欢那些在其中盛装晚餐的，大盛宴，派。",
    "Gubbins doesn't want *money*, if that's what you're thinking. What's Gubbins going to buy? Another bridge?": "古宾斯不想要钱 如果你是这么想的 古宾斯要买什么？",
    "Gubbins doesn't want *money*. What's Gubbins going to buy? Another bridge?": "古宾斯不要*钱*。古宾斯能拿钱买什么？再买一座桥吗？",
    "Gubbins is sitting on the riverbank with his feet in the Grumblewater, looking happier than a troll has any right to look.": "古宾斯坐在河岸上，脚踏在格鲁姆不勒水中，看起来比巨怪更快乐，他没有任何权利看。",
    "Gubbins is thinking about the cake. It's a good thought. Gubbins is going to keep having it for a long time.": "古宾斯在考虑蛋糕，这个想法不错，古宾斯会长期保持这个想法。",
    "Gubbins lets out a sigh that ruffles your hair.": "古宾斯叹了口气，那气流吹乱了你的头发。",
    "Gubbins remembers that one. Gubbins remembers it *in his mouth*.": "古宾斯记得这一个。古宾斯的*嘴巴*可还记着呢。",
    "Gubbins wants a story. Or something as good as a story. Gubbins would know it if he tasted it.": "古宾斯想听个故事。或者，来点和故事一样好的东西。古宾斯尝一口就知道。",
    "HALT! Who goes over Gubbins's bridge?": "站住！谁要过古宾斯的桥？",
    "Ha! That'll put Brimble down like a sack of flour. Clever child.": "那样会把布林布尔像一袋面粉一样倒下去",
    "Have you brought me a story?": "你给我带来了故事吗？",
    "Have you seen anything strange tonight?": "你今晚有没有看到什么奇怪的事？",
    "Have you tried finishing *her* story? The lighthouse one.": "你试过完成她的故事吗？",
    "He gnaws more slowly. He yawns — a yawn you could have parked a cart in. His head sinks onto his paws. His tail gives one last, happy thump.": "他慢一点地眨眼。他打哈欠——你本可以把一个车停在里面的打哈欠。他的头沉到他的爪子上。他的尾巴给了最后一个，快乐的抽。",
    "He hasn't even turned around.": "他甚至没有转身。",
    "He is getting up.": "他起来了。",
    "He is laughing and crying at the same time, which you have noticed grown-ups can only do when something very good has happened.": "他同时在笑哭，你注意到，只有在发生了一件好事时，成年人才能这样做。",
    "He kneels by the bed and opens the little book, and reads aloud, in the voice of a man who has read a great many bedtime stories.": "他跪在床边，打开小书，大声读，以一个读过许多睡前故事的人的嗓音。",
    "He looks at you as if you had said something in a language he used to speak.": "他看你就像用他以前说的语言 说了些什么",
    "He never finished it. She used to ask me how it ended, and I'd say, \"Your papa will tell you, pet.\" I never thought —": "他还没完成 她经常问我怎么结束的 我会说 \"你爸爸会告诉你的 宠物\"",
    "He takes it as delicately as a troll can take anything, and eats it in one enormous bite, and then sits there for a long moment with his eyes shut.": "他把它像巨怪一样精致地带走任何东西，并用一个巨大的咬咬它，然后坐在那里一个很长的瞬间，闭上眼睛。",
    "He takes it. His fingers close around it exactly where the gold is worn smooth.": "他拿着，手指紧紧地关在金子穿的光滑处",
    "He turns the pages slowly until he comes to the place where the ink trails away.": "他慢慢翻页，直到他来到墨迹消失的地方。",
    "He wipes his eyes with a hand the size of a spade.": "他用铁锹那么大的手擦了擦眼睛。",
    "He writes for a long time. The Loom slows, and slows, and stops. When he finally looks up, his face is wet, and he is almost smiling.": "他写了很久，Loom慢了，慢了，停下来。当他终于抬头时，脸湿了，几乎笑了。",
    "High on Greymantle, where the pines give up and the snow begins, a door as tall as a house has been cut into the living rock. Above it a great stone face has been carved into the lintel. The wind up here is thin and very cold and it goes straight through Gran's scarf.": "高处的灰门，松树放弃，雪开始，一扇高如屋的门被切入了活岩石中，上面刻着巨大的石面，在林特尔上，这里的风很薄，非常冷，直接穿过奶奶的围巾。",
    "High on the very top shelf, one bottle glows the exact gold of Gran's hearth. Even from down here you can read its label: MAB ASHBY, BRACKENFORD — ALL OF THEM.": "高高的架子上，一瓶能发光 奶奶的灵气。即使从这里，你也可以读到它的标签:MAB ASHBY、BRAKENFORD — 所有。",
    "Honey Cake": "蜂蜜蛋糕",
    "How Hob Lights the Lamps": "何宝点灯",
    "How do I get inside Greymantle?": "我要怎样才能进灰斗篷山？",
    "How the Baker's Grandmother Met a Bear": "贝克的祖母怎么认识一只熊的",
    "How to Play": "玩法说明",
    "How to play": "玩法说明",
    "Hundreds of paper birds, folded from the pages of spell-books and hung from the ceiling on threads. Each one has a single word written on its wing. *Wake. Please. Wake. Please. Elsie. Wake.*": "数百只纸鸟，从咒语书页上叠起，挂在天花板上，每只鸟的翅膀上都写着一个单词。",
    "I AM THE DOOR. Also the face on the door. It's a fine distinction, but I'm attached to it.": "我是门，门上的脸，很区别，但我依附它",
    "I am told, but I am never heard alone. I end, but I am never over. And the more of me you give away, the more of me there is. WHAT AM I?": "有人讲，我才有人听。我有结尾，却永远讲不完。你把我分给越多的人，世上便有越多的我。我是什么？",
    "I can't finish that one. I don't know how it ends. I never knew — I only ever made up the next part, and the next. Her mother always said she'd tell me how it ended when we got there.": "我无法完成这个，我不知道它会怎样结束，我从不知道——我只编了下一部分，下一部分，她妈妈总是说，当我们到达那里时，她会告诉我它会怎样结束。",
    "I could, if I had moonbells. They only bloom on the longest night — which is tonight, lucky for you. There's a patch of them under the pines, down by the old signpost.": "如果我有月亮铃声，它们只在最长的夜晚——这就是今晚，你走运了。松树下有一圈，在旧的路标旁。",
    "I couldn't even if I wanted to. I haven't a pen worth writing it with. I threw mine out of the window, that night. Swore I'd never write another word.": "我甚至不能这样想，我还没有一支值得写起来的笔，那天晚上我把笔扔出窗外，我再也不会写了。",
    "I don't even know what became of the pages. I couldn't bear to look for them.": "我甚至不知道这些页子会变成什么样 我无法忍受去寻找它们",
    "I don't know how it ends.": "不知终日如何。",
    "I have a spine, but no bones. I have leaves, but no roots. I hold a thousand lives, and I have never lived one. WHAT AM I?": "我有脊却无骨，有许多页却无一根。我藏着千百种人生，自己却从未活过。我是什么？",
    "I know you will, dear. Mind the troll on the bridge — he's soft as porridge, but he never lets anybody over for nothing. Take something to eat. You'll be hungry, and so, I expect, will everyone you meet.": "我知道你会的，亲爱的。小心桥上的巨怪——他心软得像碗稀粥，却从不让人白白过桥。带点吃的。你会饿的，我猜，你一路碰上的人也一样。",
    "I ought to say no. I ought to say you're too young, and it's too cold, and the mountain's too high.": "我该说不行的。我该说你太小了，天太冷了，山也太高了。",
    "I threw this out of the window the night Elsie fell asleep.": "艾尔西睡着的那天晚上，我把这东西扔出了窗外。",
    "I'll bring them home, Gran. I promise.": "我会带它们回家的，奶奶。我保证。",
    "I'm going to give it to the princess. For being brave.": "我要把它给公主，因为她勇敢",
    "I'm going up the mountain to get them back.": "我要上山，把它们找回来。",
    "I'm sorry. I'm so sorry. Thank you.": "对不起。我真的很抱歉。谢谢你。",
    "IN YOU GO. And if you see the little one — tell her Graniteface misses her riddles. Nobody sits on my nose any more.": "告诉她Graniteface想念她的谜语。没有人会再坐在我的鼻子上。",
    "If you see that magpie, tell her she's a thief. She took my red button. Mam says she'll swap, sometimes, if you give her something shinier.": "如果你看到那个黑猩猩，告诉她她是小偷 她拿走了我的红色按钮 妈妈说她会换的，有时，如果你给她更闪亮的东西",
    "In her sleep, very softly, Elsie murmurs: *\"...and then what happened, Papa?\"*": "在她睡梦中，很温柔地，埃尔西喃喃地说:\"然后发生了什么，爸爸?\"",
    "In the Sleeping Bear, somebody remembered the second verse of *The Plough and the Pheasant*, and then everybody did. Hob the lamplighter remembered how his song started, and started. On the green, a small girl was already explaining to her doll that the princess didn't *need* rescuing, thank you, but she'd take a lift home. And by her own fire, an old woman opened a book that was no longer blank, and put her hand to her mouth, and said: *\"Rowan. Oh — Rowan.\"*": "在\"睡熊\"中，有人想起了\"犁和滇香\"的第二段诗句，后来大家也都记得了. 灯光手霍布想起了他的歌的开始，开始. 在绿地上，一个小女孩已经向她的娃娃解释公主不需要*救，谢谢，但她会搭便车回家. 凭借自己的火力，一个老妇人打开了本书，不再空白，把手放在嘴边，说:\"罗万，哦——罗文\".",
    "In the Warlock's library, Rowan poured Mab's stories home into the Book of Tales — and found among them one they had never been told: how a baby named Rowan came to a grandmother's door on the longest night, and was kept, and was loved.": "在男巫的藏书室里，罗温把梅布的故事倒回了《故事书》。里面竟有一段自己从没听过的往事：一年中最长的夜晚，一个叫罗温的婴儿被送到一位奶奶门前，从此有了家，也有了疼爱自己的人。",
    "In the Warlock's library, among ten thousand bottled stories, Rowan read Corvin Hale's journal: a thousand days of spells and stories and endings, and none of them the right one.": "在沃洛克的图书馆里，在一万个瓶装故事中，罗文阅读了科文·黑尔的期刊:千天咒语和故事及结局，没有一个是正确的。",
    "In the Whispering Pines, a magpie named Tatters traded Gran's lucky penny for a golden quill that had fallen from the Warlock's tower three winters before. Gran had said luck was lighter than a sword. It turned out to be about as heavy as a pen.": "在\"华西松\"中，一位名叫塔特斯的岩浆将格兰的幸运一分钱交易给一个金笔，这笔金笔是之前三个冬天从沃洛克的塔上掉下来的，奶奶曾说运气比剑轻，结果与笔一样重。",
    "In the bed, Elsie Hale opens her eyes.": "床上的艾尔西·黑尔睁开了眼睛。",
    "In the best ones, she does.": "在最好的，她做的。。。",
    "In the book, a keeper and his daughter were left standing in the dark of a story with no ending. Rowan understood, then, what the Warlock had been looking for in everyone else's tales.": "书里，守灯人和女儿被留在一个没有结局的故事里，站在无边的黑暗中。罗温终于明白，男巫为什么会去翻找别人的故事。",
    "In the lighthouse lived a keeper, and the keeper's wife, and their daughter, whose job it was to keep the light from getting lonely. Every night she told it a story, and every night it shone a little brighter to hear the end.": "灯塔里住着守灯人、他的妻子和女儿。女儿负责陪伴灯火，不让它感到寂寞。每晚她讲一个故事给它听，而每晚听到结局时，它总会更亮一点。",
    "In the tower, Rowan read the last page of Elsie Hale's diary and understood that she had never been enchanted at all — not really. She was waiting. She had fallen asleep waiting for her father to finish the story.": "在塔内，罗文读了艾尔西·黑尔日记的最后一页，并明白她根本没有被魔法——其实没有，她在等待，她睡着了，等待着父亲完成这个故事。",
    "In the village of Brackenford, at the foot of the mountain called Greymantle, old Mab Ashby had told stories for sixty winters. There was not a child in the valley who hadn't fallen asleep to one of them, and not a grown-up who didn't still know the words. Tonight, by her own fire, Mab opened her mouth to tell one — and found nothing there at all.": "在灰斗篷山脚下的布雷肯福德村，梅布·阿什比奶奶讲了整整六十个冬天的故事。山谷里没有哪个孩子不曾听着她的故事入睡，也没有哪个大人忘了那些熟悉的词句。今夜，梅布坐在自家炉火边，张嘴想讲个故事，却发现自己一个字也想不起来了。",
    "Inside Greymantle, Rowan met Brimble, the Warlock's hound: big as a pony, soft as butter, and dangerous only in the way that very large, very friendly things are. A drowsy bone put him to sleep across the foot of the stair.": "在格雷曼特尔内部，罗文遇到了布林布尔，沃洛克人的猎犬:大如小马，软如黄油，只有非常大，非常友好的东西才会有危险. 昏沉的骨头使他在楼梯的脚对面睡觉。",
    "Instant": "立即显示",
    "Iron Poker": "铁火钳",
    "Is that — is that a *proper* cake?": "那是……那真是一块*正经的*蛋糕吗？",
    "It appears to be asleep.": "似乎睡着了。",
    "It doesn't hurt. It feels like moonbells — like the moment just before sleep. You feel the story of you being drawn out, thread by shining thread: the cottage, the fire, the honey cake, the troll, the magpie, the well —": "感觉像月钟，就像睡觉前的那一刻，你感觉到你被拉出，线条闪闪的故事:小屋、火、蜂蜜蛋糕、巨怪、黑猩猩、井...",
    "It has played its tune. It has given up its secret. It seems content.": "它演奏了它的曲子，它放弃了它的秘密，它似乎满足了。",
    "It is, you are almost certain, a troll.": "你几乎可以肯定，那是一只巨怪。",
    "It started three winters back. Only a few at first. Old Tam lost the words to his drinking song. The miller lost the end of his ballad. And every winter, on the longest night, more of them go.": "是三个冬天前开始的。起先只少了几个。老塔姆忘了酒歌的词，磨坊主忘了歌谣的结尾。从那以后，每年冬至夜都会再少一些。",
    "It would look very fetching on a coat half your size.": "穿一件你一半大小的外套看起来很迷人",
    "It's a library, but not of books. From floor to ceiling stand bottles, ten thousand of them, each stoppered and labelled and glowing. Every story in the valley is here, and every one of them is humming.": "书库是图书馆，但书本不是，从楼层到天花板的瓶子，一万个，每个瓶子都停着，贴着标签，发光，山谷里的每一篇故事都在这里，每篇都哼着。",
    "It's a tiny brass key — the winding kind, for a clock or a toy — with a thread of faded blue ribbon still knotted through its bow. Somebody dropped this here to make a wish, and never came back for it.": "这是一种小小的铜钥匙，一种风向，用来做钟或玩具，上面有一条淡蓝色的丝带，仍然被它结着。有人把这个扔在这里，来许个愿，却再也没有回来。",
    "It's broken already.": "它已经坏了。",
    "It's cold down here, and it smells of stone and old pennies. Moss. Echoes. And there, on a ledge just above the black water: the glint.": "这里很冷，有石头和旧的硬币的味道，摩斯，回声，就在黑水上面的一顶窗子上，闪烁着闪烁的闪烁。",
    "It's far too high to reach. You'd need a ladder — and the only ladder in here is at the other end of the rail.": "它太高了，你需要梯子，这里唯一的梯子就在铁路的另一端。",
    "It's gone, Rowan. All of it. I opened the Book to tell you the one about the Fox and the Frost Giant — you always liked that one — and look.": "没了，罗温。全都没了。我翻开书，想给你讲狐狸和冰霜巨人的故事——那一直是你的最爱——可你看。",
    "It's locked. The keyhole is rimmed with silver.": "锁上，钥匙孔被银子缠住",
    "It's rather a long way away to use. That is, you suppose, the point of walking.": "离用起来很远，你猜是走路的点",
    "Jars of every herb in the forest, each labelled in a spidery hand: FEVERFEW. SELF-HEAL. HEARTSEASE. FORGET-ME-NOT. And one, empty, labelled MOONBELLS — FOR THE LONGEST NIGHT ONLY.": "森林里每根草药的茎，每个都用蜘蛛手贴上标签:FEVERFEW. SELF-HEAL. HeartSEASEE.FORGET-ME-NOT. 和一只空的，标记为Moonbels——只供最长的夜晚使用。",
    "Keep it, keep it. The soup doesn't want it back.": "收着吧，收着吧。这锅汤已经用不着它了。",
    "Keep your penny, dear. I've no use for money out here — the forest doesn't take it.": "留你一分钱，亲爱的 我在这里没有钱用——森林不收钱。",
    "LEFT": "左侧",
    "Later he had a little girl. Elsie. She'd sit right there, where you're standing, and ask me for the one about the lighthouse. I never knew that one. She said her papa was making it up for her, a bit every night.": "后来他有了个小女儿，叫艾尔西。她会坐在你现在站的地方，央我讲灯塔的故事。我从没听过那个故事。她说那是爸爸专门编给她听的，每晚讲一点。",
    "Little Brass Key": "小铜钥匙",
    "Look": "观察",
    "Look (2)": "看(2) 说吧 Look (2)",
    "Look around": "环顾四周",
    "Look at yourself": "看看自己",
    "Lost in a Story": "在故事里迷失了 , 被你所迷惑",
    "Loved to Death": "爱死",
    "Lucky Penny": "幸运便士",
    "Mab Ashby's book. I'd know it anywhere. I'm sorry about that, too.": "马布·阿什比的书，我随时都能知道，我也很抱歉",
    "Mab Ashby's book. You took hers back. Good. Good — somebody ought to have something back.": "阿什比的书 你把她的拿回来了 很好，好，应该有人拿回来",
    "Mab Ashby's. Take it. Take it home. I — just take it.": "梅布·阿什比的。你拿去吧。把它带回家。我……拿去吧。",
    "Mab's Bottle": "梅布的瓶子",
    "Make a dash for it": "做个破折叠",
    "Mam says that magpie takes anything shiny. She'll swap, sometimes, if you give her something shinier.": "妈妈说，如果有更光泽的东西，迷宫会变换的",
    "Maybe the princess rescues herself.": "也许公主会救她",
    "Menu": "菜单",
    "Menu (Esc)": "菜单( Esc)",
    "Mind how you go, dear. And if you see Corvin — tell him Wenna says he's to eat something.": "注意你走的路 亲爱的 如果你看到Corvin 告诉他Wenna说他要吃东西",
    "Moonbells": "月铃花",
    "Moonbells! Oh, and fresh ones. Give them here, dear.": "月铃花！哎呀，还是刚摘的。给我吧，亲爱的。",
    "More bottles, their stories unspooling in streams of light across the chamber and into the Loom.": "更多的瓶子，他们的故事 散落到光流中 穿过室，进入了Loom。",
    "Most of the pages are about ordinary things: a fox seen from the window, a pie, how much Brimble weighs (A LOT, underlined three times), a riddle for Graniteface that doesn't quite work.": "大部分的页面都涉及普通事物:从窗户看到的狐狸，馅饼，布林布尔的重量(A LOT,下划线三次),格莱尼特面孔的谜语并不完全有效。",
    "Mrrp.": "喵呜。",
    "Much too small. This lock wants something slender, and silver.": "太大了，这锁要些苗条的，还有银子",
    "My BUTTON! You got it back from that thieving bird! Rowan, you're a — you're a —": "我的小鸟，你从偷盗鸟身上拿回来的",
    "My daughter is asleep in the tower above us. She has been asleep for three winters. No spell will wake her. I have tried them all.": "我女儿在我们上面的塔上睡觉，她已经睡了三个冬天，没有咒语能唤醒她，我已经试过他们了。",
    "My dear. Go on, my dear.": "亲爱的。去吧，亲爱的。",
    "NO —": "不——",
    "Never mind.": "算了。",
    "Never. Not in a hundred years.": "绝不可能。再过一百年也不会。",
    "No backsies.": "无背。",
    "No saved game found.": "没有找到存档。",
    "No scene": "没有场景",
    "No. It's gone. Get it home, dear.": "没了。真的没了。亲爱的，把它带回家吧。",
    "No. That one's already somebody's. Tatters can tell.": "不，那已经是别人的了，塔特斯看得出来",
    "Nobody comes by any more. Gubbins is ever so hungry.": "已经没人打这儿过了。古宾斯饿坏了。",
    "Normal": "正常",
    "Not every knot needs untying. Some just need an iron poker.": "并不是每个结都需要解绑，有些人只需要铁牌",
    "Not shiny. Not shiny at *all*.": "不闪亮 不闪亮",
    "Not yet": "先等等",
    "Nothing in it. Same as everybody.": "什么都没有。跟其他人一样。",
    "Notices, nailed up in a dozen different hands:": "注意，钉在十几个不同的手:",
    "Off": "关",
    "Oh — that's Mab Ashby's. I'd know that glow anywhere. She told me a story once, when I was a girl, about a hedgehog who —": "哦，那是Mab Ashby的，我随时都能知道，她曾经告诉我一个故事，当我还是个女孩的时候，一个刺猬...",
    "Old Wenna: a small, round, apple-cheeked woman with a white bun and a green shawl, knitting something long and red at a tremendous speed. She has a face that has told a great many children to go to sleep, and meant it kindly every time.": "老文娜:一个小圆的苹果色女人，带着白包和绿色披肩，用巨大的速度织出长而红色的东西。 她的脸让很多孩子睡觉，而且每次都是好意。",
    "On": "开",
    "On the longest night of the year, the stories began to go out — one by one, like candles in a draughty house.": "一年中最长的夜晚，故事开始一个接一个地熄灭，就像漏风的屋里一支支被吹灭的蜡烛。",
    "On the village green, Rowan met a small girl whose doll was stuck in a story with no ending, and told her the princess could rescue herself. It was the first new story Brackenford had heard in three winters.": "在村绿上，罗文遇到了一个小女孩，她的娃娃卡在一个故事里，没有结局，并告诉她公主可以救自己，这是布拉肯福德在三个冬天听到的第一个新故事。",
    "Once upon a time there was a — a —": "从前有一个……一个……",
    "Once upon a time, at the very end of the world, where the map runs out and the sea keeps going anyway, there was a lighthouse.": "从前，世界末日，地图流出，大海不断，曾经有一个灯塔。",
    "Once upon a time…": "很久很久以前……",
    "Once, on the longest night of the year, the stories of Brackenford began to go out. Old Mab Ashby, who had told them for sixty winters, found her Book of Tales as blank as snow. And her grandchild Rowan — who was stubborn in the way only the very young and the very old can be — took the Book and a lucky penny, and set out to bring the stories home.": "有一年，在最长的那一夜，布雷肯福德的故事一个接一个地熄灭了。讲了六十个冬天故事的梅布奶奶发现，自己的《故事书》白得像雪。她的孙辈罗温有股只有小孩和老人才有的倔劲儿。罗温带上书和一枚幸运便士，踏上了把故事带回家的旅程。",
    "One night a great storm came. The waves climbed the rocks and the wind climbed the stairs, and the light went out. The keeper's wife took a lantern and went down to the shore to guide the lost ships in — and when the storm was over, she did not come back.": "一天晚上，大风暴降临，大浪攀登岩石，风向攀登楼梯，灯光熄灭，守门人的妻子拿了灯笼下岸，引导失落的船进——当风暴过后，她没有回来。",
    "Ooh. *Ooh.* It's been loved, this one. Sixty years of thumbs. You can always tell. Loved things shine different.": "被爱着的，这个，60年的拇指，你总是能分辨出来，爱的东西闪耀着不同的事物。",
    "Papa?": "爸爸？",
    "Paused": "已暂停",
    "Pell": "佩尔",
    "Pell bends over her doll and begins whispering furiously. You have the odd, prickling feeling that you have just watched a story being born.": "佩尔俯视她的娃娃，开始狂声低语，你有一种奇怪的，刺耳的感觉，你刚刚看到一个故事诞生了。",
    "Pell regards the penny with deep suspicion. \"Is that for the magpie? She likes shiny things. She's a *thief*, though.\"": "佩尔很怀疑这钱 她喜欢闪亮的东西，虽然她是个\"小偷\"",
    "Pell scrunches up her whole face with effort.": "佩尔用努力把她整张脸都弄得一团糟",
    "Pell stares at her doll as though it had just grown a second head.": "佩尔盯着她的娃娃 好像它刚刚长出第二个头一样",
    "Pell's lip wobbles dangerously.": "佩尔的唇动得很危险",
    "Pell, the miller's youngest, sitting cross-legged in the cold with a rag doll in her lap. She is frowning at the doll as if it has personally let her down.": "磨坊主最小的佩尔(Pell)在寒冷中坐在双腿上，腿上带着布娃娃，她向娃娃皱眉，好像它亲自让她失望了一样。",
    "Pie Crust, Brackenford Method": "布雷肯福德方法派克吕斯特",
    "Poke the troll": "戳一戳巨怪",
    "Pull the cork": "扯开软木板",
    "Put it back": "把它放回去，放回来",
    "Put the stopper back": "把停车器放回去",
    "RIGHT": "对",
    "Read the Book of Tales": "阅读《故事书》",
    "Red Button": "红纽扣",
    "Red toadstools with white spots, straight out of a story. In the stories you are never, ever supposed to eat them.": "红色的蛤蟆凳子，上面有白色斑点，直接从故事中出来，在故事中你永远，永远不应该吃它们。",
    "Red-gold light pours through an archway to the east, and with it a sound like a thousand people whispering all at once. All the streams of light in the library are drifting that way.": "红金光从东边的拱门道倒下，随即发出一个声音，像千人一次地低声说出，图书馆里所有的光流都是这样漂移的。",
    "Restore saved game": "读取存档",
    "Restore saved tale": "读取存档",
    "Resume · START": "继续 · START",
    "Return to the story": "返回故事",
    "Right-click cycles the verbs. Keys 1–4 pick them, B opens the Book of Tales, Esc opens the menu.": "点击鼠标右键可轮换动作，数字键 1–4 可直接选择。按 B 打开《故事书》，按 Esc 打开菜单。",
    "Rowan": "罗温",
    "Rowan Ashby, of Brackenford.": "我是罗温·阿什比，来自布雷肯福德。",
    "Rowan brought Pell her red button back from the magpie's nest. It was a small thing. The best things in stories often are.": "罗文从岩浆的巢穴里带回了佩尔的红色按钮，这是一件小事，故事中最优秀的东西往往是。",
    "Rowan climbed down the Brackenford well, where wishes go, and found one that nobody had ever come back for: a little brass key on a blue ribbon.": "罗文爬下布拉肯福德的井，在那里，愿望去，找到一个没有人回来过的地方: 一个蓝色丝带上的小铜钥匙。",
    "Rowan! Rowan, look. My doll's a princess, and she's locked in a tower by a — by a —": "罗文，你看，我的娃娃是公主 她被锁在塔上",
    "Rowan? Is that you, love? Come here. Come and look at this.": "罗温？是你吗，亲爱的？快过来。来看看这个。",
    "START": "开始",
    "Same as all the rest. Nobody's got any left. Three winters Gubbins has sat on this bridge and not heard one single story. Not one.": "和其余一样，没有人能留下任何东西，三个冬天古宾斯坐在这座桥上，没有听到一个故事，一个也没有。",
    "Satchel": "文件夹",
    "Save your tale": "保存故事进度",
    "Saving is not available in this browser.": "这个浏览器无法保存游戏。",
    "Score": "得分",
    "Seems to me, dear, a pen that's thrown away is still a pen.": "在我看来，亲爱的，被扔掉的笔仍然是笔。",
    "She can't think of the word, either. She settles for flinging both arms around your middle.": "她也想不出这个词 她决定把两只手臂都扔到你中间",
    "She could climb down her hair! No — she ties her bedsheets together! No, no, no — she makes *friends* with the something, and it flies her home!": "她可以顺着头发爬下去！不对——她把床单结成绳子！不不不——她和那个东西交上了*朋友*，它带着她飞回了家！",
    "She doesn't need the right ending. She needs yours.": "她需要的不是一个正确的结局，而是你写给她的结局。",
    "She fell asleep waiting for a story. So I thought — a story will wake her. I only have to find the right one.": "她睡着了，等待一个故事。所以我想，一个故事会唤醒她，我只需要找到正确的故事。",
    "She frowns, and the frown goes on a moment too long.": "她皱起眉头。那片刻的迟疑长得叫人心慌。",
    "She has forgotten your name. You don't say anything. You don't quite trust yourself to.": "她忘了你的名字。你什么也没说。你怕自己一开口就忍不住了。",
    "She ladles a little of it into a glass vial, stoppers it, and presses it into your hand.": "她把其中的一点 塞进玻璃瓶里 把它拦住 塞进你的手里",
    "She presses it back into your hands, hard.": "她用力把它塞回你手里。",
    "She trails off.": "她说着说着，没了下文。",
    "She turns it over in her fingers, and gives it back.": "她在指间把它翻过来看看，又还给了你。",
    "She turns the pages for you. They are clean and white and utterly empty, like new snow nobody has walked on yet.": "她翻开书给你看。每一页都干干净净，一片雪白，空得像谁也没有踩过的新雪。",
    "She wished the lighthouse story would never end. Children don't understand what they're wishing for. Neither do grown-ups, mostly.": "她希望灯塔的故事永不结束，孩子们不明白自己希望什么，大多是成年人也不愿意。",
    "She'd not close her eyes till her papa had told her a story, and it always had to be the same one — the lighthouse at the end of the world. He made it up for her, a bit at a time. A new piece every night.": "她不会闭上眼睛，直到她爸爸告诉她一个故事，而且总是必须是一个相同的故事——世界末日的灯塔，他为她做了一些，一次一次，每晚都有新的作品。",
    "She's seven — no. She *was* seven, three winters ago, when she fell asleep, and she hasn't aged a day since. Golden hair spread across the pillow. A small crease between her eyebrows, as though she's listening hard for something.": "她七岁——不，她*七，三岁冬天，她睡着了，从那以后她一天也没有长大，金色的头发散落在枕头上，眉间有一小片折痕，好像她正认真听一些东西。",
    "Shh! I'm at the good bit. The princess has just made friends with the something, and now it's going to fly her home, and she's going to be *extremely* rude to the tower on the way out.": "嘘，我有点不礼貌，公主刚和这些东西交了朋友，现在她要飞回家，她出去时会很无礼的到塔上去。",
    "Shiny!": "闪亮！",
    "Shiny! Tatters has the loved penny. Tatters is the richest bird in the forest. Go away now, Tatters is admiring it.": "闪亮，塔特人有爱的一分钱，塔特人是森林里最富有的鸟类，现在走开，塔特人正在欣赏它。",
    "Shiny? *Shiny?* Tatters trades. Tatters is a fair bird. Mostly. Occasionally. On Tuesdays.": "亮晶晶？*亮晶晶的？* 塔特斯肯交换。塔特斯是只公道的鸟。大多时候。偶尔。每逢星期二。",
    "Silver Key": "银钥匙",
    "Silver's cold. Tatters likes shiny things that are *warm*.": "银色的冷，塔特斯喜欢闪亮的东西，温暖的*.",
    "Sixty years I've been telling stories. And tonight I opened my mouth and there was nothing in it but my teeth.": "我讲了六十年故事。可今晚我一张嘴，里面除了牙齿什么都没有。",
    "Sleep": "睡眠",
    "Sleeping Draught": "安眠药水",
    "Slow": "慢",
    "Smash ten thousand bottles in one go? The stories would go everywhere, in a hurry, all at once. You aren't sure you want to find out what that looks like.": "一口气打碎一万只瓶子？那些故事会在一瞬间飞得到处都是。你不太确定自己想不想亲眼看见这一幕。",
    "Smash the Loom": "砸毁织故事机",
    "Some endings have to be written by the one who began them.": "有些结局必须写在开始它们的人身上。",
    "Somebody walked down Greymantle in the grey light of the morning after the longest night. They didn't know their own name. They had a red scarf, and a satchel with a book in it, and the book was full of stories — but none of them seemed to be about anyone in particular.": "有人在最长的夜晚之后的早晨，在灰色的光线下走，他们不知道自己的名字，他们有一个红色的围巾，以及一个装有书的包，这本书充满了故事——但是它们中似乎没有一个是特别针对任何人的。",
    "Something shiny. Something round and shiny and warm from somebody's pocket. Something that's been *loved*. Tatters knows it when Tatters sees it.": "闪亮的，从某人口袋里发光发热的东西，被爱的东西，塔特斯看到它时就知道了。",
    "Somewhere overhead, something is chattering happily to itself about spoons.": "某处在高处，有些东西在谈论勺子 自己快乐地聊天。",
    "Sound:": "音效：",
    "Sound: On": "音效：开",
    "Soup Bone": "汤骨",
    "Spoon! Thimble! Fork, bent! Buttons, three! And the golden feather — Tatters's *best*. It fell out of the tall tower on the mountain, three winters back. Came down through the snow like a little sun. Tatters caught it before it landed.": "勺子 尖刺 叉子 弯曲 扣子 3 和金羽毛 塔特斯的最好的 * 它从山上的高塔上掉下来 回到了三个冬天 穿过雪地像太阳一样 塔特斯在降落前就抓住了它",
    "Stay dry": "留在岸上",
    "Stay well back": "后退点",
    "Staying dry, you decide, is an underrated virtue.": "你觉得，人们实在低估了衣服干爽的好处。",
    "Step closer to the edge": "靠近边缘",
    "Swept Away": "被水冲走",
    "Swim across": "游到对岸",
    "THAT IS A BOOK. I did not ask you a question yet. Hold that thought.": "那是一本书，我还没问你问题，等一下",
    "THAT IS NOT AN ANSWER. That is a *thing*.": "这不是一个回答，那是个\"东西\"",
    "THE WARLOCK MADE ME TO KEEP PEOPLE OUT. THE LITTLE ONE TAUGHT ME TO LET THE CLEVER ONES IN. She used to sit right on my nose, swinging her feet, and make up riddles for me. I liked her rule better.": "温柔的冰雪让我让大家离开，那种小的冰雪让我把冰雪卷进来。她经常坐在我的鼻子上，挥舞她的脚，为我填上谜题。我更喜欢她的规矩。",
    "TOLL.": "过桥费。",
    "Take it to him. It's his. It was always his.": "拿去给他吧。那是他的，一直都是。",
    "Take it, take it, dear. The soup's done with it.": "拿去吧，亲爱的。这锅汤用不着它了。",
    "Take my story instead.": "改拿我的故事吧。",
    "Take the Book. Every tale I ever told is meant to be written in it. If you find where they've gone — well. A book knows its way home.": "带上这本书吧。我讲过的每一个故事，本该都写在里面。你若能找到它们去了哪儿……唔，书会认得回家的路。",
    "Talk": "交谈",
    "Talk (4)": "谈话(4)",
    "Talk to yourself": "和自己说话",
    "Talk to…": "交谈……",
    "Tam's Drinking Song (the one you know)": "谭饮歌(汝所识者).",
    "Tatters": "塔特斯",
    "Tatters is feeling generous. Feather AND button. Don't tell the other magpies.": "泰特斯很慷慨，有发型，别告诉其他的岩浆",
    "Tatters shies away from the glowing bottle, feathers flat.": "触摸离发光瓶远处，羽毛平坦。",
    "Tatters the magpie, admiring Gran's penny from every possible angle. She has tucked it into the very middle of the nest, where the best things go.": "尝尝这些岩浆，从每个角度欣赏奶奶的一分钱。她把它塞进巢穴的中间，最好的事物就在那里。",
    "Text:": "文字速度：",
    "Text: Normal": "文字速度：正常",
    "That was three winters ago. He's tried every spell in every book. And when the spells ran out, he started on the stories. Every story in the valley, I shouldn't wonder, by now. Looking for the one that'll wake her.": "那时是三个冬天，他尝试了每本书中的每个咒语。当咒语用尽后，他就开始讲故事。每个故事在山谷里，我不应该怀疑，现在，寻找会唤醒她的故事。",
    "That was — that was everything. That was every chance she had left.": "这就是一切，这是她离开的每一个机会。",
    "That's the miller's girl's, isn't it? Everything shiny in this forest ends up in that magpie's nest sooner or later.": "那是磨坊主女儿的，对不对？这片林子里只要是亮晶晶的东西，迟早都会进那只喜鹊的窝。",
    "That's... that's a *story*, that is. That tastes like the one where the old woman bakes on the longest night, and the whole village comes round, and nobody is cold.": "味道就像老妇人烤的 烤在最长的夜晚，整个村子都围着转，没人冷",
    "The Ballad of Brackenford (all nine verses)": "布拉肯福德的巴拉德(所有九首诗)",
    "The Book of Tales": "故事书",
    "The Book of Tales (B)": "故事书",
    "The Broken Loom": "破烂的屋",
    "The Door of Greymantle": "灰门之门",
    "The End": "全剧终",
    "The Fox and the Frost Giant": "狐狸和冰霜巨头",
    "The Gift of Rowan": "罗文的礼物",
    "The Grumblewater Bridge": "咕噜河上的桥",
    "The Grumblewater: fast and black and grumbling to itself, as it always is. Nobody has ever worked out what about.": "格鲁姆不勒斯:快速而黑色，自怨自艾，就像往常一样。没有人想过什么。",
    "The Hall of the Hound": "猎犬之堂",
    "The Heart of the Mountain": "山脉之心",
    "The Hedgehog Who Borrowed the Moon": "借月球的黑奇虎",
    "The Keeper's Daughter": "守护者的女儿",
    "The Library of Bottled Stories": "装瓶式故事图书馆",
    "The Longest Sleep": "梦中最长的睡眠",
    "The Loom hums under your hand like something alive. If you break it, the stories will go free — and whatever hope Corvin has left will go with them.": "卢姆的哼声像活的一样，如果你打破它，故事就会自由——无论科尔文留下什么希望，都会随他们一起走。",
    "The Miller's Three Wishes": "米勒的三点愿望",
    "The Plough and the Pheasant": "犁和",
    "The Sleeping Bear, Brackenford's only inn. On any other longest night it would be bursting at the seams with singing. Tonight it's as quiet as a held breath.": "睡熊，布莱肯福德是唯一一家客栈，在任何其他最长的夜晚，它都会在歌声的缝合处爆裂，今晚它就像静气一样安静。",
    "The Story Loom stands broken, its beam cracked in two, its threads hanging dead and grey.": "故事室的梁断裂成两段 线条被枯萎和灰白色所覆盖",
    "The Story Loom: a frame of dark carved wood as big as a house, strung with ten thousand threads of light. Every thread is a story — you can hear them, faintly, as they cross: a verse of a song, a line of a joke, *once upon a time* over and over. On the cloth at the bottom, half-woven, is a lighthouse.": "\"故事室\":一个像房子一样大，用一万线光刺穿的暗木框，每条线都是故事——微弱地，当他们交叉时，你都能听到:一首歌的诗句，一行笑话，*一次又一次*,在底部的布上，半成形，是一座灯塔。",
    "The Story Thief": "故事大盗",
    "The Story Thief of Greymantle": "灰斗篷山的故事大盗",
    "The Unfinished Tale": "未写完的故事",
    "The Whispering Pines": "华声松",
    "The Whispering Pines. Moonlight comes down between the trunks in long silver slices, and the trees whisper — tonight, if you listen very hard, it sounds almost as if they're trying to remember something.": "低语松林。细长的银色月光从树干间洒下，树木窃窃私语。今晚若你仔细听，几乎会觉得它们正努力地回想什么。",
    "The adventure scene. Click to walk, look, use or talk.": "冒险场景，点击可以走，看，用或说话。",
    "The archway back to the library.": "通往藏书室的拱门。",
    "The archway opens into a chamber at the very heart of the mountain. In the middle of it stands a loom as big as a house, and on the loom, thread by glowing thread, stories are being woven — pouring in streams of light from the bottles on the walls, crossing, knotting, becoming cloth.": "拱门道在山心开进一间密室，中间有如屋一样大的隐形，在隐形处，通过发光的线线条，故事被编织——从墙上的瓶子里涌出光流，横过，结结，成为布。",
    "The bone glistens a faint moonbell blue. Even the smell is sleepy.": "骨头闪烁着微弱的月亮 连气味都困住了",
    "The cauldron is still steaming a sleepy moonbell blue.": "坩埚上还悬着一缕淡蓝的蒸汽，像月铃花一样引人入梦。",
    "The dark": "黑暗",
    "The door back out into the Whispering Pines.": "穿过这扇门就能回到低语松林。",
    "The door has sunk into the mountain. Beyond it, a passage leads into warm, candle-smelling dark.": "门已经沉入山中，在山外，一条通道通向温暖，香烛的黑暗。",
    "The door is barred. A sign has been chalked on it: *CLOSED TONIGHT. NOBODY CAN REMEMBER ANY OF THE SONGS.*": "门是禁止的，上面刻着一个标记: 今晚关闭，没有人记得任何宋人。",
    "The door of Gran's cottage. Warm light leaks out around the edges.": "格兰家小屋的门，暖光在边缘外漏。",
    "The door's the best way in. The chimney is for Midwinter visitors only.": "门是最佳的入口，烟囱只供中冬客使用。",
    "The echo goes round the cavern twice and nearly knocks you over. Brimble looks enormously pleased with himself.": "声音绕洞两圈 差点把你打晕了 布兰布尔看起来很满意自己",
    "The fire crackles and spits and throws your shadow up the wall, twice as tall as you. Gran used to make shadow-animals in that light — a rabbit, a wolf, a dragon — and tell you what they were thinking.": "炉火噼啪作响，把你的影子投到墙上，拉得足有你两倍高。奶奶以前会借着火光做手影——兔子、狼、龙——还会给你讲它们在想什么。",
    "The fire is lit. The kettle has boiled. Gran is in her rocking chair with the Book of Tales open on her knees, and she is staring at it as if it were written in a language she has never seen.": "炉火烧得正旺，水壶也开了。奶奶坐在摇椅上，膝头摊着《故事书》。她盯着书页，仿佛上面写满了她从未见过的文字。",
    "The front door's the only door. It has a face, and the face asks riddles, and it won't open to anybody who can't answer them. Elsie used to sit on its nose and make up new ones for it. Think like a child at bedtime and you'll not go far wrong.": "门是唯一的门，它有一张脸，脸问谜语，不会向任何无法回答的人打开，埃尔西曾经坐在它的鼻子上，为它补上新的门，想得像个在睡觉的时候的孩子，你不会犯大错。",
    "The front door. Beyond it: the village green, the road, the bridge, the forest, and the mountain.": "前门。门的另一边是村庄的草地、大路、桥、森林，还有那座山。",
    "The heart of the mountain: a round chamber as tall as a church, with a great round window open to the stars. In the middle stands a loom the size of a house, and on it, thread by glowing thread, stories are being woven — pouring in streams of light from the bottles on the walls, crossing, knotting, becoming cloth.": "山心:一个圆形的室室，像教堂一样高，有一个巨大的圆窗对着星星敞开，中间的窗子是一个房子的密布，上面通过发光线线线，故事被编织——从墙上的瓶子里涌出光流，横跨，结结，成为布。",
    "The hound is enormous: grey and shaggy, with a head like a hearthrug and a tail going like a threshing flail. His collar tag says BRIMBLE. He would very much like to be your friend, and has no idea at all that he weighs as much as a haycart.": "猎犬庞大:灰白色和毛发，头像心绞，尾巴像鞭子一样。他的领章上写着BRIMOLE。他非常想成为你的朋友，而且完全不知道他重得像一个大草纸。",
    "The last entry is written very carefully, in her best letters:": "最后一首非常仔细地写在她最好的信里:",
    "The last line isn't dated. *I cannot remember how our story was meant to go. I don't think I ever knew. Her mother always knew.*": "最后一行没有约会。*我不记得我们的故事该怎么走。我想我从不知道。她的母亲总是知道。*",
    "The last page fills more slowly than the rest. It is the only story in the book that you have never heard.": "最后的一页填充比其他的要慢，这是你从未听过的书中唯一的故事。",
    "The library ladder, now parked beneath Gran's bottle.": "图书馆梯子，现在停在奶奶的瓶子下面",
    "The lid is shut fast, and it won't play without winding. The keyhole in the base is tiny.": "盖子闭塞很快，不刮风就无法演奏，底部的键孔很小。",
    "The light pours out like warm honey, and where it touches the pages, words bloom — hundreds of them, thousands, in Gran's round handwriting. The Fox and the Frost Giant. The Miller's Three Wishes. How the Moon Lost Her Shoe. They settle onto the paper like birds coming home to roost.": "光像温暖的蜂蜜一样涌出，在它触及页面的地方，词就开花——在格兰的圆形笔迹中，有数百个，数千个。福克斯和霜巨人;米勒的三愿;月球是如何失去她的鞋的。它们像鸟儿一样落到纸上，像鸟儿一样落脚。",
    "The lighthouse music box stands open, its lamp glowing faintly, its little tune long since run down.": "灯塔音乐盒一直开着，灯光微微闪烁，自下而来，小曲调很长。",
    "The little brass key from the Brackenford well fitted Elsie's music box exactly. She had dropped it down the well long ago, wishing that the lighthouse story would never end — and inside the box, folded small, was the lighthouse story itself: unfinished.": "布拉肯福德音乐盒的小铜钥匙正好配上埃尔西的音乐盒。她早就把它扔下了，希望灯塔的故事永不结束——在盒子里，折叠的小东西是灯塔的故事:未完成的故事本身。",
    "The little door stands open. A narrow stair winds up into the tower, lit by moonlight from somewhere above.": "小门站着，一个狭窄的楼梯向塔内倾斜，从上面的某个地方被月光点燃。",
    "The magpie from the Whispering Pines came and stole my button! Right off my coat! My best red one!": "胡萝卜松的猩猩来了，偷了我的扣子，从我外套上脱下来，我最好的红的",
    "The magpie goes absolutely rigid. Then she drops out of the tree, snatches it from your fingers, and is back on her branch before you have finished flinching.": "黑猩猩会死硬的 然后她从树上掉下来 从你的手指上抢走 并在你停止跳动之前回到她的树枝上",
    "The magpie is well out of reach, and in any case looks like she bites.": "岩浆完全无法到达，无论如何看起来都像是她咬人。",
    "The moon is up over the valley, fat and silver. In Gran's stories the moon once lost her shoe and had to hop across the sky for a whole month. You're not sure, tonight, how that one ended.": "月亮在山谷上空，肥胖银色，在奶奶的故事中，月亮曾经失去了她的鞋子，不得不跳过天空整整一个月，你不确定今晚，那一个是如何结束的。",
    "The moonbells are already in the draught. That's rather the point of it.": "月钟已经沉入水中了，这就是重点",
    "The mountainside drops away into nothing. Far, far below, the lights of Brackenford twinkle like somebody has spilled a jewellery box down the valley. One of those lights is Gran's window.": "山坡一落千丈，远在下面，布拉肯福德闪闪闪发光 就像有人把珠宝盒洒到山谷里，其中一个灯是奶奶的窗户。",
    "The narrow stair back down to the library.": "狭长的楼梯回图书馆",
    "The nest glitters in the moonlight: a spoon, a thimble, a bent fork, three buttons (one of them a bright, familiar red), and sticking out of the top like a flag, a quill made of real gold.": "鸟窝在月光下闪闪发光：一把勺子，一个顶针，一把歪叉子，三颗纽扣（其中一颗是眼熟的鲜红色），还有一支像旗子一样插在最上面的真金羽毛笔。",
    "The nest is well out of reach, and guarded by a magpie with very strong opinions about property.": "巢穴远不能及，由对财产有非常强烈看法的岩浆守护。",
    "The nest still glitters — a spoon, a thimble, a bent fork, two ordinary buttons — and now, in pride of place, Gran's lucky penny.": "鸟窝仍然闪闪发亮：一把勺子、一个顶针、一把歪叉子、两颗普通纽扣。如今摆在最显眼处的，是奶奶的幸运便士。",
    "The night she fell asleep, he threw it out of the tower window. Swore he'd never write another word.": "她睡着的那晚，他把它扔出塔窗外，他发誓再也不写字了。",
    "The passage back out to the door and the snow.": "这条通道通向来时的门，门外就是雪地。",
    "The path winds back down the mountain to the Whispering Pines.": "小路蜿蜒下山，通往低语松林。",
    "The pines whisper. If you listen hard, it almost sounds like *once... once... once...* — the first word of a story nobody can finish.": "松树低语，如果你认真听的话，听起来几乎是一次...",
    "The road back to the Grumblewater bridge.": "路回格鲁姆不勒水桥。",
    "The road climbs and climbs until the pines give up and the snow begins. At the top of the path, cut into the living rock of Greymantle, is a door as tall as a house — and above the door, carved into the stone, an enormous face.": "道路攀登，直到松树放弃，雪开始，在路的顶部，切入灰门洞的活岩，是一扇像房子一样高的门——门上方，刻成石块，面容巨大。",
    "The road climbs into the Whispering Pines, where the moonlight comes down in long silver slices between the trunks. The path forks at an old signpost.": "路爬入华亭，月光在树干之间长银片下山，路岔在一座旧的路标上。",
    "The road north begins to climb in earnest, switching back and forth up the flank of Greymantle.": "北边的道路开始认真攀登，前后向上转弯，沿着格雷曼特尔的侧翼。",
    "The road north brings you to the Grumblewater, and the old stone bridge across it. Something very large is standing at the far end of the bridge.": "北路引汝到格鲁姆布尔水，横跨的老石桥，桥的远端站着甚大的东西。",
    "The road north crosses the Grumblewater by a humpbacked bridge of grey stone. The river is fast and black and full of the moon. On the far side, the Whispering Pines begin.": "北面的道路由灰石的座椅桥穿过格鲁姆布尔水，河道快速而黑，满月，远处是华西松开始。",
    "The road north runs out of the village, over the Grumblewater, through the Whispering Pines, and up — a long way up — to Greymantle.": "北路流出村里，过格鲁姆布尔水，经怀柔松，上——远——至格雷芒。",
    "The road runs back south to Brackenford. You can see the lit windows from here.": "大路向南通往布雷肯福德。从这里还能看见村里亮着灯的窗子。",
    "The silver key slides into the lock as if it had been missing it. It turns with a small, sad click, and the door swings open onto a narrow stair winding up into the tower.": "银键滑入锁内，仿佛一直缺失，它用小的，悲哀的点击转过身来，门打开了一条狭窄的楼梯，风向上方进入塔楼。",
    "The soup bone, generously dosed with sleeping draught. It smells of soup, moonbells and poor decisions — irresistible to a hound.": "一根浇足了安眠药水的汤骨。汤香、月铃花香和冒失行事的味道混在一起，猎犬怎么可能抵挡得住。",
    "The soup is soup. You leave it be.": "汤就是汤，你决定不去碰它。",
    "The stair back down to the Hall of the Hound.": "楼梯回向猎犬厅。",
    "The stair winds up and up, and comes out at last in a round room full of moonlight.": "楼梯起伏，终于在满月的圆房里出来。",
    "The stories came home to Brackenford that night, every one. The Sleeping Bear sang until dawn. The lamplighter lit the lamps. Pell's princess got an ending, and then several more. And Gran — Gran knew your name before you had even opened the door.": "故事都回到了布莱肯福德，每晚都是。睡熊唱到天亮。灯光照亮灯光。佩尔的公主有一个结局，然后又有几个。格兰——在你打开门之前，奶奶就知道你的名字。",
    "The sun has gone down on the shortest day of the year. It won't be back for a long, long night.": "太阳在一年中最短的一天下山了，不会回来长夜。",
    "The threads snap one after another, singing like harp strings, and the stories tear loose — ten thousand threads of light unravelling at once, streaming up through the great round window and out into the night. Down the mountain. Home.": "线条接连地响起，歌唱如竖琴弦，故事一时松散——一万条线光一时破碎，从大圆形的窗户流出，进入夜晚，在山下，回家。",
    "The torches are bolted into the rock, and hot at the business end.": "火炬被栓入岩中，在商业端发热。",
    "The troll goes very still. He sniffs. His yellow eyes go wide.": "巨怪一动不动。他嗅了嗅，黄色的眼睛睁得溜圆。",
    "The troll is very big. The poker is very pointy.": "巨怪很大。火钳很尖。",
    "The trunk is smooth as bone and the lowest branch is twice your height. You aren't getting up there.": "树干很滑，最下面的树枝是你的两倍高，你不会上去的",
    "The view is very fine. The drop is very long.": "风景很好，下降时间很长",
    "The village well is older than the village. A tiny tiled roof, a winch, and the end of a rope that rotted through last spring. You lean over the edge: far below, something glints — not in the water, but on a ledge of stone just above it.": "村井比村里老。一个小的瓦子屋顶，一个绞盘，和一个腐烂的绳子的尽头，你倒在边缘上:远在下面，有些东西是闪闪发光的——不是在水里，而是在它上面的一块石头上。",
    "The village well, older than the village. Nothing glints in it now. You've had the only interesting thing out of it.": "村子里比村子还老，现在没有东西了 你只有这个有趣的东西",
    "The water is fast, black and bitterly cold.": "河水湍急，漆黑，冰冷刺骨。",
    "The wheel's free already.": "轮已解脱。",
    "The whole valley is spread out below the window: the dark pines, the silver thread of the Grumblewater, and the tiny lit windows of Brackenford. From up here it looks like something out of a story.": "整个山谷都分布在窗下:暗松，银线的格朗布尔水，以及布莱肯福德的细小的灯光。从上面看，它看起来像一个故事。",
    "The window doesn't open. Somebody has made very sure of that.": "窗户没打开，有人很确定",
    "The window is painted shut, and has been since before you were born.": "窗户被油漆封死了，从你出生以前就是这样。",
    "The winter her mother died, Corvin stopped telling it. Couldn't bear to, I think. It had been a story for the three of them, and now there were only two, and he didn't know how it went any more.": "冬天她母亲死了，柯文停止了说，我想是受不了的，这本来是三个人的故事，现在只有两个，他不知道后来怎样了。",
    "Then one winter they didn't come down to the fair. And the winter after, the lights came on in the tower.": "有一年冬天，他们没下山赶集。又过了一个冬天，塔上的灯就亮了。",
    "Then — then the princess is just going to stay in the tower *forever*?": "然后——然后公主就只好留在塔里了*永远？",
