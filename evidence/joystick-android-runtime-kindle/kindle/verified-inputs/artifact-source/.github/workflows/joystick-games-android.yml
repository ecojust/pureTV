name: Joystick games Android packages and runtime

on:
  push:
    branches: [build/joystick-games-android]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: '1'

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        game: [cf-transport-ship, qq-speed]
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            .github/workflows
            joystick-games
            resource/game-kit
            docs/puzzle-nine/browser
            tools
      - name: Install the gameplay artwork renderer
        run: python3 -m pip install Pillow==11.3.0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-35 build-tools;34.0.0
      - name: Verify the committed Web payload and Android boundary contracts
        working-directory: joystick-games/${{ matrix.game }}
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build:check 2>&1 | tee "$RUNNER_TEMP/web-build-check.log"
          python3 ../tools/android-tests.py 2>&1 | tee "$RUNNER_TEMP/android-contract-tests.log"
      - name: Fetch the existing pinned QR encoder
        run: |
          curl --fail --silent --show-error --location https://repo.maven.apache.org/maven2/com/google/zxing/core/3.5.3/core-3.5.3.jar --output "$RUNNER_TEMP/zxing.jar"
          python3 - <<'PY'
          import hashlib,os
          from pathlib import Path
          assert hashlib.sha256((Path(os.environ['RUNNER_TEMP'])/'zxing.jar').read_bytes()).hexdigest() == '8d8064c1636fdaef7189dd9055c7d59950a8940a12f2293956446ec3c109fd82'
          PY
      - name: Build immutable package inputs and read-only Observer
        env:
          GAME: ${{ matrix.game }}
        run: |
          set -euo pipefail
          python3 joystick-games/tools/android-build.py --game "$GAME" \
            --output "$RUNNER_TEMP/unsigned/$GAME" --cache "$RUNNER_TEMP/dex-cache" \
            --sdk "$ANDROID_HOME" --jdk "$JAVA_HOME" --zxing "$RUNNER_TEMP/zxing.jar" \
            --require-committed 2>&1 | tee "$RUNNER_TEMP/build.log"
          python3 joystick-games/qa/android/build-observer.py --game "$GAME" \
            --output "$RUNNER_TEMP/unsigned/$GAME/observer" --sdk "$ANDROID_HOME" --jdk "$JAVA_HOME" \
            2>&1 | tee "$RUNNER_TEMP/observer-build.log"
      - uses: actions/upload-artifact@v4
        with:
          name: joystick-android-unsigned-${{ matrix.game }}
          path: ${{ runner.temp }}/unsigned/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: joystick-android-report-build-${{ matrix.game }}
          path: |
            ${{ runner.temp }}/build.log
            ${{ runner.temp }}/observer-build.log
            ${{ runner.temp }}/web-build-check.log
            ${{ runner.temp }}/android-contract-tests.log
            ${{ runner.temp }}/unsigned/*/build-receipt.json
            ${{ runner.temp }}/unsigned/*/source-inputs.json
            ${{ runner.temp }}/unsigned/*/source-inputs.after.json
            ${{ runner.temp }}/unsigned/*/source-context.json
            ${{ runner.temp }}/unsigned/*/payload-sha256.json
          if-no-files-found: warn

  sign:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            .github/workflows
            joystick-games
            resource/game-kit
            docs/puzzle-nine/browser
            tools
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: build-tools;34.0.0
      - uses: actions/download-artifact@v4
        with:
          pattern: joystick-android-unsigned-*
          merge-multiple: true
          path: ${{ runner.temp }}/unsigned
      - name: Verify source bindings and sign with the pinned existing certificate
        env:
          PURETV_KEYSTORE_BASE64: ${{ secrets.PURETV_KEYSTORE_BASE64 }}
          PURETV_KEYSTORE_PASSWORD: ${{ secrets.PURETV_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          python3 joystick-games/tools/android-release.py sign \
            --input "$RUNNER_TEMP/unsigned" --output "$RUNNER_TEMP/signed" \
            --build-tools "$ANDROID_HOME/build-tools/34.0.0" 2>&1 | tee "$RUNNER_TEMP/sign.log"
      - uses: actions/upload-artifact@v4
        with:
          name: joystick-android-signed
          path: ${{ runner.temp }}/signed/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: joystick-android-report-sign
          path: ${{ runner.temp }}/sign.log
          if-no-files-found: warn

  runtime:
    needs: sign
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        game: [cf-transport-ship, qq-speed]
    env:
      PURETV_DISPOSABLE_EMULATOR: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            .github/workflows
            joystick-games
            resource/game-kit
            docs/puzzle-nine/browser
            tools
            puretv-joystick
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools build-tools;34.0.0
      - uses: actions/download-artifact@v4
        with:
          name: joystick-android-signed
          path: ${{ runner.temp }}/signed
      - name: Independently verify signed inputs before installing
        run: >-
          python3 joystick-games/tools/android-release.py verify
          --input "$RUNNER_TEMP/signed" --build-tools "$ANDROID_HOME/build-tools/34.0.0"
      - name: Resolve the verified APK for this game version
        env:
          GAME: ${{ matrix.game }}
        run: |
          set -euo pipefail
          folder="$RUNNER_TEMP/signed/packages/$GAME"
          version=$(jq -er '.versionName' "$folder/signing-receipt.json")
          apk="$folder/$GAME-$version.apk"
          test -f "$apk"
          echo "VERIFIED_GAME_APK=$apk" >> "$GITHUB_ENV"
      - name: Enable disposable emulator acceleration
        run: |
          test -e /dev/kvm
          sudo chmod a+rw /dev/kvm
          command -v ffprobe >/dev/null || sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Operate the actual APK using the original pureTV TCP SDK
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: android-tv
          arch: x86_64
          profile: tv_1080p
          avd-name: JoystickGamesValidation
          force-avd-creation: true
          disable-animations: true
          emulator-options: -no-window -memory 3072 -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: >-
            python3 joystick-games/qa/android/run.py --game '${{ matrix.game }}'
            --apk "$VERIFIED_GAME_APK"
            --observer "$RUNNER_TEMP/signed/observers/${{ matrix.game }}/observer-${{ matrix.game }}.apk"
            --output "$RUNNER_TEMP/runtime/${{ matrix.game }}-normal" --adb "$ANDROID_HOME/platform-tools/adb" &&
            python3 joystick-games/qa/android/run.py --game '${{ matrix.game }}'
            --apk "$VERIFIED_GAME_APK"
            --observer "$RUNNER_TEMP/signed/observers/${{ matrix.game }}/observer-${{ matrix.game }}.apk"
            --output "$RUNNER_TEMP/runtime/${{ matrix.game }}-occupied" --adb "$ANDROID_HOME/platform-tools/adb" --occupy-default-port
      - name: Preserve exact executed QA scripts and emulator description
        if: always()
        env:
          GAME: ${{ matrix.game }}
        run: |
          python3 - <<'PY'
          import hashlib,json,os,shutil,subprocess
          from pathlib import Path
          out=Path(os.environ['RUNNER_TEMP'])/'runtime'/os.environ['GAME'];out.mkdir(parents=True,exist_ok=True)
          paths=list(Path('joystick-games/qa/android').rglob('*.py'))+list(Path('joystick-games/qa/android').rglob('*.java'))
          paths += [Path('puretv-joystick/joystick_sdk.py'),Path('.github/workflows/joystick-games-android.yml')]
          files={}
          for path in paths:
              target=out/'executed-source'/path;target.parent.mkdir(parents=True,exist_ok=True);shutil.copyfile(path,target)
              files[path.as_posix()]={'bytes':path.stat().st_size,'sha256':hashlib.sha256(path.read_bytes()).hexdigest()}
          (out/'executed-source.json').write_text(json.dumps({'sourceSha':os.environ['GITHUB_SHA'],'runId':os.environ['GITHUB_RUN_ID'],'files':files},indent=2)+'\n')
          p=subprocess.run([os.environ['ANDROID_HOME']+'/emulator/emulator','-version'],text=True,capture_output=True)
          (out/'emulator-version.txt').write_text(p.stdout+p.stderr)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: joystick-android-report-runtime-${{ matrix.game }}
          path: ${{ runner.temp }}/runtime/
          if-no-files-found: error

  export:
    if: always()
    needs: [build, sign, runtime]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            .github/workflows
            joystick-games
            resource/game-kit
            docs/puzzle-nine/browser
            tools
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: build-tools;34.0.0
      - uses: actions/download-artifact@v4
        if: needs.sign.result == 'success'
        with:
          name: joystick-android-signed
          path: ${{ runner.temp }}/export
      - uses: actions/download-artifact@v4
        with:
          pattern: joystick-android-report-*
          path: ${{ runner.temp }}/export/reports
      - name: Reverify signed artifacts independently of runtime results
        if: needs.sign.result == 'success'
        run: >-
          python3 joystick-games/tools/android-release.py verify
          --input "$RUNNER_TEMP/export" --build-tools "$ANDROID_HOME/build-tools/34.0.0"
      - name: Export original reports and packages to an isolated branch
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RESULT: ${{ needs.build.result }}
          SIGN_RESULT: ${{ needs.sign.result }}
          RUNTIME_RESULT: ${{ needs.runtime.result }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          out=Path(os.environ['RUNNER_TEMP'])/'export';out.mkdir(exist_ok=True)
          files={}
          for p in sorted(out.rglob('*')):
              assert not p.is_symlink()
              if p.is_file():
                  assert p.stat().st_size<100_000_000
                  files[p.relative_to(out).as_posix()]={'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()}
          (out/'export-manifest.json').write_text(json.dumps({'sourceSha':os.environ['GITHUB_SHA'],'runId':os.environ['GITHUB_RUN_ID'],'buildResult':os.environ['BUILD_RESULT'],'signResult':os.environ['SIGN_RESULT'],'runtimeResult':os.environ['RUNTIME_RESULT'],'files':files,'physicalTvTested':False,'physicalEsp32Tested':False},indent=2)+'\n')
          PY
          export_branch="build-assets/joystick-games-android-${GITHUB_RUN_ID}-attempt-${GITHUB_RUN_ATTEMPT}"
          test -z "$(git ls-remote --heads origin "refs/heads/$export_branch")"
          git init --initial-branch "$export_branch" "$RUNNER_TEMP/export"
          git -C "$RUNNER_TEMP/export" config user.name github-actions[bot]
          git -C "$RUNNER_TEMP/export" config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git -C "$RUNNER_TEMP/export" add .
          git -C "$RUNNER_TEMP/export" commit -q -m "Joystick Android packages and original evidence ${GITHUB_RUN_ID}"
          gh auth setup-git
          git -C "$RUNNER_TEMP/export" remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          git -C "$RUNNER_TEMP/export" push origin "HEAD:refs/heads/$export_branch"
