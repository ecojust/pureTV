// AGP's Java compilation does not honor AndroidSourceDirectorySet include filters.
// Give it a generated directory containing exactly the three shared controller files.
def controllerOutput = layout.buildDirectory.dir('generated/sources/puretv-controller')
def prepareController = tasks.register('preparePuretvControllerSources', Sync) {
    from(file('../../game-kit/android/src/main/java')) {
        include 'com/ecojust/gamekit/WifiControllerServer.java'
        include 'com/ecojust/gamekit/WifiControllerDiscovery.java'
    }
    from(file('../../game-kit/legacy-controller-native/src/main/java')) {
        include 'com/ecojust/controller/LegacyWifiController.java'
    }
    into(controllerOutput)
}
android.sourceSets.main.java.srcDir(controllerOutput)
tasks.withType(JavaCompile).configureEach { dependsOn(prepareController) }
// Standalone lint also needs the generated source even without an assemble task.
tasks.configureEach {
    if (name == 'preBuild' || name.startsWith('lint') || name.contains('Lint')) dependsOn(prepareController)
}

// Generate the two images that the Android launcher and Android TV display.
def repoRoot = projectDir.toPath().getParent().getParent().getParent().toFile()
def iconTool = new File(repoRoot, 'tools/game_icons.py')
def captureMap = new File(repoRoot, 'tools/game-icon-sources.json')
def crops = new File(repoRoot, 'tools/game-icon-crops.json')
def gamePath = 'resource/apps/' + projectDir.name
def capture = new groovy.json.JsonSlurper().parse(captureMap)[gamePath] ?: gamePath + '/thumb.png'
def generatedArt = layout.buildDirectory.dir('generated/res/gameplay')
def launcherArt = tasks.register('generateGameplayLauncherArt') {
    inputs.files(iconTool, captureMap, crops, new File(repoRoot, capture))
    outputs.dir(generatedArt)
    doLast {
        def images = new File(generatedArt.get().asFile, 'drawable-nodpi')
        project.exec { commandLine 'python3', iconTool, projectDir, new File(images, 'gameplay_icon.png'), '--size', '192' }
        project.exec { commandLine 'python3', iconTool, projectDir, new File(images, 'gameplay_banner.png'), '--banner' }
    }
}
android.sourceSets.main.res.srcDir(generatedArt)
tasks.named('preBuild').configure { dependsOn(launcherArt) }
