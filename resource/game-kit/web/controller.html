<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#101b2e"><title>PureTV 手柄</title><link rel="stylesheet" href="controller.css"></head>
<body>
<main id="controller" data-actions="2">
  <header><strong id="game-name">PureTV</strong><span id="status" role="status">正在连接…</span></header>
  <section id="stick-zone" aria-label="方向摇杆"><div id="stick"><span id="thumb"></span></div><span id="stick-caption">在左侧任意位置滑动控制方向</span></section>
  <nav id="system-controls"><button id="start" type="button">开始 / 暂停</button><button id="select" type="button">重新开始</button><button id="retry" type="button" hidden>重新连接</button><button id="fullscreen" type="button">全屏</button></nav>
  <section id="actions" aria-label="动作区域"><button id="a" type="button"><b>A</b><span id="action-a">动作 A</span></button><button id="b" type="button"><b>B</b><span id="action-b">动作 B</span></button></section>
</main><script src="controller.js"></script>
</body></html>
