plugins { id 'com.android.application' version '8.5.2' apply false }
subprojects { project ->
    layout.buildDirectory.set(rootProject.layout.projectDirectory.dir('outputs/' + project.name))
    plugins.withId('com.android.application') {
        tasks.register('verifyControllerSourceSelection') {
            dependsOn 'preparePuretvControllerSources'
            doLast {
                def generated = layout.buildDirectory.dir('generated/sources/puretv-controller').get().asFile
                def actual = fileTree(generated).files.collect { generated.toPath().relativize(it.toPath()).toString() }.sort()
                def expected = ['com/ecojust/controller/LegacyWifiController.java','com/ecojust/gamekit/WifiControllerDiscovery.java','com/ecojust/gamekit/WifiControllerServer.java'].sort()
                assert actual == expected : actual
                assert !android.sourceSets.main.java.srcDirs.any { it.toString().endsWith('game-kit/android/src/main/java') }
                def java = tasks.named('compileDebugJavaWithJavac').get().source.files
                assert java.count { it.name == 'WifiControllerServer.java' } == 1
                assert java.count { it.name == 'WifiControllerDiscovery.java' } == 1
                assert java.count { it.name == 'LegacyWifiController.java' } == 1
                assert !java.any { it.toString().contains('com/ecojust/gamekit/MainActivity.java') }
                def report = [project: project.name, status: 'passed', generated: actual, compiledSources: java.collect { it.toString() }.sort()]
                file(rootProject.layout.projectDirectory.file(project.name + '-sources.json')).text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(report)) + '\n'
                println 'Verified controller source selection for ' + project.name
            }
        }
    }
}
