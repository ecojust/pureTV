<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
  <meta name="theme-color" content="#10171d">
  <title>ALIEN SHOOTER TV · Controller</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/controller.css">
</head>
<body>
  <main class="controller" id="controller" data-action-layout="split" data-connected="false" data-player="1" data-state="offline">
    <header class="header">
      <div class="brand"><svg viewBox="0 0 40 40" aria-hidden="true"><path d="M7 10 20 3l13 7v13c0 7-13 14-13 14S7 30 7 23Z" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="20" cy="19" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="M20 8v7m0 8v7M9 19h7m8 0h7" stroke="currentColor" stroke-width="2"/></svg><div><strong data-i18n="title">孤胆枪手 TV</strong><span data-i18n="controller">手机控制器</span></div></div>
      <div class="connection" role="status" aria-live="polite"><i id="connection-dot"></i><span id="connection-text">正在连接</span></div>
      <button class="fullscreen" id="fullscreen" type="button" aria-label="全屏" title="全屏"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    </header>
    <section class="dashboard" aria-label="游戏状态" data-i18n-aria="status">
      <div class="player-badge"><span class="player-number" id="player-number">P—</span><div><span class="eyebrow" data-i18n="yourPlayer">你的玩家</span><strong id="player-name">正在加入</strong></div></div>
      <div class="stats"><div class="place-stat"><span data-i18n="stage">任务</span><strong id="stage" title="—">—</strong></div><div><span data-i18n="health">生命</span><strong id="health">—</strong></div><div><span data-i18n="ammo">弹药</span><strong id="ammo">—</strong></div></div>
    </section>
    <div class="messages">
      <div class="status-line"><span class="play-status" id="play-status" role="status" aria-live="polite">手柄未连接</span><span class="telemetry" id="weapon">—</span></div>
      <div class="message" id="message" role="status" aria-live="polite">正在加入电视上的房间…</div>
    </div>
    <section class="controls" aria-label="游戏操作" data-i18n-aria="controls">
      <div class="joystick-column">
        <div class="joystick-zone" id="joystick-zone" role="group" aria-label="左侧按住滑动" aria-disabled="true" tabindex="0" data-active="false">
          <div class="joystick" id="joystick" aria-hidden="true">
            <div class="joystick-ring"></div><div class="axis axis-x"></div><div class="axis axis-y"></div>
            <span class="direction up">▲</span><span class="direction down">▼</span><span class="direction left">◀</span><span class="direction right">▶</span>
            <div class="joystick-thumb" id="joystick-thumb"><div></div></div>
          </div>
        </div>
        <span class="control-caption" data-i18n="move">左侧按住滑动</span>
      </div>
      <div class="system-keys" aria-label="游戏菜单">
        <button type="button" id="button-select" class="system-button" disabled><span>SELECT</span><small id="select-caption">选择</small></button>
        <button type="button" id="button-start" class="system-button" disabled><span>START</span><small id="start-caption">开始 / 暂停</small></button>
      </div>
      <div class="actions">
        <div class="button-wrap b-wrap"><button type="button" id="button-b" class="action-button button-b" disabled><svg class="action-symbol" viewBox="0 0 64 64" aria-hidden="true"><path d="m29 12 7-7 10 7-7 7m-12-2L40 29"/><path d="M44 29c11 15 4 27-10 27S10 44 20 30l7-10 10 1Z"/><path d="m40 16 12 6v11M23 34h22M21 42h26M32 28v23"/></svg></button><span class="button-caption" id="b-caption">手雷</span></div>
        <div class="button-wrap a-wrap"><button type="button" id="button-a" class="action-button button-a" disabled><svg class="action-symbol" viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="18"/><path d="M32 4v16m0 24v16M4 32h16m24 0h16"/><circle cx="32" cy="32" r="4"/></svg><span class="aim-stick" id="aim-stick" aria-hidden="true"><span id="aim-thumb"></span></span></button><span class="button-caption" id="a-caption">开火 · 拖动瞄准</span></div>
      </div>
    </section>
    <footer class="footer"><span id="footer-hint" data-i18n="hint">操作提示</span></footer>
    <div class="rotate-hint" data-i18n="rotate">横屏握持，视野更宽</div>
    <div class="error-actions" id="error-actions" hidden><button type="button" id="retry" data-i18n="retry">重新连接</button></div>
  </main>
  <script src="/controller.js"></script>
</body>
</html>
