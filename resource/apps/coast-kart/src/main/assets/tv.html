<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1"
    />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; media-src 'self' blob:"
    />
    <title>Coast Kart TV</title>
    <link rel="stylesheet" href="tv.css" />
  </head>
  <body>
    <div class="app">
      <main class="main">
        <section class="arena-panel">
          <div class="canvas-wrap">
            <canvas
              id="battlefield"
              width="960"
              height="540"
              aria-label="Coast Kart TV"
            ></canvas>
            <div class="loading" id="game-loading">
              <strong id="loading-title">正在准备赛道…</strong>
              <p id="loading-detail"></p>
            </div>
          </div>
        </section>
        <aside class="sidebar">
          <section class="join-card">
            <div class="room-brand" id="room-brand">
              COAST KART <span>TV</span>
            </div>
            <div class="section-heading">
              <span id="join-label">手机手柄</span
              ><span id="lan-label">同一局域网</span>
            </div>
            <div class="qr-frame">
              <img id="room-qr" alt="Room QR code" hidden />
              <div id="qr-pending">
                <span id="network-message">正在创建房间…</span>
              </div>
            </div>
            <h2 id="scan-title">扫码，一起出发</h2>
            <p id="scan-description"></p>
            <div class="room-address" id="room-address"></div>
          </section>
          <section class="players" aria-label="Players">
            <div class="player-card p1" id="player-1">
              <div class="player-icon">1P</div>
              <div class="player-info">
                <strong id="player-name-1">车手一</strong
                ><span id="player-status-1"></span>
              </div>
            </div>
            <div class="player-card p2" id="player-2">
              <div class="player-icon">2P</div>
              <div class="player-info">
                <strong id="player-name-2">车手二</strong
                ><span id="player-status-2"></span>
              </div>
            </div>
          </section>
          <p class="menu-help" id="menu-help"></p>
          <button id="music-button" class="music-button" type="button">
            音乐
          </button>
          <section class="control-legend">
            <div>
              <span class="legend-stick">✚</span><span id="move-label"></span>
            </div>
            <div><span class="key-pill">A</span><span id="a-label"></span></div>
            <div><span class="key-pill">B</span><span id="b-label"></span></div>
          </section>
        </aside>
      </main>
      <footer class="footer">
        <span id="footer-left"></span><span id="footer-right"></span>
      </footer>
    </div>
    <script src="bootstrap.js"></script>
    <script src="game-model.js"></script>
    <script src="renderer.js"></script>
    <script src="audio.js"></script>
    <script src="runtime.js"></script>
    <script src="game.js"></script>
  </body>
</html>
