<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
  <meta name="theme-color" content="#101414">
  <title>极品二手车 · Used Car Racing TV</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="controller.css">
</head>
<body>
  <main class="controller" id="controller" data-action-layout="racing" data-connected="false" data-player="1" data-state="offline">
    <header class="header">
      <div class="brand"><span class="brand-mark" aria-hidden="true">U<span>／</span>C</span><div><strong data-i18n="title">极品二手车</strong><span data-i18n="controller">驾驶控制器 / UCR—01</span></div></div>
      <div class="connection" role="status" aria-live="polite"><i id="connection-dot"></i><span id="connection-text">正在连接</span></div>
      <button class="fullscreen" id="fullscreen" type="button" aria-label="全屏" title="全屏"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5" fill="none" stroke="currentColor" stroke-width="1.7"/></svg></button>
    </header>
    <section class="dashboard" aria-label="车辆仪表" data-i18n-aria="status">
      <div class="player-badge"><span class="player-number" id="player-number">P—</span><div><span class="eyebrow" data-i18n="yourPlayer">驾驶席</span><strong id="player-name">正在加入</strong></div></div>
      <div class="track-line"><span class="eyebrow" data-i18n="track">赛道</span><strong id="track-name">—</strong></div>
    </section>
    <section class="instruments" aria-label="实时车辆状态" data-i18n-aria="telemetry">
      <div class="speed"><span class="eyebrow">KM/H</span><strong id="speed">—</strong></div>
      <div class="gear"><span class="eyebrow" data-i18n="gear">档位</span><strong id="gear">—</strong></div>
      <div class="race-details"><span id="lap">—</span><strong id="rank">—</strong></div>
    </section>
    <div class="messages"><div class="status-line"><span id="play-status" role="status" aria-live="polite">手柄未连接</span><span id="brake-alert" role="status"></span></div><div class="message" id="message" role="status" aria-live="polite">正在加入电视上的房间…</div></div>
    <section class="controls" aria-label="游戏操作" data-i18n-aria="controls">
      <div class="joystick-column"><div class="joystick-zone" id="joystick-zone" role="group" aria-label="左侧按住左右滑动转向" aria-disabled="true" tabindex="0" data-active="false">
        <div class="steering-guide" aria-hidden="true"><span>−</span><svg viewBox="0 0 130 130"><circle cx="65" cy="65" r="52"/><path d="M15 50h100M65 65v50M65 12v13"/><circle cx="65" cy="65" r="15"/></svg><span>＋</span></div>
        <div class="joystick" id="joystick" aria-hidden="true"><div class="joystick-ring"></div><div class="axis axis-x"></div><span class="direction left">◀</span><span class="direction right">▶</span><div class="joystick-thumb" id="joystick-thumb"><span>◆</span></div></div>
      </div><span class="control-caption" id="steering-caption" data-i18n="move">左侧任意位置落指 · 左右滑动转向</span></div>
      <div class="steering-settings" role="group" aria-label="转向方式" id="steering-settings">
        <button type="button" id="steering-stick" aria-pressed="true">虚拟摇杆</button>
        <button type="button" id="steering-gyro" aria-pressed="false">陀螺仪</button>
        <button type="button" id="steering-center" hidden>校准中立</button>
        <button type="button" id="steering-local" hidden>返回局域网</button>
      </div>
      <div class="system-keys" aria-label="游戏菜单"><button type="button" id="button-select" class="system-button" disabled><span>SELECT</span><small id="select-caption">镜头 · 长按换挡</small></button><button type="button" id="button-start" class="system-button" disabled><span>START</span><small id="start-caption">开始 / 暂停</small></button></div>
      <div class="actions">
        <div class="button-wrap a-wrap"><button type="button" id="button-a" class="action-button button-a" disabled><svg class="pedal-icon" viewBox="0 0 36 52" aria-hidden="true"><path d="M12 2h15l5 39-3 8H9L5 41z"/><path d="M13 13h11M12 22h13M11 31h15M10 40h17"/></svg><span class="action-name">GAS</span><span class="button-caption" id="a-caption">油门 · 按住加速</span><span class="action-edge" aria-hidden="true">A / 01</span></button></div>
        <div class="button-wrap b-wrap"><button type="button" id="button-b" class="action-button button-b" disabled><svg class="pedal-icon" viewBox="0 0 54 42" aria-hidden="true"><path d="M8 2h38l5 29-4 7H7l-4-7z"/><path d="M14 10v18m9-18v18m9-18v18m9-18v18"/></svg><span class="action-name">BRAKE</span><span class="button-caption" id="b-caption">刹车 · 按住蓄力</span><span class="pedal-force"><strong id="force">—</strong><small>N</small></span><span class="force-track" aria-hidden="true"><i id="force-bar"></i><b></b></span><span class="action-edge" aria-hidden="true">B / 02</span></button></div>
      </div>
    </section>
    <footer class="footer" data-i18n="hint">右上油门 · 右下刹车 · 无需低头找按钮</footer>
    <div class="rotate-hint" data-i18n="rotate">↻ 横屏驾驶，左右手分别操控方向与踏板</div>
    <div class="error-actions" id="error-actions" hidden><button type="button" id="retry" data-i18n="retry">重新连接</button></div>
  </main>
  <script src="secure-controller.js"></script><script src="steering.js"></script><script src="controller.js"></script>
</body>
</html>
