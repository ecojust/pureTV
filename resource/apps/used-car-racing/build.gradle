plugins { id 'com.android.application' }

android {
    namespace 'com.ecojust.usedcartv'
    compileSdk 35
    defaultConfig {
        applicationId 'com.ecojust.usedcartv'
        minSdk 26
        targetSdk 29
        versionCode 3
        versionName '0.1.2'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    testOptions { unitTests.includeAndroidResources = true }
    lint { disable 'ExpiredTargetSdkVersion' }
}

dependencies {
    implementation 'com.google.zxing:core:3.5.3'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
}

tasks.register('verifyReleaseSize') {
    dependsOn 'assembleRelease'
    doLast {
        def apks = fileTree("$buildDir/outputs/apk/release") { include '*.apk' }
        if (apks.empty) throw new GradleException('No release APK found')
        apks.each { apk ->
            if (apk.length() > 5 * 1024 * 1024) throw new GradleException("APK exceeds 5 MiB: ${apk.length()} bytes")
            println "Used Car Racing TV APK: ${apk.length()} bytes (limit 5 MiB)"
        }
    }
}
