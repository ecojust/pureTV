plugins { id 'com.android.application' }

android {
    namespace 'com.ecojust.webtv'
    compileSdk 35
    defaultConfig {
        applicationId 'com.ecojust.webtv'
        minSdk 26
        targetSdk 29
        versionCode 3
        versionName '0.5.0'
    }
    signingConfigs {
        release {
            if (System.getenv('ANDROID_KEYSTORE_PATH')) {
                storeFile file(System.getenv('ANDROID_KEYSTORE_PATH'))
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias 'cleanyourtv-c'
                keyPassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
            if (System.getenv('ANDROID_KEYSTORE_PATH')) signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    testOptions { unitTests.includeAndroidResources = true }
    lint { disable 'ExpiredTargetSdkVersion' }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
}

tasks.register('verifyReleaseSize') {
    dependsOn 'assembleRelease'
    doLast {
        def apks = fileTree("$buildDir/outputs/apk/release") { include '*.apk' }
        if (apks.empty) throw new GradleException('No release APK found')
        apks.each { apk ->
            if (apk.length() > 5 * 1024 * 1024) throw new GradleException("APK exceeds 5 MiB: ${apk.length()} bytes")
            println "WebTV APK: ${apk.length()} bytes (limit 5 MiB)"
        }
    }
}
